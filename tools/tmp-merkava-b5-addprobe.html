<!doctype html>
<!-- TEMP (merkava family, B5 turret-furniture round): per-P.add-call replica
     of tools/turret-parent-audit.html. The official audit measures MERGED
     bucket meshes (one AABB per bucket), which cannot attribute a stranded
     flag to a source line. This probe rebuilds the tank through the profile
     builder with an instrumented P that records every add (bucket, xformed
     AABB, profile call site from the stack), then replays the audit math at
     per-add granularity: casting envelope from turret-side adds, stranded /
     abutting per hull-side add. DIAGNOSIS ONLY (bespoke harness law): all
     verdicts still come from the official audit + gate + critic rigs. -->
<meta charset="utf-8">
<title>tmp-merkava-b5-addprobe</title>
<script type="module">
import * as THREE from 'three';
import { KIT } from '/src/vehicles/tankFactory.js';
import { getSpec } from '/src/vehicles/specs.js';
import { createTankMaterials } from '/src/vehicles/materials.js';
import { PROFILED_BUILDERS } from '/src/vehicles/profiledProcedurals.js';

const params = new URLSearchParams(location.search);
const id = params.get('id') || 'merkava1b';

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer: null };
const spec = getSpec(id);
const armor = spec.armor;
const mats = createTankMaterials(spec, engineCtx, 4242, 'high');
const rng = mulberry32((4242 | 0) ^ 0x9e37);

const hullG = new THREE.Group(); hullG.name = 'rig_hull';
const turretG = new THREE.Group(); turretG.name = 'rig_turret';
turretG.position.set(armor.turretPivot[0], armor.turretPivot[1], armor.turretPivot[2]);
const gunG = new THREE.Group(); gunG.name = 'rig_gun';
gunG.position.set(armor.gunPivot[0], armor.gunPivot[1], armor.gunPivot[2]);
const recoilG = new THREE.Group(); recoilG.name = 'rig_recoil';
hullG.add(turretG); // topology irrelevant for the probe; positions read directly
turretG.add(gunG); gunG.add(recoilG);

const records = [];
function site() {
  const lines = (new Error().stack || '').split('\n');
  for (const ln of lines) {
    const m = ln.match(/\/src\/vehicles\/(profiles\/[^:)]+|tankFactory\.js):(\d+):(\d+)/);
    if (m) return `${m[1]}:${m[2]}`;
  }
  return '(unknown)';
}
function record(bucket, geo) {
  geo.computeBoundingBox();
  const b = geo.boundingBox;
  records.push({ bucket, site: site(),
    box: [[b.min.x, b.min.y, b.min.z], [b.max.x, b.max.y, b.max.z]] });
}
const P = {
  spec, mats, rng, q: true, hullG, turretG, gunG, recoilG,
  disposables: [], gear: null, muzzleZ: armor.gunBarrel.lengthM, topY: 0.8,
  add(bucket, geo, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, s = 1) {
    record(bucket, KIT.xform(geo, x, y, z, rx, ry, rz, s));
  },
  clear(...names) {
    const drop = new Set(names.flat());
    for (let i = records.length - 1; i >= 0; i--) if (drop.has(records[i].bucket)) records.splice(i, 1);
  },
  addGunExtra(geo, x, y, z) { record('gunMount', KIT.xform(geo, x, y, z)); },
  addGunExtraDark(geo, x, y, z) { record('gunMountDark', KIT.xform(geo, x, y, z)); },
  decal(parent, kind, text, size, pos, rotY = 0, rotX = 0, rotZ = 0) {
    const g = new THREE.PlaneGeometry(1, 1);
    const m = new THREE.Matrix4().compose(
      new THREE.Vector3(pos[0], pos[1], pos[2]),
      new THREE.Quaternion().setFromEuler(new THREE.Euler(rotX, rotY, rotZ, 'ZYX')),
      new THREE.Vector3(size, size, size));
    g.applyMatrix4(m);
    g.computeBoundingBox();
    const b = g.boundingBox;
    records.push({ bucket: `DECAL:${parent}`, site: site(),
      box: [[b.min.x, b.min.y, b.min.z], [b.max.x, b.max.y, b.max.z]] });
  },
  eraCluster(plateName, fill, turretLocal = false) {
    fill((x, y, z) => records.push({ bucket: `ERA:${turretLocal ? 'turret' : 'hull'}`, site: site(),
      box: [[x - 0.14, y - 0.065, z - 0.035], [x + 0.14, y + 0.065, z + 0.035]] }));
  },
};

PROFILED_BUILDERS[id](P);

const pivot = [turretG.position.x, turretG.position.y, turretG.position.z];
const ringY = pivot[1];
const gunPos = [gunG.position.x, gunG.position.y, gunG.position.z];

const TURRET_SIDE = new Set(['turret', 'turretDetail', 'turretDark', 'turretCloth', 'turretGlass', 'turretTrack', 'DECAL:turret']);
const GUN_SIDE = new Set(['gun', 'gunDark', 'gunMount', 'gunMountDark']);
const SKIP = new Set(['hullShadow', 'ERA:hull', 'ERA:turret']); // colorWrite-false / instanced in the real audit

// world AABB per record
for (const r of records) {
  const off = TURRET_SIDE.has(r.bucket) ? pivot
    : GUN_SIDE.has(r.bucket) ? [pivot[0] + gunPos[0], pivot[1] + gunPos[1], pivot[2] + gunPos[2]]
    : [0, 0, 0];
  r.world = [
    [r.box[0][0] + off[0], r.box[0][1] + off[1], r.box[0][2] + off[2]],
    [r.box[1][0] + off[0], r.box[1][1] + off[1], r.box[1][2] + off[2]]];
}

// casting envelope = union of turret-side records (gun subtree excluded)
const casting = new THREE.Box3();
for (const r of records) {
  if (!TURRET_SIDE.has(r.bucket)) continue;
  casting.union(new THREE.Box3(
    new THREE.Vector3(...r.world[0]), new THREE.Vector3(...r.world[1])));
}
const M = 0.03;
const shrunk = casting.clone();
shrunk.min.addScalar(M); shrunk.max.addScalar(-M);

const stranded = [], abutting = [];
const perBucket = {};
for (const r of records) {
  const u = perBucket[r.bucket] || (perBucket[r.bucket] = new THREE.Box3());
  u.union(new THREE.Box3(new THREE.Vector3(...r.world[0]), new THREE.Vector3(...r.world[1])));
  if (TURRET_SIDE.has(r.bucket) || GUN_SIDE.has(r.bucket) || SKIP.has(r.bucket)) continue;
  const bb = new THREE.Box3(new THREE.Vector3(...r.world[0]), new THREE.Vector3(...r.world[1]));
  if (bb.max.y <= ringY + 0.02) continue;
  const vol = Math.max(1e-9, (bb.max.x - bb.min.x) * (bb.max.y - bb.min.y) * (bb.max.z - bb.min.z));
  const inter = bb.clone();
  inter.min.max(shrunk.min); inter.max.min(shrunk.max);
  const has = inter.min.x < inter.max.x && inter.min.y < inter.max.y && inter.min.z < inter.max.z;
  const frac = has ? ((inter.max.x - inter.min.x) * (inter.max.y - inter.min.y) * (inter.max.z - inter.min.z)) / vol : 0;
  const row = { bucket: r.bucket, site: r.site, overlap: +frac.toFixed(3),
    box: r.world.map((v) => v.map((n) => +n.toFixed(3))) };
  if (frac >= 0.25) { stranded.push(row); continue; }
  const GAP = 0.12;
  if (bb.min.y > ringY - 0.10 && bb.min.y < casting.max.y && bb.max.y > casting.min.y + M &&
      bb.max.x > casting.min.x - GAP && bb.min.x < casting.max.x + GAP &&
      bb.max.z > casting.min.z - GAP && bb.min.z < casting.max.z + GAP) abutting.push(row);
}
stranded.sort((a, b) => b.overlap - a.overlap);

// envelope-smear attribution: turret-side extremes
const turretRecs = records.filter((r) => TURRET_SIDE.has(r.bucket));
const fmt = (r) => ({ bucket: r.bucket, site: r.site, box: r.world.map((v) => v.map((n) => +n.toFixed(3))) });
const lowY = [...turretRecs].sort((a, b) => a.world[0][1] - b.world[0][1]).slice(0, 12).map(fmt);
const minZ = [...turretRecs].sort((a, b) => a.world[0][2] - b.world[0][2]).slice(0, 8).map(fmt);
const maxZ = [...turretRecs].sort((a, b) => b.world[1][2] - a.world[1][2]).slice(0, 6).map(fmt);
const wideX = [...turretRecs].sort((a, b) => Math.max(b.world[1][0], -b.world[0][0]) - Math.max(a.world[1][0], -a.world[0][0])).slice(0, 8).map(fmt);

window.__B5_RESULT = {
  id, pivot, ringY,
  castingBox: [[+casting.min.x.toFixed(3), +casting.min.y.toFixed(3), +casting.min.z.toFixed(3)],
               [+casting.max.x.toFixed(3), +casting.max.y.toFixed(3), +casting.max.z.toFixed(3)]],
  counts: { records: records.length, stranded: stranded.length, abutting: abutting.length },
  stranded, abutting,
  smear: { lowY, minZ, maxZ, wideX },
  bucketUnions: Object.fromEntries(Object.entries(perBucket).map(([k, b]) => [k,
    [[+b.min.x.toFixed(2), +b.min.y.toFixed(2), +b.min.z.toFixed(2)],
     [+b.max.x.toFixed(2), +b.max.y.toFixed(2), +b.max.z.toFixed(2)]]])),
};
window.__B5_READY = true;
</script>
