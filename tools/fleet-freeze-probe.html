<!doctype html>
<!-- Deterministic geometry hash of a first-party procedural build.
     Freeze verification for the m60a1 dual-gate graduate: its reference GLB
     registration was decommissioned at graduation, so the geometric gate can
     no longer measure it — instead every shared-code edit must keep the
     procedural geometry BYTE-IDENTICAL. Hashes every visible mesh's position
     buffer + world matrix (deterministic build: camoSeed pinned). -->
<meta charset="utf-8">
<title>Fleet freeze probe</title>
<script type="module">
import { createTank } from '/src/vehicles/tankFactory.ts';
import { geometryFingerprint } from '/src/vehicles/tankAssets.ts';

const params = new URLSearchParams(location.search);
const id = params.get('id') || 'm60a1';
const camoSeed = Number(params.get('seed') || 4242);
const assetMode = params.get('asset') === '1';
const engineCtx = assetMode ? null : { setupShadowMaterial: (m) => m, anisotropy: 1, renderer: null };
const tank = createTank(id, engineCtx, assetMode
  ? { camoSeed, quality: 'high' }
  : { camoSeed, quality: 'high', proceduralOnly: true });
tank.root.updateMatrixWorld(true);

// FNV-1a over float32 bit patterns, mesh-order independent (sorted digests)
const fnv = (h, b) => { h ^= b; return (h * 0x01000193) >>> 0; };
const hashBytes = (bytes, h = 0x811c9dc5) => { for (let i = 0; i < bytes.length; i++) h = fnv(h, bytes[i]); return h >>> 0; };
const digests = [];
let meshCount = 0, vertCount = 0;
tank.root.traverse((o) => {
  if (!(o.isMesh || o.isInstancedMesh) || !o.geometry) return;
  meshCount++;
  const pos = o.geometry.getAttribute('position');
  if (!pos) return;
  vertCount += pos.count;
  let h = hashBytes(new Uint8Array(new Float32Array(pos.array).buffer));
  h = hashBytes(new Uint8Array(new Float32Array(o.matrixWorld.elements).buffer), h);
  if (o.geometry.index) h = hashBytes(new Uint8Array(new Uint32Array(o.geometry.index.array).buffer), h);
  digests.push(h);
});
digests.sort((a, b) => a - b);
let total = 0x811c9dc5;
for (const d of digests) {
  total = fnv(total, d & 0xff); total = fnv(total, (d >> 8) & 0xff);
  total = fnv(total, (d >> 16) & 0xff); total = fnv(total, (d >> 24) & 0xff);
}
window.__GEOHASH = {
  id,
  camoSeed,
  assetMode,
  // Historical certification hash: position buffers, world transforms and
  // topology. Kept stable so existing graduate receipts remain comparable.
  hash: total.toString(16),
  // Release/currentness hash: also covers InstancedMesh transforms. Keeping
  // both closes the old gap where a wheel/track instance could move without
  // changing the historical freeze hash.
  assetHash: geometryFingerprint(tank.root),
  meshCount,
  vertCount,
};
window.__TANK_ROOT__ = tank.root;
window.__HASH_READY = true;
document.body.textContent = JSON.stringify(window.__GEOHASH);
</script>
