<!doctype html>
<!-- TEMP (track-hitbox round 2026-08-06): honest gameplay-delta measurement.
     For each requested tank, casts a dense side-view grid of lateral rays
     and classifies each cell twice: LEGACY (trackShapes stripped -> the old
     rectangle plate + AABB pair) vs PRISM (trackShapes present). Reports the
     phantom-track area the rectangles claimed, the real-shape coverage, and
     ASCII silhouettes for the report. window.__DELTA_REPORT when done. -->
<meta charset="utf-8">
<title>tmp-trackhitbox-delta</title>
<script type="module">
import { createTank } from '/src/vehicles/tankFactory.js';
import { getSpec } from '/src/vehicles/specs.js';
import { tankPoseFromState, traceTank } from '/src/sim/armor.js';
import { Vector3 } from 'three';

const params = new URLSearchParams(location.search);
const ids = (params.get('ids') || 'tiger1,m1a2,bmp2').split(',');
const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer: null };
const V = (x, y, z) => new Vector3(x, y, z);
const mkState = () => ({
  pos: V(0, 0, 0), yaw: 0, speed: 0, visualPitch: 0, visualRoll: 0,
  turretYaw: 0, gunPitch: 0,
});

const out = [];
for (const id of ids) {
  const tank = createTank(id, engineCtx, { camoSeed: 4242, quality: 'low', proceduralOnly: true });
  const spec = getSpec(id);
  const armor = spec.armor;
  const pose = tankPoseFromState(mkState());
  const dims = spec.dims;
  const hl = (dims.hullLengthM || dims.overallLengthM * 0.8) / 2 + 1.2;
  const yTop = Math.max(...armor.trackShapes.flatMap((s) => s.poly.map((p) => p[1]))) + 0.4;
  const NZ = 96;
  const NY = 40;
  const hw = dims.widthM / 2 + 2;
  const classify = () => {
    const grid = [];
    let cells = 0;
    for (let iy = NY - 1; iy >= 0; iy--) {
      const y = (iy + 0.5) * (yTop / NY);
      let row = '';
      for (let iz = 0; iz < NZ; iz++) {
        const z = -hl + (iz + 0.5) * (2 * hl / NZ);
        const hits = traceTank(V(hw, y, z), V(-hw, y, z), pose, armor, new Set());
        const isTrack = hits.some((h) =>
          (h.kind === 'plate' && h.plate.moduleLink === 'trackR')
          || (h.kind === 'module' && h.module === 'trackR'));
        row += isTrack ? '#' : '.';
        if (isTrack) cells++;
      }
      grid.push(row);
    }
    return { grid, cells };
  };
  const prism = classify();
  const shapes = armor.trackShapes;
  delete armor.trackShapes; // strip -> legacy rectangle plate + AABB path
  const legacy = classify();
  armor.trackShapes = shapes; // restore the shared spec object
  // deltas
  let phantomGone = 0;   // legacy said track, prism says nothing
  let newCover = 0;      // prism says track where legacy had none
  for (let r = 0; r < NY; r++) {
    for (let c = 0; c < NZ; c++) {
      const a = legacy.grid[r][c] === '#';
      const b = prism.grid[r][c] === '#';
      if (a && !b) phantomGone++;
      if (b && !a) newCover++;
    }
  }
  out.push({
    id, cellM2: (2 * hl / NZ) * (yTop / NY),
    legacyCells: legacy.cells, prismCells: prism.cells,
    phantomGone, newCover,
    legacyGrid: legacy.grid.filter((_, i) => i % 2 === 0),
    prismGrid: prism.grid.filter((_, i) => i % 2 === 0),
  });
  tank.dispose();
  await new Promise((r) => setTimeout(r, 0));
}
window.__DELTA_REPORT = out;
window.__DELTA_READY = true;
</script>
