<!doctype html>
<!-- TEMP (merkava §B3.1): 1024 island hunt — proc-only whole-body mask from
     the gate's fq-right direction, articulation poses, island bboxes in
     WORLD coordinates. Diagnosis only. -->
<meta charset="utf-8">
<title>tmp-merkava-islands</title>
<script type="module">
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.js';

const params = new URLSearchParams(location.search);
const id = params.get('id') || 'merkava4b';
const GSIZE = 1024;

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(GSIZE, GSIZE);
const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer };
const scene = new THREE.Scene();
const tank = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
scene.add(tank.root);
tank.root.updateMatrixWorld(true);
tank.root.traverse((o) => {
  if (!o.isLOD) return;
  o.autoUpdate = false;
  o.levels.forEach((level, i) => { if (level.object) level.object.visible = i === 0; });
});
// flat white override for a clean mask (shadow-named excluded like the gate's baseVisible)
const white = new THREE.MeshBasicMaterial({ color: 0xffffff });
tank.root.traverse((o) => {
  if ((o.isMesh || o.isInstancedMesh) && o.geometry && !/shadow/i.test(o.name || '')) o.material = white;
  else if (/shadow/i.test(o.name || '')) o.visible = false;
});

function visibleBox(root) {
  const box = new THREE.Box3();
  root.updateMatrixWorld(true);
  root.traverse((o) => {
    if (!(o.isMesh || o.isInstancedMesh) || !o.geometry) return;
    let vis = true;
    for (let p = o; p; p = p.parent) if (!p.visible) { vis = false; break; }
    if (!vis) return;
    if (o.isInstancedMesh) {
      if (o.count === 0) return;
      o.computeBoundingBox();
      if (o.boundingBox && !o.boundingBox.isEmpty()) box.union(o.boundingBox.clone().applyMatrix4(o.matrixWorld));
      return;
    }
    if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
    box.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld));
  });
  return box;
}
const bbox = visibleBox(tank.root);
const center = bbox.getCenter(new THREE.Vector3());
const dir = new THREE.Vector3(1, 0.08, 1).normalize();
const nominalUp = new THREE.Vector3(0, 1, 0);
const right = new THREE.Vector3().crossVectors(nominalUp, dir).normalize();
const up = new THREE.Vector3().crossVectors(dir, right).normalize();
let ext = 0.5;
for (const cx of [bbox.min.x, bbox.max.x]) for (const cy of [bbox.min.y, bbox.max.y]) for (const cz of [bbox.min.z, bbox.max.z]) {
  const d = new THREE.Vector3(cx, cy, cz).sub(center);
  ext = Math.max(ext, Math.abs(d.dot(right)), Math.abs(d.dot(up)));
}
const half = ext * 1.10;
const camera = new THREE.OrthographicCamera(-half, half, half, -half, 0.1, 200);
camera.position.copy(center).addScaledVector(dir, 60);
camera.up.copy(up);
camera.lookAt(center);
camera.updateProjectionMatrix();
camera.updateMatrixWorld(true);

const rt = new THREE.WebGLRenderTarget(GSIZE, GSIZE, { depthBuffer: true, stencilBuffer: false });
function mask() {
  renderer.setRenderTarget(rt);
  renderer.setClearColor(0x000000, 1);
  renderer.clear(true, true, true);
  renderer.render(scene, camera);
  const rgba = new Uint8Array(GSIZE * GSIZE * 4);
  renderer.readRenderTargetPixels(rt, 0, 0, GSIZE, GSIZE, rgba);
  const m = new Uint8Array(GSIZE * GSIZE);
  for (let i = 0; i < m.length; i++) m[i] = rgba[i * 4] > 40 ? 1 : 0;
  renderer.setRenderTarget(null);
  return m;
}
function islandsDetail(raw) {
  let m = raw;
  for (let pass = 0; pass < 2; pass++) {
    const next = new Uint8Array(m.length);
    for (let y = 0; y < GSIZE; y++) for (let x = 0; x < GSIZE; x++) {
      const i = y * GSIZE + x;
      if (m[i] || (x > 0 && m[i - 1]) || (x < GSIZE - 1 && m[i + 1]) ||
          (y > 0 && m[i - GSIZE]) || (y < GSIZE - 1 && m[i + GSIZE])) next[i] = 1;
    }
    m = next;
  }
  const seen = new Uint8Array(m.length);
  const comps = [];
  const stack = [];
  for (let i = 0; i < m.length; i++) {
    if (!m[i] || seen[i]) continue;
    let area = 0, x0 = 1e9, x1 = -1, y0 = 1e9, y1 = -1;
    stack.push(i); seen[i] = 1;
    while (stack.length) {
      const j = stack.pop(); area++;
      const x = j % GSIZE, y = (j / GSIZE) | 0;
      if (x < x0) x0 = x; if (x > x1) x1 = x;
      if (y < y0) y0 = y; if (y > y1) y1 = y;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= GSIZE || ny >= GSIZE) continue;
        const k = ny * GSIZE + nx;
        if (m[k] && !seen[k]) { seen[k] = 1; stack.push(k); }
      }
    }
    comps.push({ area, x0, x1, y0, y1 });
  }
  return comps.sort((a, b) => b.area - a.area);
}
// px -> world: p = center + right*ax + up*ay (ax,ay in [-half, half])
function pxWorld(x, y) {
  const ax = ((x + 0.5) / GSIZE * 2 - 1) * half;
  const ay = ((y + 0.5) / GSIZE * 2 - 1) * half;
  return [
    +(center.x + right.x * ax + up.x * ay).toFixed(2),
    +(center.y + right.y * ax + up.y * ay).toFixed(2),
    +(center.z + right.z * ax + up.z * ay).toFixed(2),
  ];
}
const turretN = tank.root.getObjectByName('rig_turret');
const gunN = tank.root.getObjectByName('rig_gun');
const poses = [[0, 0], [90, 0], [180, 0], [0, -8], [0, 15]];
const out = [];
for (const [yaw, pitch] of poses) {
  if (turretN) turretN.rotation.y = yaw * Math.PI / 180;
  if (gunN) gunN.rotation.x = -pitch * Math.PI / 180;
  tank.root.updateMatrixWorld(true);
  const comps = islandsDetail(mask());
  out.push({
    yaw, pitch,
    big: comps.filter((c) => c.area > 400).length,
    comps: comps.slice(0, 5).map((c) => ({
      area: c.area,
      pxA: [c.x0, c.y0], pxB: [c.x1, c.y1],
      wA: pxWorld(c.x0, c.y0), wB: pxWorld(c.x1, c.y1),
    })),
  });
}
// island snapshot: render the REST mask, isolate the 2nd-largest component,
// export a PNG with body=gray, island=white for eyeball identification
if (turretN) turretN.rotation.y = Math.PI;   // yaw 180 (the >400 pose)
if (gunN) gunN.rotation.x = 0;
tank.root.updateMatrixWorld(true);
{
  const raw = mask();
  let m = raw;
  for (let pass = 0; pass < 2; pass++) {
    const next = new Uint8Array(m.length);
    for (let y = 0; y < GSIZE; y++) for (let x = 0; x < GSIZE; x++) {
      const i = y * GSIZE + x;
      if (m[i] || (x > 0 && m[i - 1]) || (x < GSIZE - 1 && m[i + 1]) ||
          (y > 0 && m[i - GSIZE]) || (y < GSIZE - 1 && m[i + GSIZE])) next[i] = 1;
    }
    m = next;
  }
  const seen = new Int32Array(m.length).fill(-1);
  const comps = [];
  const stack = [];
  for (let i = 0; i < m.length; i++) {
    if (!m[i] || seen[i] >= 0) continue;
    const idx = comps.length; let area = 0;
    stack.push(i); seen[i] = idx;
    while (stack.length) {
      const j = stack.pop(); area++;
      const x = j % GSIZE, y = (j / GSIZE) | 0;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= GSIZE || ny >= GSIZE) continue;
        const k = ny * GSIZE + nx;
        if (m[k] && seen[k] < 0) { seen[k] = idx; stack.push(k); }
      }
    }
    comps.push(area);
  }
  const order = comps.map((a, i) => [a, i]).sort((a, b) => b[0] - a[0]);
  const island = order.length > 1 ? order[1][1] : -1;
  const cv = document.createElement('canvas');
  cv.width = GSIZE; cv.height = GSIZE;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(GSIZE, GSIZE);
  for (let i = 0; i < m.length; i++) {
    const v = seen[i] < 0 ? 15 : (seen[i] === island ? 255 : 90);
    // flip y (render target rows are bottom-up)
    const x = i % GSIZE, y = (i / GSIZE) | 0;
    const o = ((GSIZE - 1 - y) * GSIZE + x) * 4;
    img.data[o] = v; img.data[o + 1] = v; img.data[o + 2] = seen[i] === island ? 0 : v; img.data[o + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  window.__ISL_PNG = cv.toDataURL('image/png');
}
// raycast through the island center pixel (yaw-180 pose still applied)
{
  const cx = 783, cy = 545;   // island center (PNG was y-flipped; mask rows are bottom-up)
  const ax = ((cx + 0.5) / GSIZE * 2 - 1) * half;
  const ay = ((cy + 0.5) / GSIZE * 2 - 1) * half;
  const origin = new THREE.Vector3().copy(camera.position).addScaledVector(right, ax).addScaledVector(up, ay);
  const rc = new THREE.Raycaster(origin, dir.clone().negate());
  const hits = rc.intersectObjects(scene.children, true).filter((h) => {
    let vis = true;
    for (let q = h.object; q; q = q.parent) if (!q.visible) { vis = false; break; }
    return vis;
  });
  window.__ISL_HIT = hits.slice(0, 3).map((h) => {
    const names = [];
    for (let q = h.object; q; q = q.parent) names.push(q.name || q.type);
    return { chain: names.join('<'), pt: [+h.point.x.toFixed(3), +h.point.y.toFixed(3), +h.point.z.toFixed(3)] };
  });
}
window.__ISL = out;
window.__ISL_READY = true;
</script>
