<!doctype html>
<!-- TEMP (abramsx dedicated round 2026-08-07): GARAGE-ANGLE shot set,
     proc OR reference (?ref=1). tmp-t14-garage.html lineage: main.js
     garageCameraPose offset (+7.4, +2.75, +8.0), fov 42 — the owner's
     elevated 3/4 read — four corners + two higher tilts, photoclass
     lights/clear color. Deleted after the round. -->
<meta charset="utf-8">
<title>tmp-abramsx-garage</title>
<style>body{margin:0;background:#151b20}</style>
<div id="out"></div>
<script type="module">
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.js';

const SIZE = 900;
const params = new URLSearchParams(location.search);
const id = params.get('id') || 'abramsx';
const asRef = params.get('ref') === '1';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
renderer.setSize(SIZE, SIZE, false);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x151b20, 1);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer };

const tank = createTank(id, engineCtx, asRef
  ? { camoSeed: 4242, quality: 'high' }
  : { camoSeed: 4242, quality: 'high', proceduralOnly: true });
scene.add(tank.root);

const hemi = new THREE.HemisphereLight(0xcfd8e0, 0x2a2f26, 1.05);
const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(30, 42, 24);
scene.add(hemi, sun);

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
if (asRef) {
  const swapped = () => {
    let yes = false;
    tank.root.traverse((o) => { if (o.userData?.__glbSwapped) yes = true; });
    return yes;
  };
  for (let i = 0; i < 600 && !swapped(); i++) await sleep(50);
  if (!swapped()) throw new Error(`${id} reference GLB did not load`);
  await sleep(400);
}

tank.root.updateMatrixWorld(true);
tank.root.traverse((o) => {
  if (!o.isLOD) return;
  o.autoUpdate = false;
  o.levels.forEach((level, i) => { if (level.object) level.object.visible = i === 0; });
});

function visibleBox(root) {
  const box = new THREE.Box3();
  root.updateMatrixWorld(true);
  root.traverse((o) => {
    if (!(o.isMesh || o.isInstancedMesh || o.isSkinnedMesh) || !o.geometry) return;
    let vis = true;
    for (let p = o; p; p = p.parent) if (!p.visible) { vis = false; break; }
    if (!vis || /shadow/i.test(o.name || '')) return;
    if (o.isInstancedMesh) {
      if (o.count === 0) return;
      o.computeBoundingBox();
      if (o.boundingBox && !o.boundingBox.isEmpty()) {
        box.union(o.boundingBox.clone().applyMatrix4(o.matrixWorld));
      }
      return;
    }
    if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
    box.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld));
  });
  return box;
}

const shots = {};
function shoot(camera) {
  renderer.setRenderTarget(null);
  renderer.setClearColor(0x151b20, 1);
  renderer.clear(true, true, true);
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/png');
}

const box = visibleBox(tank.root);
const center = box.getCenter(new THREE.Vector3());

// the garage pose: camera offset (7.4, 2.75, 8.0) from the pedestal, fov 42
function garageCam(sx, sz, lift = 1) {
  const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 300);
  camera.position.set(center.x + sx * 7.4, center.y + 2.75 * lift - 0.6, center.z + sz * 8.0);
  camera.lookAt(center.x, center.y + 0.2, center.z);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
  return camera;
}
shots['garage-frontright'] = shoot(garageCam(1, 1));
shots['garage-frontleft'] = shoot(garageCam(-1, 1));
shots['garage-rearright'] = shoot(garageCam(1, -1));
shots['garage-rearleft'] = shoot(garageCam(-1, -1));
shots['garage-high-fr'] = shoot(garageCam(1, 1, 2.2));
shots['garage-high-rl'] = shoot(garageCam(-1, -1, 2.2));
// AXDED-R2 relaunch: optional CLOSE-QUARTER evidence crops (?close=1) —
// wheel line / bow deck / turret face / roof, same lights + pose.
if (params.get('close') === '1') {
  function closeCam(px, py, pz, tx, ty, tz, fov = 34) {
    const camera = new THREE.PerspectiveCamera(fov, 1, 0.05, 300);
    camera.position.set(px, py, pz);
    camera.lookAt(tx, ty, tz);
    camera.updateProjectionMatrix();
    camera.updateMatrixWorld(true);
    return camera;
  }
  shots['close-wheels'] = shoot(closeCam(center.x + 5.2, 1.05, center.z + 1.6, center.x, 0.62, center.z + 0.4));
  shots['close-bow'] = shoot(closeCam(center.x + 2.4, 3.1, center.z + 6.4, center.x, 1.28, center.z + 3.2));
  shots['close-face'] = shoot(closeCam(center.x + 2.8, 2.9, center.z + 5.6, center.x, 2.15, center.z + 1.6));
  shots['close-roof'] = shoot(closeCam(center.x + 3.4, 3.9, center.z - 0.4, center.x, 2.35, center.z + 0.2));
  shots['close-stern'] = shoot(closeCam(center.x + 3.4, 2.2, center.z - 5.6, center.x, 1.15, center.z - 3.2));
}

// AXDED-R2 relaunch: fitting census debug export (AABBs in world m)
{
  const census = [];
  tank.root.updateMatrixWorld(true);
  tank.root.traverse((o) => {
    if (o.userData?.fitting) {
      const b = new THREE.Box3().setFromObject(o);
      let vis = true;
      for (let p = o; p; p = p.parent) if (p.visible === false) vis = false;
      census.push({ fit: o.userData.fitting, vis,
        min: b.min.toArray().map((v) => Math.round(v * 1000) / 1000),
        max: b.max.toArray().map((v) => Math.round(v * 1000) / 1000) });
    }
  });
  window.__FIT_CENSUS = census;
}
window.__SHOTS = shots;
window.__SHOTS_READY = true;
document.getElementById('out').textContent = `shots ready: ${Object.keys(shots).length}`;
</script>
