<!doctype html>
<!-- TEMP (france round): game-truth FrontSide render harness, REF (GLB via
     the real loader path — the exact read the garage shows) or PROC
     (proceduralOnly createTank), compass views + plan + gun heroes.
     Usage: ?id=amx30&mode=ref  |  ?id=leclerc&mode=proc
     READ-ONLY: no harness files touched. -->
<meta charset="utf-8">
<title>tmp-france-views</title>
<script type="module">
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.js';
import { MODEL_SOURCE } from '/src/vehicles/specs.js';

const params = new URLSearchParams(location.search);
const id = params.get('id') || 'amx30';
const mode = params.get('mode') || 'proc';
const SIZE = 900;
// BEFORE-evidence for the retired amx30 registrations: page-local re-register
// (the fidelity page's own MODEL_SOURCE-swap pattern; no file state touched)
if (mode === 'ref' && (id === 'amx30' || id === 'amx30b2') && !MODEL_SOURCE[id]) {
  MODEL_SOURCE[id] = { source: 'glb', glb: {
    path: `/models/tanks/community/${id === 'amx30' ? 'amx30b_ahab' : 'amx30b2_ahab'}.glb`,
    turretNode: '^Turret$', autoPivot: true, paintUntextured: true,
  } };
}

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
renderer.setSize(SIZE, SIZE, false);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x151b20, 1);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer };
const tank = createTank(id, engineCtx, mode === 'ref'
  ? { camoSeed: 4242, quality: 'high' }
  : { camoSeed: 4242, quality: 'high', proceduralOnly: true });
scene.add(tank.root);
const hemi = new THREE.HemisphereLight(0xcfd8e0, 0x2a2f26, 1.05);
const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(30, 42, 24);
scene.add(hemi, sun);

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
if (mode === 'ref') {
  const swapped = () => { let y = false; tank.root.traverse((o) => { if (o.userData?.__glbSwapped) y = true; }); return y; };
  for (let i = 0; i < 600 && !swapped(); i++) await sleep(50);
  if (!swapped()) throw new Error(`${id}: reference GLB did not swap in`);
}
tank.root.updateMatrixWorld(true);
tank.root.traverse((o) => {
  if (!o.isLOD) return;
  o.autoUpdate = false;
  o.levels.forEach((level, i) => { if (level.object) level.object.visible = i === 0; });
});

const VIEWS = {
  front: new THREE.Vector3(0, 0.06, 1),
  left: new THREE.Vector3(-1, 0.05, 0),
  right: new THREE.Vector3(1, 0.05, 0),
  rear: new THREE.Vector3(0, 0.06, -1),
  frontleft: new THREE.Vector3(-1, 0.08, 1),
  frontright: new THREE.Vector3(1, 0.08, 1),
  rearleft: new THREE.Vector3(-1, 0.08, -1),
  rearright: new THREE.Vector3(1, 0.08, -1),
  plan: new THREE.Vector3(0, 1, 0.0001),
  tilt: new THREE.Vector3(0.6, 1, 0.75),
};

function visibleBox(root) {
  const box = new THREE.Box3();
  root.updateMatrixWorld(true);
  root.traverse((o) => {
    if (!(o.isMesh || o.isInstancedMesh) || !o.geometry) return;
    let vis = true;
    for (let p = o; p; p = p.parent) if (!p.visible) { vis = false; break; }
    if (!vis || /shadow/i.test(o.name || '')) return;
    if (o.isInstancedMesh) {
      if (o.count === 0) return;
      o.computeBoundingBox();
      if (o.boundingBox && !o.boundingBox.isEmpty()) box.union(o.boundingBox.clone().applyMatrix4(o.matrixWorld));
      return;
    }
    if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
    box.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld));
  });
  return box;
}
function orthoFor(box, direction) {
  const center = box.getCenter(new THREE.Vector3());
  const dir = direction.clone().normalize();
  const nominalUp = Math.abs(dir.y) > 0.9 ? new THREE.Vector3(0, 0, -1) : new THREE.Vector3(0, 1, 0);
  const right = new THREE.Vector3().crossVectors(nominalUp, dir).normalize();
  const up = new THREE.Vector3().crossVectors(dir, right).normalize();
  let ext = 0.5;
  for (const cx of [box.min.x, box.max.x]) for (const cy of [box.min.y, box.max.y]) for (const cz of [box.min.z, box.max.z]) {
    const d = new THREE.Vector3(cx, cy, cz).sub(center);
    ext = Math.max(ext, Math.abs(d.dot(right)), Math.abs(d.dot(up)));
  }
  const half = ext * 1.06 * 1.1;
  const camera = new THREE.OrthographicCamera(-half, half, half, -half, 0.1, 200);
  camera.position.copy(center).addScaledVector(dir, 60);
  camera.up.copy(up);
  camera.lookAt(center);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
  return camera;
}
const box = visibleBox(tank.root);
const shots = {};
function shoot(tag, dir) {
  renderer.setClearColor(0x151b20, 1);
  renderer.clear(true, true, true);
  renderer.render(scene, orthoFor(box, dir));
  shots[tag] = renderer.domElement.toDataURL('image/png');
}
function hero(tag, sx, sz) {
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 300);
  cam.position.set(center.x + sx * size.z * 0.75, center.y + size.y * 1.05, center.z + sz * size.z * 0.75);
  cam.lookAt(center);
  cam.updateProjectionMatrix();
  cam.updateMatrixWorld(true);
  renderer.setClearColor(0x151b20, 1);
  renderer.clear(true, true, true);
  renderer.render(scene, cam);
  shots[tag] = renderer.domElement.toDataURL('image/png');
}
for (const [name, dir] of Object.entries(VIEWS)) shoot(name, dir);
hero('hero-frontleft', -1, 1);
hero('hero-frontright', 1, 1);
hero('hero-rearright', 1, -1);
// yaw-90 pair: does the turret carry its furniture (and does the gun agree
// with the hull nose after the amx30 fix)?
const turretG = tank.root.getObjectByName('rig_turret');
if (turretG) {
  turretG.rotation.y = Math.PI / 2;
  tank.root.updateMatrixWorld(true);
  shoot('plan-yaw90', VIEWS.plan);
  hero('hero-frontleft-yaw90', -1, 1);
  turretG.rotation.y = 0;
  tank.root.updateMatrixWorld(true);
}
window.__SHOTS = { shots };
window.__SHOTS_READY = true;
</script>
