<!doctype html>
<!-- TEMP (fleet muzzle-bore sweep, §B3.1): renders close-up muzzle crops of a
     procedural build — one straight end-on down the bore axis, one close
     front-quarter — using the rig_muzzle anchor. Deterministic build
     (camoSeed 4242, quality high). ?id=<tankId> -->
<meta charset="utf-8">
<title>tmp-muzzle-crops</title>
<style>body{margin:0;background:#2a2d31}canvas{display:block}</style>
<script type="module">
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.js';

const params = new URLSearchParams(location.search);
const id = params.get('id') || 'm60a1';
const W = 640, H = 640;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x3a4147);
const hemi = new THREE.HemisphereLight(0xcfd8e3, 0x4a4238, 1.05);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2df, 2.2);
sun.position.set(6, 9, 8);
scene.add(sun);
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.5);
fill.position.set(-5, 3, -6);
scene.add(fill);

const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 4, renderer };
const tank = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
scene.add(tank.root);
tank.root.updateMatrixWorld(true);

// muzzle anchor + gun forward dir in world
let muzzle = null;
tank.root.traverse((o) => { if (o.name === 'rig_muzzle') muzzle = o; });
const M = new THREE.Vector3();
const F = new THREE.Vector3(0, 0, 1);
if (muzzle) {
  muzzle.getWorldPosition(M);
  muzzle.getWorldQuaternion(new THREE.Quaternion());
  const q = new THREE.Quaternion();
  muzzle.getWorldQuaternion(q);
  F.applyQuaternion(q).normalize();
} else {
  // fallback: overall front-most point at gun height
  const bb = new THREE.Box3().setFromObject(tank.root);
  M.set(0, bb.max.y * 0.62, bb.max.z);
}
const up = new THREE.Vector3(0, 1, 0);
const right = new THREE.Vector3().crossVectors(F, up).normalize();

const cam = new THREE.PerspectiveCamera(32, 1, 0.03, 200);
const shots = {};
function shoot(name, fov, pos, look) {
  cam.fov = fov;
  cam.position.copy(pos);
  cam.lookAt(look);
  cam.updateProjectionMatrix();
  renderer.render(scene, cam);
  shots[name] = renderer.domElement.toDataURL('image/png');
}
// straight end-on down the bore (slight up-offset so the face isn't edge-degenerate)
shoot('end', 22, M.clone().addScaledVector(F, 1.30).addScaledVector(up, 0.06),
  M.clone().addScaledVector(F, -0.4));
// close front-quarter: rim + disc + tube character
shoot('quarter', 30, M.clone().addScaledVector(F, 1.55).addScaledVector(right, 1.05).addScaledVector(up, 0.55),
  M.clone().addScaledVector(F, -0.25));

const boreNodes = [];
tank.root.traverse((o) => {
  if (/muzzleBore|muzzleTip/i.test(o.name || '')) {
    boreNodes.push({ name: o.name, verts: o.geometry?.getAttribute?.('position')?.count ?? 0, mat: o.material?.name || (o.material ? 'ok' : 'MISSING') });
  }
});
window.__MUZZLE_SHOTS = { id, shots, muzzleWorld: M.toArray(), forward: F.toArray(), boreNodes };
window.__MUZZLE_READY = true;
</script>
