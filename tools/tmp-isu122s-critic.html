<!doctype html>
<meta charset="utf-8">
<title>tmp isu122s critic pairs</title>
<style>:root{color-scheme:dark;background:#0b0f12;color:#e7edf0;font:13px monospace}</style>
<div id="out">booting…</div>
<script type="module">
// TEMP (isu122s graduation critic r1): shaded ref|proc pair renders at the
// board's 9 fixed views + hero perspectives + closeups, per-model ortho rig
// (m60a1-r5 critic convention), board light rig. Pairs exposed on
// window.__CRITIC_PAIRS as data URLs for the puppeteer driver. Deleted after
// the round.
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.js';
import { MODEL_SOURCE, TANK_SPECS } from '/src/vehicles/specs.js';

const SIZE = 640;
const id = 'isu122s';
const source = MODEL_SOURCE[id];
if (source?.source !== 'glb') throw new Error(`${id} has no GLB reference registered`);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
renderer.setSize(SIZE, SIZE, false);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x151b20, 1);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer };

const reference = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high' });
const procedural = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
scene.add(reference.root, procedural.root);

// fidelity board's exact rig
const hemi = new THREE.HemisphereLight(0xcfd8e0, 0x2a2f26, 1.05);
const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(30, 42, 24);
scene.add(hemi, sun);

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const swapped = (visual) => {
  let yes = false;
  visual.root.traverse((o) => { if (o.userData?.__glbSwapped) yes = true; });
  return yes;
};
for (let i = 0; i < 600 && !swapped(reference); i++) await sleep(50);
if (!swapped(reference)) throw new Error(`${id} reference GLB did not load`);
await sleep(400);
reference.root.updateMatrixWorld(true);
procedural.root.updateMatrixWorld(true);
for (const root of [reference.root, procedural.root]) {
  root.traverse((o) => {
    if (!o.isLOD) return;
    o.autoUpdate = false;
    o.levels.forEach((level, i) => { if (level.object) level.object.visible = i === 0; });
  });
}

const VIEWS = {
  front: new THREE.Vector3(0, 0.08, 1),
  frontleft: new THREE.Vector3(-1, 0.08, 1),
  left: new THREE.Vector3(-1, 0.05, 0),
  rearleft: new THREE.Vector3(-1, 0.08, -1),
  rear: new THREE.Vector3(0, 0.08, -1),
  rearright: new THREE.Vector3(1, 0.08, -1),
  right: new THREE.Vector3(1, 0.05, 0),
  frontright: new THREE.Vector3(1, 0.08, 1),
  top: new THREE.Vector3(0, 1, 0.02),
};

function visibleBox(root) {
  const box = new THREE.Box3();
  root.updateMatrixWorld(true);
  root.traverse((o) => {
    if (!(o.isMesh || o.isInstancedMesh || o.isSkinnedMesh) || !o.geometry) return;
    let vis = true;
    for (let p = o; p; p = p.parent) if (!p.visible) { vis = false; break; }
    if (!vis || /shadow/i.test(o.name || '')) return;
    if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
    const b = o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld);
    box.union(b);
  });
  return box;
}

// Boxes are computed ONCE while both roots are visible — renderModel leaves
// one root hidden, and a box computed on a hidden root is empty (garbage
// cameras, blank frames — critic r1 finding).
function orthoFor(box, direction, frac = 0.55, centerOff = null) {
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  if (centerOff) {
    center.x += centerOff.x * size.x; center.y += centerOff.y * size.y; center.z += centerOff.z * size.z;
  }
  const dir = direction.clone().normalize();
  const nominalUp = Math.abs(dir.y) > 0.9 ? new THREE.Vector3(0, 0, -1) : new THREE.Vector3(0, 1, 0);
  const right = new THREE.Vector3().crossVectors(nominalUp, dir).normalize();
  const up = new THREE.Vector3().crossVectors(dir, right).normalize();
  // frame by projected extent of the box corners on the camera plane
  let ext = 0.5;
  for (const cx of [box.min.x, box.max.x]) for (const cy of [box.min.y, box.max.y]) for (const cz of [box.min.z, box.max.z]) {
    const d = new THREE.Vector3(cx, cy, cz).sub(center);
    ext = Math.max(ext, Math.abs(d.dot(right)), Math.abs(d.dot(up)));
  }
  const half = ext * (frac / 0.5) * 1.06;
  const camera = new THREE.OrthographicCamera(-half, half, half, -half, 0.1, 200);
  camera.position.copy(center).addScaledVector(dir, 60);
  camera.up.copy(up);
  camera.lookAt(center);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
  return camera;
}

function heroFor(box, direction) {
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const dist = Math.max(size.x, size.y, size.z) * 1.55;
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 300);
  camera.position.copy(center).addScaledVector(direction.clone().normalize(), dist);
  camera.position.y += size.y * 0.28;
  camera.lookAt(center);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
  return camera;
}

const copy2d = document.createElement('canvas');
copy2d.width = copy2d.height = SIZE;
const copyCtx = copy2d.getContext('2d', { willReadFrequently: true });
function renderModel(visual, other, camera) {
  visual.root.visible = true;
  other.root.visible = false;
  renderer.setRenderTarget(null);
  renderer.setClearColor(0x151b20, 1);
  renderer.clear(true, true, true);
  renderer.render(scene, camera);
  copyCtx.drawImage(renderer.domElement, 0, 0, SIZE, SIZE);
  return copyCtx.getImageData(0, 0, SIZE, SIZE);
}

const pairCanvas = document.createElement('canvas');
pairCanvas.width = SIZE * 2; pairCanvas.height = SIZE;
const pairCtx = pairCanvas.getContext('2d', { willReadFrequently: true });
function pairURL(refImg, procImg) {
  copyCtx.putImageData(refImg, 0, 0); pairCtx.drawImage(copy2d, 0, 0);
  copyCtx.putImageData(procImg, 0, 0); pairCtx.drawImage(copy2d, SIZE, 0);
  pairCtx.fillStyle = '#e7edf0'; pairCtx.font = '18px monospace';
  pairCtx.fillText('REFERENCE', 12, 24);
  pairCtx.fillText('PROCEDURAL', SIZE + 12, 24);
  return pairCanvas.toDataURL('image/png');
}

reference.root.visible = true;
procedural.root.visible = true;
const refBox = visibleBox(reference.root);
const procBox = visibleBox(procedural.root);
const badBox = (b) => !isFinite(b.min.x) || !isFinite(b.max.x) || b.getSize(new THREE.Vector3()).length() < 0.5;
if (badBox(refBox) || badBox(procBox)) throw new Error('degenerate bounding box — model failed to build');

const pairs = {};
for (const [name, dir] of Object.entries(VIEWS)) {
  const r = renderModel(reference, procedural, orthoFor(refBox, dir));
  const p = renderModel(procedural, reference, orthoFor(procBox, dir));
  pairs[`view-${name}`] = pairURL(r, p);
}
for (const [name, dir] of [
  ['hero-frontleft', new THREE.Vector3(-1, 0.35, 1)],
  ['hero-rearright', new THREE.Vector3(1, 0.35, -1)],
  // owner directive 2026-08-02 (top-down fill & circularity review): shaded
  // tilted top-down perspective — hollow/empty-from-above + broken-circle
  // defects that pure orthos hide.
  ['hero-toptilt', new THREE.Vector3(0.55, 1.35, -0.75)],
]) {
  const r = renderModel(reference, procedural, heroFor(refBox, dir));
  const p = renderModel(procedural, reference, heroFor(procBox, dir));
  pairs[name] = pairURL(r, p);
}
// closeups: casemate face + ball mantlet (forward third), roof cluster (top third)
for (const [name, dir, off, hs] of [
  ['close-mantlet', new THREE.Vector3(-1, 0.22, 1), { x: 0, y: 0.12, z: 0.28 }, 0.26],
  ['close-roofcluster', new THREE.Vector3(1, 0.55, 0.35), { x: 0, y: 0.3, z: 0.05 }, 0.24],
]) {
  const r = renderModel(reference, procedural, orthoFor(refBox, dir, hs, off));
  const p = renderModel(procedural, reference, orthoFor(procBox, dir, hs, off));
  pairs[name] = pairURL(r, p);
}
// sanity: refuse to publish pairs whose procedural half is empty
{
  const probe = renderModel(procedural, reference, orthoFor(procBox, VIEWS.left));
  let lit = 0;
  for (let i = 0; i < probe.data.length; i += 4) {
    if (Math.abs(probe.data[i] - 0x15) > 12 || Math.abs(probe.data[i + 1] - 0x1b) > 12) lit++;
  }
  if (lit < 2000) throw new Error(`procedural half near-empty (${lit} lit px) — refusing to write pairs`);
}

window.__CRITIC_PAIRS = pairs;
window.__CRITIC_READY = true;
document.getElementById('out').textContent = `pairs ready: ${Object.keys(pairs).length}`;
</script>
