<!doctype html>
<!-- TEMP (isu122s r11): bucket-identification probe. Renders the procedural
     build only, one ortho view, with chosen material buckets tinted in pure
     debug colors so pair-pane rects can be mapped to surfaces exactly.
     ?id=isu122s&view=front  (front|left|right|rear|top)
     Exposes window.__PROBE_PNG (dataURL) + __PROBE_DONE. Deleted after round. -->
<meta charset="utf-8">
<title>tmp id probe</title>
<script type="module">
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.js';

const SIZE = 640;
const q = new URLSearchParams(location.search);
const id = q.get('id') || 'isu122s';
const view = q.get('view') || 'front';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
renderer.setSize(SIZE, SIZE, false);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x151b20, 1);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer };
const tank = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
scene.add(tank.root);
const hemi = new THREE.HemisphereLight(0xcfd8e0, 0x2a2f26, 1.05);
const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(30, 42, 24);
scene.add(hemi, sun);

// tint buckets AFTER build (per-build mats instances)
const TINT = {
  rubber: 0xff00ff,      // front-plate skin bucket
  canvasCloth: 0x00ffff, // painted casting bucket
  detail: 0xffff00,      // fittings / flank skins
  wood: 0xff8800,        // wheel family
  glass: 0x00ff00,       // drums
};
const flat = (hex) => new THREE.MeshBasicMaterial({ color: hex });
const mats = tank.visual?.mats || tank.mats;
// createTank returns {root,...}; find materials by walking meshes and matching
// known material references via the profile P.mats is not exposed — instead
// tint by CURRENT color hex match is fragile; walk meshes and match material
// uuid groups by their color/rough signature. Simpler: traverse and replace
// by material.name if set, else use color heuristics. We instead tag by
//댓 bucket via userData set at add-time — not available. Fallback: replace by
// matching the exact color hexes this build sets.
const BYHEX = new Map([
  [0x53584a, 0xff00ff],  // mats.rubber (front plate)
  [0x7a7f72, 0x00ffff],  // mats.canvasCloth (casting/painted)
  [0x515549, 0xffff00],  // mats.detail (fittings/flank skins)
  [0x62665a, 0xff8800],  // mats.wood (wheel family)
  [0x575a4e, 0x00ff00],  // mats.glass (drums)
  [0x4e5047, 0x0088ff],  // mats.spareTrack (steel fittings)
]);
const seen = new Map();
tank.root.traverse((o) => {
  if (!(o.isMesh || o.isInstancedMesh)) return;
  const m = o.material;
  if (!m || !m.color) return;
  const hx = m.color.getHex();
  if (BYHEX.has(hx)) {
    if (!seen.has(hx)) seen.set(hx, flat(BYHEX.get(hx)));
    o.material = seen.get(hx);
  }
});

// &list=1: report every instanced mesh + gear-side plain mesh with material
// identity (color hex, roughness) and geometry bbox so tone work can target
// the right object class.
if (q.get('list')) {
  const rows = [];
  tank.root.traverse((o) => {
    if (!(o.isMesh || o.isInstancedMesh)) return;
    const m = o.material;
    if (!m || !m.color) return;
    if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
    const bb = o.geometry.boundingBox;
    rows.push({
      kind: o.isInstancedMesh ? `inst x${o.count}` : 'mesh',
      hex: m.color.getHex().toString(16).padStart(6, '0'),
      rough: m.roughness, name: m.name || '',
      bb: [bb.min, bb.max].map((v) => [v.x, v.y, v.z].map((n) => +n.toFixed(3))),
    });
  });
  window.__PROBE_LIST = rows;
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
await sleep(300);
tank.root.updateMatrixWorld(true);
tank.root.traverse((o) => {
  if (!o.isLOD) return;
  o.autoUpdate = false;
  o.levels.forEach((level, i) => { if (level.object) level.object.visible = i === 0; });
});

const DIRS = {
  front: new THREE.Vector3(0, 0.08, 1),
  left: new THREE.Vector3(-1, 0.05, 0),
  right: new THREE.Vector3(1, 0.05, 0),
  rear: new THREE.Vector3(0, 0.08, -1),
  top: new THREE.Vector3(0, 1, 0.02),
};
const box = new THREE.Box3();
tank.root.traverse((o) => {
  if (!(o.isMesh || o.isInstancedMesh) || !o.geometry) return;
  let vis = true;
  for (let p = o; p; p = p.parent) if (!p.visible) { vis = false; break; }
  if (!vis || /shadow/i.test(o.name || '')) return;
  if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
  box.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld));
});
const dir = DIRS[view].clone().normalize();
const center = box.getCenter(new THREE.Vector3());
const nominalUp = Math.abs(dir.y) > 0.9 ? new THREE.Vector3(0, 0, -1) : new THREE.Vector3(0, 1, 0);
const right = new THREE.Vector3().crossVectors(nominalUp, dir).normalize();
const up = new THREE.Vector3().crossVectors(dir, right).normalize();
let ext = 0.5;
for (const cx of [box.min.x, box.max.x]) for (const cy of [box.min.y, box.max.y]) for (const cz of [box.min.z, box.max.z]) {
  const d = new THREE.Vector3(cx, cy, cz).sub(center);
  ext = Math.max(ext, Math.abs(d.dot(right)), Math.abs(d.dot(up)));
}
const half = ext * (0.55 / 0.5) * 1.06;
const camera = new THREE.OrthographicCamera(-half, half, half, -half, 0.1, 200);
camera.position.copy(center).addScaledVector(dir, 60);
camera.up.copy(up);
camera.lookAt(center);
camera.updateProjectionMatrix();
renderer.render(scene, camera);
window.__PROBE_META = { half, center: center.toArray(), right: right.toArray(), up: up.toArray() };
window.__PROBE_PNG = renderer.domElement.toDataURL('image/png');
window.__PROBE_DONE = true;
</script>
