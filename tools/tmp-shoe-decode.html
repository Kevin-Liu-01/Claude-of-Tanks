<!doctype html>
<!-- SCRATCH (leopard §B4 shoe blind-spot round): per-solid decode of the
     official track-clip-audit shoe pass. Same createTank frame, same shoe
     OBB/component/depth math (DEPTH_MIN 0.015, exact mode only), but hit
     voxels are CLUSTERED (26-connectivity) so each cluster maps to one
     authored solid; per cluster we also report the deepest voxel + the
     instance (layer, center, local point) that produced the max depth.
     Diagnosis-only — never verdict evidence (§D). -->
<meta charset="utf-8">
<title>tmp-shoe-decode</title>
<script type="module">
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.js';

const params = new URLSearchParams(location.search);
const id = params.get('id') || 'leo2a6';
const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer: null };
const tank = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
tank.root.updateMatrixWorld(true);

const V = 0.02;

const bands = [];
const meshes = [];
const shoeIMs = [];
tank.root.traverse((o) => {
  if (!o.visible) return;
  if (o.isMesh && !o.isInstancedMesh && o.geometry) {
    const pos = o.geometry.getAttribute('position');
    if (pos && pos.usage === THREE.DynamicDrawUsage) bands.push(o);
    else if (!o.material || o.material.colorWrite !== false) meshes.push(o);
  } else if (o.isInstancedMesh && o.parent && o.parent.isLOD && o.count >= 8
      && o.geometry && o.geometry.getAttribute('position')) {
    shoeIMs.push(o);
  }
});

const out = { id, zones: [] };
const bbox = new THREE.Box3();
const lanes = bands.map((b) => { bbox.setFromObject(b); return bbox.clone(); });
const zMax = Math.max(...lanes.map((l) => l.max.z));
const zMin = Math.min(...lanes.map((l) => l.min.z));
let laneInnerX = Math.min(...lanes.map((l) => Math.min(Math.abs(l.min.x), Math.abs(l.max.x))));

// shoe envelope
const senv = new THREE.Box3();
const sv = new THREE.Vector3();
const _im4 = new THREE.Matrix4(), _wm4 = new THREE.Matrix4(), _ic = new THREE.Vector3();
for (const im of shoeIMs) {
  const pos = im.geometry.getAttribute('position');
  for (let k = 0; k < im.count; k++) {
    im.getMatrixAt(k, _im4);
    if (Math.abs(_im4.determinant()) < 1e-12) continue;
    _wm4.multiplyMatrices(im.matrixWorld, _im4);
    for (let i = 0; i < pos.count; i++) {
      sv.fromBufferAttribute(pos, i).applyMatrix4(_wm4);
      senv.expandByPoint(sv);
    }
  }
}
out.shoeEnv = [[senv.min.x, senv.min.y, senv.min.z], [senv.max.x, senv.max.y, senv.max.z]].map((r) => r.map((v) => +v.toFixed(4)));
out.bandZ = { zMax: +zMax.toFixed(4), zMin: +zMin.toFixed(4) };

const sZones = [
  { name: 'front', z0: senv.max.z - 0.50, z1: senv.max.z + 0.06 },
  { name: 'rear', z0: senv.min.z - 0.06, z1: senv.min.z + 0.50 },
];
const sy0 = senv.min.y + 0.02, sy1 = senv.max.y + 0.06;

const compBoxes = new Map();
function componentsOf(g) {
  if (compBoxes.has(g.uuid)) return compBoxes.get(g.uuid);
  const pos = g.getAttribute('position'), idx = g.index;
  const n = pos.count;
  const parent = new Array(n);
  for (let i = 0; i < n; i++) parent[i] = i;
  const find = (i) => { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
  const uni = (i, j) => { const a = find(i), b = find(j); if (a !== b) parent[a] = b; };
  const byPos = new Map();
  for (let i = 0; i < n; i++) {
    const k = `${Math.round(pos.getX(i) * 1e4)},${Math.round(pos.getY(i) * 1e4)},${Math.round(pos.getZ(i) * 1e4)}`;
    if (byPos.has(k)) uni(i, byPos.get(k)); else byPos.set(k, i);
  }
  const nt = idx ? idx.count : n;
  for (let i = 0; i < nt; i += 3) {
    const i0 = idx ? idx.getX(i) : i, i1 = idx ? idx.getX(i + 1) : i + 1, i2 = idx ? idx.getX(i + 2) : i + 2;
    uni(i0, i1); uni(i1, i2);
  }
  const boxes = new Map();
  for (let i = 0; i < n; i++) {
    const r = find(i);
    let bx = boxes.get(r);
    if (!bx) { bx = new THREE.Box3(); boxes.set(r, bx); }
    bx.expandByPoint(new THREE.Vector3(pos.getX(i), pos.getY(i), pos.getZ(i)));
  }
  const list = [...boxes.values()];
  compBoxes.set(g.uuid, list);
  return list;
}
const DEPTH_MIN = 0.015;
const boxDepth = (bx, pt) => Math.min(
  pt.x - bx.min.x, bx.max.x - pt.x,
  pt.y - bx.min.y, bx.max.y - pt.y,
  pt.z - bx.min.z, bx.max.z - pt.z);
const SHELL_M = 3 * V;
const shellBoxes = new Map();
function shellOf(g) {
  if (shellBoxes.has(g.uuid)) return shellBoxes.get(g.uuid);
  const list = componentsOf(g).map((bx) => bx.clone().expandByScalar(SHELL_M));
  shellBoxes.set(g.uuid, list);
  return list;
}

const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3(), p = new THREE.Vector3();
function sampleTris(g, mtx, z0, z1, yLo, yHi, set) {
  const pos = g.getAttribute('position'), idx = g.index;
  const n = idx ? idx.count : pos.count;
  for (let i = 0; i < n; i += 3) {
    const i0 = idx ? idx.getX(i) : i, i1 = idx ? idx.getX(i + 1) : i + 1, i2 = idx ? idx.getX(i + 2) : i + 2;
    a.fromBufferAttribute(pos, i0).applyMatrix4(mtx);
    b.fromBufferAttribute(pos, i1).applyMatrix4(mtx);
    c.fromBufferAttribute(pos, i2).applyMatrix4(mtx);
    const zc = (a.z + b.z + c.z) / 3;
    const zr = Math.max(a.z, b.z, c.z) - Math.min(a.z, b.z, c.z);
    if (zc + zr < z0 || zc - zr > z1) continue;
    const area = b.clone().sub(a).cross(c.clone().sub(a)).length() / 2;
    const steps = Math.max(1, Math.min(24, Math.ceil(Math.sqrt(area) / 0.012)));
    for (let u = 0; u <= steps; u++) {
      for (let v = 0; v + u <= steps; v++) {
        const w = steps - u - v;
        p.set(0, 0, 0).addScaledVector(a, u / steps).addScaledVector(b, v / steps).addScaledVector(c, w / steps);
        if (p.z < z0 || p.z > z1 || p.y < yLo || p.y > yHi) continue;
        set.add(`${Math.round(p.x / V)},${Math.round(p.y / V)},${Math.round(p.z / V)}`);
      }
    }
  }
}

sZones.forEach((zone) => {
  const obbs = [];
  for (const im of shoeIMs) {
    const g = im.geometry;
    if (!g.boundingSphere) g.computeBoundingSphere();
    const comps = componentsOf(g);
    const shell = shellOf(g);
    const R = g.boundingSphere.radius + g.boundingSphere.center.length() + SHELL_M;
    for (let k = 0; k < im.count; k++) {
      im.getMatrixAt(k, _im4);
      if (Math.abs(_im4.determinant()) < 1e-12) continue;
      _wm4.multiplyMatrices(im.matrixWorld, _im4);
      _ic.setFromMatrixPosition(_wm4);
      if (_ic.z + R < zone.z0 || _ic.z - R > zone.z1 || _ic.y + R < sy0 || _ic.y - R > sy1) continue;
      obbs.push({ inv: _wm4.clone().invert(), comps, shell, cx: _ic.x, cy: _ic.y, cz: _ic.z, r2: R * R, layer: im.geometry.uuid });
    }
  }
  const zoneOut = { name: zone.name, z0: +zone.z0.toFixed(3), z1: +zone.z1.toFixed(3), meshes: [] };
  const zoneBox = new THREE.Box3(
    new THREE.Vector3(-1e3, sy0, zone.z0), new THREE.Vector3(1e3, sy1, zone.z1));
  const q = new THREE.Vector3();
  meshes.forEach((m, mi) => {
    bbox.setFromObject(m);
    if (!bbox.intersectsBox(zoneBox)) return;
    const reach = Math.min(Math.abs(bbox.min.x), bbox.min.x <= 0 && bbox.max.x >= 0 ? 0 : Math.abs(bbox.max.x));
    if (reach > Math.max(0.05, laneInnerX - 0.15)) return;
    const set = new Set();
    sampleTris(m.geometry, m.matrixWorld, zone.z0, zone.z1, sy0, sy1, set);
    const hitVox = new Map(); // key -> {depth, inst}
    for (const k of set) {
      const [x, y, z] = k.split(',').map(Number);
      const wx = x * V, wy = y * V, wz = z * V;
      let depth = -1; let bestInst = null;
      for (const ob of obbs) {
        const dx = wx - ob.cx, dy = wy - ob.cy, dz = wz - ob.cz;
        if (dx * dx + dy * dy + dz * dz > ob.r2) continue;
        q.set(wx, wy, wz).applyMatrix4(ob.inv);
        for (const cb of ob.comps) {
          const d = boxDepth(cb, q);
          if (d > depth) { depth = d; bestInst = ob; }
        }
      }
      if (depth >= DEPTH_MIN) hitVox.set(k, { depth, cy: bestInst.cy, cz: bestInst.cz });
    }
    if (!hitVox.size) return;
    // cluster (26-connectivity)
    const seen = new Set();
    const clusters = [];
    for (const k0 of hitVox.keys()) {
      if (seen.has(k0)) continue;
      const stack = [k0];
      seen.add(k0);
      const cl = { vox: 0, lo: [1e9, 1e9, 1e9], hi: [-1e9, -1e9, -1e9], maxDepth: -1, deepVox: null, inst: null };
      while (stack.length) {
        const k = stack.pop();
        cl.vox++;
        const [x, y, z] = k.split(',').map(Number);
        cl.lo = [Math.min(cl.lo[0], x), Math.min(cl.lo[1], y), Math.min(cl.lo[2], z)];
        cl.hi = [Math.max(cl.hi[0], x), Math.max(cl.hi[1], y), Math.max(cl.hi[2], z)];
        const rec = hitVox.get(k);
        if (rec.depth > cl.maxDepth) { cl.maxDepth = rec.depth; cl.deepVox = [x * V, y * V, z * V]; cl.inst = { cy: rec.cy, cz: rec.cz }; }
        for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) for (let dz = -1; dz <= 1; dz++) {
          const nk = `${x + dx},${y + dy},${z + dz}`;
          if (hitVox.has(nk) && !seen.has(nk)) { seen.add(nk); stack.push(nk); }
        }
      }
      clusters.push({
        vox: cl.vox,
        box: [cl.lo.map((v) => +(v * V).toFixed(3)), cl.hi.map((v) => +(v * V).toFixed(3))],
        maxDepthM: +cl.maxDepth.toFixed(4),
        deepVox: cl.deepVox.map((v) => +v.toFixed(3)),
        instCenter: { y: +cl.inst.cy.toFixed(3), z: +cl.inst.cz.toFixed(3) },
      });
    }
    clusters.sort((x, y) => y.vox - x.vox);
    const matC = m.material && m.material.color ? m.material.color.getHexString() : '?';
    zoneOut.meshes.push({
      mi, name: m.name || m.parent?.name || '(unnamed)', mat: matC,
      total: [...hitVox.values()].length, clusters: clusters.slice(0, 12),
    });
  });
  out.zones.push(zoneOut);
});

window.__DECODE_RESULT = out;
window.__DECODE_READY = true;
</script>
