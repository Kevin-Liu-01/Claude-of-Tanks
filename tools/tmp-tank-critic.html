    gunFollowers:'vehicle#gun_barrel_' } },
  merkava3b: { source:'glb', glb:{ path:'/models/tanks/community/recovered/merkava3b.glb',
    turretNode:'^Turret$', gunNode:'^Gun$', autoPivot:true, paintUntextured:true,
    turretFollowers:'vehicle#(?:antenna_|bone_|ex_armor_(?!body|[lr]_)|ex_decor_(?:0[1-9]|1[0-3]|1[78])|ex_decor_[lr]_02|hatch_(?:0[4-9]|1[0-3]))',
    gunFollowers:'vehicle#gun_barrel_' } },
  merkava3c: { source:'glb', glb:{ path:'/models/tanks/community/recovered/merkava3c.glb',
    turretNode:'^Turret$', gunNode:'^Gun$', autoPivot:true, paintUntextured:true,
    turretFollowers:'vehicle#(?:antenna_|bone_|ex_armor_(?!body|[lr]_)|ex_decor_(?:0[1-9]|1[01]|13|1[5-7])|ex_decor_[lr]_02|hatch_(?:0[4-9]|1[0-3]))',
    gunFollowers:'vehicle#gun_barrel_' } },
  // AFV lane (2026-08-06): SPz Puma oracle row mirroring the fidelity
  // harness (42manako CC-BY-4.0; playable stays procedural).
  spz_puma: { source:'glb', glb:{ path:'/models/tanks/community/spz_puma.glb',
    turretNode:'^turret$', autoPivot:true, yawOffset:-Math.PI/2 } },
  // m2a2_bradley GRADUATION ADJUDICATION (2026-08-08): oracle row mirroring
  // the fidelity harness (42manako CC-BY-4.0, turret_lod split, textures in
  // the print — no paintUntextured; vertex REG yawOffset 0 / flip false).
  m2a2_bradley: { source:'glb', glb:{ path:'/models/tanks/community/m2_bradley_ifv.glb',
    turretNode:'^turret_lod$', autoPivot:true } },
  // BASE-21 ORACLE WAVE (2026-08-06): oracle rows mirroring the fidelity
  // harness LOCAL_REFERENCE_OVERRIDES (see its wave block for print notes
  // + the leo2a4/type10 provenance refusals). t14's GLB is LOCAL-ONLY
  // (gitignored community-candidates/ staging area).
  challenger2: { source:'glb', glb:{ path:'/models/tanks/community/challenger_ii.glb',
    turretNode:'^challendger[ _]2_0$', gunNode:'^Gun$', autoPivot:true } },
  type10: { source:'glb', glb:{ path:'/models/tanks/community/type-10_main_battle_tank_repaired.glb',
    turretNode:'^Turret$', gunNode:'^Gun$', autoPivot:true, paintUntextured:true } },
  // Owner 2026-08-10 high-detail NullOps Type 74 drop. Sketchfab Standard:
  // local visual/measurement reference only; the playable stays procedural.
  type74: { source:'glb', glb:{ path:'/models/community-candidates/type_74_new.glb',
    turretNode:'^Tower_9$', gunNode:'^Gun_7$', autoPivot:true, scaleToOverall:true } },
  t14: { source:'glb', glb:{ path:'/models/community-candidates/t-14_armara_uralvagon_factory.glb',
    turretNode:'^Object_8$', gunNode:'^Object_14$', autoPivot:true, yawOffset:Math.PI,
    turretFollowers:'^Object_(?:9|10|11|15)$' } },
  t72b3m: { source:'glb', glb:{ path:'/models/tanks/community/t-72b3m_obr._2022.glb',
    turretNode:'^Object_14$', gunNode:'^Object_15$', autoPivot:true, yawOffset:Math.PI,
    turretFollowers:'^Object_3$' } },
  // AbramsX graduate: the Mortavex asset is measurement-only.  Runtime no
  // longer installs its visibly stilted kit, but critic comparisons retain
  // the exact frozen source registration.
  abramsx: { source:'glb', glb:{ path:'/models/tanks/community/abramsx-mortavex.glb',
    turretNode:'^Turret$', gunNode:'^[Ss]tvol$', autoPivot:true,
    turretFollowers:'^(TurretKit|stvol|puli|RWSKorpus)$',
    pivot:[0,285.639,73.949], paintUntextured:true } },
  // challenger_3 NEW VEHICLE (owner greenlight 2026-08-06): 42manako
  // CC-BY-NC-4.0 — LOCAL-ONLY QUARANTINE oracle, never ships; mirrors the
  // fidelity harness row (gun 'weapon' under 'mount'; anchored regex
  // skips weapon2/weapon3; raw nose +x).
  challenger_3: { source:'glb', glb:{ path:'/models/tanks/community/challenger_3.glb',
    turretNode:'^turret$', gunNode:'^weapon$', autoPivot:true, yawOffset:-Math.PI/2 } },
};
// graduates carry a truthy {source:'procedural'} marker, and createTank
// reads MODEL_SOURCE internally — checking alone is not enough: INJECT the
// override into MODEL_SOURCE (page-local module instance; never ships).
if (MODEL_SOURCE[id]?.source !== 'glb' && CRITIC_REFERENCE_OVERRIDES[id]) {
  MODEL_SOURCE[id] = CRITIC_REFERENCE_OVERRIDES[id];
}
// pt91m (2026-08-03, first critic round): the recovered print is authored
// -z-forward (docs/references/tanks/pt91m.md oracle note — the gate's
// vertex-extract auto-flips it before scoring, but modelLoader honors only
// cfg.yawOffset and userdrops5's source() sets none). Raw pairs rendered the
// REFERENCE yaw-180 vs the procedural: gun/glacis -z, mirrored flanks — every
// asym-print coordinate would read wrong-handed. Same page-local patch class
// as the injection above; never ships.
if (id === 'pt91m' && MODEL_SOURCE[id]?.glb && MODEL_SOURCE[id].glb.yawOffset == null) {
  MODEL_SOURCE[id] = { ...MODEL_SOURCE[id], glb: { ...MODEL_SOURCE[id].glb, yawOffset: Math.PI } };
}
const source = MODEL_SOURCE[id];
if (!proceduralOnlyEvidence && source?.source !== 'glb') throw new Error(`${id} has no GLB reference registered`);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
renderer.setSize(SIZE, SIZE, false);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x151b20, 1);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer };

// The OTCo convenience GLB is intentionally material-merged and has no
// trustworthy articulation nodes. For static source pixels only, allow its
// complete raw scene through the fixed-mount loader path, then construct the
// procedural side normally. This never changes runtime data and avoids
// distorting the reference material buckets.
const rawLeo2A4 = id === 'leo2a4';
let reference;
if (proceduralOnlyEvidence) {
  // Authored-only recovery/audit mode.  This is deliberately NOT source
  // evidence: it exists so removed or unavailable comparison assets never
  // block elevated-profile and yaw inspection of our own procedural model.
  // A second deterministic authored build occupies the left panel solely to
  // preserve the board framing contract.  The labels below make the mode
  // impossible to mistake for a source-relative score packet.
  reference = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
  reference.root.userData.__glbSwapped = true;
} else if (rawLeo2A4) {
  const gltf = await new GLTFLoader().loadAsync(source.glb.path);
  reference = { root: gltf.scene };
  reference.root.userData.__glbSwapped = true;
} else {
  reference = source?.source === 'glb'
    ? await loadReferenceGlb(source, id, spec)
    : createTank(id, engineCtx, { camoSeed: 4242, quality: 'high' });
}
const procedural = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
scene.add(reference.root, procedural.root);

// fidelity board's exact rig
const hemi = new THREE.HemisphereLight(0xcfd8e0, 0x2a2f26, 1.05);
const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(30, 42, 24);
scene.add(hemi, sun);

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const swapped = (visual) => {
  let yes = false;
  visual.root.traverse((o) => { if (o.userData?.__glbSwapped) yes = true; });
  return yes;
};
for (let i = 0; i < 600 && !swapped(reference); i++) await sleep(50);
if (!swapped(reference)) throw new Error(`${id} reference GLB did not load`);
await sleep(400);
reference.root.updateMatrixWorld(true);
procedural.root.updateMatrixWorld(true);
for (const root of [reference.root, procedural.root]) {
  root.traverse((o) => {
    if (!o.isLOD) return;
    o.autoUpdate = false;
    o.levels.forEach((level, i) => { if (level.object) level.object.visible = i === 0; });
  });
}

const VIEWS = {
  front: new THREE.Vector3(0, 0.08, 1),
  frontleft: new THREE.Vector3(-1, 0.08, 1),
  left: new THREE.Vector3(-1, 0.05, 0),
  rearleft: new THREE.Vector3(-1, 0.08, -1),
  rear: new THREE.Vector3(0, 0.08, -1),
  rearright: new THREE.Vector3(1, 0.08, -1),
  right: new THREE.Vector3(1, 0.05, 0),
  frontright: new THREE.Vector3(1, 0.08, 1),
  top: new THREE.Vector3(0, 1, 0.02),
};
// Owner-standard modern-tank profile (2026-08-12): a repeatable near-side
// elevation with just enough downward pitch to expose the complete turret
// roof.  It is opt-in (`?profile=1`) so the immutable 14-view certification
// packet remains exactly 42 frames, while design/parenting reviews can add
// the same silhouette/attachment proof for every modern family.
const ELEVATED_PROFILE = ['profile-elevated-left', new THREE.Vector3(-1, 0.24, 0.04)];

function visibleBox(root) {
  const box = new THREE.Box3();
  root.updateMatrixWorld(true);
  root.traverse((o) => {
    if (!(o.isMesh || o.isInstancedMesh || o.isSkinnedMesh) || !o.geometry) return;
    let vis = true;
    for (let p = o; p; p = p.parent) if (!p.visible) { vis = false; break; }
    if (!vis || /shadow/i.test(o.name || '')) return;
    // InstancedMesh: the geometry bbox is the TEMPLATE at origin (a phantom
    // disc parked at y ~0 inflated proc framing ~8% both axes — merkava r6
    // extent audit). computeBoundingBox() on the InstancedMesh itself is
    // instance-aware; use it and skip empty instancers.
    if (o.isInstancedMesh) {
      if (o.count === 0) return;
      o.computeBoundingBox();
      if (o.boundingBox && !o.boundingBox.isEmpty()) {
        box.union(o.boundingBox.clone().applyMatrix4(o.matrixWorld));
      }
      return;
    }
    if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
    const b = o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld);
    box.union(b);
  });
  return box;
}

// Boxes are computed ONCE while both roots are visible — renderModel leaves
// one root hidden, and a box computed on a hidden root is empty (garbage
// cameras, blank frames — critic r1 finding).
function orthoFor(box, direction, frac = 0.55, centerOff = null) {
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  if (centerOff) {
    center.x += centerOff.x * size.x; center.y += centerOff.y * size.y; center.z += centerOff.z * size.z;
  }
  const dir = direction.clone().normalize();
  const nominalUp = Math.abs(dir.y) > 0.9 ? new THREE.Vector3(0, 0, -1) : new THREE.Vector3(0, 1, 0);
  const right = new THREE.Vector3().crossVectors(nominalUp, dir).normalize();
  const up = new THREE.Vector3().crossVectors(dir, right).normalize();
  // frame by projected extent of the box corners on the camera plane
  let ext = 0.5;
  for (const cx of [box.min.x, box.max.x]) for (const cy of [box.min.y, box.max.y]) for (const cz of [box.min.z, box.max.z]) {
    const d = new THREE.Vector3(cx, cy, cz).sub(center);
    ext = Math.max(ext, Math.abs(d.dot(right)), Math.abs(d.dot(up)));
  }
  const half = ext * (frac / 0.5) * 1.06;
  const camera = new THREE.OrthographicCamera(-half, half, half, -half, 0.1, 200);
  camera.position.copy(center).addScaledVector(dir, 60);
  camera.up.copy(up);
  camera.lookAt(center);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
  return camera;
}

function heroFor(box, direction) {
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const dist = Math.max(size.x, size.y, size.z) * 1.55;
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 300);
  camera.position.copy(center).addScaledVector(direction.clone().normalize(), dist);
  camera.position.y += size.y * 0.28;
  camera.lookAt(center);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
  return camera;
}

const copy2d = document.createElement('canvas');
copy2d.width = copy2d.height = SIZE;
const copyCtx = copy2d.getContext('2d', { willReadFrequently: true });
function renderModel(visual, other, camera) {
  visual.root.visible = true;
  other.root.visible = false;
  renderer.setRenderTarget(null);
  renderer.setClearColor(0x151b20, 1);
  renderer.clear(true, true, true);
  renderer.render(scene, camera);
  copyCtx.drawImage(renderer.domElement, 0, 0, SIZE, SIZE);
  return copyCtx.getImageData(0, 0, SIZE, SIZE);
}

const pairCanvas = document.createElement('canvas');
pairCanvas.width = SIZE * 2; pairCanvas.height = SIZE;
const pairCtx = pairCanvas.getContext('2d', { willReadFrequently: true });
function pairURL(refImg, procImg) {
  copyCtx.putImageData(refImg, 0, 0); pairCtx.drawImage(copy2d, 0, 0);
  copyCtx.putImageData(procImg, 0, 0); pairCtx.drawImage(copy2d, SIZE, 0);
  pairCtx.fillStyle = '#e7edf0'; pairCtx.font = '18px monospace';
  pairCtx.fillText(proceduralOnlyEvidence ? 'DETERMINISM COPY A — NOT SOURCE' : 'SOURCE GLB REFERENCE', 12, 24);
  pairCtx.fillText(proceduralOnlyEvidence ? 'DETERMINISM COPY B — NOT SOURCE' : 'AUTHORED PROCEDURAL', SIZE + 12, 24);
  return pairCanvas.toDataURL('image/png');
}

function soloURL(img) {
  copyCtx.putImageData(img, 0, 0);
  return copy2d.toDataURL('image/png');
}

reference.root.visible = true;
procedural.root.visible = true;
const refBox = visibleBox(reference.root);
const procBox = visibleBox(procedural.root);
const badBox = (b) => !isFinite(b.min.x) || !isFinite(b.max.x) || b.getSize(new THREE.Vector3()).length() < 0.5;
if (badBox(refBox) || badBox(procBox)) throw new Error('degenerate bounding box — model failed to build');

const pairs = {};
for (const [name, dir] of Object.entries(VIEWS)) {
  const r = renderModel(reference, procedural, orthoFor(refBox, dir));
  const p = renderModel(procedural, reference, orthoFor(procBox, dir));
  pairs[`view-${name}`] = pairURL(r, p);
}
for (const [name, dir] of [
  ['hero-frontleft', new THREE.Vector3(-1, 0.35, 1)],
  ['hero-rearright', new THREE.Vector3(1, 0.35, -1)],
  // owner directive 2026-08-02 (top-down fill & circularity review): shaded
  // tilted top-down perspective — hollow/empty-from-above + broken-circle
  // defects that pure orthos hide.
  ['hero-toptilt', new THREE.Vector3(0.55, 1.35, -0.75)],
]) {
  const r = renderModel(reference, procedural, heroFor(refBox, dir));
  const p = renderModel(procedural, reference, heroFor(procBox, dir));
  pairs[name] = pairURL(r, p);
}
// closeups: casemate face + ball mantlet (forward third), roof cluster (top third)
for (const [name, dir, off, hs] of [
  ['close-front', new THREE.Vector3(-1, 0.22, 1), { x: 0, y: 0.12, z: 0.28 }, 0.26],
  ['close-roof', new THREE.Vector3(1, 0.55, 0.35), { x: 0, y: 0.3, z: 0.05 }, 0.24],
]) {
  const r = renderModel(reference, procedural, orthoFor(refBox, dir, hs, off));
  const p = renderModel(procedural, reference, orthoFor(procBox, dir, hs, off));
  pairs[name] = pairURL(r, p);
}
if (params.get('profile') === '1') {
  const [name, dir] = ELEVATED_PROFILE;
  const r = renderModel(reference, procedural, orthoFor(refBox, dir, 0.47));
  const p = renderModel(procedural, reference, orthoFor(procBox, dir, 0.47));
  pairs[name] = pairURL(r, p);
}
// sanity: refuse to publish pairs whose procedural half is empty
{
  const probe = renderModel(procedural, reference, orthoFor(procBox, VIEWS.left));
  let lit = 0;
  for (let i = 0; i < probe.data.length; i += 4) {
    if (Math.abs(probe.data[i] - 0x15) > 12 || Math.abs(probe.data[i + 1] - 0x1b) > 12) lit++;
  }
  if (lit < 2000) throw new Error(`procedural half near-empty (${lit} lit px) — refusing to write pairs`);
}

// Optional immutable final-evidence packet. Both yaw states use the union of
// their visible bounds so the cameras, scale, and fixed-hull pixels stay
// directly comparable instead of being independently reframed.
let yaw0 = null;
let yaw90 = null;
if (params.get('final') === '1') {
  const turret = procedural.root.getObjectByName('rig_turret');
  if (!turret) throw new Error(`${id} procedural has no rig_turret`);
  reference.root.visible = false;
  procedural.root.visible = true;
  turret.rotation.y = 0;
  procedural.root.updateMatrixWorld(true);
  const yaw0Box = visibleBox(procedural.root);
  turret.rotation.y = Math.PI / 2;
  procedural.root.updateMatrixWorld(true);
  const yaw90Box = visibleBox(procedural.root);
  const yawFrame = yaw0Box.clone().union(yaw90Box);

  const captureYaw = (yaw) => {
    turret.rotation.y = yaw;
    procedural.root.updateMatrixWorld(true);
    const frames = {};
    for (const [name, dir] of Object.entries(VIEWS)) {
      frames[`view-${name}`] = soloURL(renderModel(procedural, reference, orthoFor(yawFrame, dir)));
    }
    for (const [name, dir] of [
      ['hero-frontleft', new THREE.Vector3(-1, 0.35, 1)],
      ['hero-rearright', new THREE.Vector3(1, 0.35, -1)],
      ['hero-toptilt', new THREE.Vector3(0.55, 1.35, -0.75)],
    ]) {
      frames[name] = soloURL(renderModel(procedural, reference, heroFor(yawFrame, dir)));
    }
    for (const [name, dir, off, hs] of [
      ['close-front', new THREE.Vector3(-1, 0.22, 1), { x: 0, y: 0.12, z: 0.28 }, 0.26],
      ['close-roof', new THREE.Vector3(1, 0.55, 0.35), { x: 0, y: 0.3, z: 0.05 }, 0.24],
    ]) {
      frames[name] = soloURL(renderModel(procedural, reference, orthoFor(yawFrame, dir, hs, off)));
    }
    if (params.get('profile') === '1') {
      const [name, dir] = ELEVATED_PROFILE;
      frames[name] = soloURL(renderModel(procedural, reference, orthoFor(yawFrame, dir, 0.47)));
    }
    return frames;
  };

  yaw0 = captureYaw(0);
  yaw90 = captureYaw(Math.PI / 2);
  turret.rotation.y = 0;
  procedural.root.updateMatrixWorld(true);
}

window.__CRITIC_PAIRS = pairs;
window.__CRITIC_YAW0 = yaw0;
window.__CRITIC_YAW90 = yaw90;
window.__CRITIC_READY = true;
document.getElementById('out').textContent = `pairs ready: ${Object.keys(pairs).length}${yaw0 ? ' + yaw0/yaw90' : ''}`;
if (params.get('show') === '1') {
  for (const [name, url] of Object.entries(pairs)) {
    const h = document.createElement('h2'); h.textContent = name;
    const img = document.createElement('img'); img.src = url; img.alt = name;
    img.style.display = 'block'; img.style.width = '1280px';
    img.style.maxWidth = '100%'; img.style.marginBottom = '18px';
    document.body.append(h, img);
  }
}
</script>
