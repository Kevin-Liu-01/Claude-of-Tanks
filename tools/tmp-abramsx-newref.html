<!doctype html>
<!-- TEMP (abramsx dedicated round 2026-08-07, relaunch): OFFLINE probe of the
     owner's NEW reference drop public/models/community-candidates/
     abrams_x_low_poly.glb (Mortavex, Sketchfab Standard = local-only,
     NOT registered — orchestrator lane). Direct GLTFLoader read: node census
     + AABBs + the same six garage angles as tmp-abramsx-garage.html so the
     pairs compare 1:1. Deleted after the round. -->
<meta charset="utf-8">
<title>tmp-abramsx-newref</title>
<style>body{margin:0;background:#151b20}</style>
<div id="out"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const SIZE = 900;
const params = new URLSearchParams(location.search);
const yawDeg = parseFloat(params.get('yaw') ?? '0');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
renderer.setSize(SIZE, SIZE, false);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x151b20, 1);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();

const hemi = new THREE.HemisphereLight(0xcfd8e0, 0x2a2f26, 1.05);
const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(30, 42, 24);
scene.add(hemi, sun);

const gltf = await new GLTFLoader().loadAsync('/models/community-candidates/abrams_x_low_poly.glb');
const root = gltf.scene;
scene.add(root);
if (yawDeg) root.rotation.y = (yawDeg * Math.PI) / 180;
root.updateMatrixWorld(true);

// ---- census: top-level groups + named nodes with world AABBs ----
const boxOf = (o) => {
  const b = new THREE.Box3();
  o.updateMatrixWorld(true);
  o.traverse((m) => {
    if (!(m.isMesh || m.isInstancedMesh) || !m.geometry) return;
    if (!m.geometry.boundingBox) m.geometry.computeBoundingBox();
    b.union(m.geometry.boundingBox.clone().applyMatrix4(m.matrixWorld));
  });
  return b;
};
const rnd = (v) => Math.round(v * 1000) / 1000;
const fmtBox = (b) => b.isEmpty() ? null : {
  x: [rnd(b.min.x), rnd(b.max.x)], y: [rnd(b.min.y), rnd(b.max.y)], z: [rnd(b.min.z), rnd(b.max.z)],
};
const census = { nodes: [], meshes: [] };
root.traverse((o) => {
  if (o.isMesh) {
    const g = o.geometry;
    const tris = g.index ? g.index.count / 3 : g.attributes.position.count / 3;
    census.meshes.push({ name: o.name, parent: o.parent?.name, verts: g.attributes.position.count, tris: Math.round(tris), box: fmtBox(boxOf(o)) });
  } else if (o !== root && o.name) {
    census.nodes.push({ name: o.name, parent: o.parent?.name, kids: o.children.length });
  }
});
const whole = boxOf(root);
census.wholeBox = fmtBox(whole);

// ---- scale to game meters (normalize the width to the committed 3.66),
// then ground at y=0 and center x/z for the garage frame ----
const widthM = parseFloat(params.get('width') ?? '3.66');
const s = widthM / (whole.max.x - whole.min.x);
census.scale = s;
root.scale.setScalar(s);
root.updateMatrixWorld(true);
const sw = boxOf(root);
root.position.y -= sw.min.y;
root.position.x -= (sw.min.x + sw.max.x) / 2;
root.position.z -= (sw.min.z + sw.max.z) / 2;
root.updateMatrixWorld(true);
const box = boxOf(root);
census.groundedBox = fmtBox(box);
const center = box.getCenter(new THREE.Vector3());

const shots = {};
function shoot(camera) {
  renderer.setRenderTarget(null);
  renderer.setClearColor(0x151b20, 1);
  renderer.clear(true, true, true);
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/png');
}
function garageCam(sx, sz, lift = 1) {
  const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 300);
  camera.position.set(center.x + sx * 7.4, center.y + 2.75 * lift - 0.6, center.z + sz * 8.0);
  camera.lookAt(center.x, center.y + 0.2, center.z);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
  return camera;
}
function orthoCam(dir) {
  const span = Math.max(box.max.x - box.min.x, box.max.y - box.min.y, box.max.z - box.min.z) * 0.62;
  const camera = new THREE.OrthographicCamera(-span, span, span, -span, 0.1, 400);
  camera.position.set(center.x + dir[0] * 40, center.y + dir[1] * 40, center.z + dir[2] * 40);
  camera.lookAt(center);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
  return camera;
}
shots['garage-frontright'] = shoot(garageCam(1, 1));
shots['garage-frontleft'] = shoot(garageCam(-1, 1));
shots['garage-rearright'] = shoot(garageCam(1, -1));
shots['garage-rearleft'] = shoot(garageCam(-1, -1));
shots['garage-high-fr'] = shoot(garageCam(1, 1, 2.2));
shots['garage-high-rl'] = shoot(garageCam(-1, -1, 2.2));
shots['ortho-left'] = shoot(orthoCam([1, 0, 0]));
shots['ortho-front'] = shoot(orthoCam([0, 0, 1]));
shots['ortho-plan'] = shoot(orthoCam([0, 1, 0]));

window.__CENSUS = census;
window.__SHOTS = shots;
window.__SHOTS_READY = true;
document.getElementById('out').textContent = `shots ready: ${Object.keys(shots).length}`;
</script>
