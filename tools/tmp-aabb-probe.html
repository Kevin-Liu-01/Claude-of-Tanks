<!doctype html>
<!-- TEMP (AFV r4, diagnosis-only): per-mesh world-AABB probe of a PROCEDURAL
     build. Names the meshes whose world AABB intersects a query box —
     ?id=<id>&x0=&x1=&y0=&y1=&z0=&z1= (world coords, any omitted bound is
     unbounded). Reports bucket/material, vert count, AABB, and the owning
     rig group (rig_hull / rig_turret / rig_gun path). -->
<meta charset="utf-8">
<title>tmp-aabb-probe</title>
<script type="module">
import { createTank } from '/src/vehicles/tankFactory.js';
import * as THREE from 'three';

const params = new URLSearchParams(location.search);
const id = params.get('id') || 'm2a2_bradley';
const num = (k, d) => params.has(k) ? parseFloat(params.get(k)) : d;
const q = new THREE.Box3(
  new THREE.Vector3(num('x0', -1e9), num('y0', -1e9), num('z0', -1e9)),
  new THREE.Vector3(num('x1', 1e9), num('y1', 1e9), num('z1', 1e9)));
const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer: null };
const tank = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
tank.root.updateMatrixWorld(true);
const out = [];
const box = new THREE.Box3();
tank.root.traverse((o) => {
  if (!(o.isMesh || o.isInstancedMesh) || !o.geometry) return;
  o.geometry.computeBoundingBox();
  box.copy(o.geometry.boundingBox).applyMatrix4(o.matrixWorld);
  if (o.isInstancedMesh) box.copy(new THREE.Box3().setFromObject(o));
  if (!box.intersectsBox(q)) return;
  const path = [];
  for (let p = o; p; p = p.parent) if (p.name) path.push(p.name);
  const f = (v) => v.toFixed(3);
  const mcol = o.material && o.material.color ? o.material.color.getHexString() : '?';
  out.push(`${o.name || '(anon)'} mat=${o.material && o.material.name || ''}#${mcol} verts=${o.geometry.getAttribute('position') ? o.geometry.getAttribute('position').count : 0}`
    + ` aabb x[${f(box.min.x)},${f(box.max.x)}] y[${f(box.min.y)},${f(box.max.y)}] z[${f(box.min.z)},${f(box.max.z)}]`
    + ` path=${path.reverse().join('/')}`);
  // &verts=1: dump world-space vertices inside the query box (cluster by
  // rounded coords so merged-bucket owners are nameable)
  if (params.get('verts') && !o.isInstancedMesh) {
    const pos = o.geometry.getAttribute('position');
    const v = new THREE.Vector3();
    const seen = new Set();
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld);
      if (!q.containsPoint(v)) continue;
      const key = `${v.x.toFixed(2)},${v.y.toFixed(2)},${v.z.toFixed(2)}`;
      if (seen.has(key)) continue;
      seen.add(key);
      if (seen.size <= 40) out.push(`  vert ${key}`);
    }
    if (seen.size > 40) out.push(`  ... ${seen.size} unique verts total`);
  }
});
window.__PROBE = out;
window.__PROBE_READY = true;
</script>
