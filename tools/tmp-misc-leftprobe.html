<!doctype html>
<!-- TEMP (misc missing-left-side round, 2026-08-06): §C winding audit +
     left/right flank raycast probe on a PROCEDURAL build. Patches KIT.slab
     before createTank so every profile slab call is censused: a slab whose
     six faces point INWARD is backface-culled in every FrontSide render
     (game + critic) while staying fully visible to the gate's DoubleSide
     mask material — the §C MISSING-SIDE class. Raycast probe: mirrored
     horizontal rays at (y,z) grid from both flanks; Raycaster respects
     material.side, so a culled left wall reads as a deeper first-hit |x|
     than its right mirror. -->
<meta charset="utf-8">
<title>tmp-misc-leftprobe</title>
<script type="module">
import * as THREE from 'three';
import { KIT } from '/src/vehicles/tankFactory.js';
import { createTank } from '/src/vehicles/tankFactory.js';

const params = new URLSearchParams(location.search);
const id = params.get('id') || 'ariete';

// ---- 1. instrument KIT.slab (profiles destructure at build time) ----------
const slabRecords = [];
const origSlab = KIT.slab;
KIT.slab = function (...corners) {
  const [b0, b1, b2, b3, t0, t1, t2, t3] = corners;
  const c8 = [b0, b1, b2, b3, t0, t1, t2, t3];
  const cen = [0, 1, 2].map((k) => c8.reduce((s, p) => s + p[k], 0) / 8);
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  // the six faces exactly as slab() builds them
  const faces = [
    [b0, b1, t1, t0], [b1, b2, t2, t1], [b2, b3, t3, t2],
    [b3, b0, t0, t3], [t0, t1, t2, t3], [b3, b2, b1, b0],
  ];
  let outward = 0;
  for (const f of faces) {
    const n = cross(sub(f[1], f[0]), sub(f[2], f[0]));
    const fc = [0, 1, 2].map((k) => (f[0][k] + f[1][k] + f[2][k] + f[3][k]) / 4);
    if (dot(n, sub(fc, cen)) > 0) outward++;
  }
  // signed volume of the triangle soup about the origin
  let vol = 0;
  for (const f of faces) {
    for (const tri of [[f[0], f[1], f[2]], [f[0], f[2], f[3]]]) {
      vol += dot(tri[0], cross(tri[1], tri[2])) / 6;
    }
  }
  // call-site line from the stack (vite serves unbundled ESM: real lines)
  const stack = (new Error()).stack || '';
  const site = (stack.split('\n').find((l) => /profiles\/(misc|kit)\.js/.test(l)) || '')
    .replace(/^\s+at\s+/, '').replace(location.origin, '');
  const xs = c8.map((p) => p[0]);
  slabRecords.push({
    i: slabRecords.length, outward, vol: +vol.toFixed(5),
    xMin: +Math.min(...xs).toFixed(3), xMax: +Math.max(...xs).toFixed(3),
    zMin: +Math.min(...c8.map((p) => p[2])).toFixed(3),
    zMax: +Math.max(...c8.map((p) => p[2])).toFixed(3),
    yMin: +Math.min(...c8.map((p) => p[1])).toFixed(3),
    yMax: +Math.max(...c8.map((p) => p[1])).toFixed(3),
    site,
  });
  return origSlab.apply(this, corners);
};

// ---- 2. build ---------------------------------------------------------------
const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer: null };
const tank = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
tank.root.updateMatrixWorld(true);

// ---- 3. mirrored raycast probe ---------------------------------------------
// horizontal rays toward -x (from +x flank) and +x (from -x flank) on a
// (y,z) grid; first-hit |x| per side. FrontSide culling applies to the
// raycaster, so this measures RENDER truth, not mask truth.
const caster = new THREE.Raycaster();
const meshes = [];
tank.root.traverse((o) => {
  if ((o.isMesh || o.isInstancedMesh) && o.geometry && !/shadow/i.test(o.name || '')) meshes.push(o);
});
function probe(y, z) {
  const out = {};
  for (const [tag, ox, dir] of [['R', 8, -1], ['L', -8, 1]]) {
    caster.set(new THREE.Vector3(ox, y, z), new THREE.Vector3(dir, 0, 0));
    const hits = caster.intersectObjects(meshes, false);
    out[tag] = hits.length
      ? { x: +hits[0].point.x.toFixed(4), name: hits[0].object.name || '(unnamed)' }
      : null;
  }
  return out;
}
const rows = [];
for (let y = 0.3; y <= 2.6; y += 0.1) {
  for (let z = -3.8; z <= 4.0; z += 0.2) {
    const { R, L } = probe(+y.toFixed(2), +z.toFixed(2));
    const rx = R ? Math.abs(R.x) : 0;
    const lx = L ? Math.abs(L.x) : 0;
    if (Math.abs(rx - lx) > 0.03) {
      rows.push({
        y: +y.toFixed(2), z: +z.toFixed(2),
        rightX: R ? +rx.toFixed(3) : null, leftX: L ? +lx.toFixed(3) : null,
        d: +(rx - lx).toFixed(3),
        rightHit: R ? R.name : null, leftHit: L ? L.name : null,
      });
    }
  }
}
rows.sort((a, b) => Math.abs(b.d) - Math.abs(a.d));

window.__PROBE = {
  id,
  slabs: slabRecords,
  reversed: slabRecords.filter((r) => r.outward <= 2),
  mixed: slabRecords.filter((r) => r.outward > 2 && r.outward < 6),
  asym: rows.slice(0, 120),
  asymCount: rows.length,
};
window.__PROBE_READY = true;
</script>
