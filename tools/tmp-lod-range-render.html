<!doctype html>
<meta charset="utf-8">
<title>tmp lod range render</title>
<script type="module">
// TEMP (factory invisible-LOD envelope round): deterministic range renders
// with REAL LOD selection (LOD.autoUpdate untouched — the renderer picks the
// level from true camera distance). Proof harness for the before/after pair:
//   close_rest    12 m  fov 40   LOD0, rest
//   far_rest      250 m fov 2.2  LOD1 band, rest (telephoto so the read is legible)
//   far_rest_wide 250 m fov 40   honest player-scale context
//   close_detrackL / far_detrackL — same cameras with trackL thrown
// Deleted after the round.
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.js';

const params = new URLSearchParams(location.search);
const id = params.get('id') || 'ariete';
const W = 960, H = 640;
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
document.body.appendChild(renderer.domElement);

const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer };
const tank = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87a0c0);
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(900, 900),
  new THREE.MeshLambertMaterial({ color: 0x6b6f5a }),
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);
scene.add(new THREE.HemisphereLight(0xcfd8e8, 0x5a5648, 1.05));
const sun = new THREE.DirectionalLight(0xfff2dd, 1.6);
sun.position.set(60, 90, 40);
scene.add(sun);
scene.add(tank.root);
tank.root.updateMatrixWorld(true);

const shots = {};
function shoot(key, dist, fov, azDeg, elDeg) {
  const cam = new THREE.PerspectiveCamera(fov, W / H, 0.1, 1200);
  const az = azDeg * Math.PI / 180, el = elDeg * Math.PI / 180;
  cam.position.set(
    Math.sin(az) * Math.cos(el) * dist,
    Math.sin(el) * dist + 1.2,
    Math.cos(az) * Math.cos(el) * dist,
  );
  cam.lookAt(0, 1.1, 0);
  cam.updateMatrixWorld(true);
  renderer.render(scene, cam);
  shots[key] = renderer.domElement.toDataURL('image/png');
}

// rest state
shoot('close_rest', 12, 40, 34, 9);
shoot('far_rest', 250, 2.2, 34, 3);
shoot('far_rest_wide', 250, 40, 34, 3);
// thrown trackL (ribbon side = -x): view from rear-left so the shed band reads
tank.setTrackState('trackL', true);
tank.root.updateMatrixWorld(true);
shoot('close_detrackL', 12, 40, 210, 11);
shoot('far_detrackL', 250, 2.2, 210, 3);
// restore + re-verify rest render is recoverable (repair path sanity)
tank.setTrackState('trackL', false);
tank.root.updateMatrixWorld(true);
shoot('close_rest_after_repair', 12, 40, 34, 9);

window.__SHOTS = { id, shots };
window.__SHOTS_READY = true;
</script>
