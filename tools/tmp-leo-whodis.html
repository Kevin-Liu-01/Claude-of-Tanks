<!doctype html>
<!-- TEMP (leopard r4): list triangles of a procedural build intersecting a
     probe AABB — member identification for containment residuals. -->
<meta charset="utf-8">
<title>tmp-leo-whodis</title>
<script type="module">
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.js';

const q = new URLSearchParams(location.search);
const id = q.get('id') || 'leo2a6';
const [x0, x1, y0, y1, z0, z1] = (q.get('box') || '1.60,1.64,1.10,1.30,3.20,3.66').split(',').map(Number);
const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer: null };
const tank = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
tank.root.updateMatrixWorld(true);
const out = [];
let idx = 0;
const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
tank.root.traverse((o) => {
  if (!(o.isMesh && !o.isInstancedMesh && o.geometry)) return;
  const myIdx = idx++;
  const pos = o.geometry.getAttribute('position');
  if (!pos || pos.usage === THREE.DynamicDrawUsage) return;
  if (o.material && o.material.colorWrite === false) return;
  const gidx = o.geometry.index;
  const n = gidx ? gidx.count : pos.count;
  const tris = [];
  for (let i = 0; i < n; i += 3) {
    const i0 = gidx ? gidx.getX(i) : i, i1 = gidx ? gidx.getX(i + 1) : i + 1, i2 = gidx ? gidx.getX(i + 2) : i + 2;
    a.fromBufferAttribute(pos, i0).applyMatrix4(o.matrixWorld);
    b.fromBufferAttribute(pos, i1).applyMatrix4(o.matrixWorld);
    c.fromBufferAttribute(pos, i2).applyMatrix4(o.matrixWorld);
    const inBox = (p) => p.x >= x0 && p.x <= x1 && p.y >= y0 && p.y <= y1 && p.z >= z0 && p.z <= z1;
    let hit = inBox(a) || inBox(b) || inBox(c);
    if (!hit) {                                   // surface-sample like the audit
      const area = b.clone().sub(a).cross(c.clone().sub(a)).length() / 2;
      const steps = Math.max(1, Math.min(24, Math.ceil(Math.sqrt(area) / 0.012)));
      const p = new THREE.Vector3();
      for (let u = 0; u <= steps && !hit; u++) {
        for (let v = 0; v + u <= steps && !hit; v++) {
          const w = steps - u - v;
          p.set(0, 0, 0).addScaledVector(a, u / steps).addScaledVector(b, v / steps).addScaledVector(c, w / steps);
          if (inBox(p)) hit = true;
        }
      }
    }
    if (hit) {
      tris.push([[+a.x.toFixed(4), +a.y.toFixed(4), +a.z.toFixed(4)], [+b.x.toFixed(4), +b.y.toFixed(4), +b.z.toFixed(4)], [+c.x.toFixed(4), +c.y.toFixed(4), +c.z.toFixed(4)]]);
      if (tris.length > 14) break;
    }
  }
  if (tris.length) out.push({ mesh: `#${myIdx} ${o.name || o.parent?.name || '(unnamed)'} ${pos.count}v`, tris });
});
window.__WHO = out; window.__WHO_READY = true;
</script>
