<!doctype html>
<meta charset="utf-8">
<title>tmp merkava top-down/perspective review</title>
<style>:root{color-scheme:dark;background:#0b0f12;color:#e7edf0;font:13px monospace}</style>
<div id="out">booting…</div>
<script type="module">
// TEMP (merkava batch-14 push): owner directive "top-down fill & circularity
// review" — renders the PROCEDURAL build SHADED from straight above plus two
// high perspective quarters (fidelity board light rig), one frame per view,
// exported as data URLs for the driver to save. Deleted after the round.
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.js';
import { TANK_SPECS } from '/src/vehicles/specs.js';

const SIZE = 1100;
const params = new URLSearchParams(location.search);
const id = params.get('id') || 'merkava3b';
if (!TANK_SPECS[id]) throw new Error(`Unknown tank id: ${id}`);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
renderer.setSize(SIZE, SIZE, false);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x151b20, 1);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer };
const procedural = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
scene.add(procedural.root);
const hemi = new THREE.HemisphereLight(0xcfd8e0, 0x2a2f26, 1.05);
const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(30, 42, 24);
scene.add(hemi, sun);
procedural.root.updateMatrixWorld(true);
procedural.root.traverse((o) => {
  if (!o.isLOD) return;
  o.autoUpdate = false;
  o.levels.forEach((level, i) => { if (level.object) level.object.visible = i === 0; });
});

const box = new THREE.Box3().setFromObject(procedural.root);
const center = box.getCenter(new THREE.Vector3());
const size = box.getSize(new THREE.Vector3());
const VIEWS = {
  top: new THREE.Vector3(0, 1, 0.02),
  highFL: new THREE.Vector3(-0.7, 0.85, 0.75),
  highRR: new THREE.Vector3(0.65, 0.85, -0.75),
};
const shots = {};
for (const [name, dirRaw] of Object.entries(VIEWS)) {
  const dir = dirRaw.clone().normalize();
  const nominalUp = Math.abs(dir.y) > 0.9 ? new THREE.Vector3(0, 0, -1) : new THREE.Vector3(0, 1, 0);
  const right = new THREE.Vector3().crossVectors(nominalUp, dir).normalize();
  const up = new THREE.Vector3().crossVectors(dir, right).normalize();
  const half = Math.max(size.x, size.y, size.z) * 0.56;
  const cam = new THREE.OrthographicCamera(-half, half, half, -half, 0.1, 200);
  cam.position.copy(center).addScaledVector(dir, 60);
  cam.up.copy(up);
  cam.lookAt(center);
  cam.updateProjectionMatrix();
  renderer.clear(true, true, true);
  renderer.render(scene, cam);
  shots[name] = renderer.domElement.toDataURL('image/png');
}
window.__TOPDOWN_SHOTS = shots;
window.__TOPDOWN_READY = true;
document.getElementById('out').textContent = `done: ${Object.keys(shots).join(', ')}`;
</script>
