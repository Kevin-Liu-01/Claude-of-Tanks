<!doctype html>
<!-- TEMP (AFV no-air round): exact-sightline attribution — rebuilds the
     tmp-afv-glacisgap front-low camera and raycasts given screen pixels,
     printing every DoubleSide intersection with world coords. Diagnosis
     only, never verdict evidence. -->
<meta charset="utf-8">
<title>tmp-afv-raypick</title>
<style>body{background:#151b20;margin:0;color:#e7edf0;font:12px monospace}</style>
<div id="out">building…</div>
<script type="module">
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.js';

const params = new URLSearchParams(location.search);
const id = params.get('id') || 'm2a2_bradley';
const view = params.get('view') || 'front-low';
const px = (params.get('px') || '773,453').split(';').map((p) => p.split(',').map(Number));
const SIZE = 900;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(SIZE, SIZE);
const scene = new THREE.Scene();
const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer };
const procedural = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
scene.add(procedural.root);
procedural.root.updateMatrixWorld(true);
procedural.root.traverse((o) => {
  if (!o.isLOD) return;
  o.autoUpdate = false;
  o.levels.forEach((level, i) => { if (level.object) level.object.visible = i === 0; });
});
const hull = procedural.root.getObjectByName('rig_hull');
function effVisible(o) { for (let p = o; p; p = p.parent) if (!p.visible) return false; return true; }
function subtreeBox(node) {
  const box = new THREE.Box3();
  node.traverse((o) => {
    if (!(o.isMesh || o.isInstancedMesh) || !o.geometry) return;
    if (!effVisible(o) || /shadow/i.test(o.name || '')) return;
    if (o.isInstancedMesh) { if (o.count === 0) return; o.computeBoundingBox(); if (o.boundingBox && !o.boundingBox.isEmpty()) box.union(o.boundingBox.clone().applyMatrix4(o.matrixWorld)); return; }
    if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
    box.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld));
  });
  return box;
}
const hullBox = subtreeBox(hull);
const bowBox = hullBox.clone();
bowBox.min.z = hullBox.max.z - (hullBox.max.z - hullBox.min.z) * 0.48;
bowBox.expandByVector(new THREE.Vector3(0.25, 0.20, 0.25));
const DIRS = {
  'front-low': new THREE.Vector3(0, -0.08, 1),
  'front-under': new THREE.Vector3(0, -0.42, 1),
  'right-low': new THREE.Vector3(1, -0.04, 0.30),
  'left-low': new THREE.Vector3(-1, -0.04, 0.30),
};
const dir = DIRS[view].clone().normalize();
const center = bowBox.getCenter(new THREE.Vector3());
const nominalUp = Math.abs(dir.y) > 0.9 ? new THREE.Vector3(0, 0, -1) : new THREE.Vector3(0, 1, 0);
const right = new THREE.Vector3().crossVectors(nominalUp, dir).normalize();
const up = new THREE.Vector3().crossVectors(dir, right).normalize();
let ext = 0.3;
for (const cx of [bowBox.min.x, bowBox.max.x]) for (const cy of [bowBox.min.y, bowBox.max.y]) for (const cz of [bowBox.min.z, bowBox.max.z]) {
  const d = new THREE.Vector3(cx, cy, cz).sub(center);
  ext = Math.max(ext, Math.abs(d.dot(right)), Math.abs(d.dot(up)));
}
const half = ext * 1.05;
// DoubleSide-force everything so every crossing reports
const targets = [];
procedural.root.traverse((o) => {
  if (!(o.isMesh || o.isInstancedMesh) || !o.geometry) return;
  if (!effVisible(o) || /shadow/i.test(o.name || '')) return;
  const mats = Array.isArray(o.material) ? o.material : [o.material];
  for (const m of mats) if (m && m.side !== THREE.DoubleSide) { const c = m.clone(); c.side = THREE.DoubleSide; o.material = Array.isArray(o.material) ? o.material : c; }
  targets.push(o);
});
const ray = new THREE.Raycaster();
ray.far = 100;
const lines = [];
for (const [sx, sy] of px) {
  const wx = (sx / SIZE * 2 - 1) * half;
  const wy = (1 - sy / SIZE * 2) * half;
  const origin = center.clone().addScaledVector(right, wx).addScaledVector(up, wy).addScaledVector(dir, 40);
  ray.set(origin, dir.clone().negate());
  const hits = ray.intersectObjects(targets, false);
  lines.push(`pixel ${sx},${sy}:`);
  for (const h of hits.slice(0, 14)) {
    lines.push(`  d=${h.distance.toFixed(2)} world=(${h.point.x.toFixed(3)}, ${h.point.y.toFixed(3)}, ${h.point.z.toFixed(3)}) mesh=${h.object.name || h.object.material?.name || h.object.uuid.slice(0, 6)}`);
  }
  if (!hits.length) lines.push('  NO HITS (sky)');
}
window.__PICK = lines.join('\n');
window.__PICK_READY = true;
document.getElementById('out').textContent = lines.join('\n');
</script>
