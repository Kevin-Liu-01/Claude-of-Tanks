<!doctype html>
<!-- TEMP (merkava §B3.1 gun-run round): close-up render set framed on the
     rig_gun world AABB (mantlet to muzzle) — diagnosis + report crops only,
     never verdict evidence. Same light rig as the critic pages. -->
<meta charset="utf-8">
<title>tmp-merkava-gunrun</title>
<style>body{background:#151b20;margin:0;color:#e7edf0;font:12px monospace}</style>
<div id="out">building…</div>
<script type="module">
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.js';

const params = new URLSearchParams(location.search);
const id = params.get('id') || 'merkava3b';
const SIZE = 900;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(SIZE, SIZE);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer };
const procedural = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
scene.add(procedural.root);
const hemi = new THREE.HemisphereLight(0xcfd8e0, 0x2a2f26, 1.05);
const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(30, 42, 24);
scene.add(hemi, sun);

procedural.root.updateMatrixWorld(true);
procedural.root.traverse((o) => {
  if (!o.isLOD) return;
  o.autoUpdate = false;
  o.levels.forEach((level, i) => { if (level.object) level.object.visible = i === 0; });
});

function subtreeBox(node) {
  const box = new THREE.Box3();
  node.updateMatrixWorld(true);
  node.traverse((o) => {
    if (!(o.isMesh || o.isInstancedMesh) || !o.geometry) return;
    let vis = true;
    for (let p = o; p; p = p.parent) if (!p.visible) { vis = false; break; }
    if (!vis || /shadow/i.test(o.name || '')) return;
    if (o.isInstancedMesh) {
      if (o.count === 0) return;
      o.computeBoundingBox();
      if (o.boundingBox && !o.boundingBox.isEmpty()) box.union(o.boundingBox.clone().applyMatrix4(o.matrixWorld));
      return;
    }
    if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
    box.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld));
  });
  return box;
}

const gun = procedural.root.getObjectByName('rig_gun');
const gunBox = subtreeBox(gun);
// widen a touch so the mantlet/cheek seat context reads
gunBox.expandByVector(new THREE.Vector3(0.25, 0.22, 0.15));

function orthoFor(box, direction) {
  const center = box.getCenter(new THREE.Vector3());
  const dir = direction.clone().normalize();
  const nominalUp = Math.abs(dir.y) > 0.9 ? new THREE.Vector3(0, 0, -1) : new THREE.Vector3(0, 1, 0);
  const right = new THREE.Vector3().crossVectors(nominalUp, dir).normalize();
  const up = new THREE.Vector3().crossVectors(dir, right).normalize();
  let ext = 0.3;
  for (const cx of [box.min.x, box.max.x]) for (const cy of [box.min.y, box.max.y]) for (const cz of [box.min.z, box.max.z]) {
    const d = new THREE.Vector3(cx, cy, cz).sub(center);
    ext = Math.max(ext, Math.abs(d.dot(right)), Math.abs(d.dot(up)));
  }
  const half = ext * 1.05;
  const camera = new THREE.OrthographicCamera(-half, half, half, -half, 0.1, 200);
  camera.position.copy(center).addScaledVector(dir, 40);
  camera.up.copy(up);
  camera.lookAt(center);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
  return camera;
}
function heroFor(box, direction) {
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const dist = Math.max(size.x, size.y, size.z) * 1.05;
  const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 300);
  camera.position.copy(center).addScaledVector(direction.clone().normalize(), dist);
  camera.position.y += size.y * 0.30;
  camera.lookAt(center);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
  return camera;
}

const shots = {};
function grab(camera) {
  renderer.setRenderTarget(null);
  renderer.setClearColor(0x151b20, 1);
  renderer.clear(true, true, true);
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/png');
}
shots['gun-left'] = grab(orthoFor(gunBox, new THREE.Vector3(-1, 0.04, 0)));
shots['gun-right'] = grab(orthoFor(gunBox, new THREE.Vector3(1, 0.04, 0)));
shots['gun-top'] = grab(orthoFor(gunBox, new THREE.Vector3(0, 1, 0.02)));
shots['gun-fqleft'] = grab(orthoFor(gunBox, new THREE.Vector3(-1, 0.18, 1)));
shots['gun-fqright'] = grab(orthoFor(gunBox, new THREE.Vector3(1, 0.18, 1)));
shots['gun-hero'] = grab(heroFor(gunBox, new THREE.Vector3(-0.85, 0.32, 1)));
shots['gun-hero-r'] = grab(heroFor(gunBox, new THREE.Vector3(0.85, 0.26, 0.95)));

window.__GUN_SHOTS = shots;
window.__GUN_READY = true;
document.getElementById('out').textContent = `gun shots ready (${id})`;
</script>
