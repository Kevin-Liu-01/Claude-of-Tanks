<!doctype html>
<!-- TEMP (merkava §B3.1): raycast census over the gun run — identifies which
     bucket mesh owns each surface along the tube (mantlet to muzzle). -->
<meta charset="utf-8">
<title>tmp-merkava-gunprobe</title>
<script type="module">
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.js';

const params = new URLSearchParams(location.search);
const id = params.get('id') || 'merkava4';

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(64, 64);
const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer };
const scene = new THREE.Scene();
const tank = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
scene.add(tank.root);
tank.root.updateMatrixWorld(true);
tank.root.traverse((o) => {
  if (!o.isLOD) return;
  o.autoUpdate = false;
  o.levels.forEach((level, i) => { if (level.object) level.object.visible = i === 0; });
});

function chain(o) {
  const names = [];
  for (let p = o; p; p = p.parent) names.push(p.name || p.type);
  return names.join('<');
}
function matName(o) {
  const m = o.material;
  if (!m) return '?';
  return m.name || (m.color ? '#' + m.color.getHexString() : m.type);
}

const ray = new THREE.Raycaster();
const out = [];
// vertical rays from above, marching along z at several x offsets: report
// first-hit object + surface y, only for hits ABOVE y>1.2 (gun band zone)
for (const x of [-0.30, -0.18, -0.12, 0, 0.12, 0.18, 0.30]) {
  for (let z = 1.4; z <= 5.0; z += 0.05) {
    ray.set(new THREE.Vector3(x, 8, z), new THREE.Vector3(0, -1, 0));
    const hits = ray.intersectObjects(scene.children, true).filter((h) => {
      let vis = true;
      for (let p = h.object; p; p = p.parent) if (!p.visible) { vis = false; break; }
      return vis && !/shadow/i.test(h.object.name || '');
    });
    if (!hits.length) continue;
    const h = hits[0];
    if (h.point.y < 1.55) continue;
    out.push({ x, z: +z.toFixed(2), y: +h.point.y.toFixed(3), obj: chain(h.object), mat: matName(h.object) });
  }
}
// side rays (from +x) at gun axis heights, to catch side-proud pieces
const R2 = [];
for (const y of [1.85, 1.95, 2.05, 2.15]) {
  for (let z = 1.4; z <= 5.0; z += 0.05) {
    ray.set(new THREE.Vector3(4, y, z), new THREE.Vector3(-1, 0, 0));
    const hits = ray.intersectObjects(scene.children, true).filter((h) => {
      let vis = true;
      for (let p = h.object; p; p = p.parent) if (!p.visible) { vis = false; break; }
      return vis && !/shadow/i.test(h.object.name || '');
    });
    if (!hits.length) continue;
    const h = hits[0];
    R2.push({ y, z: +z.toFixed(2), x: +h.point.x.toFixed(3), obj: chain(h.object), mat: matName(h.object) });
  }
}
window.__PROBE = { top: out, side: R2 };
window.__PROBE_READY = true;
</script>
