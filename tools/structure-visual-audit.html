<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Procedural structure visual audit</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #101820; }
    canvas { display: block; width: 100%; height: 100%; }
    output {
      position: fixed; top: 18px; left: 18px; padding: 8px 11px;
      border: 1px solid #65727b; background: rgba(8, 13, 17, .82);
      color: #d9e3e7; font: 600 12px/1.3 ui-monospace, SFMono-Regular, monospace;
      letter-spacing: .08em; text-transform: uppercase;
    }
  </style>
</head>
<body>
  <output id="label">Preparing structure…</output>
  <script type="module">
    import * as THREE from 'three';
    import { VILLAGE_BUILDERS } from '/src/world/maps/villageKit.ts';
    import { URBAN_BUILDERS } from '/src/world/maps/urbanKit.ts';
    import {
      DESTRUCTIBLE_BUILDING_TYPES, STRUCTURE_BUILDERS,
    } from '/src/world/maps/structureKit.ts';
    import { DESTRUCTIBLE_TYPES } from '/src/world/maps/inhabitKit.ts';
    import {
      buildSourcedStructureGeometry, preloadPropModels,
    } from '/src/world/props.ts';
    import { SOURCED_STRUCTURE_TYPES } from '/src/world/sourcedStructureTypes.ts';
    import {
      certifyStructureCollisionProfile, deriveStructureCollisionProfile,
    } from '/src/world/structureCollision.ts';

    const params = new URLSearchParams(location.search);
    const id = params.get('id') || 'megatower';
    const view = params.get('view') || 'three-quarter';
    const focus = params.get('focus') || 'all';
    const collisionLayer = params.get('collision') || 'contact';
    const seed = Number(params.get('seed') || 0x51a7c7) >>> 0;
    const build = { ...VILLAGE_BUILDERS, ...URBAN_BUILDERS, ...STRUCTURE_BUILDERS }[id];
    const destructible = DESTRUCTIBLE_BUILDING_TYPES[id] || DESTRUCTIBLE_TYPES[id];
    const sourced = SOURCED_STRUCTURE_TYPES[id];
    if (!build && !destructible && !sourced) throw new Error(`unknown structure id: ${id}`);

    function seeded(initial) {
      let state = initial >>> 0;
      return () => {
        state += 0x6D2B79F5;
        let value = state;
        value = Math.imul(value ^ (value >>> 15), value | 1);
        value ^= value + Math.imul(value ^ (value >>> 7), value | 61);
        return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
      };
    }

    const bucketNames = [
      'plaster', 'plaster2', 'plaster3', 'stone', 'roof', 'wood', 'dark',
      'glass', 'curtain', 'straw', 'baked',
    ];
    const buckets = Object.fromEntries(bucketNames.map((name) => [name, []]));
    if (sourced) await preloadPropModels();
    const dimensions = build
      ? build(seeded(seed), buckets, 'plaster3')
      : destructible ? {
        w: (destructible.hw ?? destructible.r) * 2,
        d: (destructible.hl ?? destructible.r) * 2,
        h: destructible.h,
      } : {
        w: sourced.r * 2,
        d: sourced.r * 2,
        h: sourced.h,
      };
    if (destructible) buckets.baked.push(destructible.build(seeded(seed)));
    if (sourced) buckets.baked.push(buildSourcedStructureGeometry(id));
    const collisionProfile = deriveStructureCollisionProfile(buckets);
    const collisionCertification = certifyStructureCollisionProfile(buckets, collisionProfile);
    const palette = {
      plaster: 0x7a766b,
      plaster2: 0x666b68,
      plaster3: 0x4f5555,
      stone: 0x8a8478,
      roof: 0x4b403a,
      wood: 0x4e3828,
      dark: 0x22292d,
      glass: 0x244550,
      curtain: 0x735c3e,
      straw: 0x7b683a,
      baked: 0x55585a,
    };

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;
    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x17232c);
    scene.fog = new THREE.Fog(0x17232c, 120, 250);
    const subject = new THREE.Group();
    subject.name = `structure_${id}`;
    scene.add(subject);

    let triangles = 0;
    let parts = 0;
    const focusBounds = new THREE.Box3();
    for (const [bucket, geometries] of Object.entries(buckets)) {
      const material = new THREE.MeshStandardMaterial({
        name: `audit:${bucket}`,
        color: palette[bucket] || 0x777777,
        roughness: bucket === 'glass' ? 0.48 : 0.86,
        metalness: bucket === 'dark' ? 0.35 : 0.03,
      });
      for (const geometry of geometries) {
        const mesh = new THREE.Mesh(geometry, material);
        mesh.userData = { ...geometry.userData };
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        subject.add(mesh);
        if (
          focus === 'crown'
          && (geometry.userData?.ruinedConcretePart || geometry.userData?.ruinedConcreteCrown)
        ) {
          geometry.computeBoundingBox();
          if (geometry.boundingBox) focusBounds.union(geometry.boundingBox);
        }
        triangles += Math.floor((geometry.index?.count || geometry.attributes.position.count) / 3);
        parts++;
      }
    }
    subject.updateMatrixWorld(true);

    function convexPoints(part) {
      if (part.kind === 'convex') return part.points;
      if (part.kind === 'obb') {
        const s = Math.sin(part.yaw), c = Math.cos(part.yaw);
        return [
          [-part.hw, -part.hl], [part.hw, -part.hl],
          [part.hw, part.hl], [-part.hw, part.hl],
        ].flatMap(([x, z]) => [part.cx + x * c + z * s, part.cz - x * s + z * c]);
      }
      const points = [];
      for (let index = 0; index < 20; index++) {
        const angle = index / 20 * Math.PI * 2;
        points.push(part.cx + Math.cos(angle) * part.r, part.cz + Math.sin(angle) * part.r);
      }
      return points;
    }

    function addBandOverlay(band, color, opacity) {
      const vertices = [];
      for (const part of band.parts) {
        const points = convexPoints(part);
        for (let index = 0; index < points.length; index += 2) {
          const next = (index + 2) % points.length;
          vertices.push(
            points[index], band.minY, points[index + 1],
            points[next], band.minY, points[next + 1],
            points[index], band.maxY, points[index + 1],
            points[next], band.maxY, points[next + 1],
            points[index], band.minY, points[index + 1],
            points[index], band.maxY, points[index + 1],
          );
        }
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
      const lines = new THREE.LineSegments(geometry, new THREE.LineBasicMaterial({
        color, transparent: true, opacity, depthTest: false,
      }));
      lines.renderOrder = 20;
      scene.add(lines);
    }
    if (collisionLayer === 'contact' || collisionLayer === 'all') {
      addBandOverlay(collisionProfile.contact, 0x31f6e8, 0.92);
    }
    if (collisionLayer === 'shell' || collisionLayer === 'all') {
      for (const band of collisionProfile.shell) addBandOverlay(band, 0xffb13c, 0.72);
    }

    const structureBounds = new THREE.Box3().setFromObject(subject);
    const bounds = focus === 'crown' && !focusBounds.isEmpty() ? focusBounds : structureBounds;
    const sphere = bounds.getBoundingSphere(new THREE.Sphere());
    const size = bounds.getSize(new THREE.Vector3());
    const target = sphere.center.clone();
    target.y = bounds.min.y + size.y * 0.53;
    const directions = {
      front: new THREE.Vector3(0, 0.12, 1),
      rear: new THREE.Vector3(0, 0.12, -1),
      right: new THREE.Vector3(1, 0.12, 0),
      left: new THREE.Vector3(-1, 0.12, 0),
      'three-quarter': new THREE.Vector3(1, 0.26, 1),
      'front-left': new THREE.Vector3(-1, 0.26, 1),
      'rear-right': new THREE.Vector3(1, 0.26, -1),
      'rear-left': new THREE.Vector3(-1, 0.26, -1),
      roof: new THREE.Vector3(0.18, 1, 0.12),
    };

    const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 500);
    const fitDistance = sphere.radius / Math.sin(THREE.MathUtils.degToRad(camera.fov * 0.5)) * 1.12;
    function setView(nextView) {
      const direction = (directions[nextView] || directions['three-quarter']).clone().normalize();
      camera.position.copy(target).addScaledVector(direction, fitDistance);
      camera.lookAt(target);
      camera.updateMatrixWorld(true);
      render();
      document.querySelector('#label').value = `${id} · ${focus} · ${nextView} · ${collisionLayer} · ${collisionCertification.minimumScore.toFixed(1)}/100 · ${parts} parts · ${triangles.toLocaleString()} tris`;
      const projected = [];
      for (const x of [bounds.min.x, bounds.max.x]) {
        for (const y of [bounds.min.y, bounds.max.y]) {
          for (const z of [bounds.min.z, bounds.max.z]) {
            projected.push(new THREE.Vector3(x, y, z).project(camera));
          }
        }
      }
      const minX = Math.min(...projected.map((point) => point.x));
      const maxX = Math.max(...projected.map((point) => point.x));
      const minY = Math.min(...projected.map((point) => point.y));
      const maxY = Math.max(...projected.map((point) => point.y));
      return {
        view: nextView,
        frameWidth: maxX - minX,
        frameHeight: maxY - minY,
        frameArea: (maxX - minX) * (maxY - minY) * 0.25,
      };
    }

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(Math.max(180, dimensions.w * 5), Math.max(180, dimensions.d * 5)),
      new THREE.MeshStandardMaterial({ color: 0x252b2d, roughness: 1 }),
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = structureBounds.min.y - 0.03;
    ground.receiveShadow = true;
    scene.add(ground);

    scene.add(new THREE.HemisphereLight(0xb6c9d7, 0x332c25, 1.25));
    const sun = new THREE.DirectionalLight(0xffe2bb, 3.3);
    sun.position.set(bounds.max.x + 35, bounds.max.y + 42, bounds.max.z + 30);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    const shadowRadius = Math.max(dimensions.w, dimensions.d, dimensions.h) * 0.75;
    Object.assign(sun.shadow.camera, {
      left: -shadowRadius, right: shadowRadius,
      top: shadowRadius, bottom: -shadowRadius,
      near: 1, far: 240,
    });
    sun.target.position.copy(target);
    scene.add(sun, sun.target);

    const render = () => renderer.render(scene, camera);
    function probeFrame() {
      render();
      const probe = document.createElement('canvas');
      probe.width = 64; probe.height = 40;
      const context = probe.getContext('2d', { willReadFrequently: true });
      context.drawImage(renderer.domElement, 0, 0, probe.width, probe.height);
      const pixels = context.getImageData(0, 0, probe.width, probe.height).data;
      let sum = 0, sumSquared = 0, opaque = 0;
      for (let index = 0; index < pixels.length; index += 4) {
        const luminance = pixels[index] * 0.2126 + pixels[index + 1] * 0.7152 + pixels[index + 2] * 0.0722;
        sum += luminance; sumSquared += luminance * luminance;
        if (pixels[index + 3] > 250) opaque++;
      }
      const count = pixels.length / 4;
      const mean = sum / count;
      return { mean, variance: sumSquared / count - mean * mean, opaqueRatio: opaque / count };
    }
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      render();
    });
    setView(view);
    document.fonts?.ready?.then(render);
    window.__STRUCTURE_AUDIT = {
      ready: true,
      id,
      view,
      focus,
      parts,
      triangles,
      dimensions,
      collisionLayer,
      collisionProfile,
      collisionCertification,
      bounds: { min: bounds.min.toArray(), max: bounds.max.toArray() },
      setView,
      probeFrame,
    };
  </script>
</body>
</html>
