<!doctype html>
<!-- TEMP (t84 r32 builder): raycast ID probe on the critic rig's exact
     cameras. Renders NOTHING for judgment — casts rays through requested
     pixel rects of the proc-only model and reports hit object/material/world
     point (+ a DoubleSide re-test for sky pixels). Diagnosis only, deleted
     after round. ?id=t84&probes=<json url-encoded>
     probes: [{view:'front'|...|'close-roof'|'hero-rearright', x0,y0,x1,y1, step}] -->
<meta charset="utf-8">
<title>tmp t84 r32 probe</title>
<script type="module">
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.js';

const SIZE = 640;
const q = new URLSearchParams(location.search);
const id = q.get('id') || 't84';
const probes = JSON.parse(q.get('probes') || '[]');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
renderer.setSize(SIZE, SIZE, false);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x151b20, 1);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer };
const tank = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
scene.add(tank.root);
tank.root.updateMatrixWorld(true);
tank.root.traverse((o) => {
  if (!o.isLOD) return;
  o.autoUpdate = false;
  o.levels.forEach((level, i) => { if (level.object) level.object.visible = i === 0; });
});

function visibleBox(root) {
  const box = new THREE.Box3();
  root.updateMatrixWorld(true);
  root.traverse((o) => {
    if (!(o.isMesh || o.isInstancedMesh || o.isSkinnedMesh) || !o.geometry) return;
    let vis = true;
    for (let p = o; p; p = p.parent) if (!p.visible) { vis = false; break; }
    if (!vis || /shadow/i.test(o.name || '')) return;
    if (o.isInstancedMesh) {
      if (o.count === 0) return;
      o.computeBoundingBox();
      if (o.boundingBox && !o.boundingBox.isEmpty()) {
        box.union(o.boundingBox.clone().applyMatrix4(o.matrixWorld));
      }
      return;
    }
    if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
    const b = o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld);
    box.union(b);
  });
  return box;
}

const VIEWS = {
  front: new THREE.Vector3(0, 0.08, 1),
  frontleft: new THREE.Vector3(-1, 0.08, 1),
  left: new THREE.Vector3(-1, 0.05, 0),
  rearleft: new THREE.Vector3(-1, 0.08, -1),
  rear: new THREE.Vector3(0, 0.08, -1),
  rearright: new THREE.Vector3(1, 0.08, -1),
  right: new THREE.Vector3(1, 0.05, 0),
  frontright: new THREE.Vector3(1, 0.08, 1),
  top: new THREE.Vector3(0, 1, 0.02),
};

function orthoFor(box, direction, frac = 0.55, centerOff = null) {
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  if (centerOff) {
    center.x += centerOff.x * size.x; center.y += centerOff.y * size.y; center.z += centerOff.z * size.z;
  }
  const dir = direction.clone().normalize();
  const nominalUp = Math.abs(dir.y) > 0.9 ? new THREE.Vector3(0, 0, -1) : new THREE.Vector3(0, 1, 0);
  const right = new THREE.Vector3().crossVectors(nominalUp, dir).normalize();
  const up = new THREE.Vector3().crossVectors(dir, right).normalize();
  let ext = 0.5;
  for (const cx of [box.min.x, box.max.x]) for (const cy of [box.min.y, box.max.y]) for (const cz of [box.min.z, box.max.z]) {
    const d = new THREE.Vector3(cx, cy, cz).sub(center);
    ext = Math.max(ext, Math.abs(d.dot(right)), Math.abs(d.dot(up)));
  }
  const half = ext * (frac / 0.5) * 1.06;
  const camera = new THREE.OrthographicCamera(-half, half, half, -half, 0.1, 200);
  camera.position.copy(center).addScaledVector(dir, 60);
  camera.up.copy(up);
  camera.lookAt(center);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
  return camera;
}
function heroFor(box, direction) {
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const dist = Math.max(size.x, size.y, size.z) * 1.55;
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 300);
  camera.position.copy(center).addScaledVector(direction.clone().normalize(), dist);
  camera.position.y += size.y * 0.28;
  camera.lookAt(center);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
  return camera;
}

const procBox = visibleBox(tank.root);
function cameraFor(view) {
  if (VIEWS[view]) return orthoFor(procBox, VIEWS[view]);
  if (view === 'close-front') return orthoFor(procBox, new THREE.Vector3(-1, 0.22, 1), 0.26, { x: 0, y: 0.12, z: 0.28 });
  if (view === 'close-roof') return orthoFor(procBox, new THREE.Vector3(1, 0.55, 0.35), 0.24, { x: 0, y: 0.3, z: 0.05 });
  if (view === 'hero-frontleft') return heroFor(procBox, new THREE.Vector3(-1, 0.35, 1));
  if (view === 'hero-rearright') return heroFor(procBox, new THREE.Vector3(1, 0.35, -1));
  if (view === 'hero-toptilt') return heroFor(procBox, new THREE.Vector3(0.55, 1.35, -0.75));
  throw new Error('unknown view ' + view);
}

function pathOf(o) {
  const parts = [];
  for (let p = o; p && p !== tank.root; p = p.parent) {
    let tag = p.name || p.type;
    if (p.userData?.fitting) tag += `#fit:${p.userData.fitting}`;
    parts.unshift(tag);
  }
  let tail = '';
  if (o.isInstancedMesh) tail += `[inst:${o.count}]`;
  if (o.geometry?.attributes?.position) tail += `[v:${o.geometry.attributes.position.count}]`;
  return parts.join('/') + tail;
}
function matTag(m) {
  if (!m) return 'none';
  const hex = m.color ? m.color.getHexString() : '??';
  return `${m.type.replace('Mesh', '').replace('Material', '')}:${hex}${m.map ? ':map' : ''}${m.vertexColors ? ':vc' : ''}`;
}

// board light rig (so the optional render snapshot matches the critic pairs)
const hemi = new THREE.HemisphereLight(0xcfd8e0, 0x2a2f26, 1.05);
const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(30, 42, 24);
scene.add(hemi, sun);

const ray = new THREE.Raycaster();
const results = [];
const snaps = {};
for (const pr of probes) {
  const cam = cameraFor(pr.view);
  if (pr.snap && !snaps[pr.view]) {
    renderer.setRenderTarget(null);
    renderer.clear(true, true, true);
    renderer.render(scene, cam);
    snaps[pr.view] = renderer.domElement.toDataURL('image/png');
  }
  const step = pr.step || 1;
  const agg = new Map();
  const skyPx = [];
  for (let py = pr.y0; py <= pr.y1; py += step) {
    for (let px = pr.x0; px <= pr.x1; px += step) {
      const ndc = new THREE.Vector2((px + 0.5) / SIZE * 2 - 1, 1 - (py + 0.5) / SIZE * 2);
      ray.setFromCamera(ndc, cam);
      const hits = ray.intersectObject(tank.root, true).filter((h) => {
        for (let p = h.object; p; p = p.parent) if (p.visible === false) return false;
        if (/shadow/i.test(h.object.name || '')) return false;
        return true;
      });
      if (!hits.length) { skyPx.push([px, py]); continue; }
      const h = hits[0];
      const key = `${pathOf(h.object)} | ${matTag(h.object.material)}`;
      let a = agg.get(key);
      if (!a) { a = { n: 0, px: [1e9, 1e9, -1e9, -1e9], w: [1e9, 1e9, 1e9, -1e9, -1e9, -1e9], pts: [] }; agg.set(key, a); }
      a.n++;
      a.px[0] = Math.min(a.px[0], px); a.px[1] = Math.min(a.px[1], py);
      a.px[2] = Math.max(a.px[2], px); a.px[3] = Math.max(a.px[3], py);
      const p = h.point;
      a.w[0] = Math.min(a.w[0], p.x); a.w[1] = Math.min(a.w[1], p.y); a.w[2] = Math.min(a.w[2], p.z);
      a.w[3] = Math.max(a.w[3], p.x); a.w[4] = Math.max(a.w[4], p.y); a.w[5] = Math.max(a.w[5], p.z);
      if (a.pts.length < 3) a.pts.push([+p.x.toFixed(3), +p.y.toFixed(3), +p.z.toFixed(3)]);
    }
  }
  // DoubleSide re-test on sky pixels: what culled/missing surface is there?
  const dsAgg = new Map();
  if (skyPx.length) {
    const saved = [];
    tank.root.traverse((o) => {
      if (!(o.isMesh || o.isInstancedMesh)) return;
      const ms = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of ms) { if (m) { saved.push([m, m.side]); m.side = THREE.DoubleSide; } }
    });
    for (const [px, py] of skyPx) {
      const ndc = new THREE.Vector2((px + 0.5) / SIZE * 2 - 1, 1 - (py + 0.5) / SIZE * 2);
      ray.setFromCamera(ndc, cam);
      const hits = ray.intersectObject(tank.root, true).filter((h) => {
        for (let p = h.object; p; p = p.parent) if (p.visible === false) return false;
        if (/shadow/i.test(h.object.name || '')) return false;
        return true;
      });
      const key = hits.length ? `DS:${pathOf(hits[0].object)} | ${matTag(hits[0].object.material)}` : 'DS:TRUE-SKY';
      let a = dsAgg.get(key);
      if (!a) { a = { n: 0, pts: [] }; dsAgg.set(key, a); }
      a.n++;
      if (hits.length && a.pts.length < 3) {
        const p = hits[0].point;
        a.pts.push([+p.x.toFixed(3), +p.y.toFixed(3), +p.z.toFixed(3)]);
      }
    }
    for (const [m, s] of saved) m.side = s;
  }
  results.push({
    view: pr.view, rect: [pr.x0, pr.y0, pr.x1, pr.y1], sky: skyPx.length,
    skySample: skyPx.slice(0, 8),
    hits: [...agg.entries()].sort((a, b) => b[1].n - a[1].n).map(([k, a]) => ({
      k, n: a.n, px: a.px, w: a.w.map((v) => +v.toFixed(3)), pts: a.pts,
    })),
    dsHits: [...dsAgg.entries()].sort((a, b) => b[1].n - a[1].n).map(([k, a]) => ({ k, n: a.n, pts: a.pts })),
  });
}
window.__PROBE = results;
window.__PROBE_SNAPS = snaps;
window.__PROBE_READY = true;
</script>
