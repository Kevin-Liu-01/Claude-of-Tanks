<!doctype html>
<!-- TEMP (merkava family, B5 round): owner-visible yaw proof — one shaded
     rear-left three-quarter pair per tank, turret at yaw 0 | yaw 90, whole
     vehicle. This is the §B5 "turntable/garage shot pair at yaw ~90°
     showing the furniture rotating WITH the turret". Proc only (no ref). -->
<meta charset="utf-8">
<title>tmp-merkava-b5-yawpair</title>
<body style="margin:0;background:#151b20">
<script type="module">
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.js';

const params = new URLSearchParams(location.search);
const id = params.get('id') || 'merkava3b';
const yawDeg = Number(params.get('yaw') || 90);

const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer: null };
const tank = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
tank.root.updateMatrixWorld(true);

const PX = 900;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(PX, PX);
renderer.setClearColor(0x151b20, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xcfd8e8, 0x2a2e26, 0.95));
const key = new THREE.DirectionalLight(0xfff2dd, 1.35);
key.position.set(30, 42, 24);
scene.add(key);
const fill = new THREE.DirectionalLight(0xdde8ff, 0.35);
fill.position.set(-26, 18, -30);
scene.add(fill);
scene.add(tank.root);

// frame the whole vehicle from the rear-left, slightly high (the owner's
// follow-cam class view of the turret rear)
const box = new THREE.Box3().setFromObject(tank.root);
const c = box.getCenter(new THREE.Vector3());
const r = box.getSize(new THREE.Vector3()).length() * 0.62;
const cam = new THREE.PerspectiveCamera(38, 1, 0.1, 400);
const dir = new THREE.Vector3(-0.85, 0.42, -1).normalize();
cam.position.copy(c).addScaledVector(dir, r * 1.55);
cam.lookAt(c.x, c.y + 0.15, c.z);
cam.updateMatrixWorld(true);

const turret = tank.root.getObjectByName('rig_turret');
const canvases = [];
for (const yaw of [0, yawDeg]) {
  if (turret) turret.rotation.y = yaw * Math.PI / 180;
  tank.root.updateMatrixWorld(true);
  renderer.render(scene, cam);
  canvases.push(renderer.domElement.toDataURL('image/png'));
}
if (turret) turret.rotation.y = 0;

const cv = document.createElement('canvas');
cv.width = PX * 2 + 4; cv.height = PX + 26;
const ctx = cv.getContext('2d');
ctx.fillStyle = '#0b0e12'; ctx.fillRect(0, 0, cv.width, cv.height);
let loaded = 0;
canvases.forEach((url, i) => {
  const img = new Image();
  img.onload = () => {
    ctx.drawImage(img, i * (PX + 4), 26);
    ctx.fillStyle = '#cfd8e8'; ctx.font = '16px monospace';
    ctx.fillText(`${id} — turret yaw ${i === 0 ? 0 : yawDeg}°  (rear-left)`, i * (PX + 4) + 12, 18);
    if (++loaded === 2) {
      window.__YAWPAIR = cv.toDataURL('image/png');
      window.__YAW_READY = true;
    }
  };
  img.src = url;
});
</script>
