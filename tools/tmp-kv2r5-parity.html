<!doctype html>
<meta charset="utf-8">
<title>tmp kv2 r5 parity probe</title>
<style>:root{color-scheme:dark;background:#0b0f12;color:#e7edf0;font:13px monospace}</style>
<div id="out">booting…</div>
<script type="module">
// TEMP probe (kv2 shaded-parity r5 round): reproduces the r4 critic's
// fixed-world pair rig — same per-model framing, same board lights, median
// luminance over white-mask-gated tank pixels — at the critic's 1100px tile
// resolution, PLUS the critic's pair-left/right TRACK-BAND rect medians
// (proc x 50..1050, ref x 60..1060, y 590..810 in tile space) with median
// RGB so the ref's rusty-warm family is measurable. Deleted after round.
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.js';
import { MODEL_SOURCE, TANK_SPECS } from '/src/vehicles/specs.js';

const SIZE = 1100;
const params = new URLSearchParams(location.search);
const id = params.get('id') || 'kv2';
const spec = TANK_SPECS[id];
if (!spec) throw new Error(`Unknown tank id: ${id}`);
const source = MODEL_SOURCE[id];
if (source?.source !== 'glb') throw new Error(`${id} has no GLB reference`);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
renderer.setSize(SIZE, SIZE, false);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x151b20, 1);
const scene = new THREE.Scene();
const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer };

const reference = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high' });
const procedural = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
scene.add(reference.root, procedural.root);

// fidelity board's exact rig
const hemi = new THREE.HemisphereLight(0xcfd8e0, 0x2a2f26, 1.05);
const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(30, 42, 24);
scene.add(hemi, sun);

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const swapped = (visual) => {
  let yes = false;
  visual.root.traverse((o) => { if (o.userData?.__glbSwapped) yes = true; });
  return yes;
};
for (let i = 0; i < 600 && !swapped(reference); i++) await sleep(50);
if (!swapped(reference)) throw new Error(`${id} reference GLB did not load`);
await sleep(400);
reference.root.updateMatrixWorld(true);
procedural.root.updateMatrixWorld(true);
for (const root of [reference.root, procedural.root]) {
  root.traverse((o) => {
    if (!o.isLOD) return;
    o.autoUpdate = false;
    o.levels.forEach((level, i) => { if (level.object) level.object.visible = i === 0; });
  });
}

const ANGLES = {
  front: new THREE.Vector3(0, 0.08, 1),
  right: new THREE.Vector3(1, 0.05, 0),
  left: new THREE.Vector3(-1, 0.05, 0),
  rear34: new THREE.Vector3(-1, 0.28, -1),
  rear: new THREE.Vector3(0, 0.08, -1),
  top: new THREE.Vector3(0, 1, 0.02),
};
// Track-band metric: the r4 critic's 15.1-vs-55.6 "bottom-run/band median"
// is NOT a plain rect median over tank pixels (re-measured on their own
// pair-left.png: rect median = 55.3 because hull paint behind the gear
// dominates any rect). It is a COMPONENT measurement — luminance of the
// track hardware itself. Mechanize it with component masks:
//   ref:  meshes whose material name matches /track/i (strict band) or
//         /track|wheel/i (whole gear) — the GLB names materials cleanly.
//   proc: strict band = meshes/instances whose material envMapIntensity
//         <= 0.10 (trackL/R 0.10, spareTrack bucket + inner links 0.06,
//         link pads 0.08 — unique among the set); whole gear = strict ∪
//         every InstancedMesh under hullG (wheels/pockets/rollers) ∪
//         hullG child meshes at |position.x| > 0.9 (band + spinner drums).
const BAND_VIEWS = { left: true, right: true };
function procStrictTrack(o) {
  const m = o.material;
  return !!m && typeof m.envMapIntensity === 'number' && m.envMapIntensity <= 0.101;
}
function procGear(o) {
  return procStrictTrack(o) || o.isInstancedMesh || (o.isMesh && Math.abs(o.position.x) > 0.9);
}
function refMatcher(re) {
  return (o) => !!(o.material && re.test(o.material.name || ''));
}
function gearVisibleSet(visual, isProc, strict) {
  const keep = new Set();
  const pred = isProc ? (strict ? procStrictTrack : procGear)
    : refMatcher(strict ? /track/i : /track|wheel/i);
  visual.root.traverse((o) => {
    if (!(o.isMesh || o.isInstancedMesh) || !o.geometry) return;
    if (pred(o)) keep.add(o);
  });
  return keep;
}
const gearWhite = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
const gearBlack = new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide });
function renderGearMask(visual, other, camera, keep) {
  // occlusion-preserving component mask: gear renders WHITE, everything else
  // in the same model renders BLACK with real depth — a pixel is gear only
  // where gear is the actual front surface (hiding the hull instead exposed
  // the far-side run over paint pixels and polluted the median).
  const saved = [];
  visual.root.traverse((o) => {
    if (!(o.isMesh || o.isInstancedMesh) || !o.geometry) return;
    saved.push([o, o.material]);
    o.material = keep.has(o) ? gearWhite : gearBlack;
  });
  const data = renderModel(visual, other, camera, false);
  for (const [o, m] of saved) o.material = m;
  return data;
}

function visibleBox(root) {
  const box = new THREE.Box3();
  root.updateMatrixWorld(true);
  root.traverse((o) => {
    if (!(o.isMesh || o.isInstancedMesh || o.isSkinnedMesh) || !o.geometry) return;
    let vis = true;
    for (let p = o; p; p = p.parent) if (!p.visible) { vis = false; break; }
    if (!vis || /shadow/i.test(o.name || '')) return;
    if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
    const b = o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld);
    box.union(b);
  });
  return box;
}

function cameraFor(root, direction) {
  const box = visibleBox(root);
  const center = box.getCenter(new THREE.Vector3());
  const dir = direction.clone().normalize();
  const nominalUp = Math.abs(dir.y) > 0.9 ? new THREE.Vector3(0, 0, -1) : new THREE.Vector3(0, 1, 0);
  const right = new THREE.Vector3().crossVectors(nominalUp, dir).normalize();
  const up = new THREE.Vector3().crossVectors(dir, right).normalize();
  let half = 0.5;
  const size = box.getSize(new THREE.Vector3());
  half = Math.max(size.x, size.y, size.z) * 0.62;
  const camera = new THREE.OrthographicCamera(-half, half, half, -half, 0.1, 200);
  camera.position.copy(center).addScaledVector(dir, 60);
  camera.up.copy(up);
  camera.lookAt(center);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
  return camera;
}

const maskMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
const copy2d = document.createElement('canvas');
copy2d.width = copy2d.height = SIZE;
const copyCtx = copy2d.getContext('2d', { willReadFrequently: true });
function renderModel(visual, other, camera, asMask) {
  visual.root.visible = true;
  other.root.visible = false;
  scene.overrideMaterial = asMask ? maskMaterial : null;
  renderer.setRenderTarget(null);
  renderer.setClearColor(asMask ? 0x000000 : 0x151b20, 1);
  renderer.clear(true, true, true);
  renderer.render(scene, camera);
  copyCtx.drawImage(renderer.domElement, 0, 0, SIZE, SIZE);
  return copyCtx.getImageData(0, 0, SIZE, SIZE).data;
}

function stats(lit, mask, rect) {
  const vals = [];
  const rs = [], gs = [], bs = [];
  const [x0, x1] = rect ? rect.x : [0, SIZE];
  const [y0, y1] = rect ? rect.y : [0, SIZE];
  for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
    const p = y * SIZE + x;
    if (mask[p * 4] <= 40) continue;
    const i = p * 4;
    vals.push(0.2126 * lit[i] + 0.7152 * lit[i + 1] + 0.0722 * lit[i + 2]);
    rs.push(lit[i]); gs.push(lit[i + 1]); bs.push(lit[i + 2]);
  }
  const med = (a) => { a.sort((q, w) => q - w); return a.length ? a[(a.length / 2) | 0] : 0; };
  const mean = vals.length ? vals.reduce((a, v) => a + v, 0) / vals.length : 0;
  return { median: med(vals), mean: +mean.toFixed(1), n: vals.length, rgb: [med(rs), med(gs), med(bs)] };
}

const report = { id, views: {}, band: {} };
for (const [name, dir] of Object.entries(ANGLES)) {
  const row = {};
  const litData = {};
  const maskData = {};
  for (const [tag, visual, other] of [['ref', reference, procedural], ['proc', procedural, reference]]) {
    reference.root.visible = true;
    procedural.root.visible = true;
    const cam = cameraFor(visual.root, dir);
    maskData[tag] = renderModel(visual, other, cam, true);
    litData[tag] = renderModel(visual, other, cam, false);
    const s = stats(litData[tag], maskData[tag]);
    row[tag] = s.median;
    row[`${tag}Mean`] = s.mean;
  }
  row.ratio = row.proc > 0 ? +(row.ref / row.proc).toFixed(3) : -1;
  row.ratioMean = row.procMean > 0 ? +(row.refMean / row.procMean).toFixed(3) : -1;
  report.views[name] = row;
  if (BAND_VIEWS[name]) {
    for (const strict of [true, false]) {
      const bandRow = {};
      const botRow = {};
      for (const [tag, visual, other] of [['ref', reference, procedural], ['proc', procedural, reference]]) {
        reference.root.visible = true;
        procedural.root.visible = true;
        const cam = cameraFor(visual.root, dir);
        const keep = gearVisibleSet(visual, tag === 'proc', strict);
        const gearMask = renderGearMask(visual, other, cam, keep);
        bandRow[tag] = stats(litData[tag], gearMask);
        bandRow[`${tag}N`] = keep.size;
        // bottom-run slice: rows below world y=0.48 (the critic's 15.1 was
        // the "bottom-run median" — links/cleats under the wheel line)
        const v = new THREE.Vector3(0, 0.48, 0).project(cam);
        const rowTop = Math.max(0, Math.round((1 - (v.y + 1) / 2) * SIZE));
        botRow[tag] = stats(litData[tag], gearMask, { x: [0, SIZE], y: [rowTop, SIZE] });
      }
      bandRow.ratio = bandRow.proc.median > 0 ? +(bandRow.ref.median / bandRow.proc.median).toFixed(3) : -1;
      botRow.ratio = botRow.proc.median > 0 ? +(botRow.ref.median / botRow.proc.median).toFixed(3) : -1;
      report.band[`${name}${strict ? '-track' : '-gear'}`] = bandRow;
      report.band[`${name}${strict ? '-track' : '-gear'}-bot`] = botRow;
    }
  }
}
// ref GLB track-material texel family (albedo target): draw the 'track'
// material's baseColor map to a small canvas and take mean/median RGB.
{
  let trackMat = null;
  reference.root.traverse((o) => {
    if (trackMat || !o.material) return;
    const list = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of list) if (/track/i.test(m.name || '') && m.map && m.map.image) trackMat = m;
  });
  if (trackMat) {
    const img = trackMat.map.image;
    const tc = document.createElement('canvas');
    tc.width = tc.height = 64;
    const tctx = tc.getContext('2d', { willReadFrequently: true });
    tctx.drawImage(img, 0, 0, 64, 64);
    const td = tctx.getImageData(0, 0, 64, 64).data;
    const rs = [], gs = [], bs = [];
    let mr = 0, mg = 0, mb = 0;
    for (let i = 0; i < 64 * 64 * 4; i += 4) {
      rs.push(td[i]); gs.push(td[i + 1]); bs.push(td[i + 2]);
      mr += td[i]; mg += td[i + 1]; mb += td[i + 2];
    }
    const med = (a) => { a.sort((q, w) => q - w); return a[(a.length / 2) | 0]; };
    report.refTrackTexels = {
      colorFactor: trackMat.color ? trackMat.color.getHexString() : null,
      meanRGB: [mr, mg, mb].map((v) => Math.round(v / (64 * 64))),
      medianRGB: [med(rs), med(gs), med(bs)],
    };
  }
}
// optional tile dumps for eyeballing rect placement (?shots=1)
if (params.get('shots')) {
  window.__SHADE_SHOTS = {};
  for (const name of ['left', 'front', 'rear', 'top', 'rear34', 'right']) {
    const dir = ANGLES[name];
    for (const [tag, visual, other] of [['ref', reference, procedural], ['proc', procedural, reference]]) {
      reference.root.visible = true;
      procedural.root.visible = true;
      const cam = cameraFor(visual.root, dir);
      renderModel(visual, other, cam, false);
      window.__SHADE_SHOTS[`${name}-${tag}`] = copy2d.toDataURL('image/png');
    }
  }
}
window.__SHADE_REPORT = report;
document.querySelector('#out').textContent = JSON.stringify(report, null, 2);
window.__SHADE_READY = true;
</script>
