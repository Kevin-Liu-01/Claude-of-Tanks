<!DOCTYPE html>
<!-- tools/tmp-userdrops-rawskin.html — user-drops temp probe: raw GLTFLoader
     load of the type74 quarantine GLB (no game pipeline), testing whether
     (a) rotating the Tower_9 bone directly and (b) rotating a fresh parent
     group inserted above it move the skinned verts. ?mode=none|bone|group -->
<html><body style="margin:0">
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { clone as skClone } from 'three/examples/jsm/utils/SkeletonUtils.js';

const q = new URLSearchParams(location.search);
const mode = q.get('mode') || 'none';
const W = 1280, H = 720;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87a6c4);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445533, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.position.set(10, 15, 8);
scene.add(sun);

new GLTFLoader().load('/models/tanks/community/quarantine/type74-nullops.glb', (gltf) => {
  scene.add(gltf.scene);
  gltf.scene.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(gltf.scene);
  const c = box.getCenter(new THREE.Vector3()), sz = box.getSize(new THREE.Vector3());
  let tower = null;
  gltf.scene.traverse((o) => { if (o.name === 'Tower_9') tower = o; });
  window.__FOUND = tower ? (tower.type + ':' + tower.parent.name) : 'missing';
  if (mode === 'bone' && tower) tower.rotation.y += Math.PI / 2;
  if (mode === 'clone') {
    // SkeletonUtils.clone + fresh-group rotation (game-pipeline step 1)
    scene.remove(gltf.scene);
    const c2 = skClone(gltf.scene);
    scene.add(c2);
    c2.updateMatrixWorld(true);
    let t2 = null;
    c2.traverse((o) => { if (o.name === 'Tower_9') t2 = o; });
    const parent = t2.parent;
    const g = new THREE.Group();
    g.position.copy(t2.position);
    t2.position.set(0, 0, 0);
    parent.add(g);
    g.add(t2);
    g.rotation.y = Math.PI / 2;
    window.__FOUND = 'clone:' + (t2 ? 'ok' : 'missing');
  }
  if (mode === 'detach' && tower) {
    // game-pipeline step 2: bone REMOVED from the armature chain and attached
    // to a scene-level group (like turretG under hullG), preserving world pose
    const g = new THREE.Group();
    scene.add(g);
    scene.updateMatrixWorld(true);
    const m = tower.matrixWorld.clone();
    m.premultiply(g.matrixWorld.clone().invert());
    tower.removeFromParent();
    m.decompose(tower.position, tower.quaternion, tower.scale);
    g.add(tower);
    g.rotation.y = Math.PI / 2;
  }
  if (mode === 'group' && tower) {
    // insert a fresh group between Tower_9 and its parent, preserving pose
    const parent = tower.parent;
    const g = new THREE.Group();
    g.position.copy(tower.position);
    tower.position.set(0, 0, 0);
    parent.add(g);
    g.add(tower);
    g.rotation.y = Math.PI / 2;
  }
  const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 500);
  const d = Math.max(sz.x, sz.y, sz.z) * 1.2;
  camera.position.set(c.x + d * 0.7, c.y + d * 0.45, c.z + d * 0.7);
  camera.lookAt(c);
  let n = 0;
  (function loop() {
    scene.updateMatrixWorld(true);
    renderer.render(scene, camera);
    if (++n > 10) { window.__PROBE_READY = true; return; }
    requestAnimationFrame(loop);
  })();
}, undefined, (e) => { window.__PROBE_ERROR = String(e); window.__PROBE_READY = true; });
</script>
</body></html>
