<!doctype html>
<!-- scratch render for the shoe-audit extension: closeup of a wrap zone.
     ?id=<id>&cam=x,y,z&look=x,y,z -->
<meta charset="utf-8">
<title>tmp-shoeaudit-shot</title>
<body style="margin:0">
<script type="module">
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.js';

const params = new URLSearchParams(location.search);
const id = params.get('id') || 'leo2a6';
const cam = (params.get('cam') || '3.2,1.4,5.4').split(',').map(Number);
const look = (params.get('look') || '1.2,0.9,3.4').split(',').map(Number);

const W = 1100, H = 800;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
document.body.appendChild(renderer.domElement);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9db4c4);
const sun = new THREE.DirectionalLight(0xfff2e0, 2.6);
sun.position.set(4, 7, 6);
scene.add(sun);
scene.add(new THREE.AmbientLight(0xcfd8e6, 1.1));
const hemi = new THREE.HemisphereLight(0xd8e6f5, 0x5a5548, 0.8);
scene.add(hemi);

const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 4, renderer };
const tank = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
tank.root.updateMatrixWorld(true);
scene.add(tank.root);

const camera = new THREE.PerspectiveCamera(38, W / H, 0.05, 100);
camera.position.set(cam[0], cam[1], cam[2]);
camera.lookAt(look[0], look[1], look[2]);
renderer.render(scene, camera);
window.__SHOT_READY = true;
</script>
