<!doctype html>
<!-- TEMP (casemate family, ISU track-containment graduate round): band-surface
     (y,z) profile scan + offender mesh->bucket identification. Same band
     fingerprint as tools/track-clip-audit.html. DIAGNOSIS ONLY. -->
<meta charset="utf-8">
<title>tmp-isu-lanescan</title>
<script type="module">
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.js';

const params = new URLSearchParams(location.search);
const id = params.get('id') || 'isu152';
const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer: null };
const tank = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
tank.root.updateMatrixWorld(true);

const V = 0.02;

const bands = [];
const meshes = [];
let idx = 0;
tank.root.traverse((o) => {
  if (!o.visible) return;
  if (o.isMesh && !o.isInstancedMesh && o.geometry) {
    o.userData.diagIdx = idx++;
    const pos = o.geometry.getAttribute('position');
    if (pos && pos.usage === THREE.DynamicDrawUsage) bands.push(o);
    else if (!o.material || o.material.colorWrite !== false) meshes.push(o);
  }
});

const bbox = new THREE.Box3();
const lanes = bands.map((b) => { bbox.setFromObject(b); return bbox.clone(); });
const zMax = Math.max(...lanes.map((l) => l.max.z));
const zMin = Math.min(...lanes.map((l) => l.min.z));
const yTop = Math.max(...lanes.map((l) => l.max.y));
const yBot = Math.min(...lanes.map((l) => l.min.y));
const laneInnerX = Math.min(...lanes.map((l) => Math.min(Math.abs(l.min.x), Math.abs(l.max.x))));
const out = {
  id,
  band: { zMax: +zMax.toFixed(4), zMin: +zMin.toFixed(4), yTop: +yTop.toFixed(4), yBot: +yBot.toFixed(4), laneInnerX: +laneInnerX.toFixed(4) },
  laneBoxes: lanes.map((l) => [l.min.toArray().map((v) => +v.toFixed(3)), l.max.toArray().map((v) => +v.toFixed(3))]),
  zones: [],
  meshDir: [],
};

// mesh directory: index, name, material color hex, vert count, bbox — to map
// the audit's (unnamed) hits back to source buckets
for (const m of meshes) {
  bbox.setFromObject(m);
  out.meshDir.push({
    i: m.userData.diagIdx,
    name: m.name || m.parent?.name || '(unnamed)',
    mat: m.material && m.material.color ? m.material.color.getHexString() : '?',
    v: m.geometry.getAttribute('position').count,
    box: [bbox.min.toArray().map((v) => +v.toFixed(3)), bbox.max.toArray().map((v) => +v.toFixed(3))],
  });
}

const zones = [
  { name: 'front', z0: zMax - 0.50, z1: zMax + 0.06 },
  { name: 'rear', z0: zMin - 0.06, z1: zMin + 0.50 },
];
const y0 = yBot + 0.02, y1 = yTop + 0.06;

const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3(), p = new THREE.Vector3();
function sampleMesh(o, z0, z1, set) {
  const g = o.geometry, pos = g.getAttribute('position'), gidx = g.index;
  const n = gidx ? gidx.count : pos.count;
  for (let i = 0; i < n; i += 3) {
    const i0 = gidx ? gidx.getX(i) : i, i1 = gidx ? gidx.getX(i + 1) : i + 1, i2 = gidx ? gidx.getX(i + 2) : i + 2;
    a.fromBufferAttribute(pos, i0).applyMatrix4(o.matrixWorld);
    b.fromBufferAttribute(pos, i1).applyMatrix4(o.matrixWorld);
    c.fromBufferAttribute(pos, i2).applyMatrix4(o.matrixWorld);
    const zc = (a.z + b.z + c.z) / 3;
    const zr = Math.max(a.z, b.z, c.z) - Math.min(a.z, b.z, c.z);
    if (zc + zr < z0 || zc - zr > z1) continue;
    const area = b.clone().sub(a).cross(c.clone().sub(a)).length() / 2;
    const steps = Math.max(1, Math.min(24, Math.ceil(Math.sqrt(area) / 0.012)));
    for (let u = 0; u <= steps; u++) {
      for (let v = 0; v + u <= steps; v++) {
        const w = steps - u - v;
        p.set(0, 0, 0).addScaledVector(a, u / steps).addScaledVector(b, v / steps).addScaledVector(c, w / steps);
        if (p.z < z0 || p.z > z1 || p.y < y0 || p.y > y1) continue;
        set.add(`${Math.round(p.x / V)},${Math.round(p.y / V)},${Math.round(p.z / V)}`);
      }
    }
  }
}

for (const zone of zones) {
  const bandSet = new Set();
  for (const bm of bands) sampleMesh(bm, zone.z0, zone.z1, bandSet);
  // (y,z) profile: for each z column (2cm), the set of y intervals the band
  // surface occupies (marginalized over x, one side |x| only)
  const cols = new Map();
  for (const k of bandSet) {
    const [x, y, z] = k.split(',').map(Number);
    if (x < 0) continue; // one side is enough (symmetric)
    if (!cols.has(z)) cols.set(z, new Set());
    cols.get(z).add(y);
  }
  const profile = [];
  for (const [z, ys] of [...cols.entries()].sort((p1, p2) => p1[0] - p2[0])) {
    const sorted = [...ys].sort((m, n) => m - n);
    // compress to intervals
    const iv = [];
    let s0 = sorted[0], prev = sorted[0];
    for (let i = 1; i <= sorted.length; i++) {
      if (i === sorted.length || sorted[i] > prev + 1) {
        iv.push([+(s0 * V).toFixed(2), +(prev * V).toFixed(2)]);
        if (i < sorted.length) { s0 = sorted[i]; prev = sorted[i]; }
      } else prev = sorted[i];
    }
    profile.push({ z: +(z * V).toFixed(2), y: iv });
  }
  out.zones.push({ name: zone.name, profile });
}
window.__CLIP_RESULT = out; window.__CLIP_READY = true;
</script>
