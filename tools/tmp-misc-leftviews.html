<!doctype html>
<!-- TEMP (misc missing-left-side round): PROC-ONLY renders of the left/right
     flank views + yaw-180 pairs, game-truth FrontSide materials, the critic
     rig's lighting/bg. §B2-style flood on every view: enclosed bg pixels
     (mask-method |px-0x151b20| maxch<=13 AND blue-signature B-R>=+8) inside
     the silhouette. No label band is drawn (label-band law: keep flood
     tooling off text). -->
<meta charset="utf-8">
<title>tmp-misc-leftviews</title>
<script type="module">
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.js';

const params = new URLSearchParams(location.search);
const id = params.get('id') || 'ariete';
const SIZE = 900;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
renderer.setSize(SIZE, SIZE, false);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x151b20, 1);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer };
const tank = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
scene.add(tank.root);
const hemi = new THREE.HemisphereLight(0xcfd8e0, 0x2a2f26, 1.05);
const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(30, 42, 24);
scene.add(hemi, sun);
tank.root.updateMatrixWorld(true);
for (const root of [tank.root]) {
  root.traverse((o) => {
    if (!o.isLOD) return;
    o.autoUpdate = false;
    o.levels.forEach((level, i) => { if (level.object) level.object.visible = i === 0; });
  });
}

const VIEWS = {
  left: new THREE.Vector3(-1, 0.05, 0),
  frontleft: new THREE.Vector3(-1, 0.08, 1),
  rearleft: new THREE.Vector3(-1, 0.08, -1),
  right: new THREE.Vector3(1, 0.05, 0),
  frontright: new THREE.Vector3(1, 0.08, 1),
  rearright: new THREE.Vector3(1, 0.08, -1),
};

function visibleBox(root) {
  const box = new THREE.Box3();
  root.updateMatrixWorld(true);
  root.traverse((o) => {
    if (!(o.isMesh || o.isInstancedMesh) || !o.geometry) return;
    let vis = true;
    for (let p = o; p; p = p.parent) if (!p.visible) { vis = false; break; }
    if (!vis || /shadow/i.test(o.name || '')) return;
    if (o.isInstancedMesh) {
      if (o.count === 0) return;
      o.computeBoundingBox();
      if (o.boundingBox && !o.boundingBox.isEmpty()) box.union(o.boundingBox.clone().applyMatrix4(o.matrixWorld));
      return;
    }
    if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
    box.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld));
  });
  return box;
}
function orthoFor(box, direction) {
  const center = box.getCenter(new THREE.Vector3());
  const dir = direction.clone().normalize();
  const nominalUp = Math.abs(dir.y) > 0.9 ? new THREE.Vector3(0, 0, -1) : new THREE.Vector3(0, 1, 0);
  const right = new THREE.Vector3().crossVectors(nominalUp, dir).normalize();
  const up = new THREE.Vector3().crossVectors(dir, right).normalize();
  let ext = 0.5;
  for (const cx of [box.min.x, box.max.x]) for (const cy of [box.min.y, box.max.y]) for (const cz of [box.min.z, box.max.z]) {
    const d = new THREE.Vector3(cx, cy, cz).sub(center);
    ext = Math.max(ext, Math.abs(d.dot(right)), Math.abs(d.dot(up)));
  }
  const half = ext * 1.06 * 1.1;
  const camera = new THREE.OrthographicCamera(-half, half, half, -half, 0.1, 200);
  camera.position.copy(center).addScaledVector(dir, 60);
  camera.up.copy(up);
  camera.lookAt(center);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
  return camera;
}

const copy2d = document.createElement('canvas');
copy2d.width = copy2d.height = SIZE;
const copyCtx = copy2d.getContext('2d', { willReadFrequently: true });

// §B2 flood: bg-like = maxch(|px - (0x15,0x1b,0x20)|) <= 13 AND B-R >= 8.
function floodHoles(img) {
  const { data, width: W, height: H } = img;
  const bg = new Uint8Array(W * H);
  for (let i = 0; i < W * H; i++) {
    const r = data[i * 4], g = data[i * 4 + 1], b = data[i * 4 + 2];
    if (Math.max(Math.abs(r - 0x15), Math.abs(g - 0x1b), Math.abs(b - 0x20)) <= 13 && b - r >= 8) bg[i] = 1;
  }
  const seen = new Uint8Array(W * H);
  const stack = [];
  for (let x = 0; x < W; x++) { stack.push(x, (H - 1) * W + x); }
  for (let y = 0; y < H; y++) { stack.push(y * W, y * W + W - 1); }
  while (stack.length) {
    const i = stack.pop();
    if (seen[i] || !bg[i]) continue;
    seen[i] = 1;
    const x = i % W, y = (i / W) | 0;
    if (x > 0) stack.push(i - 1);
    if (x < W - 1) stack.push(i + 1);
    if (y > 0) stack.push(i - W);
    if (y < H - 1) stack.push(i + W);
  }
  let holePx = 0; let minX = W, maxX = -1, minY = H, maxY = -1;
  for (let i = 0; i < W * H; i++) {
    if (bg[i] && !seen[i]) {
      holePx++;
      const x = i % W, y = (i / W) | 0;
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
    }
  }
  return { holePx, rect: holePx ? [minX, minY, maxX, maxY] : null };
}

const box = visibleBox(tank.root);
const shots = {};
const flood = {};
// §B3.1 gun-run closeups: perspective heroes framed on the gun assembly
// (mantlet/collar/tube zone — front of the turret to the muzzle).
function gunHero(tag, sx) {
  const gb = new THREE.Box3(
    new THREE.Vector3(-1.6, Math.max(box.min.y, 0.9), 0.2),
    new THREE.Vector3(1.6, Math.min(box.max.y, 2.9), Math.min(box.max.z, 4.6)));
  const center = gb.getCenter(new THREE.Vector3());
  const size = gb.getSize(new THREE.Vector3());
  const cam = new THREE.PerspectiveCamera(34, 1, 0.1, 300);
  cam.position.set(center.x + sx * size.z * 0.85, center.y + size.y * 0.85, center.z + size.z * 0.72);
  cam.lookAt(center);
  cam.updateProjectionMatrix();
  cam.updateMatrixWorld(true);
  renderer.setClearColor(0x151b20, 1);
  renderer.clear(true, true, true);
  renderer.render(scene, cam);
  shots[tag] = renderer.domElement.toDataURL('image/png');
}
function shoot(tag, dir) {
  renderer.setClearColor(0x151b20, 1);
  renderer.clear(true, true, true);
  renderer.render(scene, orthoFor(box, dir));
  copyCtx.drawImage(renderer.domElement, 0, 0, SIZE, SIZE);
  const img = copyCtx.getImageData(0, 0, SIZE, SIZE);
  flood[tag] = floodHoles(img);
  shots[tag] = renderer.domElement.toDataURL('image/png');
}
for (const [name, dir] of Object.entries(VIEWS)) shoot(name, dir);
gunHero('gunrun-right', 1);
gunHero('gunrun-left', -1);
// yaw-180 pair: rotate the whole tank PI about Y, re-render the right trio —
// the physical LEFT flank now faces those cameras (box re-derived after yaw).
tank.root.rotation.y = Math.PI;
tank.root.updateMatrixWorld(true);
const box180 = visibleBox(tank.root);
for (const [name, dir] of [['right', VIEWS.right], ['frontright', VIEWS.frontright], ['rearright', VIEWS.rearright]]) {
  renderer.setClearColor(0x151b20, 1);
  renderer.clear(true, true, true);
  renderer.render(scene, orthoFor(box180, dir));
  copyCtx.drawImage(renderer.domElement, 0, 0, SIZE, SIZE);
  const img = copyCtx.getImageData(0, 0, SIZE, SIZE);
  flood[`yaw180-${name}`] = floodHoles(img);
  shots[`yaw180-${name}`] = renderer.domElement.toDataURL('image/png');
}
tank.root.rotation.y = 0;

window.__SHOTS = { id, shots, flood };
window.__SHOTS_READY = true;
</script>
