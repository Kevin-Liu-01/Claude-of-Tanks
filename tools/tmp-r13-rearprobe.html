<!doctype html>
<!-- TEMP (merkava1b r13): dead-rear WINDOW pixel probe. Rebuilds the critic
     rear camera EXACTLY (visibleBox + orthoFor frac 0.55, dir (0,0.08,-1))
     over the PROC build, then unprojects window pixels into rays and
     reports the first mesh hit per pixel (name, material hex, world point,
     geometry bbox). window.__PROBE_DONE / __PROBE_ROWS. Deleted after
     round. -->
<meta charset="utf-8">
<title>tmp rear window probe</title>
<script type="module">
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.js';

const q = new URLSearchParams(location.search);
const id = q.get('id') || 'merkava1b';
const SIZE = 640;
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(64, 64, false);
const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer };
const tank = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
const scene = new THREE.Scene();
scene.add(tank.root);
scene.updateMatrixWorld(true);
tank.root.traverse((o) => {
  if (!o.isLOD) return;
  o.autoUpdate = false;
  o.levels.forEach((level, i) => { if (level.object) level.object.visible = i === 0; });
});

function visibleBox(root) {
  const box = new THREE.Box3();
  root.updateMatrixWorld(true);
  root.traverse((o) => {
    if (!(o.isMesh || o.isInstancedMesh || o.isSkinnedMesh) || !o.geometry) return;
    let vis = true;
    for (let p = o; p; p = p.parent) if (!p.visible) { vis = false; break; }
    if (!vis || /shadow/i.test(o.name || '')) return;
    if (o.isInstancedMesh) {
      if (o.count === 0) return;
      o.computeBoundingBox();
      if (o.boundingBox && !o.boundingBox.isEmpty()) box.union(o.boundingBox.clone().applyMatrix4(o.matrixWorld));
      return;
    }
    if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
    box.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld));
  });
  return box;
}
function orthoFor(box, direction, frac = 0.55) {
  const center = box.getCenter(new THREE.Vector3());
  const dir = direction.clone().normalize();
  const nominalUp = Math.abs(dir.y) > 0.9 ? new THREE.Vector3(0, 0, -1) : new THREE.Vector3(0, 1, 0);
  const right = new THREE.Vector3().crossVectors(nominalUp, dir).normalize();
  const up = new THREE.Vector3().crossVectors(dir, right).normalize();
  let ext = 0.5;
  for (const cx of [box.min.x, box.max.x]) for (const cy of [box.min.y, box.max.y]) for (const cz of [box.min.z, box.max.z]) {
    const d = new THREE.Vector3(cx, cy, cz).sub(center);
    ext = Math.max(ext, Math.abs(d.dot(right)), Math.abs(d.dot(up)));
  }
  const half = ext * (frac / 0.5) * 1.06;
  const camera = new THREE.OrthographicCamera(-half, half, half, -half, 0.1, 200);
  camera.position.copy(center).addScaledVector(dir, 60);
  camera.up.copy(up);
  camera.lookAt(center);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
  return camera;
}

const box = visibleBox(tank.root);
const camera = orthoFor(box, new THREE.Vector3(0, 0.08, -1));
const ray = new THREE.Raycaster();
const rows = [];
for (let iy = 206; iy <= 254; iy += 8) {
  for (let ix = 252; ix <= 388; ix += 8) {
    const ndc = new THREE.Vector2((ix + 0.5) / SIZE * 2 - 1, -((iy + 0.5) / SIZE * 2 - 1));
    ray.setFromCamera(ndc, camera);
    const h = ray.intersectObject(tank.root, true)[0];
    if (!h) { rows.push({ ix, iy, miss: true }); continue; }
    const o = h.object;
    if (o.geometry && !o.geometry.boundingBox) o.geometry.computeBoundingBox();
    const bb = o.geometry ? o.geometry.boundingBox : null;
    rows.push({
      ix, iy,
      name: o.name || o.parent?.name || '?',
      mat: o.material && o.material.color ? o.material.color.getHex().toString(16) : '?',
      pt: [h.point.x, h.point.y, h.point.z].map((v) => Math.round(v * 100) / 100),
      bb: bb ? [bb.min.x, bb.min.y, bb.min.z, bb.max.x, bb.max.y, bb.max.z].map((v) => Math.round(v * 100) / 100) : null,
    });
  }
}
window.__PROBE_ROWS = rows;
window.__PROBE_DONE = true;
</script>
