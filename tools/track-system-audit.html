<!doctype html>
<meta charset="utf-8">
<title>Track system audit</title>
<script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';
import { createTank } from '/src/vehicles/tankFactory.js';

const id = new URLSearchParams(location.search).get('id');
const round = (value) => Number(value.toFixed(5));

function matrixPose(mesh, index) {
  const matrix = new THREE.Matrix4();
  const position = new THREE.Vector3();
  const quaternion = new THREE.Quaternion();
  const scale = new THREE.Vector3();
  mesh.getMatrixAt(index, matrix);
  matrix.decompose(position, quaternion, scale);
  return { position, quaternion, scale };
}

function intersectionsAtZ(points, z) {
  const ys = [];
  for (let i = 0; i < points.length; i++) {
    const a = points[i], b = points[(i + 1) % points.length];
    if ((a[0] - z) * (b[0] - z) > 0) continue;
    const dz = b[0] - a[0];
    const y = Math.abs(dz) < 1e-7
      ? Math.min(a[1], b[1])
      : a[1] + (b[1] - a[1]) * ((z - a[0]) / dz);
    if (Number.isFinite(y) && !ys.some((value) => Math.abs(value - y) < 1e-5)) ys.push(y);
  }
  return ys.sort((a, b) => a - b);
}

function courseStation(points, point) {
  let bestDistanceSq = Infinity;
  let bestStation = 0;
  let cursor = 0;
  for (let i = 0; i < points.length; i++) {
    const a = points[i], b = points[(i + 1) % points.length];
    const dz = b[0] - a[0], dy = b[1] - a[1];
    const lengthSq = dz * dz + dy * dy;
    const length = Math.sqrt(lengthSq) || 1e-6;
    const t = lengthSq > 1e-12
      ? Math.max(0, Math.min(1, ((point.z - a[0]) * dz + (point.y - a[1]) * dy) / lengthSq))
      : 0;
    const pz = a[0] + dz * t, py = a[1] + dy * t;
    const distanceSq = (point.z - pz) ** 2 + (point.y - py) ** 2;
    if (distanceSq < bestDistanceSq) {
      bestDistanceSq = distanceSq;
      bestStation = cursor + length * t;
    }
    cursor += length;
  }
  return bestStation;
}

function inspectUnit(unitId, receipt, objects) {
  const failures = [];
  const bands = objects.filter((object) => object.userData.runningGearUnitId === unitId
    && /^gearTrackBand[LR]$/.test(object.name));
  const pads = objects.filter((object) => object.userData.runningGearUnitId === unitId
    && object.name === 'gearTrackPads');
  const tires = objects.filter((object) => object.userData.runningGearUnitId === unitId
    && object.name === 'gearRoadWheelTires');
  const wheelLayers = tires.length ? tires : objects.filter((object) =>
    object.userData.runningGearUnitId === unitId && object.name === 'gearRoadWheelDiscs');
  const drives = objects.filter((object) => object.userData.runningGearUnitId === unitId
    && object.name === 'gearEndWheelHardware'
    && object.userData.runningGearEndKind === 'sprocket');

  if (bands.length !== 2) failures.push(`expected 2 belts, got ${bands.length}`);
  if (pads.length !== 1) failures.push(`expected 1 integrated shoe layer, got ${pads.length}`);
  if (!wheelLayers.length) failures.push('missing suspension-driven road-wheel layer');
  if (!receipt) failures.push('missing closed-course receipt');
  if (!receipt || !pads.length) return { unitId, failures };

  const padMesh = pads[0];
  const count = receipt.shoeCountPerSide;
  if (padMesh.count !== count * 2) {
    failures.push(`shoe instance count ${padMesh.count} != ${count}×2`);
  }
  if (Math.abs(receipt.loopLengthM - receipt.shoePitchM * count) > 1e-6) {
    failures.push('shoe pitch does not close exactly on loop length');
  }
  if (Math.abs(receipt.textureRepeatM - receipt.shoePitchM * 4) > 1e-7) {
    failures.push('belt texture cadence is not four exact shoes');
  }
  if (receipt.shoePadCoverageRatio < 0.88) {
    failures.push(`broad tread covers only ${round(receipt.shoePadCoverageRatio * 100)}% of each pitch`);
  }
  if (padMesh.userData.trackShoePadCoverageRatio !== receipt.shoePadCoverageRatio) {
    failures.push('broad tread coverage drift between geometry and course receipt');
  }
  if (receipt.shoeRadialScale < 0.75 && receipt.shoeDetailMode === 'full') {
    failures.push('shallow shoe profile exposes full connector rails as a second course');
  }
  if (padMesh.userData.trackShoeDetailMode !== receipt.shoeDetailMode) {
    failures.push('shoe detail mode drift between geometry and course receipt');
  }
  for (const band of bands) {
    if (Math.abs(band.userData.trackTextureRepeatM - receipt.textureRepeatM) > 1e-7) {
      failures.push(`${band.name} texture receipt drift`);
    }
  }

  const sidePoses = [0, 1].map((sideIndex) => {
    const poses = [];
    for (let i = 0; i < count; i++) poses.push(matrixPose(padMesh, sideIndex * count + i));
    return poses;
  });
  const bandBySide = new Map(bands.map((band) => [band.userData.runningGearSide, band]));
  const expectedOffset = receipt.shoeOutboardOffset || 0;
  for (const [sideIndex, side] of [-1, 1].entries()) {
    const band = bandBySide.get(side);
    if (!band) continue;
    const expectedX = band.position.x + side * expectedOffset;
    const poses = sidePoses[sideIndex];
    let maxLaneError = 0;
    for (const pose of poses) {
      if (pose.scale.lengthSq() < 0.1) continue;
      maxLaneError = Math.max(maxLaneError, Math.abs(pose.position.x - expectedX));
    }
    if (maxLaneError > 1e-5) {
      failures.push(`side ${side} shoe/belt lane error ${round(maxLaneError)} m`);
    }
  }
  const courseQuarterCounts = [];
  for (const poses of sidePoses) {
    const hidden = poses.filter(({ scale }) => scale.lengthSq() < 0.1).length;
    if (hidden) failures.push(`${hidden} shoe matrices collapsed instead of completing the loop`);
    let maxGap = 0;
    let tangentSum = 0;
    let tangentCount = 0;
    for (let i = 0; i < poses.length; i++) {
      const current = poses[i];
      const next = poses[(i + 1) % poses.length];
      if (current.scale.lengthSq() < 0.1 || next.scale.lengthSq() < 0.1) continue;
      const delta = next.position.clone().sub(current.position);
      const gap = delta.length();
      maxGap = Math.max(maxGap, gap);
      if (gap > 1e-6) {
        const forward = new THREE.Vector3(0, 0, 1).applyQuaternion(current.quaternion);
        tangentSum += forward.dot(delta.normalize());
        tangentCount++;
      }
    }
    if (maxGap > receipt.shoePitchM * 1.75) {
      failures.push(`closed-course shoe gap ${round(maxGap)} m exceeds pitch ${round(receipt.shoePitchM)} m`);
    }
    const stations = [];
    for (const { position, scale } of poses) {
      if (scale.lengthSq() >= 0.1) stations.push(courseStation(receipt.loopPoints, position));
    }
    stations.sort((a, b) => a - b);
    let maxArcGap = 0;
    for (let i = 0; i < stations.length; i++) {
      const next = i + 1 < stations.length ? stations[i + 1] : stations[0] + receipt.loopLengthM;
      maxArcGap = Math.max(maxArcGap, next - stations[i]);
    }
    // Projection at a sharp polygon corner can move the shoe center by up to
    // roughly half a pitch because the instantiated shoe is offset outward
    // from the band centerline. A true missing shoe creates a ~2-pitch hole;
    // keep the gate below that while tolerating the legitimate wrap offset.
    if (maxArcGap > receipt.shoePitchM * 1.60) {
      failures.push(`course arc has an uncovered shoe interval ${round(maxArcGap / receipt.shoePitchM)}× pitch`);
    }
    const quarters = [0, 0, 0, 0];
    for (const station of stations) {
      quarters[Math.min(3, Math.floor((station / receipt.loopLengthM) * 4))]++;
    }
    const minimumQuarter = Math.max(1, Math.floor(receipt.shoeCountPerSide / 4) - 1);
    if (quarters.some((value) => value < minimumQuarter)) {
      failures.push(`tread does not populate the complete loop (${quarters.join('/')})`);
    }
    courseQuarterCounts.push(quarters);
    const tangentMean = tangentSum / Math.max(1, tangentCount);
    if (tangentMean < 0.88) failures.push(`shoe tangent mean ${round(tangentMean)} is misaligned`);
  }

  const parityCount = Math.min(sidePoses[0].length, sidePoses[1].length);
  let parityError = 0;
  for (let i = 0; i < parityCount; i++) {
    const left = sidePoses[0][i], right = sidePoses[1][i];
    parityError = Math.max(parityError,
      Math.abs(left.position.y - right.position.y),
      Math.abs(left.position.z - right.position.z),
      1 - Math.abs(left.quaternion.dot(right.quaternion)));
  }
  if (parityError > 1e-4) failures.push(`left/right course parity error ${round(parityError)}`);

  const laneBySide = new Map(bands.map((band) => [band.userData.runningGearSide, Math.abs(band.position.x)]));
  const wheelXs = [];
  for (const wheelLayer of wheelLayers) {
    for (let i = 0; i < wheelLayer.count; i++) wheelXs.push(matrixPose(wheelLayer, i).position.x);
  }
  for (const side of [-1, 1]) {
    const lane = laneBySide.get(side);
    let nearestWheel = Infinity;
    for (const x of wheelXs) {
      if (Math.sign(x || side) !== side) continue;
      nearestWheel = Math.min(nearestWheel, Math.abs(Math.abs(x) - lane));
    }
    if (!Number.isFinite(nearestWheel) || nearestWheel > receipt.trackW * 0.55) {
      failures.push(`side ${side} wheels do not share the belt lane`);
    }
  }

  for (const z of receipt.wheelZs) {
    const crossings = intersectionsAtZ(receipt.loopPoints, z);
    if (crossings.length < 2) {
      failures.push(`road wheel z=${z} lies outside closed belt envelope`);
      continue;
    }
    const lower = crossings[0], upper = crossings.at(-1);
    const bottomGap = receipt.wheelY - receipt.wheelR - lower;
    const topGap = upper - (receipt.wheelY + receipt.wheelR);
    if (bottomGap < -0.12 || bottomGap > 0.24) {
      failures.push(`road wheel z=${z} lower alignment gap ${round(bottomGap)} m`);
    }
    if (topGap < -0.16) failures.push(`road wheel z=${z} protrudes above return run by ${round(-topGap)} m`);
  }

  for (const drive of drives) {
    const gear = drive.userData;
    if (!gear.sprocketToothCount) continue;
    const expected = Math.max(4,
      Math.round((Math.PI * 2 * gear.trackSpinRadiusM) / receipt.shoePitchM));
    if (Math.abs(gear.sprocketToothCount - expected) > 1) {
      failures.push(`sprocket teeth ${gear.sprocketToothCount} drift from ${expected} shoe engagements`);
    }
  }

  return {
    unitId,
    shoeCountPerSide: count,
    shoePitchM: round(receipt.shoePitchM),
    shoePadCoverageRatio: receipt.shoePadCoverageRatio,
    shoeDetailMode: receipt.shoeDetailMode,
    courseQuarterCounts,
    loopLengthM: round(receipt.loopLengthM),
    roadWheelStations: receipt.wheelZs.length,
    failures: [...new Set(failures)],
  };
}

try {
  if (!id) throw new Error('missing id');
  const tank = createTank(id, {
    setupShadowMaterial: (material) => material,
    anisotropy: 1,
    renderer: null,
  }, {
    camoSeed: 4242,
    quality: 'high',
    proceduralOnly: true,
    geometryReceipt: true,
  });
  tank.root.updateMatrixWorld(true);
  const hull = tank.root.getObjectByName('rig_hull');
  const objects = [];
  tank.root.traverse((object) => {
    if (object.userData?.runningGear) objects.push(object);
  });
  const receipts = hull?.userData.runningGearReceipts || [];
  const unitIdSet = new Set();
  for (const object of objects) {
    const unitId = object.userData.runningGearUnitId;
    if (Number.isInteger(unitId)) unitIdSet.add(unitId);
  }
  const unitIds = [...unitIdSet].sort((a, b) => a - b);
  const units = unitIds.map((unitId) => inspectUnit(
    unitId,
    receipts.find((receipt) => receipt.unitId === unitId),
    objects,
  ));
  const failures = units.flatMap((unit) => unit.failures.map((failure) => `unit ${unit.unitId}: ${failure}`));
  window.__TRACK_SYSTEM_AUDIT = { id, units, failures, pass: units.length > 0 && failures.length === 0 };
} catch (error) {
  window.__TRACK_SYSTEM_AUDIT = { id, error: String(error?.stack || error), pass: false };
}
window.__TRACK_SYSTEM_READY = true;
</script>
