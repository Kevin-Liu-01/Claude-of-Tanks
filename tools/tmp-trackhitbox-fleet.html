<!doctype html>
<!-- TEMP (track-hitbox round 2026-08-06): fleet smoke for the derived track
     prisms. Builds EVERY registered tank (full vite env — userdrops included),
     checks the trackShapes derivation invariants on the shared spec armor,
     and resolves a battery of real traceTank+resolveShellHit rays against
     each vehicle. window.__FLEET_REPORT when done. -->
<meta charset="utf-8">
<title>tmp-trackhitbox-fleet</title>
<script type="module">
import { createTank } from '/src/vehicles/tankFactory.js';
import { ALL_TANK_IDS, TANK_SPECS, getSpec } from '/src/vehicles/specs.js';
import { tankPoseFromState, traceTank } from '/src/sim/armor.js';
import { resolveShellHit, createCombatState } from '/src/sim/damage.js';
import { createShell } from '/src/sim/ballistics.js';
import { mulberry32 } from '/src/game/state.js';
import { Vector3 } from 'three';

const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer: null };
const V = (x, y, z) => new Vector3(x, y, z);
const AP = {
  name: 'probe_ap', type: 'AP', caliberMm: 100, pen100Mm: 220, pen1000Mm: 200,
  dmg: 250, velocityMps: 900, moduleDmg: 100, tracer: 'AP',
};
const mkState = () => ({
  pos: V(0, 0, 0), yaw: 0, speed: 0, visualPitch: 0, visualRoll: 0,
  turretYaw: 0, gunPitch: 0,
});

const rows = [];
const errors = [];
// registered ids INCLUDING userdrops registrations (they extend ALL_TANK_IDS
// in place at import time under the vite env)
const ids = [...ALL_TANK_IDS];
for (const id of ids) {
  const row = { id, built: false, shapes: 0, convex: true, mirrored: true,
    rays: 0, trackRays: 0, resolves: 0, err: null };
  try {
    const tank = createTank(id, engineCtx, { camoSeed: 4242, quality: 'low', proceduralOnly: true });
    row.built = true;
    const spec = getSpec(id);
    const armor = spec.armor;
    const shapes = armor.trackShapes || [];
    row.shapes = shapes.length;
    // invariants: convex CCW polys, x0<x1, mirrored module naming
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    for (const s of shapes) {
      if (!(s.x0 < s.x1)) row.convex = false;
      if (s.module === 'trackL' && !(s.x1 <= 0.0001)) row.mirrored = false;
      if (s.module === 'trackR' && !(s.x0 >= -0.0001)) row.mirrored = false;
      let area2 = 0;
      for (let i = 0; i < s.poly.length; i++) {
        const o = s.poly[i];
        const a = s.poly[(i + 1) % s.poly.length];
        const b = s.poly[(i + 2) % s.poly.length];
        if (cross(o, a, b) < -1e-6) row.convex = false;
        area2 += o[0] * a[1] - a[0] * o[1];
      }
      if (area2 <= 0) row.convex = false;
      if (!s.plate || s.plate.kind !== 'external' || s.plate.moduleLink !== s.module) row.convex = false;
    }
    // ray battery: side sweeps at 9 heights x 7 z-stations, both sides,
    // plus end-on lanes down each track and two diagonals — every ray is
    // resolved through the REAL pipeline against a throwaway combat state.
    const pose = tankPoseFromState(mkState());
    const dims = spec.dims || { widthM: 3.5, heightM: 2.5, hullLengthM: 7 };
    const hw = dims.widthM / 2 + 2;
    const hl = (dims.hullLengthM || 7) / 2 + 2;
    const lanes = [];
    for (const h of [0.15, 0.3, 0.45, 0.6, 0.8, 1.0, 1.3, 1.7, 2.2]) {
      for (let k = -3; k <= 3; k++) {
        const z = (k / 3) * (hl - 1.2);
        lanes.push([V(hw, h, z), V(-hw, h, z)]);   // right → left
        lanes.push([V(-hw, h, z), V(hw, h, z)]);   // left → right
      }
    }
    for (const x of [dims.widthM * 0.38, -dims.widthM * 0.38]) {
      for (const h of [0.25, 0.5, 0.8]) {
        lanes.push([V(x, h, hl), V(x, h, -hl)]);   // end-on track lanes
      }
    }
    lanes.push([V(hw, 2.2, hl), V(-hw, 0.2, -hl)]); // diagonals
    lanes.push([V(-hw, 0.2, -hl), V(hw, 2.2, hl)]);
    let seed = 1000;
    for (const [from, to] of lanes) {
      const hits = traceTank(from, to, pose, armor, new Set());
      row.rays++;
      if (hits.some((h) => (h.kind === 'module' && (h.module === 'trackL' || h.module === 'trackR'))
        || (h.kind === 'plate' && h.plate.moduleLink))) row.trackRays++;
      // sanity: ordered, finite
      for (let i = 0; i < hits.length; i++) {
        if (!Number.isFinite(hits[i].t)) throw new Error(`non-finite t on ${id}`);
        if (i && hits[i].t < hits[i - 1].t - 1e-9) throw new Error(`unsorted hits on ${id}`);
        if (hits[i].kind === 'plate' && !Number.isFinite(hits[i].impactAngleDeg)) {
          throw new Error(`bad impact angle on ${id}`);
        }
      }
      if (!hits.length) continue;
      const dir = to.clone().sub(from).normalize();
      const shell = createShell(AP, 'probe', true, from, dir, seed);
      shell.distM = 300;
      const combat = createCombatState(spec);
      const ev = resolveShellHit(shell, { id, spec, state: mkState(), combat }, hits, mulberry32(seed++));
      if (!ev || typeof ev.kind !== 'string') throw new Error(`no event on ${id}`);
      row.resolves++;
    }
    tank.dispose();
  } catch (e) {
    row.err = String(e && e.message || e);
    errors.push(`${id}: ${row.err}`);
  }
  rows.push(row);
  // yield so the page never watchdogs on 100+ builds
  await new Promise((r) => setTimeout(r, 0));
}
window.__FLEET_REPORT = {
  total: rows.length,
  built: rows.filter((r) => r.built).length,
  withShapes: rows.filter((r) => r.shapes > 0).length,
  badConvex: rows.filter((r) => !r.convex).map((r) => r.id),
  badMirror: rows.filter((r) => !r.mirrored).map((r) => r.id),
  noTrackRays: rows.filter((r) => r.shapes > 0 && r.trackRays === 0).map((r) => r.id),
  errors,
  rows,
};
window.__FLEET_READY = true;
</script>
