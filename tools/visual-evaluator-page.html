function visibleBox(root) {
  const box = new THREE.Box3();
  root.updateMatrixWorld(true);
  root.traverse((o) => {
    if (!(o.isMesh || o.isInstancedMesh || o.isSkinnedMesh) || !o.geometry) return;
    let vis = true;
    for (let p = o; p; p = p.parent) if (!p.visible) { vis = false; break; }
    if (!vis || /shadow/i.test(o.name || '')) return;
    if (o.isInstancedMesh) {
      if (o.count === 0) return;
      o.computeBoundingBox();
      if (o.boundingBox && !o.boundingBox.isEmpty()) {
        box.union(o.boundingBox.clone().applyMatrix4(o.matrixWorld));
      }
      return;
    }
    if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
    const b = o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld);
    box.union(b);
  });
  return box;
}

// stashCam: record the exact world<->pixel mapping on the camera so every
// measurement converts through ONE code path (gate convention: symmetric
// ortho, u = ((px+0.5)/S*2-1)*half along camera right, v likewise up).
function stashCam(camera, center, half, mode) {
  camera.updateMatrixWorld(true);
  const m = camera.matrixWorld;
  camera.userData.eval = {
    mode,
    center: center.clone(),
    half,
    right: new THREE.Vector3().setFromMatrixColumn(m, 0).normalize(),
    up: new THREE.Vector3().setFromMatrixColumn(m, 1).normalize(),
  };
  return camera;
}

function orthoFor(box, direction, frac = 0.55, centerOff = null) {
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  if (centerOff) {
    center.x += centerOff.x * size.x; center.y += centerOff.y * size.y; center.z += centerOff.z * size.z;
  }
  const dir = direction.clone().normalize();
  const nominalUp = Math.abs(dir.y) > 0.9 ? new THREE.Vector3(0, 0, -1) : new THREE.Vector3(0, 1, 0);
  const right = new THREE.Vector3().crossVectors(nominalUp, dir).normalize();
  const up = new THREE.Vector3().crossVectors(dir, right).normalize();
  let ext = 0.5;
  for (const cx of [box.min.x, box.max.x]) for (const cy of [box.min.y, box.max.y]) for (const cz of [box.min.z, box.max.z]) {
    const d = new THREE.Vector3(cx, cy, cz).sub(center);
    ext = Math.max(ext, Math.abs(d.dot(right)), Math.abs(d.dot(up)));
  }
  const half = ext * (frac / 0.5) * 1.06;
  const camera = new THREE.OrthographicCamera(-half, half, half, -half, 0.1, 200);
  camera.position.copy(center).addScaledVector(dir, 60);
  camera.up.copy(up);
  camera.lookAt(center);
  camera.updateProjectionMatrix();
  return stashCam(camera, center, half, 'ortho');
}

function heroFor(box, direction) {
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const dist = Math.max(size.x, size.y, size.z) * 1.55;
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 300);
  camera.position.copy(center).addScaledVector(direction.clone().normalize(), dist);
  camera.position.y += size.y * 0.28;
  camera.lookAt(center);
  camera.updateProjectionMatrix();
  // perspective: world mapping is APPROX, valid at the box-center depth plane
  const half = Math.tan(camera.fov * Math.PI / 360) * camera.position.distanceTo(center);
  return stashCam(camera, center, half, 'hero');
}

function pxToWorld(cam, x, y, S) {
  const { center, half, right, up } = cam.userData.eval;
  const un = ((x + 0.5) / S) * 2 - 1;
  const vn = -(((y + 0.5) / S) * 2 - 1);
  return center.clone().addScaledVector(right, un * half).addScaledVector(up, vn * half);
}
// Self-registered camera-plane coordinates in meters, relative to the
// model's OWN framing center (per-model ortho rig, m60a1-r5 critic
// convention). Ref and proc builds do not share a world origin (recovered
// GLB pivots vs procedural conventions — isu152 sits ~1.6 m apart), so all
// ref<->proc COMPARISON runs in this frame; display coordinates convert
// into the PROC model's world (the authoring frame).
function pxToRel(cam, x, y, S) {
  const { half } = cam.userData.eval;
  return [(((x + 0.5) / S) * 2 - 1) * half, -((((y + 0.5) / S) * 2 - 1)) * half];
}
function relToWorld(cam, u, v) {
  const { center, right, up } = cam.userData.eval;
  return center.clone().addScaledVector(right, u).addScaledVector(up, v);
}
const mPerPxOf = (cam, S) => 2 * cam.userData.eval.half / S;
const axisName = (v) => {
  const a = [Math.abs(v.x), Math.abs(v.y), Math.abs(v.z)];
  return 'xyz'[a.indexOf(Math.max(...a))];
};

const maskCanvas = document.createElement('canvas');
maskCanvas.width = maskCanvas.height = MASK_S;
const maskCtx = maskCanvas.getContext('2d', { willReadFrequently: true });
const shotCanvas = document.createElement('canvas');
shotCanvas.width = shotCanvas.height = SHOT_S;

const maskMat = new THREE.MeshBasicMaterial({ color: 0xffffff }); // scene-true culling (FrontSide)

// Flat-unlit silhouette pass. Shadow proxies (colorWrite:false / *shadow*)
// are HIDDEN, not painted — the mask measures the silhouette the critic's
// shaded pairs actually show (unlike the gate, which deliberately overrides
// them in; see BUILD-STANDARD §C).
function swapToMask(root) {
  const saved = [];
  root.traverse((o) => {
    if (!(o.isMesh || o.isInstancedMesh || o.isSkinnedMesh)) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    const proxy = /shadow/i.test(o.name || '') ||
      mats.some((m) => m && (m.colorWrite === false || (m.transparent && (m.opacity ?? 1) < 0.05)));
    saved.push({ o, material: o.material, visible: o.visible });
    if (proxy) o.visible = false;
    else o.material = Array.isArray(o.material) ? o.material.map(() => maskMat) : maskMat;
  });
  return () => { for (const s of saved) { s.o.material = s.material; s.o.visible = s.visible; } };
}

function renderMaskField(model, other, camera) {
  const restore = swapToMask(model.root);
  model.root.visible = true;
  other.root.visible = false;
  renderer.setSize(MASK_S, MASK_S, false);
  renderer.setClearColor(0x000000, 1);
  renderer.setRenderTarget(null);
  renderer.clear(true, true, true);
  renderer.render(scene, camera);
  restore();
  maskCtx.drawImage(renderer.domElement, 0, 0);
  const img = maskCtx.getImageData(0, 0, MASK_S, MASK_S).data;
  const f = new Uint8Array(MASK_S * MASK_S);
  for (let i = 0; i < f.length; i++) f[i] = img[i * 4]; // R channel; AA coverage
  return f;
}

function maskPxBounds(field, S) {
  let minX = S, maxX = -1, minY = S, maxY = -1;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    if (field[y * S + x] < 127.5) continue;
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
  }
  return maxX < 0 ? null : { minX, maxX, minY, maxY };
}

// Auto-reframe: orthoFor frames the model's visibleBox, but phantom
// non-rendering extents (hidden GLB helper nodes, instancer templates — the
// critic page's own InstancedMesh note is the same defect class) can leave
// the actual silhouette at half resolution (m1a2 ref rendered 45% fill vs
// proc 86%). When a standard ortho view underfills, rebuild the SAME view
// (direction, up, conventions) tightened to the measured mask at the
// official ~86% dominant-axis fill. Closeups are deliberate crops — never
// reframed. Reported per view/side as `reframed`.
function reframeTight(cam, field) {
  const b = maskPxBounds(field, MASK_S);
  if (!b) return null;
  const extPx = Math.max(b.maxX - b.minX, b.maxY - b.minY) / 2;
  const fill = extPx / (MASK_S / 2);
  if (fill >= 0.62 || fill < 0.02) return null;
  const ud = cam.userData.eval;
  const mpp = 2 * ud.half / MASK_S;
  const [du, dv] = pxToRel(cam, (b.minX + b.maxX) / 2, (b.minY + b.maxY) / 2, MASK_S);
  const newCenter = relToWorld(cam, du, dv);
  const newHalf = Math.max(0.5, (extPx * mpp) / 0.857);
  const dir = cam.position.clone().sub(ud.center).normalize();
  const cam2 = new THREE.OrthographicCamera(-newHalf, newHalf, newHalf, -newHalf, 0.1, 200);
  cam2.position.copy(newCenter).addScaledVector(dir, 60);
  cam2.up.copy(ud.up);
  cam2.lookAt(newCenter);
  cam2.updateProjectionMatrix();
  return stashCam(cam2, newCenter, newHalf, 'ortho');
}

}

// ------------------------------------------------------- marching squares --
// Subpixel contour extraction at iso=127.5 on the AA coverage field (MSAA
// resolve is linear in coverage, so the iso-line tracks the 50% edge).
function marchingSquares(f, W, H, iso) {
  const pts = new Map(); // edgeKey -> [x, y]
  const adj = new Map(); // edgeKey -> [edgeKey, ...]
  const link = (a, b) => {
    let la = adj.get(a); if (!la) adj.set(a, la = []);
    let lb = adj.get(b); if (!lb) adj.set(b, lb = []);
    la.push(b); lb.push(a);
  };
  const t = (va, vb) => (iso - va) / (vb - va);
  for (let y = 0; y < H - 1; y++) {
    const r0 = y * W, r1 = (y + 1) * W;
    for (let x = 0; x < W - 1; x++) {
      const tl = f[r0 + x], tr = f[r0 + x + 1], br = f[r1 + x + 1], bl = f[r1 + x];
      const c = (tl >= iso ? 1 : 0) | (tr >= iso ? 2 : 0) | (br >= iso ? 4 : 0) | (bl >= iso ? 8 : 0);
      if (c === 0 || c === 15) continue;
      const eT = 2 * (y * W + x), eB = 2 * ((y + 1) * W + x);
      const eL = 2 * (y * W + x) + 1, eR = 2 * (y * W + x + 1) + 1;
      const T = () => { if (!pts.has(eT)) pts.set(eT, [x + t(tl, tr), y]); return eT; };
      const B = () => { if (!pts.has(eB)) pts.set(eB, [x + t(bl, br), y + 1]); return eB; };
      const L = () => { if (!pts.has(eL)) pts.set(eL, [x, y + t(tl, bl)]); return eL; };
      const R = () => { if (!pts.has(eR)) pts.set(eR, [x + 1, y + t(tr, br)]); return eR; };
      switch (c) {
        case 1: link(T(), L()); break;
        case 2: link(T(), R()); break;
        case 3: link(L(), R()); break;
        case 4: link(R(), B()); break;
        case 5: if ((tl + tr + br + bl) / 4 >= iso) { link(T(), R()); link(B(), L()); }
                else { link(T(), L()); link(B(), R()); } break;
        case 6: link(T(), B()); break;
        case 7: link(L(), B()); break;
        case 8: link(L(), B()); break;
        case 9: link(T(), B()); break;
        case 10: if ((tl + tr + br + bl) / 4 >= iso) { link(T(), L()); link(B(), R()); }
                 else { link(T(), R()); link(B(), L()); } break;
        case 11: link(R(), B()); break;
        case 12: link(L(), R()); break;
        case 13: link(T(), R()); break;
        case 14: link(T(), L()); break;
      }
    }
  }
  const loops = [];
  for (const [start, nbrs] of adj) {
    if (!nbrs.length) continue;
    const loop = [start];
    let prev = start;
    let cur = nbrs.pop();
    { const l = adj.get(cur); l.splice(l.indexOf(start), 1); }
    while (cur !== start) {
      loop.push(cur);
      const l = adj.get(cur) || [];
      if (!l.length) break; // open chain hit the image border
      const nxt = l.pop();
      { const l2 = adj.get(nxt); const i = l2.indexOf(cur); if (i >= 0) l2.splice(i, 1); }
      prev = cur; cur = nxt;
    }
    const closed = cur === start;
    loops.push({ pts: loop.map((k) => pts.get(k)), closed });
  }
  return loops.filter((l) => l.pts.length >= 8);
}

const shoelace = (p) => {
  let a = 0;
  for (let i = 0, n = p.length; i < n; i++) {
    const q = p[i], r = p[(i + 1) % n];
    a += q[0] * r[1] - r[0] * q[1];
  }
  return a / 2;
};

function resampleLoop(p, spacing = 1) {
  const outPts = [];
  let carry = 0;
  for (let i = 0, n = p.length; i < n; i++) {
    const a = p[i], b = p[(i + 1) % n];
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const len = Math.hypot(dx, dy);
    if (len < 1e-9) continue;
    let d = carry;
    while (d < len) {
      outPts.push([a[0] + dx * (d / len), a[1] + dy * (d / len)]);
      d += spacing;
    }
    carry = d - len;
  }
  return outPts;
}

// Douglas-Peucker on a CLOSED resampled loop; returns simplified vertex
// INDICES into the loop (so segment ranges align with arc-run ranges).
function dpClosed(p, eps) {
  const n = p.length;
  let iMin = 0, iMax = 0;
  for (let i = 1; i < n; i++) {
    if (p[i][0] < p[iMin][0]) iMin = i;
    if (p[i][0] > p[iMax][0]) iMax = i;
  }
  const keep = new Set([iMin, iMax]);
  const seg = (i0, i1) => { // i0 < i1 in unwrapped index space
    const stack = [[i0, i1]];
    while (stack.length) {
      const [a, b] = stack.pop();
      if (b - a < 2) continue;
      const pa = p[a % n], pb = p[b % n];
      const vx = pb[0] - pa[0], vy = pb[1] - pa[1];
      const L2 = vx * vx + vy * vy;
      let worst = -1, wd = -1;
      for (let i = a + 1; i < b; i++) {
        const q = p[i % n];
        let d;
        if (L2 < 1e-12) d = Math.hypot(q[0] - pa[0], q[1] - pa[1]);
        else {
          const cross = (q[0] - pa[0]) * vy - (q[1] - pa[1]) * vx;
          d = Math.abs(cross) / Math.sqrt(L2);
        }
        if (d > wd) { wd = d; worst = i; }
      }
      if (wd > eps) { keep.add(worst % n); stack.push([a, worst], [worst, b]); }
    }
  };
  const lo = Math.min(iMin, iMax), hi = Math.max(iMin, iMax);
  seg(lo, hi);
  seg(hi, lo + n);
  return [...keep].sort((a, b) => a - b);
}

// --------------------------------------------------------- per-mask analysis --
const angDeg = (dx, dy) => { // px space (y down) -> camera plane (v up), undirected [0,180)
  let a = Math.atan2(-dy, dx) * 180 / Math.PI;
  a %= 180; if (a < 0) a += 180;
  return a;
};
const angDiff180 = (a, b) => { // signed circular b-a for undirected lines, [-90,90)
  let d = (b - a) % 180;
  if (d >= 90) d -= 180; if (d < -90) d += 180;
  return d;
};

function kasaFit(p) {
  let Sx = 0, Sy = 0, Sxx = 0, Syy = 0, Sxy = 0, Sxz = 0, Syz = 0, Sz = 0;
  const n = p.length;
  for (const [x, y] of p) {
    const z = x * x + y * y;
    Sx += x; Sy += y; Sxx += x * x; Syy += y * y; Sxy += x * y;
    Sxz += x * z; Syz += y * z; Sz += z;
  }
  // solve [ [Sxx Sxy Sx] [Sxy Syy Sy] [Sx Sy n] ] * [2a 2b c]' = [Sxz Syz Sz]
  const A = [[Sxx, Sxy, Sx], [Sxy, Syy, Sy], [Sx, Sy, n]];
  const B = [Sxz, Syz, Sz];
  const det3 = (m) =>
    m[0][0] * (m[1][1] * m[2][2] - m[1][2] * m[2][1]) -
    m[0][1] * (m[1][0] * m[2][2] - m[1][2] * m[2][0]) +
    m[0][2] * (m[1][0] * m[2][1] - m[1][1] * m[2][0]);
  const D = det3(A);
  if (Math.abs(D) < 1e-9) return null;
  const col = (m, i, v) => m.map((row, r) => row.map((x, c) => (c === i ? v[r] : x)));
  const a2 = det3(col(A, 0, B)) / D, b2 = det3(col(A, 1, B)) / D, c = det3(col(A, 2, B)) / D;
  const cx = a2 / 2, cy = b2 / 2;
  const r2 = c + cx * cx + cy * cy;
  if (r2 <= 0) return null;
  const r = Math.sqrt(r2);
  let se = 0;
  for (const [x, y] of p) { const d = Math.hypot(x - cx, y - cy) - r; se += d * d; }
  return { cx, cy, r, rms: Math.sqrt(se / n) };
}

// Facet detector: tangent-angle series along an arc run. A true circle is
// linear in arc length; a lathe N-gon is a staircase — detrend, measure the
// periodic step (autocorrelation), report N = 360/stepDeg (ww2-board
// cast-dome-vs-lathe class). Verdict needs BOTH the >1.2 deg step amplitude
// AND a facet sagitta that survives at overlay scale (r*(1-cos(pi/N)) >=
// 0.5 px @640) — a 96-seg lathe steps 3.75 deg but its 0.04 px sagitta is
// invisible, and calling it polygonal would be a false report.
function facetAnalysis(thetaRun, rPx) {
  const n = thetaRun.length;
  if (n < 24) return null;
  const mx = (n - 1) / 2;
  let sxy = 0, sxx = 0, my = 0;
  for (const y of thetaRun) my += y; my /= n;
  for (let i = 0; i < n; i++) { sxy += (i - mx) * (thetaRun[i] - my); sxx += (i - mx) * (i - mx); }
  const b = sxy / sxx, a = my - b * mx;
  const d = new Float64Array(n);
  for (let i = 0; i < n; i++) d[i] = thetaRun[i] - (a + b * i);
  const sorted = [...d].sort((p, q) => p - q);
  const pct = (q) => sorted[Math.max(0, Math.min(n - 1, Math.round(q * (n - 1))))];
  const amp = pct(0.975) - pct(0.025);
  if (amp < FACET_AMP_DEG) return { ampDeg: amp, polygonal: false };
  let varD = 0; for (const v of d) varD += v * v; varD /= n;
  if (varD < 1e-9) return { ampDeg: amp, polygonal: false };
  let bestLag = 0, bestAc = 0;
  const maxLag = Math.min(Math.floor(n / 2), 220);
  let prev = 1, rising = false;
  for (let lag = 3; lag < maxLag; lag++) {
    let s = 0;
    for (let i = 0; i + lag < n; i++) s += d[i] * d[i + lag];
    const ac = s / ((n - lag) * varD);
    if (ac > prev) rising = true;
    if (rising && ac > 0.3 && ac > bestAc) { bestAc = ac; bestLag = lag; }
    if (rising && bestLag && ac < bestAc - 0.15) break; // past the first peak
    prev = ac;
  }
  if (!bestLag) return { ampDeg: amp, polygonal: false, note: 'aperiodic waviness' };
  // parabolic peak refinement (facet-count precision: lag error of 2px on a
  // 40px facet shifts N by one)
  if (bestLag > 3 && bestLag < maxLag - 1) {
    const acAt = (lag) => {
      let s = 0;
      for (let i = 0; i + lag < n; i++) s += d[i] * d[i + lag];
      return s / ((n - lag) * varD);
    };
    const y0 = acAt(bestLag - 1), y1 = acAt(bestLag), y2 = acAt(bestLag + 1);
    const denom = y0 - 2 * y1 + y2;
    if (Math.abs(denom) > 1e-9) bestLag += Math.max(-0.5, Math.min(0.5, 0.5 * (y0 - y2) / denom));
  }
  const stepDeg = Math.abs(b) * bestLag;
  if (stepDeg < 0.8) return { ampDeg: amp, polygonal: false, note: 'aperiodic waviness' };
  const facets = Math.round(360 / stepDeg);
  // lathe reads are N>=6; a 4-5 "facet" chain is blocky corner geometry
  if (facets < 6 || facets > 96) return { ampDeg: amp, polygonal: false, note: facets < 6 ? 'blocky corner chain, not a lathe read' : 'aperiodic waviness' };
  const sagittaOverlayPx = rPx * (1 - Math.cos(Math.PI / facets)) * (SHOT_S / MASK_S);
  if (sagittaOverlayPx < 0.5) return { ampDeg: amp, polygonal: false, note: `${facets}-seg periodicity, sub-pixel sagitta (reads smooth)` };
  return { ampDeg: amp, polygonal: true, facets, stepDeg, sagittaOverlayPx };
}

// Arc runs come from a FINE Douglas-Peucker pass (chord-averaged vertices —
// per-pixel tangent noise from AA/marching-squares is ~2 deg and would break
// sign-consistent runs; DP chords integrate it away). A faceted lathe keeps
// its corners as DP vertices (turn = 360/N each), a smooth curve becomes a
// chain of small same-sign turns; both are "segment-fit residual is high"
// regions — straight edges produce near-zero turns and never chain.
function detectArcs(rs, cam, loopId) {
  const n = rs.length;
  if (n < 40) return [];
  const keep = dpClosed(rs, 0.8 * TS);
  const m = keep.length;
  if (m < 4) return [];
  const chordAng = new Float64Array(m), chordLen = new Float64Array(m);
  for (let k = 0; k < m; k++) {
    const a = rs[keep[k]], b = rs[keep[(k + 1) % m]];
    chordAng[k] = Math.atan2(-(b[1] - a[1]), b[0] - a[0]) * 180 / Math.PI;
    chordLen[k] = Math.hypot(b[0] - a[0], b[1] - a[1]);
  }
  const wrap = (d) => { d %= 360; if (d > 180) d -= 360; if (d < -180) d += 360; return d; };
  const turnAt = (k) => wrap(chordAng[k % m] - chordAng[(k - 1 + m) % m]);
  const okTurn = (t) => Math.abs(t) >= 1.5 && Math.abs(t) <= 45;
  const MAX_CHORD = 80; // px — a chord this long is a straight, not arc material
  // start the scan on the longest chord (never inside an arc run) so runs
  // that wrap the loop seam are still found whole
  let start = 0;
  for (let k = 1; k < m; k++) if (chordLen[k] > chordLen[start]) start = k;
  const arcs = [];
  const used = new Uint8Array(m);
  for (let s = start; s < start + m; s++) {
    const ss = s % m;
    if (used[ss]) continue;
    const t0 = turnAt(s + 1);
    if (!okTurn(t0) || chordLen[ss] > MAX_CHORD) continue;
    const sgn = Math.sign(t0);
    let e = s;
    let turn = 0;
    while (e < s + m - 2) {
      const t = turnAt(e + 1);
      if (!okTurn(t) || Math.sign(t) !== sgn || chordLen[(e + 1) % m] > MAX_CHORD) break;
      turn += t; e++;
    }
    for (let q = s; q <= e; q++) used[q % m] = 1;
    // >=5 chords: AA-rounded convex corners chain 3-4 big-turn chords into a
    // fake "arc" (plate-tip class); real rounded structures at detectable
    // radius always decompose into more
    const chordCount = e - s + 1;
    if (chordCount < 5) continue;
    const i0 = keep[ss], i1 = keep[(e + 1) % m];
    const runLen = (i1 - i0 + n) % n;
    if (runLen < MIN_ARC_PX || Math.abs(turn) < 20) continue;
    const idx = [];
    for (let q = 0; q <= runLen; q++) idx.push((i0 + q) % n);
    const ptsRun = idx.map((k) => rs[k]);
    let fit = kasaFit(ptsRun);
    if (!fit || fit.r < 3 || fit.r > MASK_S * 1.5) continue;
    // robust reject-refit: contact fillets at run ends bias r high and
    // inflate rms (selftest: +3% r, 2px rms) — shrinking-threshold outlier
    // rejection converges onto the true circle in 2-3 passes.
    for (let it = 0; it < 3; it++) {
      const thr = Math.max(1.0, 1.5 * fit.rms);
      const keptPts = ptsRun.filter(([x, y]) => Math.abs(Math.hypot(x - fit.cx, y - fit.cy) - fit.r) <= thr);
      if (keptPts.length < ptsRun.length * 0.6 || keptPts.length < 20) break;
      const nf = kasaFit(keptPts);
      if (!nf) break;
      fit = nf;
    }
    // fit-quality gate: corner-junk "arcs" (plate tips, hatch lips chaining
    // through fillets) fit badly even after rejection — not rounded structure
    if (fit.rms > Math.max(1.2, 0.015 * fit.r)) continue;
    // tangent series for facet reads — slip-clamped unwrap (raw MS tangents
    // occasionally jump near ±180; a real facet corner turns ≤ ~45°/px)
    const K = 2;
    const thU = new Float64Array(idx.length);
    let prevTh = 0;
    for (let q = 0; q < idx.length; q++) {
      const a = rs[(idx[q] - K + n) % n], b = rs[(idx[q] + K) % n];
      const th = Math.atan2(-(b[1] - a[1]), b[0] - a[0]) * 180 / Math.PI;
      let step = wrap(th - prevTh);
      if (Math.abs(step) > 45) step = 0; // unwrap slip, not geometry
      thU[q] = q === 0 ? th : thU[q - 1] + step;
      prevTh = th;
    }
    const mpp = mPerPxOf(cam, MASK_S);
    const w0 = pxToWorld(cam, ptsRun[0][0], ptsRun[0][1], MASK_S);
    const w1 = pxToWorld(cam, ptsRun[ptsRun.length - 1][0], ptsRun[ptsRun.length - 1][1], MASK_S);
    const cW = pxToWorld(cam, fit.cx, fit.cy, MASK_S);
    arcs.push({
      loopId, i0, i1, lenPx: runLen,
      rPx: fit.r, rM: fit.r * mpp,
      // span = integrated DP-chord turning (chord-averaged; the tangent
      // series is only trusted for its local detrended steps)
      spanDeg: Math.abs(turn),
      rmsPx: fit.rms, rmsMm: fit.rms * mpp * 1000,
      centerPx: [fit.cx, fit.cy], centerWorld: [cW.x, cW.y, cW.z],
      centerRel: pxToRel(cam, fit.cx, fit.cy, MASK_S),
      endsWorld: [[w0.x, w0.y, w0.z], [w1.x, w1.y, w1.z]],
      endsRel: [pxToRel(cam, ptsRun[0][0], ptsRun[0][1], MASK_S),
                pxToRel(cam, ptsRun[ptsRun.length - 1][0], ptsRun[ptsRun.length - 1][1], MASK_S)],
      ptsPx: ptsRun.filter((_, q) => q % 4 === 0),
      facets: facetAnalysis(thU, fit.r),
    });
  }
  return arcs;
}

function analyzeMask(field, cam) {
  const S = MASK_S;
  let lit = 0;
  for (let k = 0; k < field.length; k++) if (field[k] >= 127.5) lit++;
  if (lit < 1200) throw new Error(`near-empty mask (${lit} lit px)`);
  const loops = marchingSquares(field, S, S, 127.5);
  let outer = 0, best = 0;
  loops.forEach((l, li) => { const a = Math.abs(shoelace(l.pts)); l.area = a; if (a > best) { best = a; outer = li; } });
  const outerSign = Math.sign(shoelace(loops[outer].pts));
  const mpp = mPerPxOf(cam, S);
  const holes = [], islands = [], borderClips = [];
  loops.forEach((l, li) => {
    if (li === outer || l.area < 12) return;
    const c = l.pts.reduce((s, p) => [s[0] + p[0], s[1] + p[1]], [0, 0]).map((v) => v / l.pts.length);
    const w = pxToWorld(cam, c[0], c[1], S);
    const rec = { areaM2: l.area * mpp * mpp, centroidWorld: [w.x, w.y, w.z], centroidPx: c };
    // HERO-FRAME BORDER-CLIP law (revolution r12/r15 critics, banked
    // 5e59cd2): an OPEN chain cut by the mask frame border gets virtually
    // closed by the shoelace wraparound and reads as a giant fake void —
    // the r7 "0.741 m² hero hole" class. Open chains are border-clip
    // artifacts, never enclosed voids; report them separately.
    if (!l.closed) { rec.borderClipped = true; borderClips.push(rec); return; }
    if (Math.sign(shoelace(l.pts)) !== outerSign) holes.push(rec); else islands.push(rec);
  });
  holes.sort((a, b) => b.areaM2 - a.areaM2); islands.sort((a, b) => b.areaM2 - a.areaM2);
  borderClips.sort((a, b) => b.areaM2 - a.areaM2);

  // segments + arcs on every loop big enough to carry structure
  const segments = [], arcs = [];
  loops.forEach((l, li) => {
    const rs = resampleLoop(l.pts, 1);
    if (rs.length < 30) return;
    const loopArcs = detectArcs(rs, cam, li);
    arcs.push(...loopArcs);
    const keep = dpClosed(rs, DP_EPS);
    const onBorder = (p) => p[0] < 2 || p[1] < 2 || p[0] > S - 3 || p[1] > S - 3;
    for (let k = 0; k < keep.length; k++) {
      const i0 = keep[k], i1 = keep[(k + 1) % keep.length];
      const p0 = rs[i0], p1 = rs[i1];
      const lenPx = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]);
      if (lenPx < MIN_SEG_PX) continue;
      // clipped views (closeups) run contours along the frame border —
      // those are crop artifacts, not vehicle edges
      if (onBorder(p0) && onBorder(p1)) continue;
      const w0 = pxToWorld(cam, p0[0], p0[1], S), w1 = pxToWorld(cam, p1[0], p1[1], S);
      const inSpan = (i, s0, L) => ((i - s0 + rs.length) % rs.length) <= L;
      const inArc = loopArcs.some((a2) => {
        const L = (a2.i1 - a2.i0 + rs.length) % rs.length;
        return inSpan(i0, a2.i0, L) && inSpan(i1, a2.i0, L);
      });
      // short chords riding the AA fillet where an arc meets a straight are
      // transition junk, not edges — keep them out of the flagged digest
      const segSpanIdx = (i1 - i0 + rs.length) % rs.length;
      const midIdx = (i0 + Math.round(segSpanIdx / 2)) % rs.length;
      const arcAdjacent = !inArc && lenPx < 60 && loopArcs.some((a2) => {
        const L = (a2.i1 - a2.i0 + rs.length) % rs.length;
        return inSpan(midIdx, (a2.i0 - 25 + rs.length) % rs.length, L + 50);
      });
      const r0 = pxToRel(cam, p0[0], p0[1], S), r1 = pxToRel(cam, p1[0], p1[1], S);
      segments.push({
        loopId: li, i0, i1, lenPx, lenM: lenPx * mpp,
        angleDeg: angDeg(p1[0] - p0[0], p1[1] - p0[1]),
        p0, p1, midPx: [(p0[0] + p1[0]) / 2, (p0[1] + p1[1]) / 2],
        w0: [w0.x, w0.y, w0.z], w1: [w1.x, w1.y, w1.z],
        midWorld: [(w0.x + w1.x) / 2, (w0.y + w1.y) / 2, (w0.z + w1.z) / 2],
        rel0: r0, rel1: r1, midRel: [(r0[0] + r1[0]) / 2, (r0[1] + r1[1]) / 2],
        inArc, arcAdjacent,
      });
    }
  });

  // per-column top/bottom profile in SELF-REGISTERED camera-plane meters
  // (gate projection convention: pixel (x,y) center -> a = -half+(x+0.5)*mpp
  // along camera-right, b = half-(y+0.5)*mpp along camera-up, both relative
  // to the model's own framing center).
  const half = cam.userData.eval.half;
  const cols = [];
  for (let x = 0; x < S; x++) {
    let topY = -1, botY = -1;
    for (let y = 0; y < S; y++) if (field[y * S + x] >= 127.5) { topY = y; break; }
    if (topY >= 0) for (let y = S - 1; y >= 0; y--) if (field[y * S + x] >= 127.5) { botY = y; break; }
    if (topY < 0) { cols.push(null); continue; }
    cols.push({
      a: -half + (x + 0.5) * mpp,      // column center along camera-right
      top: half - (topY + 0.5) * mpp,  // highest lit pixel (v-up)
      bot: half - (botY + 0.5) * mpp,
    });
  }

  // mask moments (world units) for rig parity
  let sw = 0, su = 0, sv = 0;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    if (field[y * S + x] < 127.5) continue;
    sw++; su += x; sv += y;
  }
  const mu = su / sw, mv = sv / sw;
  let cuu = 0, cvv = 0, cuv = 0;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    if (field[y * S + x] < 127.5) continue;
    const du = x - mu, dv = -(y - mv); // v-up
    cuu += du * du; cvv += dv * dv; cuv += du * dv;
  }
  cuu /= sw; cvv /= sw; cuv /= sw;
  const principalDeg = 0.5 * Math.atan2(2 * cuv, cuu - cvv) * 180 / Math.PI;
  const e = [Math.cos(principalDeg * Math.PI / 180), Math.sin(principalDeg * Math.PI / 180)];
  // CANONICAL EIGENVECTOR DIRECTION (russia r30 root-cause): the principal
  // axis is defined mod 180 deg — near-vertical plans land ref/proc on
  // OPPOSITE atan2 branches, pointing e opposite ways and flipping the
  // skew sign spuriously (t72b3m/t90m top-view false yaw-180s). Flip by
  // the DOMINANT component (cos(+-90deg) is +6e-17 for BOTH branches, so
  // a plain e[0]<0 test never fires at vertical axes).
  if ((Math.abs(e[1]) > Math.abs(e[0]) ? e[1] : e[0]) < 0) { e[0] = -e[0]; e[1] = -e[1]; }
  let m2 = 0, m3 = 0;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    if (field[y * S + x] < 127.5) continue;
    const t2 = (x - mu) * e[0] + (-(y - mv)) * e[1];
    m2 += t2 * t2; m3 += t2 * t2 * t2;
  }
  m2 /= sw; m3 /= sw;
  const skew = m3 / Math.pow(m2, 1.5);
  const centroidW = pxToWorld(cam, mu, mv, S);
  let minX = S, maxX = 0, minY = S, maxY = 0;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    if (field[y * S + x] < 127.5) continue;
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
  }
  const aspect = Math.sqrt(Math.max(cuu, cvv) / Math.max(1e-9, Math.min(cuu, cvv)));
  const moments = {
    areaM2: sw * mpp * mpp,
    centroidWorld: [centroidW.x, centroidW.y, centroidW.z],
    centroidRel: pxToRel(cam, mu, mv, S),
    bboxWorldW: (maxX - minX + 1) * mpp, bboxWorldH: (maxY - minY + 1) * mpp,
    principalDeg, skew, aspect,
  };
  return { loops, outer, holes, islands, borderClips, segments, arcs, cols, moments, mpp, lit, half };
}

// -------------------------------------------------------------- comparison --
function matchSegments(ref, proc, extentM) {
  const gateMid = Math.max(0.35, 0.06 * extentM);
  const avail = proc.map((_, i) => i);
  const matches = [];
  const order = [...ref.keys()].sort((a, b) => ref[b].lenM - ref[a].lenM);
  const usedProc = new Set();
  for (const ri of order) {
    const r = ref[ri];
    let best = -1, bestCost = Infinity;
    for (const pi of avail) {
      if (usedProc.has(pi)) continue;
      const p = proc[pi];
      // self-registered frame: ref and proc builds need not share a world
      // origin — the per-model rig centers them like the critic pairs do
      const dm = Math.hypot(r.midRel[0] - p.midRel[0], r.midRel[1] - p.midRel[1]);
      if (dm > gateMid) continue;
      const da = Math.abs(angDiff180(r.angleDeg, p.angleDeg));
      // short segments have many candidates — a loose angle gate would
      // manufacture wild-delta pairs from unrelated micro-features
      if (da > ((r.lenPx < 60 || p.lenPx < 60) ? 15 : 25)) continue;
      const ratio = r.lenM / p.lenM;
      if (ratio > 3 || ratio < 1 / 3) continue;
      const cost = (dm / extentM) * 6 + da / 25 + Math.abs(Math.log(ratio)) * 0.5;
      if (cost < bestCost) { bestCost = cost; best = pi; }
    }
    if (best >= 0) {
      usedProc.add(best);
      matches.push({ ref: r, proc: proc[best], dAngleDeg: angDiff180(r.angleDeg, proc[best].angleDeg) });
    }
  }
  const refOnly = ref.filter((_, i) => !matches.some((m) => m.ref === ref[i]));
  const procOnly = proc.filter((_, i) => !usedProc.has(i));
  return { matches, refOnly, procOnly };
}

function matchArcs(ref, proc, extentM) {
  const gate = Math.max(0.3, 0.06 * extentM);
  const pairs = [];
  const usedP = new Set();
  for (const r of [...ref].sort((a, b) => b.lenPx - a.lenPx)) {
    let best = null, bestD = Infinity;
    for (const p of proc) {
      if (usedP.has(p)) continue;
      const dm = Math.hypot(r.centerRel[0] - p.centerRel[0], r.centerRel[1] - p.centerRel[1]);
      if (dm > gate) continue;
      if (dm < bestD) { bestD = dm; best = p; }
    }
    if (best) { usedP.add(best); pairs.push({ ref: r, proc: best, dRM: best.rM - r.rM, dCenterM: bestD }); }
  }
  return {
    pairs,
    refOnly: ref.filter((r) => !pairs.some((q) => q.ref === r)),
    procOnly: proc.filter((p) => !usedP.has(p)),
  };
}

function compareProfiles(refA, procA, N = 192) {
  const span = (cols) => {
    let lo = Infinity, hi = -Infinity;
    for (const c of cols) if (c) { lo = Math.min(lo, c.a); hi = Math.max(hi, c.a); }
    return [lo, hi];
  };
  const [rl, rh] = span(refA.cols), [pl, ph] = span(procA.cols);
  const lo = Math.max(rl, pl), hi = Math.min(rh, ph);
  if (!(hi > lo)) return null;
  const sample = (cols, a, mpp) => {
    // nearest column within 1.5 px
    let best = null, bd = Infinity;
    for (const c of cols) {
      if (!c) continue;
      const d = Math.abs(c.a - a);
      if (d < bd) { bd = d; best = c; }
    }
    return bd <= 1.5 * mpp ? best : null;
  };
  const stations = [];
  for (let i = 0; i < N; i++) {
    const a = lo + ((i + 0.5) / N) * (hi - lo);
    const r = sample(refA.cols, a, refA.mpp), p = sample(procA.cols, a, procA.mpp);
    if (!r || !p) continue;
    stations.push({ a, dTop: p.top - r.top, dBot: p.bot - r.bot, refTop: r.top, procTop: p.top, refBot: r.bot, procBot: p.bot });
  }
  if (!stations.length) return null;
  // cliff tagging: where the silhouette has a vertical edge, a small
  // horizontal misregistration reads as a full-cliff-height delta — real
  // information (the feature edge moved) but a different claim class than
  // "the deck is N cm high"
  for (let i = 0; i < stations.length; i++) {
    const a = stations[Math.max(0, i - 1)], b = stations[Math.min(stations.length - 1, i + 1)];
    const g = Math.max(Math.abs(b.refTop - a.refTop), Math.abs(b.procTop - a.procTop),
      Math.abs(b.refBot - a.refBot), Math.abs(b.procBot - a.procBot));
    stations[i].cliff = g > 0.25;
  }
  const tops = stations.map((s) => Math.abs(s.dTop)).sort((x, y) => x - y);
  const bots = stations.map((s) => Math.abs(s.dBot)).sort((x, y) => x - y);
  const pct = (arr, q) => arr[Math.min(arr.length - 1, Math.floor(q * arr.length))];
  const worst = [...stations].sort((x, y) => Math.max(Math.abs(y.dTop), Math.abs(y.dBot)) - Math.max(Math.abs(x.dTop), Math.abs(x.dBot))).slice(0, 5);
  return {
    stations: stations.length,
    meanAbsTop: tops.reduce((s, v) => s + v, 0) / tops.length,
    p95Top: pct(tops, 0.95), maxTop: tops[tops.length - 1],
    meanAbsBot: bots.reduce((s, v) => s + v, 0) / bots.length,
    p95Bot: pct(bots, 0.95), maxBot: bots[bots.length - 1],
    worst,
  };
}

// -------------------------------------------------------------- reporting --
const R3 = (v) => Number(v.toFixed(3));
const R1 = (v) => Number(v.toFixed(1));
// descriptors + display coordinates are PROC-world (the authoring frame);
// ref-side findings convert through the self-registered rel frame first
const descBox = visibleBox(procedural.root);
function describeWorld(p) {
  const size = descBox.getSize(new THREE.Vector3());
  const min = descBox.min;
  const toks = [];
  const fy = (p[1] - min.y) / Math.max(1e-6, size.y);
  const fz = (p[2] - min.z) / Math.max(1e-6, size.z);
  const fx = (p[0] - min.x) / Math.max(1e-6, size.x) - 0.5;
  if (fy > 0.66) toks.push('upper'); else if (fy < 0.33) toks.push('lower');
  if (fz > 0.66) toks.push('front'); else if (fz < 0.33) toks.push('rear');
  if (Math.abs(fx) > 0.28) toks.push(fx < 0 ? 'left' : 'right');
  return toks.slice(0, 2).join('-') || 'mid';
}
function worldSpanText(cam, pts) {
  const { right, up } = cam.userData.eval;
  const ax1 = axisName(right), ax2 = axisName(up);
  const gi = { x: 0, y: 1, z: 2 };
  const rng = (ax) => {
    const vals = pts.map((p) => p[gi[ax]]);
    return `${ax} ${R3(Math.min(...vals)).toFixed(2)}..${R3(Math.max(...vals)).toFixed(2)}`;
  };
  const approx = cam.userData.eval.mode === 'hero' ? '~' : '';
  return `@${approx}world ${rng(ax1)} ${rng(ax2)}`;
}

// ------------------------------------------------------------------ boxes --
reference.root.visible = true;
procedural.root.visible = true;
const refBox = visibleBox(reference.root);
const procBox = visibleBox(procedural.root);
const badBox = (b) => !isFinite(b.min.x) || !isFinite(b.max.x) || b.getSize(new THREE.Vector3()).length() < 0.5;
if (badBox(refBox) || badBox(procBox)) throw new Error('degenerate bounding box — model failed to build');
// ref and proc builds keep independent world origins (recovered-GLB pivots
// vs procedural conventions); comparisons are self-registered, this is data
const frameOffset = procBox.getCenter(new THREE.Vector3()).sub(refBox.getCenter(new THREE.Vector3()));

// ------------------------------------------------------------- view table --
const ALL_VIEW_DEFS = [];
for (const [name, dir] of Object.entries(VIEWS)) {
  ALL_VIEW_DEFS.push({ name, kind: 'ortho', mk: (box) => orthoFor(box, dir) });
}
for (const [name, dir] of HERO_VIEWS) {
  ALL_VIEW_DEFS.push({ name, kind: 'hero', mk: (box) => heroFor(box, dir) });
}
for (const [name, dir, off, hs] of CLOSE_VIEWS) {
  ALL_VIEW_DEFS.push({ name, kind: 'close', mk: (box) => orthoFor(box, dir, hs, off) });
}
const viewFilter = (params.get('views') || '').split(',').map((s) => s.trim()).filter(Boolean);
const viewDefs = viewFilter.length
  ? ALL_VIEW_DEFS.filter((v) => viewFilter.includes(v.name))
  : (SELFTEST ? ALL_VIEW_DEFS.filter((v) => v.name === 'left') : ALL_VIEW_DEFS);
if (!viewDefs.length) throw new Error(`no views matched filter '${params.get('views')}'`);

// ------------------------------------------------------------- main sweep --
const report = {
  id, tool: 'visual-evaluator r1', selftest: SELFTEST,
  camoSeed: 4242, quality: 'high', maskSize: MASK_S, overlaySize: SHOT_S,
  thresholds: {
    dpEpsPx: DP_EPS, minSegPx: MIN_SEG_PX, minArcPx: MIN_ARC_PX,
    angleFlagDeg: ANGLE_FLAG_DEG, facetAmpDeg: FACET_AMP_DEG, yawProxyLimitDeg: YAW_PROXY_LIMIT_DEG,
  },
  views: {}, rigParity: { views: {}, verdict: 'OK' },
  frameOffsetM: { x: R3(frameOffset.x), y: R3(frameOffset.y), z: R3(frameOffset.z) },
  digest: [],
};
const overlays = {};
const digestParity = [], digestFindings = [], digestSummaries = [];

const BUCKETS = [[0.75, '#3ddc6a'], [1.5, '#d8e04a'], [4, '#ff9d38'], [1e9, '#ff4646']];
const colorFor = (d) => BUCKETS.find(([lim]) => Math.abs(d) <= lim)[1];

for (const def of viewDefs) {
  say(`analyzing ${def.name}…`);
  await sleep(0);
  let camRef = def.mk(refBox);
  let camProc = def.mk(procBox);
  let fieldRef = renderMaskField(reference, procedural, camRef);
  let fieldProc = renderMaskField(procedural, reference, camProc);
  const reframed = { ref: false, proc: false };
  if (def.kind === 'ortho') {
    const tightRef = reframeTight(camRef, fieldRef);
    if (tightRef) { camRef = tightRef; fieldRef = renderMaskField(reference, procedural, camRef); reframed.ref = true; }
    const tightProc = reframeTight(camProc, fieldProc);
    if (tightProc) { camProc = tightProc; fieldProc = renderMaskField(procedural, reference, camProc); reframed.proc = true; }
  }
  let AR, AP;
  try {
    AR = analyzeMask(fieldRef, camRef);
    AP = analyzeMask(fieldProc, camProc);
  } catch (err) {
    throw new Error(`${def.name}: ${err.message}`);
  }
  const extentM = 2 * camProc.userData.eval.half;
  const isOrtho = def.kind !== 'hero';

  // (a) edge angles — arc-interior chords and arc-transition fillets carry
  // no edge meaning; they stay in the JSON with their flags but never in
  // the flagged digest
  const segRes = matchSegments(AR.segments, AP.segments, extentM);
  const segNoise = (m) => {
    const lp = Math.min(m.ref.lenPx, m.proc.lenPx);
    return lp < 30 ? Math.max(4, 24 / lp) : 24 / lp;
  };
  // flagged = above the flag line AND above the segment's own noise band —
  // a Δ2° read on a 20px stub is not a finding, a Δ2° read on a glacis is
  const flagged = segRes.matches
    .filter((m) => Math.abs(m.dAngleDeg) > Math.max(ANGLE_FLAG_DEG, 2 * segNoise(m))
      && m.ref.lenM >= 0.25
      && !(m.ref.inArc && m.proc.inArc)
      && !(m.ref.arcAdjacent || m.proc.arcAdjacent))
    .sort((x, y) => (Math.abs(y.dAngleDeg) - segNoise(y)) - (Math.abs(x.dAngleDeg) - segNoise(x)));

  // (b) arcs
  const arcRes = matchArcs(AR.arcs, AP.arcs, extentM);

  // (c) exact geometry profile (ortho views only — world meters exact)
  const profile = isOrtho ? compareProfiles(AR, AP) : null;

  // (d) rig parity (ortho views only; the verdict comes from the nine
  // whole-vehicle views — closeup crops report data but never abort, a
  // sub-frame's principal axis is not a registration read)
  let parity = null;
  if (isOrtho) {
    const mr = AR.moments, mp = AP.moments;
    const dPrincipal = angDiff180(mr.principalDeg, mp.principalDeg);
    const dCentroid = Math.hypot(mr.centroidRel[0] - mp.centroidRel[0], mr.centroidRel[1] - mp.centroidRel[1]);
    const axisOk = mr.aspect > 1.15 && mp.aspect > 1.15;
    const flip = Math.sign(mr.skew) !== Math.sign(mp.skew) &&
      Math.min(Math.abs(mr.skew), Math.abs(mp.skew)) > SKEW_MIN;
    const yawProxy = flip ? 180 : (axisOk ? Math.abs(dPrincipal) : 0);
    parity = {
      dCentroidM: R3(dCentroid), dPrincipalDeg: R3(dPrincipal), axisConditioned: axisOk,
      refSkew: R3(mr.skew), procSkew: R3(mp.skew), flip,
      dAreaPct: R1(100 * (mp.areaM2 - mr.areaM2) / mr.areaM2),
      dWPct: R1(100 * (mp.bboxWorldW - mr.bboxWorldW) / mr.bboxWorldW),
      dHPct: R1(100 * (mp.bboxWorldH - mr.bboxWorldH) / mr.bboxWorldH),
      yawProxyDeg: R3(yawProxy),
      ref: { centroidWorld: mr.centroidWorld.map(R3), principalDeg: R3(mr.principalDeg), aspect: R3(mr.aspect) },
      proc: { centroidWorld: mp.centroidWorld.map(R3), principalDeg: R3(mp.principalDeg), aspect: R3(mp.aspect) },
    };
    report.rigParity.views[def.name] = parity;
    if (yawProxy > YAW_PROXY_LIMIT_DEG && def.kind === 'ortho') {
      report.rigParity.verdict = 'RIG MISMATCH — check registration before scoring';
      digestParity.push(`RIG MISMATCH ${def.name}: dYawProxy ${R1(yawProxy)}°${flip ? ' (skew flip — likely yaw-180)' : ''} dCentroid ${R3(dCentroid)}m dPrincipal ${R1(dPrincipal)}°`);
    }
  }

  // ---- digest lines for this view
  // selftest-calibrated extraction sigma (~24/lenPx deg); sub-30px segments
  // additionally carry corner-fillet BIAS up to a few degrees — floor at 4
  const noiseOf = (m) => R1(segNoise(m));
  // display frame: PROC world. Ref-side positions convert via the shared
  // self-registered rel frame (relToWorld through the proc camera).
  const relDisp = (rel) => { const w = relToWorld(camProc, rel[0], rel[1]); return [w.x, w.y, w.z]; };
  const segLine = (m) => {
    const pts = [m.proc.w0, m.proc.w1];
    return `${def.name}: edge ${describeWorld(m.proc.midWorld)} ${R1(m.proc.angleDeg)}° vs ref ${R1(m.ref.angleDeg)}° (Δ${m.dAngleDeg >= 0 ? '+' : ''}${R1(m.dAngleDeg)}° ±${noiseOf(m)}°) len ${R3(m.ref.lenM).toFixed(2)}m ${worldSpanText(camProc, pts)}`;
  };
  for (const m of flagged.slice(0, 5)) {
    digestFindings.push({
      mag: 100 + (Math.abs(m.dAngleDeg) - segNoise(m)) + (m.ref.lenM >= 0.8 ? 10 : 0),
      line: segLine(m),
    });
  }
  const bigUnmatched = (list, tag, toDisp) => list
    .filter((s) => s.lenM >= Math.max(0.3, 0.04 * extentM) && !s.inArc)
    .sort((x, y) => y.lenM - x.lenM).slice(0, 3)
    .map((s) => {
      const pts = toDisp ? [relDisp(s.rel0), relDisp(s.rel1)] : [s.w0, s.w1];
      return `${def.name}: ${tag} edge ${describeWorld(toDisp ? relDisp(s.midRel) : s.midWorld)} ${R1(s.angleDeg)}° len ${R3(s.lenM).toFixed(2)}m UNMATCHED ${worldSpanText(camProc, pts)}`;
    });
  for (const l of bigUnmatched(segRes.refOnly, 'ref', true)) digestFindings.push({ mag: 60, line: l });
  for (const l of bigUnmatched(segRes.procOnly, 'proc', false)) digestFindings.push({ mag: 60, line: l });

  for (const pr of arcRes.pairs) {
    const dR = pr.dRM;
    const fr = pr.ref.facets, fp = pr.proc.facets;
    const facetTxt = (f, who) => (f && f.polygonal ? `${who} reads polygonal: ${f.facets} facets (step ${R1(f.stepDeg)}°, amp ${R1(f.ampDeg)}°)` : null);
    const notes = [facetTxt(fr, 'ref'), facetTxt(fp, 'proc')].filter(Boolean).join('; ');
    const flag = Math.abs(dR) > Math.max(0.02, 0.06 * pr.ref.rM) || notes;
    if (!flag) continue;
    digestFindings.push({
      mag: 80 + Math.abs(dR) * 100 + (notes ? 20 : 0),
      line: `${def.name}: arc ${describeWorld(pr.proc.centerWorld)} r${R3(pr.proc.rM).toFixed(2)}m vs ref r${R3(pr.ref.rM).toFixed(2)}m (Δ${dR >= 0 ? '+' : ''}${R3(dR).toFixed(2)}m) span ${R1(pr.proc.spanDeg)}° fit ±${R1(pr.proc.rmsMm)}mm ${worldSpanText(camProc, pr.proc.endsWorld)}${notes ? ' — ' + notes : ''}`,
    });
  }
  const arcOnly = (list, tag, toDisp) => list
    .filter((a) => a.spanDeg >= 45 && a.rM >= 0.08 && a.rM <= extentM)
    .sort((x, y) => y.lenPx - x.lenPx).slice(0, 2)
    .map((a) => {
      const ends = toDisp ? a.endsRel.map(relDisp) : a.endsWorld;
      return `${def.name}: ${tag} arc ${describeWorld(toDisp ? relDisp(a.centerRel) : a.centerWorld)} r${R3(a.rM).toFixed(2)}m span ${R1(a.spanDeg)}° has NO ${tag === 'ref' ? 'proc' : 'ref'} match (curve missing/extra) ${worldSpanText(camProc, ends)}`;
    });
  for (const l of arcOnly(arcRes.refOnly, 'ref', true)) digestFindings.push({ mag: 70, line: l });
  for (const l of arcOnly(arcRes.procOnly, 'proc', false)) digestFindings.push({ mag: 70, line: l });

  if (profile) {
    const { right, up } = camProc.userData.eval;
    const ax1 = axisName(right), ax2 = axisName(up);
    const gi = { x: 0, y: 1, z: 2 };
    const dispA = (a) => relDisp([a, 0])[gi[ax1]];       // station in proc world
    const dispB = (a, b) => relDisp([a, b])[gi[ax2]];    // height in proc world
    for (const w of profile.worst.slice(0, 2)) {
      const mag = Math.max(Math.abs(w.dTop), Math.abs(w.dBot));
      if (mag < 0.03) continue;
      const which = Math.abs(w.dTop) >= Math.abs(w.dBot)
        ? `Δtop ${w.dTop >= 0 ? '+' : ''}${R3(w.dTop).toFixed(3)}m (ref ${ax2} ${R3(dispB(w.a, w.refTop)).toFixed(2)} proc ${R3(dispB(w.a, w.procTop)).toFixed(2)})`
        : `Δbot ${w.dBot >= 0 ? '+' : ''}${R3(w.dBot).toFixed(3)}m (ref ${ax2} ${R3(dispB(w.a, w.refBot)).toFixed(2)} proc ${R3(dispB(w.a, w.procBot)).toFixed(2)})`;
      digestFindings.push({ mag: (w.cliff ? 20 : 40) + mag * (w.cliff ? 20 : 100), line: `${def.name}: profile ${which} @ ${ax1} ${R3(dispA(w.a)).toFixed(2)}${w.cliff ? ' (at vertical edge — cliff offset, not height error)' : ''}` });
    }
  }
  for (const h of AP.holes.slice(0, 2)) {
    if (h.areaM2 < 0.002) continue;
    // silhouette-enclosed background: real §B2 deck holes AND legitimate
    // barrel/hull occlusion gaps both read this way — confirm with the
    // standard-check hole scan before claiming a defect
    digestFindings.push({ mag: 55, line: `${def.name}: proc enclosed-void ${R3(h.areaM2).toFixed(3)}m² @world x ${R3(h.centroidWorld[0]).toFixed(2)} y ${R3(h.centroidWorld[1]).toFixed(2)} z ${R3(h.centroidWorld[2]).toFixed(2)} (verify vs §B2 hole scan — barrel/deck gaps also read as voids)` });
  }
  const worstD = flagged.length ? `worst Δ${flagged[0].dAngleDeg >= 0 ? '+' : ''}${R1(flagged[0].dAngleDeg)}°` : 'worst Δ0.0°';
  digestSummaries.push(
    `${def.name}: edges ${segRes.matches.length} matched (${flagged.length} flagged >1.5°, ${worstD}) refOnly ${segRes.refOnly.length} procOnly ${segRes.procOnly.length} | arcs ref ${AR.arcs.length} proc ${AP.arcs.length} paired ${arcRes.pairs.length}` +
    (profile ? ` | profile p95 Δtop ${R3(profile.p95Top).toFixed(3)}m Δbot ${R3(profile.p95Bot).toFixed(3)}m` : ' | profile n/a (perspective)') +
    (parity ? ` | parity yawProxy ${R1(parity.yawProxyDeg)}°` : ''));

  // ---- structured record (w0/w1/centerWorld stay in the OWNING model's
  // world; midDisp/desc are proc-world display coords for cross-reference)
  const segRec = (s, toDisp) => ({
    angleDeg: R3(s.angleDeg), lenM: R3(s.lenM), lenPx: R1(s.lenPx),
    midWorld: s.midWorld.map(R3), w0: s.w0.map(R3), w1: s.w1.map(R3),
    midDisp: (toDisp ? relDisp(s.midRel) : s.midWorld).map(R3),
    desc: describeWorld(toDisp ? relDisp(s.midRel) : s.midWorld),
    inArc: s.inArc, arcAdjacent: s.arcAdjacent,
  });
  const arcRec = (a, toDisp) => ({
    rM: R3(a.rM), spanDeg: R1(a.spanDeg), rmsMm: R1(a.rmsMm),
    centerWorld: a.centerWorld.map(R3), endsWorld: a.endsWorld.map((p) => p.map(R3)),
    centerDisp: (toDisp ? relDisp(a.centerRel) : a.centerWorld).map(R3),
    desc: describeWorld(toDisp ? relDisp(a.centerRel) : a.centerWorld),
    facets: a.facets ? {
      polygonal: !!a.facets.polygonal,
      ...(a.facets.polygonal ? { n: a.facets.facets, stepDeg: R3(a.facets.stepDeg) } : {}),
      ampDeg: R3(a.facets.ampDeg ?? 0), ...(a.facets.note ? { note: a.facets.note } : {}),
    } : null,
  });
  report.views[def.name] = {
    kind: def.kind, worldApprox: def.kind === 'hero', reframed,
    axes: { u: axisName(camProc.userData.eval.right), v: axisName(camProc.userData.eval.up) },
    mPerPx: R3(AP.mpp * 1000) / 1000,
    edges: {
      matched: segRes.matches.map((m) => ({
        refAngleDeg: R3(m.ref.angleDeg), procAngleDeg: R3(m.proc.angleDeg),
        dAngleDeg: R3(m.dAngleDeg), flagged: Math.abs(m.dAngleDeg) > ANGLE_FLAG_DEG,
        noiseDeg: R3((() => { const lp = Math.min(m.ref.lenPx, m.proc.lenPx); return lp < 30 ? Math.max(4, 24 / lp) : 24 / lp; })()),
        lenM: R3(m.ref.lenM), midWorld: m.proc.midWorld.map(R3),
        desc: describeWorld(m.proc.midWorld), inArc: m.ref.inArc && m.proc.inArc,
        arcAdjacent: m.ref.arcAdjacent || m.proc.arcAdjacent,
      })),
      refOnly: segRes.refOnly.map((s) => segRec(s, true)), procOnly: segRes.procOnly.map((s) => segRec(s, false)),
    },
    arcs: {
      pairs: arcRes.pairs.map((p) => ({ ref: arcRec(p.ref, true), proc: arcRec(p.proc, false), dRM: R3(p.dRM), dCenterM: R3(p.dCenterM) })),
      refOnly: arcRes.refOnly.map((a) => arcRec(a, true)), procOnly: arcRes.procOnly.map((a) => arcRec(a, false)),
    },
    profile: profile ? {
      stations: profile.stations,
      meanAbsTopM: R3(profile.meanAbsTop), p95TopM: R3(profile.p95Top), maxTopM: R3(profile.maxTop),
      meanAbsBotM: R3(profile.meanAbsBot), p95BotM: R3(profile.p95Bot), maxBotM: R3(profile.maxBot),
      // aRel/values are self-registered camera-plane meters; *Disp are
      // proc-world for authoring cross-reference
      worst: profile.worst.map((w) => ({
        aRel: R3(w.a), aDisp: relDisp([w.a, 0]).map(R3), dTopM: R3(w.dTop), dBotM: R3(w.dBot),
        refTopRel: R3(w.refTop), procTopRel: R3(w.procTop), refBotRel: R3(w.refBot), procBotRel: R3(w.procBot),
        cliff: !!w.cliff,
      })),
    } : null,
    holes: { ref: AR.holes.slice(0, 6).map((h) => ({ areaM2: R3(h.areaM2), centroidWorld: h.centroidWorld.map(R3) })),
             proc: AP.holes.slice(0, 6).map((h) => ({ areaM2: R3(h.areaM2), centroidWorld: h.centroidWorld.map(R3) })) },
    islands: { ref: AR.islands.length, proc: AP.islands.length },
    // border-clip artifacts (open chains cut by the mask frame — the r12
    // law): reported separately so critics stop ordering geometry at them.
    borderClips: { ref: (AR.borderClips || []).length, proc: (AP.borderClips || []).length,
                   procWorst: (AP.borderClips || []).slice(0, 2).map((h) => ({ areaM2: R3(h.areaM2), centroidWorld: h.centroidWorld.map(R3) })) },
    parity,
  };

  // ---- annotated overlay (shaded pair + colored measurements)
  const HB = 46, FB = 20;
  const cv = document.createElement('canvas');
  cv.width = SHOT_S * 2; cv.height = SHOT_S + HB + FB;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#0b0f12'; ctx.fillRect(0, 0, cv.width, cv.height);
  const shadedRef = renderShaded(reference, procedural, camRef);
  shotCtx.putImageData(shadedRef, 0, 0);
  ctx.drawImage(shotCanvas, 0, HB);
  const shadedProc = renderShaded(procedural, reference, camProc);
  shotCtx.putImageData(shadedProc, 0, 0);
  ctx.drawImage(shotCanvas, SHOT_S, HB);
  const SC = SHOT_S / MASK_S;
  const P = (p, side) => [p[0] * SC + side * SHOT_S, p[1] * SC + HB];
  const drawLoop = (loops, side) => {
    ctx.strokeStyle = 'rgba(230,240,255,0.28)'; ctx.lineWidth = 1; ctx.setLineDash([]);
    for (const l of loops) {
      ctx.beginPath();
      l.pts.forEach((p, i) => { const q = P(p, side); if (i) ctx.lineTo(q[0], q[1]); else ctx.moveTo(q[0], q[1]); });
      if (l.closed) ctx.closePath();
      ctx.stroke();
    }
  };
  drawLoop(AR.loops, 0); drawLoop(AP.loops, 1);
  ctx.lineWidth = 2;
  for (const m of segRes.matches) {
    ctx.strokeStyle = colorFor(m.dAngleDeg); ctx.setLineDash([]);
    for (const [s, side] of [[m.ref, 0], [m.proc, 1]]) {
      const a = P(s.p0, side), b = P(s.p1, side);
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    }
    if (Math.abs(m.dAngleDeg) > ANGLE_FLAG_DEG) {
      const mid = P(m.proc.midPx, 1);
      ctx.fillStyle = colorFor(m.dAngleDeg); ctx.font = '11px monospace';
      ctx.fillText(`Δ${m.dAngleDeg >= 0 ? '+' : ''}${R1(m.dAngleDeg)}°`, mid[0] + 4, mid[1] - 4);
    }
  }
  ctx.setLineDash([5, 4]); ctx.strokeStyle = '#ff5cf0';
  for (const [list, side] of [[segRes.refOnly, 0], [segRes.procOnly, 1]]) {
    for (const s of list) {
      const a = P(s.p0, side), b = P(s.p1, side);
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    }
  }
  ctx.setLineDash([]); ctx.lineWidth = 1.6; ctx.font = '11px monospace';
  for (const [arcsList, side] of [[AR.arcs, 0], [AP.arcs, 1]]) {
    for (const a of arcsList) {
      ctx.strokeStyle = '#39d0ff';
      ctx.beginPath();
      a.ptsPx.forEach((p, i) => { const q = P(p, side); if (i) ctx.lineTo(q[0], q[1]); else ctx.moveTo(q[0], q[1]); });
      ctx.stroke();
      const c = P(a.ptsPx[Math.floor(a.ptsPx.length / 2)], side);
      ctx.fillStyle = '#39d0ff';
      const facet = a.facets && a.facets.polygonal ? ` ×${a.facets.facets}` : '';
      ctx.fillText(`r${R3(a.rM).toFixed(2)}m${facet}`, c[0] + 4, c[1] + 12);
    }
  }
  if (profile) {
    ctx.strokeStyle = '#6ea8ff'; ctx.fillStyle = '#6ea8ff'; ctx.lineWidth = 1.4;
    const worldToPx = (a, b) => [(a + AP.half) / AP.mpp - 0.5, (AP.half - b) / AP.mpp - 0.5];
    for (const w of profile.worst) {
      const big = Math.abs(w.dTop) >= Math.abs(w.dBot);
      const q = P(worldToPx(w.a, big ? w.procTop : w.procBot), 1);
      ctx.beginPath(); ctx.moveTo(q[0], q[1] - 7); ctx.lineTo(q[0], q[1] + 7); ctx.stroke();
      ctx.fillText(`Δ${big ? w.dTop >= 0 ? '+' : '' : w.dBot >= 0 ? '+' : ''}${R3(big ? w.dTop : w.dBot).toFixed(2)}m`, q[0] + 3, q[1] - 9);
    }
  }
  ctx.fillStyle = '#e7edf0'; ctx.font = '13px monospace';
  ctx.fillText(`visual-eval ${id} — ${def.name} (${def.kind})`, 10, 16);
  ctx.font = '11px monospace'; ctx.fillStyle = '#b9c4cc';
  ctx.fillText(digestSummaries[digestSummaries.length - 1].slice(def.name.length + 2), 10, 32);
  ctx.fillText('REFERENCE', 12, HB + 16); ctx.fillText('PROCEDURAL', SHOT_S + 12, HB + 16);
  ctx.fillStyle = '#8f9aa4';
  ctx.fillText('edges: green ≤0.75° · yellow ≤1.5° · orange ≤4° · red >4° · magenta dashed = unmatched · cyan = arc fit · blue tick = worst profile Δ', 10, HB + SHOT_S + 14);
  overlays[def.name] = cv.toDataURL('image/png');
}

// ------------------------------------------------------------ selftest math --
if (SELFTEST) {
  // Known truths in the LEFT view: plate long edges at 180-22=158° (ref) and
  // 180-25.5=154.5° (proc) -> expected matched Δ = -3.5°; hull edges 0°/90°
  // exact; cylinder r=0.800 m, ref 96-seg (reads smooth), proc 18-seg (must
  // read polygonal ~18). Extraction error = measured - expected.
  const v = report.views.left;
  const near = (arr, ang, tol = 6) => arr.filter((m) => Math.abs(angDiff180(ang, m.refAngleDeg)) < tol);
  const plate = near(v.edges.matched, 158).sort((a, b) => b.lenM - a.lenM)[0] || null;
  const flats = v.edges.matched.filter((m) => Math.abs(angDiff180(0, m.refAngleDeg)) < 3 && m.lenM > 0.5);
  const verts = v.edges.matched.filter((m) => Math.abs(angDiff180(90, m.refAngleDeg)) < 3 && m.lenM > 0.5);
  const errsFlat = flats.map((m) => Math.abs(angDiff180(0, m.refAngleDeg)));
  const errsVert = verts.map((m) => Math.abs(angDiff180(90, m.refAngleDeg)));
  const arcRef = (v.arcs.pairs[0] || {}).ref || v.arcs.refOnly[0] || null;
  const arcProc = (v.arcs.pairs[0] || {}).proc || v.arcs.procOnly[0] || null;
  report.selftestResult = {
    plateExpectedRefDeg: 158, plateExpectedProcDeg: 154.5, plateExpectedDeltaDeg: -3.5,
    plateMeasured: plate ? { refDeg: plate.refAngleDeg, procDeg: plate.procAngleDeg, dDeg: plate.dAngleDeg } : 'NOT MATCHED',
    axisEdgeAbsErrDeg: { flat: errsFlat.map(R3), vertical: errsVert.map(R3) },
    cylinderExpectedRM: 0.8,
    cylinderRef: arcRef ? { rM: arcRef.rM, spanDeg: arcRef.spanDeg, facets: arcRef.facets } : 'NO ARC',
    cylinderProc: arcProc ? { rM: arcProc.rM, spanDeg: arcProc.spanDeg, facets: arcProc.facets } : 'NO ARC',
  };
  const st = report.selftestResult;
  digestFindings.push({ mag: 200, line: `selftest: plate Δ measured ${plate ? R3(plate.dAngleDeg) : 'n/a'}° vs expected -3.5° | ref angle err ${plate ? R3(Math.abs(angDiff180(158, plate.refAngleDeg))) : 'n/a'}°` });
  digestFindings.push({ mag: 199, line: `selftest: axis-edge |err| flat ${JSON.stringify(st.axisEdgeAbsErrDeg.flat)} vert ${JSON.stringify(st.axisEdgeAbsErrDeg.vertical)}` });
  digestFindings.push({ mag: 198, line: `selftest: cylinder ref r ${arcRef ? R3(arcRef.rM) : '?'}m (exp 0.800, ${arcRef && arcRef.facets && arcRef.facets.polygonal ? 'POLYGONAL(!)' : 'smooth'}) proc r ${arcProc ? R3(arcProc.rM) : '?'}m facets ${arcProc && arcProc.facets && arcProc.facets.polygonal ? arcProc.facets.n : 'none'} (exp 18)` });
}

// ------------------------------------------------------------------ digest --
if (report.rigParity.verdict === 'OK') {
  const entries = Object.entries(report.rigParity.views);
  if (entries.length) {
    const worst = entries.sort((a, b) => b[1].yawProxyDeg - a[1].yawProxyDeg)[0];
    digestParity.push(`RIG PARITY: OK (${entries.length} ortho views, max dYawProxy ${R1(worst[1].yawProxyDeg)}° @${worst[0]}, max |dCentroid| ${R3(Math.max(...entries.map(([, p]) => p.dCentroidM)))}m)`);
  }
} else {
  digestParity.unshift(`RIG PARITY VERDICT: ${report.rigParity.verdict}`);
}
if (frameOffset.length() > 0.25) {
  digestParity.push(`note: proc build sits Δ(${R3(frameOffset.x)}, ${R3(frameOffset.y)}, ${R3(frameOffset.z)})m from ref in world frame — comparison is self-registered (per-model rig); world coords in findings are PROC-frame`);
}
report.digest = [
  ...digestParity,
  ...digestFindings.sort((a, b) => b.mag - a.mag).map((f) => f.line).slice(0, 160),
  ...digestSummaries,
];

window.__EVAL_RESULT = report;
window.__EVAL_OVERLAYS = overlays;
window.__EVAL_READY = true;
say(`done: ${Object.keys(report.views).length} views, ${report.digest.length} digest lines`);
// Optional in-app inspection surface.  The capture driver still reads the
// module-owned buffers above; ?show=1 makes the same annotated boards and
// digest visible without crossing isolated/main-world browser boundaries.
if (params.get('show') === '1') {
  document.documentElement.style.background = '#0b0f12';
  document.body.style.margin = '12px';
  document.body.style.overflow = 'auto';
  const pre = document.createElement('pre');
  pre.textContent = report.digest.join('\n');
  pre.style.whiteSpace = 'pre-wrap';
  pre.style.maxWidth = '1280px';
  document.body.appendChild(pre);
  for (const [name, url] of Object.entries(overlays)) {
    const h = document.createElement('h2'); h.textContent = name;
    const img = document.createElement('img'); img.src = url; img.alt = name;
    img.style.display = 'block'; img.style.width = '1280px';
    img.style.maxWidth = '100%'; img.style.marginBottom = '20px';
    document.body.append(h, img);
  }
}
</script>
<script>
window.addEventListener('error', (e) => { window.__EVAL_ERROR = String(e.error || e.message); });
window.addEventListener('unhandledrejection', (e) => { window.__EVAL_ERROR = String(e.reason); });
</script>
