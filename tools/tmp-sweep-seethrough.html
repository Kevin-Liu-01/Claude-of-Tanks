<!doctype html>
<!-- TEMP (FLEET SEE-THROUGH SWEEP, owner §5.33 2026-08-07: "all specific
     issues like see-through-sides ... fix all of them"): the committed
     tmp-merkava-roofgap.html enclosed-background scanner GENERALIZED to the
     whole tank, per-id. Renders game-truth FrontSide materials:
       - full-tank views (side/quarter/garage/tilt55) x turret yaw 0/45/90
       - turret-only passes (side + front-quarter) x yaw — the revolution/
         merkava see-through-turret class (hull backdrop removed)
       - yaw-0 under/low bow+stern views — the AFV under-glacis class
       - top view — the §B2 filled-deck check
     Each scan runs the §B2 enclosed-background flood (mask method
     |px-0x151b20| maxch<=13 + blue-signature B-R>=8) reporting enclosed
     clusters with world-mapped coords, PLUS a foreground-island scan
     (non-bg components disconnected from the main body — the floating-
     furniture class). Diagnosis + evidence crops only, never verdict
     evidence. READ-ONLY sweep; no src/ edits. -->
<meta charset="utf-8">
<title>tmp-sweep-seethrough</title>
<style>body{background:#151b20;margin:0;color:#e7edf0;font:12px monospace}</style>
<div id="out">building…</div>
<script type="module">
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.js';

const params = new URLSearchParams(location.search);
const id = params.get('id') || 'merkava1b';
const SIZE = 900;
const YAWS = (params.get('yaws') || '0,45,90').split(',').map(Number);
const SHOT_ENCLOSED_MIN = Number(params.get('shotmin') || 40); // px: store evidence png at/above
const ISLAND_MIN = Number(params.get('islandmin') || 8);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(SIZE, SIZE);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer };
const procedural = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
scene.add(procedural.root);
const hemi = new THREE.HemisphereLight(0xcfd8e0, 0x2a2f26, 1.05);
const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(30, 42, 24);
scene.add(hemi, sun);

procedural.root.updateMatrixWorld(true);
procedural.root.traverse((o) => {
  if (!o.isLOD) return;
  o.autoUpdate = false;
  o.levels.forEach((level, i) => { if (level.object) level.object.visible = i === 0; });
});

const turret = procedural.root.getObjectByName('rig_turret');
const gun = procedural.root.getObjectByName('rig_gun');
const hull = procedural.root.getObjectByName('rig_hull');

function effVisible(o) {
  for (let p = o; p; p = p.parent) if (!p.visible) return false;
  return true;
}
function subtreeBox(node, skipNode) {
  const box = new THREE.Box3();
  if (!node) return box;
  node.updateMatrixWorld(true);
  node.traverse((o) => {
    if (skipNode) { for (let p = o; p; p = p.parent) if (p === skipNode) return; }
    if (!(o.isMesh || o.isInstancedMesh) || !o.geometry) return;
    if (!effVisible(o) || /shadow/i.test(o.name || '')) return;
    if (o.isInstancedMesh) {
      if (o.count === 0) return;
      o.computeBoundingBox();
      if (o.boundingBox && !o.boundingBox.isEmpty()) box.union(o.boundingBox.clone().applyMatrix4(o.matrixWorld));
      return;
    }
    if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
    box.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld));
  });
  return box;
}

// gear envelope (track/wheel daylight adjudication aid): instanced meshes +
// track/wheel-named materials under the hull — the tmp-afv-glacisgap heuristic.
function gearBox() {
  const box = new THREE.Box3();
  (hull || procedural.root).traverse((o) => {
    if (!(o.isMesh || o.isInstancedMesh) || !o.geometry) return;
    if (!effVisible(o) || /shadow/i.test(o.name || '')) return;
    const gear = !!(o.isInstancedMesh || o.userData.trackBucket ||
      /track|wheel/i.test(o.material?.name || '') || /track|wheel/i.test(o.name || ''));
    if (!gear) return;
    if (o.isInstancedMesh) {
      if (o.count === 0) return;
      o.computeBoundingBox();
      if (o.boundingBox && !o.boundingBox.isEmpty()) box.union(o.boundingBox.clone().applyMatrix4(o.matrixWorld));
      return;
    }
    if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
    box.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld));
  });
  return box;
}

const wholeBox = subtreeBox(procedural.root);
const hullBox = hull ? subtreeBox(hull) : wholeBox.clone();
const turretBox = turret ? subtreeBox(turret, gun) : null;
const gunBox = gun ? subtreeBox(gun) : null;
const gearB = gearBox();
const fullFrame = wholeBox.clone().expandByVector(new THREE.Vector3(0.30, 0.30, 0.30));
const castFrame = turretBox ? turretBox.clone().expandByVector(new THREE.Vector3(0.35, 0.30, 0.35)) : null;

function orthoFor(box, direction) {
  const center = box.getCenter(new THREE.Vector3());
  const dir = direction.clone().normalize();
  const nominalUp = Math.abs(dir.y) > 0.9 ? new THREE.Vector3(0, 0, -1) : new THREE.Vector3(0, 1, 0);
  const right = new THREE.Vector3().crossVectors(nominalUp, dir).normalize();
  const up = new THREE.Vector3().crossVectors(dir, right).normalize();
  let ext = 0.3;
  for (const cx of [box.min.x, box.max.x]) for (const cy of [box.min.y, box.max.y]) for (const cz of [box.min.z, box.max.z]) {
    const d = new THREE.Vector3(cx, cy, cz).sub(center);
    ext = Math.max(ext, Math.abs(d.dot(right)), Math.abs(d.dot(up)));
  }
  const half = ext * 1.05;
  const camera = new THREE.OrthographicCamera(-half, half, half, -half, 0.1, 200);
  camera.position.copy(center).addScaledVector(dir, 40);
  camera.up.copy(up);
  camera.lookAt(center);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
  return { camera, center, right, up, half };
}

// full-tank views swept per yaw (garage angles first — the owner's read)
const YAWED_VIEWS = [
  ['side-l', new THREE.Vector3(-1, 0.06, 0)],
  ['side-r', new THREE.Vector3(1, 0.06, 0)],
  ['fql', new THREE.Vector3(-1, 0.18, 1)],
  ['fqr', new THREE.Vector3(1, 0.18, 1)],
  ['rql', new THREE.Vector3(-1, 0.18, -1)],
  ['rqr', new THREE.Vector3(1, 0.18, -1)],
  ['garage', new THREE.Vector3(1, 0.35, 1)],
  ['tilt55', new THREE.Vector3(0.55, 1.0, 0.55)],
];
// turret-only passes per yaw (see-through-turret class)
const TURRET_VIEWS = [
  ['side-l', new THREE.Vector3(-1, 0.06, 0)],
  ['side-r', new THREE.Vector3(1, 0.06, 0)],
  ['fql', new THREE.Vector3(-1, 0.18, 1)],
  ['fqr', new THREE.Vector3(1, 0.18, 1)],
];
// yaw-0-only low/under/top views (AFV under-glacis class + §B2 deck check)
const STATIC_VIEWS = [
  ['front-low', new THREE.Vector3(0, -0.08, 1)],
  ['rear-low', new THREE.Vector3(0, -0.08, -1)],
  ['under-fl', new THREE.Vector3(-0.7, -0.38, 1)],
  ['under-fr', new THREE.Vector3(0.7, -0.38, 1)],
  ['top', new THREE.Vector3(0.02, 1, 0.02)],
];

function grab(camera) {
  renderer.setRenderTarget(null);
  renderer.setClearColor(0x151b20, 1);
  renderer.clear(true, true, true);
  renderer.render(scene, camera);
}

const ctx2d = document.createElement('canvas');
ctx2d.width = SIZE; ctx2d.height = SIZE;
const c2 = ctx2d.getContext('2d', { willReadFrequently: true });

// §B2 enclosed-background flood + foreground-island scan on current canvas
function scanCanvas(view) {
  c2.drawImage(renderer.domElement, 0, 0);
  const img = c2.getImageData(0, 0, SIZE, SIZE).data;
  const N = SIZE * SIZE;
  const isBg = new Uint8Array(N);
  for (let i = 0; i < N; i++) {
    const r = img[i * 4], g = img[i * 4 + 1], b = img[i * 4 + 2];
    if (Math.abs(r - 0x15) <= 13 && Math.abs(g - 0x1b) <= 13 && Math.abs(b - 0x20) <= 13 && (b - r) >= 8) isBg[i] = 1;
  }
  // flood open bg from borders
  const open = new Uint8Array(N);
  const stack = [];
  for (let x = 0; x < SIZE; x++) { if (isBg[x]) stack.push(x); if (isBg[(SIZE - 1) * SIZE + x]) stack.push((SIZE - 1) * SIZE + x); }
  for (let y = 0; y < SIZE; y++) { if (isBg[y * SIZE]) stack.push(y * SIZE); if (isBg[y * SIZE + SIZE - 1]) stack.push(y * SIZE + SIZE - 1); }
  while (stack.length) {
    const i = stack.pop();
    if (open[i] || !isBg[i]) continue;
    open[i] = 1;
    const x = i % SIZE, y = (i / SIZE) | 0;
    if (x > 0) stack.push(i - 1);
    if (x < SIZE - 1) stack.push(i + 1);
    if (y > 0) stack.push(i - SIZE);
    if (y < SIZE - 1) stack.push(i + SIZE);
  }
  const mapPt = (cx, cy) => {
    const wx = (cx / SIZE * 2 - 1) * view.half;
    const wy = (1 - cy / SIZE * 2) * view.half;
    const wpt = view.center.clone().addScaledVector(view.right, wx).addScaledVector(view.up, wy);
    return [+wpt.x.toFixed(3), +wpt.y.toFixed(3), +wpt.z.toFixed(3)];
  };
  // enclosed bg clusters
  const seen = new Uint8Array(N);
  const clusters = [];
  for (let i = 0; i < N; i++) {
    if (!isBg[i] || open[i] || seen[i]) continue;
    let px = 0, minX = SIZE, maxX = 0, minY = SIZE, maxY = 0;
    const st = [i];
    seen[i] = 1;
    while (st.length) {
      const j = st.pop();
      px++;
      const x = j % SIZE, y = (j / SIZE) | 0;
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
      for (const k of [j - 1, j + 1, j - SIZE, j + SIZE]) {
        if (k < 0 || k >= N || seen[k] || !isBg[k] || open[k]) continue;
        const kx = k % SIZE;
        if (Math.abs(kx - x) > 1) continue;
        seen[k] = 1; st.push(k);
      }
    }
    if (px >= 4) clusters.push({ px, minX, maxX, minY, maxY });
  }
  clusters.sort((a, b) => b.px - a.px);
  const mapped = clusters.slice(0, 12).map((cl) => ({
    px: cl.px,
    rect: [cl.minX, cl.minY, cl.maxX, cl.maxY],
    world: mapPt((cl.minX + cl.maxX) / 2, (cl.minY + cl.maxY) / 2),
    sizeM: [+((cl.maxX - cl.minX + 1) / SIZE * 2 * view.half).toFixed(3), +((cl.maxY - cl.minY + 1) / SIZE * 2 * view.half).toFixed(3)],
  }));
  let total = 0;
  for (const cl of clusters) total += cl.px;
  // foreground islands (floating-furniture class): non-bg components
  // disconnected from the largest component
  const comp = new Int32Array(N).fill(-1);
  const comps = [];
  for (let i = 0; i < N; i++) {
    if (isBg[i] || comp[i] >= 0) continue;
    const ci = comps.length;
    let px = 0, minX = SIZE, maxX = 0, minY = SIZE, maxY = 0;
    const st = [i];
    comp[i] = ci;
    while (st.length) {
      const j = st.pop();
      px++;
      const x = j % SIZE, y = (j / SIZE) | 0;
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
      for (const k of [j - 1, j + 1, j - SIZE, j + SIZE]) {
        if (k < 0 || k >= N || isBg[k] || comp[k] >= 0) continue;
        const kx = k % SIZE;
        if (Math.abs(kx - (j % SIZE)) > 1) continue;
        comp[k] = ci; st.push(k);
      }
    }
    comps.push({ px, minX, maxX, minY, maxY });
  }
  comps.sort((a, b) => b.px - a.px);
  const islands = comps.slice(1).filter((c) => c.px >= ISLAND_MIN).slice(0, 10).map((c) => ({
    px: c.px,
    rect: [c.minX, c.minY, c.maxX, c.maxY],
    world: mapPt((c.minX + c.maxX) / 2, (c.minY + c.maxY) / 2),
    sizeM: [+((c.maxX - c.minX + 1) / SIZE * 2 * view.half).toFixed(3), +((c.maxY - c.minY + 1) / SIZE * 2 * view.half).toFixed(3)],
  }));
  return { enclosedPx: total, clusters: mapped, islands };
}

// turret-only visibility mask (merkava-roofgap mechanism)
const hidden = [];
function turretOnly(on) {
  if (on) {
    procedural.root.traverse((o) => {
      if (!(o.isMesh || o.isInstancedMesh)) return;
      let under = false;
      for (let p = o; p; p = p.parent) if (p === turret) { under = true; break; }
      if (!under && o.visible && effVisible(o)) { o.visible = false; hidden.push(o); }
    });
  } else {
    for (const o of hidden) o.visible = true;
    hidden.length = 0;
  }
}

const b3 = (b) => b && !b.isEmpty() ? { min: b.min.toArray().map((v) => +v.toFixed(3)), max: b.max.toArray().map((v) => +v.toFixed(3)) } : null;
const shots = {};
const report = {
  id,
  boxes: { whole: b3(wholeBox), hull: b3(hullBox), turret: b3(turretBox), gun: b3(gunBox), gear: b3(gearB) },
  hasTurret: !!turret,
  views: {},
};

function shoot(key, view, wantShotAlways) {
  const scan = scanCanvas(view);
  report.views[key] = scan;
  const flagged = scan.enclosedPx >= SHOT_ENCLOSED_MIN || scan.islands.length > 0;
  if (wantShotAlways || flagged) shots[key] = renderer.domElement.toDataURL('image/png');
  return scan;
}

const yawList = turret ? YAWS : [0];
for (const yaw of yawList) {
  if (turret) {
    turret.rotation.y = yaw * Math.PI / 180;
    procedural.root.updateMatrixWorld(true);
  }
  for (const [vn, dir] of YAWED_VIEWS) {
    const view = orthoFor(fullFrame, dir);
    grab(view.camera);
    shoot(`y${yaw}-${vn}`, view, false);
  }
  if (turret && castFrame) {
    turretOnly(true);
    for (const [vn, dir] of TURRET_VIEWS) {
      const view = orthoFor(castFrame, dir);
      grab(view.camera);
      shoot(`y${yaw}-${vn}-T`, view, false);
    }
    turretOnly(false);
  }
}
if (turret) { turret.rotation.y = 0; procedural.root.updateMatrixWorld(true); }
for (const [vn, dir] of STATIC_VIEWS) {
  const view = orthoFor(fullFrame, dir);
  grab(view.camera);
  shoot(`y0-${vn}`, view, false);
}

window.__SWEEP_SHOTS = shots;
window.__SWEEP_REPORT = report;
window.__SWEEP_READY = true;
document.getElementById('out').textContent = `see-through sweep ready (${id})`;
</script>
