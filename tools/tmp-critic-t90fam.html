<!doctype html>
<meta charset="utf-8">
<title>tmp critic t90fam</title>
<style>:root{color-scheme:dark;background:#0b0f12;color:#e7edf0;font:13px monospace}</style>
<div id="out">booting…</div>
<script type="module">
// TEMP (t90-family trio independent critic §5.38/§B8): 14-view REF|PROC
// sheets vs the LOCAL-ONLY prints (t90_kojf / t90ms_kojf semantic bakes,
// t-90a_burlak armored_warfare drop — same override rows as
// tools/tmp-tank-critic.html, the ratified critic render path), plus §B5
// yaw90 proc panels, garage-angle proc panels (tmp-abramsx-garage.html
// pose: offset 7.4/2.75/8.0, fov 42), and ?garageonly=1 proc panels for
// the §5.13/§H.4 family-kinship read on the landed kin.
// READ-ONLY on src/. Deleted after the round. (korea-critic clone)
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.js';
import { MODEL_SOURCE } from '/src/vehicles/specs.js';

const SIZE = 640;
const params = new URLSearchParams(location.search);
const id = params.get('id') || 't90';
const garageOnly = params.get('garageonly') === '1';

// Oracle rows — verbatim from tools/tmp-tank-critic.html (ratified critic
// path) for the three print-registered trio ids.
const CRITIC_REFERENCE_OVERRIDES = {
  t90ms: { source:'glb', glb:{ path:'/models/community-candidates/t90ms_kojf.glb', turretNode:'^vehicle#t-90ms_turret_t-90ms_6$', gunNode:'^vehicle#t-90ms_cannon_2a46m-5_8$', autoPivot:true, turretFollowers:'^vehicle#(?:t-90ms_(?:aps|cage01|era\\d\\d|detachparts|ejectionport|smokecaps)_turret|t-90ms_cannonbase_t-90ms|cannonbase_skinned_5|antenna01_24)' } },
  t90: { source:'glb', glb:{ path:'/models/community-candidates/t90_kojf.glb', turretNode:'^vehicle#t-90_turret_t-90_18$', gunNode:'^vehicle#t-90_cannon_2a46m2_20$', autoPivot:true, turretFollowers:'^vehicle#(?:t-90_(?:aps|era\\d\\d|hatch01|smokecaps)_turret|t-90_cannonbase|cannonbase_t-90|antenna01_(?:17|21))' } },
  t90a_burlak: { source:'glb', glb:{ path:'/models/community-candidates/t-90a_burlak_armored_warfare.glb', turretNode:'^Object_2$', gunNode:'^Object_15$', autoPivot:true, turretFollowers:'^Object_(?:3|4|7|11|16|17|18|20|23)$' } },
};
if (!garageOnly && MODEL_SOURCE[id]?.source !== 'glb' && CRITIC_REFERENCE_OVERRIDES[id]) {
  MODEL_SOURCE[id] = CRITIC_REFERENCE_OVERRIDES[id];
}
const hasRef = !garageOnly && MODEL_SOURCE[id]?.source === 'glb';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
renderer.setSize(SIZE, SIZE, false);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x151b20, 1);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer };

const reference = hasRef ? createTank(id, engineCtx, { camoSeed: 4242, quality: 'high' }) : null;
const procedural = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
if (reference) scene.add(reference.root);
scene.add(procedural.root);

const hemi = new THREE.HemisphereLight(0xcfd8e0, 0x2a2f26, 1.05);
const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(30, 42, 24);
scene.add(hemi, sun);

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const swapped = (visual) => {
  let yes = false;
  visual.root.traverse((o) => { if (o.userData?.__glbSwapped) yes = true; });
  return yes;
};
if (reference) {
  for (let i = 0; i < 600 && !swapped(reference); i++) await sleep(50);
  if (!swapped(reference)) throw new Error(`${id} reference GLB did not load`);
  await sleep(400);
  reference.root.updateMatrixWorld(true);
}
procedural.root.updateMatrixWorld(true);
for (const root of [reference?.root, procedural.root]) {
  if (!root) continue;
  root.traverse((o) => {
    if (!o.isLOD) return;
    o.autoUpdate = false;
    o.levels.forEach((level, i) => { if (level.object) level.object.visible = i === 0; });
  });
}

const VIEWS = {
  front: new THREE.Vector3(0, 0.08, 1),
  frontleft: new THREE.Vector3(-1, 0.08, 1),
  left: new THREE.Vector3(-1, 0.05, 0),
  rearleft: new THREE.Vector3(-1, 0.08, -1),
  rear: new THREE.Vector3(0, 0.08, -1),
  rearright: new THREE.Vector3(1, 0.08, -1),
  right: new THREE.Vector3(1, 0.05, 0),
  frontright: new THREE.Vector3(1, 0.08, 1),
  top: new THREE.Vector3(0, 1, 0.02),
};

function visibleBox(root) {
  const box = new THREE.Box3();
  root.updateMatrixWorld(true);
  root.traverse((o) => {
    if (!(o.isMesh || o.isInstancedMesh || o.isSkinnedMesh) || !o.geometry) return;
    let vis = true;
    for (let p = o; p; p = p.parent) if (!p.visible) { vis = false; break; }
    if (!vis || /shadow/i.test(o.name || '')) return;
    if (o.isInstancedMesh) {
      if (o.count === 0) return;
      o.computeBoundingBox();
      if (o.boundingBox && !o.boundingBox.isEmpty()) {
        box.union(o.boundingBox.clone().applyMatrix4(o.matrixWorld));
      }
      return;
    }
    if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
    box.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld));
  });
  return box;
}

function orthoFor(box, direction, frac = 0.55, centerOff = null) {
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  if (centerOff) {
    center.x += centerOff.x * size.x; center.y += centerOff.y * size.y; center.z += centerOff.z * size.z;
  }
  const dir = direction.clone().normalize();
  const nominalUp = Math.abs(dir.y) > 0.9 ? new THREE.Vector3(0, 0, -1) : new THREE.Vector3(0, 1, 0);
  const right = new THREE.Vector3().crossVectors(nominalUp, dir).normalize();
  const up = new THREE.Vector3().crossVectors(dir, right).normalize();
  let ext = 0.5;
  for (const cx of [box.min.x, box.max.x]) for (const cy of [box.min.y, box.max.y]) for (const cz of [box.min.z, box.max.z]) {
    const d = new THREE.Vector3(cx, cy, cz).sub(center);
    ext = Math.max(ext, Math.abs(d.dot(right)), Math.abs(d.dot(up)));
  }
  const half = ext * (frac / 0.5) * 1.06;
  const camera = new THREE.OrthographicCamera(-half, half, half, -half, 0.1, 200);
  camera.position.copy(center).addScaledVector(dir, 60);
  camera.up.copy(up);
  camera.lookAt(center);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
  return camera;
}

function heroFor(box, direction) {
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const dist = Math.max(size.x, size.y, size.z) * 1.55;
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 300);
  camera.position.copy(center).addScaledVector(direction.clone().normalize(), dist);
  camera.position.y += size.y * 0.28;
  camera.lookAt(center);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
  return camera;
}

const copy2d = document.createElement('canvas');
copy2d.width = copy2d.height = SIZE;
const copyCtx = copy2d.getContext('2d', { willReadFrequently: true });
function renderModel(visual, other, camera) {
  visual.root.visible = true;
  if (other) other.root.visible = false;
  renderer.setRenderTarget(null);
  renderer.setClearColor(0x151b20, 1);
  renderer.clear(true, true, true);
  renderer.render(scene, camera);
  copyCtx.drawImage(renderer.domElement, 0, 0, SIZE, SIZE);
  return copyCtx.getImageData(0, 0, SIZE, SIZE);
}

const pairCanvas = document.createElement('canvas');
pairCanvas.width = SIZE * 2; pairCanvas.height = SIZE;
const pairCtx = pairCanvas.getContext('2d', { willReadFrequently: true });
function pairURL(refImg, procImg) {
  copyCtx.putImageData(refImg, 0, 0); pairCtx.drawImage(copy2d, 0, 0);
  copyCtx.putImageData(procImg, 0, 0); pairCtx.drawImage(copy2d, SIZE, 0);
  pairCtx.fillStyle = '#e7edf0'; pairCtx.font = '18px monospace';
  pairCtx.fillText('REFERENCE', 12, 24);
  pairCtx.fillText('PROCEDURAL', SIZE + 12, 24);
  return pairCanvas.toDataURL('image/png');
}
const soloCanvas = document.createElement('canvas');
soloCanvas.width = SIZE; soloCanvas.height = SIZE;
const soloCtx = soloCanvas.getContext('2d', { willReadFrequently: true });
function soloURL(img, label) {
  soloCtx.putImageData(img, 0, 0);
  soloCtx.fillStyle = '#e7edf0'; soloCtx.font = '18px monospace';
  soloCtx.fillText(label, 12, 24);
  return soloCanvas.toDataURL('image/png');
}

if (reference) reference.root.visible = true;
procedural.root.visible = true;
const refBox = reference ? visibleBox(reference.root) : null;
const procBox = visibleBox(procedural.root);
const badBox = (b) => !isFinite(b.min.x) || !isFinite(b.max.x) || b.getSize(new THREE.Vector3()).length() < 0.5;
if ((refBox && badBox(refBox)) || badBox(procBox)) throw new Error('degenerate bounding box — model failed to build');

const pairs = {};
function take(name, camRef, camProc) {
  if (reference) {
    const r = renderModel(reference, procedural, camRef);
    const p = renderModel(procedural, reference, camProc);
    pairs[name] = pairURL(r, p);
  } else {
    const p = renderModel(procedural, null, camProc);
    pairs[name] = soloURL(p, `PROC ${id}`);
  }
}
if (!garageOnly) {
  for (const [name, dir] of Object.entries(VIEWS)) {
    take(`view-${name}`, refBox && orthoFor(refBox, dir), orthoFor(procBox, dir));
  }
  for (const [name, dir] of [
    ['hero-frontleft', new THREE.Vector3(-1, 0.35, 1)],
    ['hero-rearright', new THREE.Vector3(1, 0.35, -1)],
    ['hero-toptilt', new THREE.Vector3(0.55, 1.35, -0.75)],
  ]) {
    take(name, refBox && heroFor(refBox, dir), heroFor(procBox, dir));
  }
  for (const [name, dir, off, hs] of [
    ['close-front', new THREE.Vector3(-1, 0.22, 1), { x: 0, y: 0.12, z: 0.28 }, 0.26],
    ['close-roof', new THREE.Vector3(1, 0.55, 0.35), { x: 0, y: 0.3, z: 0.05 }, 0.24],
    // diagnostics (not part of the 14 scored families):
    ['close-turret-side', new THREE.Vector3(-1, 0.05, 0), { x: 0, y: 0.30, z: 0.12 }, 0.30],
    ['close-gunfront', new THREE.Vector3(0, 0.08, 1), { x: 0, y: 0.18, z: 0 }, 0.26],
    ['close-sternlow', new THREE.Vector3(1, 0.10, -1), { x: 0, y: -0.18, z: -0.32 }, 0.30],
    ['close-bowlow', new THREE.Vector3(-1, 0.10, 1), { x: 0, y: -0.18, z: 0.32 }, 0.30],
  ]) {
    take(name, refBox && orthoFor(refBox, dir, hs, off), orthoFor(procBox, dir, hs, off));
  }

  // §B5 yaw-90 evidence: PROC-only panels (does the turret carry its kit).
  const turretG = procedural.root.getObjectByName('rig_turret');
  if (turretG) {
    turretG.rotation.y = Math.PI / 2;
    procedural.root.updateMatrixWorld(true);
    const p1 = renderModel(procedural, reference, orthoFor(procBox, VIEWS.top));
    pairs['proc-yaw90-plan'] = soloURL(p1, 'PROC yaw90');
    const p2 = renderModel(procedural, reference, heroFor(procBox, new THREE.Vector3(-1, 0.35, 1)));
    pairs['proc-yaw90-hero'] = soloURL(p2, 'PROC yaw90');
    const p3 = renderModel(procedural, reference, heroFor(procBox, new THREE.Vector3(1, 0.35, -1)));
    pairs['proc-yaw90-hero-rr'] = soloURL(p3, 'PROC yaw90');
    turretG.rotation.y = 0;
    procedural.root.updateMatrixWorld(true);
    if (reference) reference.root.visible = true;
    procedural.root.visible = true;
  }
}

// garage-angle evidence: PROC-only, the owner's elevated 3/4 read
// (tmp-abramsx-garage.html pose: offset (7.4, 2.75, 8.0) from pedestal
// center, fov 42, two higher tilts).
{
  const center = procBox.getCenter(new THREE.Vector3());
  function garageCam(sx, sz, lift = 1) {
    const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 300);
    camera.position.set(center.x + sx * 7.4, center.y + 2.75 * lift - 0.6, center.z + sz * 8.0);
    camera.lookAt(center.x, center.y + 0.2, center.z);
    camera.updateProjectionMatrix();
    camera.updateMatrixWorld(true);
    return camera;
  }
  for (const [name, sx, sz, lift] of [
    ['garage-frontright', 1, 1, 1], ['garage-frontleft', -1, 1, 1],
    ['garage-rearright', 1, -1, 1], ['garage-rearleft', -1, -1, 1],
    ['garage-high-fr', 1, 1, 2.2], ['garage-high-rl', -1, -1, 2.2],
  ]) {
    const p = renderModel(procedural, reference, garageCam(sx, sz, lift));
    pairs[name] = soloURL(p, `GARAGE ${id}`);
  }
  if (reference) reference.root.visible = true;
  procedural.root.visible = true;
}

// sanity: refuse to publish sheets whose procedural half is empty
{
  const probe = renderModel(procedural, reference, orthoFor(procBox, VIEWS.left));
  let lit = 0;
  for (let i = 0; i < probe.data.length; i += 4) {
    if (Math.abs(probe.data[i] - 0x15) > 12 || Math.abs(probe.data[i + 1] - 0x1b) > 12) lit++;
  }
  if (lit < 2000) throw new Error(`procedural half near-empty (${lit} lit px) — refusing to write sheets`);
}

window.__CRITIC_PAIRS = pairs;
window.__CRITIC_READY = true;
document.getElementById('out').textContent = `sheets ready: ${Object.keys(pairs).length} (${hasRef ? 'pairs' : 'proc-only'})`;
</script>
