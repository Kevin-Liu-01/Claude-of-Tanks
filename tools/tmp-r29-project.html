<!doctype html>
<meta charset="utf-8">
<title>tmp r29 projection probe</title>
<style>:root{color-scheme:dark;background:#0b0f12;color:#e7edf0;font:13px monospace}</style>
<div id="out">booting…</div>
<script type="module">
// TEMP (russia r29): project world points into the critic-pair image frames
// (tmp-tank-critic.html camera replica, PROC half offset +640). Diagnosis
// only — verdict evidence stays on the official pairs. Deleted after round.
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.js';
import { MODEL_SOURCE } from '/src/vehicles/specs.js';

const SIZE = 640;
const params = new URLSearchParams(location.search);
const id = params.get('id') || 't72b3m';
// points: "x,y,z;x,y,z;..."
const pts = (params.get('pts') || '0,0,0').split(';').map((s) => s.split(',').map(Number));

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(SIZE, SIZE, false);
const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer };
const scene = new THREE.Scene();
const reference = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high' });
const procedural = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
scene.add(reference.root, procedural.root);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const swapped = (visual) => {
  let yes = false;
  visual.root.traverse((o) => { if (o.userData?.__glbSwapped) yes = true; });
  return yes;
};
for (let i = 0; i < 600 && !swapped(reference); i++) await sleep(50);
await sleep(400);
reference.root.updateMatrixWorld(true);
procedural.root.updateMatrixWorld(true);
for (const root of [reference.root, procedural.root]) {
  root.traverse((o) => {
    if (!o.isLOD) return;
    o.autoUpdate = false;
    o.levels.forEach((level, i) => { if (level.object) level.object.visible = i === 0; });
  });
}

function visibleBox(root) {
  const box = new THREE.Box3();
  root.updateMatrixWorld(true);
  root.traverse((o) => {
    if (!(o.isMesh || o.isInstancedMesh || o.isSkinnedMesh) || !o.geometry) return;
    let vis = true;
    for (let p = o; p; p = p.parent) if (!p.visible) { vis = false; break; }
    if (!vis || /shadow/i.test(o.name || '')) return;
    if (o.isInstancedMesh) {
      if (o.count === 0) return;
      o.computeBoundingBox();
      if (o.boundingBox && !o.boundingBox.isEmpty()) box.union(o.boundingBox.clone().applyMatrix4(o.matrixWorld));
      return;
    }
    if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
    box.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld));
  });
  return box;
}
function orthoFor(box, direction, frac = 0.55, centerOff = null) {
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  if (centerOff) { center.x += centerOff.x * size.x; center.y += centerOff.y * size.y; center.z += centerOff.z * size.z; }
  const dir = direction.clone().normalize();
  const nominalUp = Math.abs(dir.y) > 0.9 ? new THREE.Vector3(0, 0, -1) : new THREE.Vector3(0, 1, 0);
  const right = new THREE.Vector3().crossVectors(nominalUp, dir).normalize();
  const up = new THREE.Vector3().crossVectors(dir, right).normalize();
  let ext = 0.5;
  for (const cx of [box.min.x, box.max.x]) for (const cy of [box.min.y, box.max.y]) for (const cz of [box.min.z, box.max.z]) {
    const d = new THREE.Vector3(cx, cy, cz).sub(center);
    ext = Math.max(ext, Math.abs(d.dot(right)), Math.abs(d.dot(up)));
  }
  const half = ext * (frac / 0.5) * 1.06;
  const camera = new THREE.OrthographicCamera(-half, half, half, -half, 0.1, 200);
  camera.position.copy(center).addScaledVector(dir, 60);
  camera.up.copy(up);
  camera.lookAt(center);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
  return camera;
}
function heroFor(box, direction) {
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const dist = Math.max(size.x, size.y, size.z) * 1.55;
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 300);
  camera.position.copy(center).addScaledVector(direction.clone().normalize(), dist);
  camera.position.y += size.y * 0.28;
  camera.lookAt(center);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
  return camera;
}
reference.root.visible = true;
procedural.root.visible = true;
const refBox = visibleBox(reference.root);
const procBox = visibleBox(procedural.root);
const VIEWS = {
  front: new THREE.Vector3(0, 0.08, 1),
  frontleft: new THREE.Vector3(-1, 0.08, 1),
  left: new THREE.Vector3(-1, 0.05, 0),
  rearleft: new THREE.Vector3(-1, 0.08, -1),
  rear: new THREE.Vector3(0, 0.08, -1),
  rearright: new THREE.Vector3(1, 0.08, -1),
  right: new THREE.Vector3(1, 0.05, 0),
  frontright: new THREE.Vector3(1, 0.08, 1),
  top: new THREE.Vector3(0, 1, 0.02),
};
const cams = {};
for (const [name, dir] of Object.entries(VIEWS)) {
  cams[`view-${name}`] = { ref: orthoFor(refBox, dir), proc: orthoFor(procBox, dir) };
}
for (const [name, dir] of [
  ['hero-frontleft', new THREE.Vector3(-1, 0.35, 1)],
  ['hero-rearright', new THREE.Vector3(1, 0.35, -1)],
  ['hero-toptilt', new THREE.Vector3(0.55, 1.35, -0.75)],
]) {
  cams[name] = { ref: heroFor(refBox, dir), proc: heroFor(procBox, dir) };
}
for (const [name, dir, off, hs] of [
  ['close-front', new THREE.Vector3(-1, 0.22, 1), { x: 0, y: 0.12, z: 0.28 }, 0.26],
  ['close-roof', new THREE.Vector3(1, 0.55, 0.35), { x: 0, y: 0.3, z: 0.05 }, 0.24],
]) {
  cams[name] = { ref: orthoFor(refBox, dir, hs, off), proc: orthoFor(procBox, dir, hs, off) };
}
const out = {};
for (const [vname, pair] of Object.entries(cams)) {
  out[vname] = pts.map(([x, y, z]) => {
    const row = { w: [x, y, z] };
    for (const half of ['ref', 'proc']) {
      const v = new THREE.Vector3(x, y, z).project(pair[half]);
      const px = (v.x * 0.5 + 0.5) * SIZE + (half === 'proc' ? SIZE : 0);
      const py = (0.5 - v.y * 0.5) * SIZE;
      row[half] = [+px.toFixed(1), +py.toFixed(1)];
    }
    return row;
  });
}
window.__PROJ = out;

// pick mode: ?pick=<view>&px=x,y;x,y;... — raycast pair-image pixels into a
// model half (proc default, &half=ref) and report hit mesh path + world point.
const pickView = params.get('pick');
if (pickView) {
  const half = params.get('half') || 'proc';
  const model = half === 'proc' ? procedural : reference;
  const otherM = half === 'proc' ? reference : procedural;
  model.root.visible = true; otherM.root.visible = false;
  model.root.updateMatrixWorld(true);
  const cam = cams[pickView][half];
  const ray = new THREE.Raycaster();
  const picks = (params.get('px') || '').split(';').filter(Boolean).map((s) => s.split(',').map(Number));
  const res = [];
  for (const [px, py] of picks) {
    const lx = half === 'proc' ? px - SIZE : px;
    const ndc = new THREE.Vector2((lx / SIZE) * 2 - 1, -((py / SIZE) * 2 - 1));
    ray.setFromCamera(ndc, cam);
    const hits = ray.intersectObject(model.root, true).filter((h) => {
      let vis = true;
      for (let p = h.object; p; p = p.parent) if (!p.visible) { vis = false; break; }
      return vis;
    });
    if (!hits.length) { res.push({ px: [px, py], miss: true }); continue; }
    const h = hits[0];
    const path = [];
    for (let o = h.object; o && o !== model.root; o = o.parent) path.unshift(o.name || o.type);
    res.push({ px: [px, py], w: [+h.point.x.toFixed(3), +h.point.y.toFixed(3), +h.point.z.toFixed(3)],
      d: +h.distance.toFixed(2), mesh: path.join('/'), mat: h.object.material?.name || '' });
  }
  window.__PICKS = res;
}
window.__PROJ_READY = true;
document.getElementById('out').textContent = 'projections ready';
</script>
