<!doctype html>
<!-- TEMP r5 probe: does the post-merge midShade swap land on the turretTrack
     mesh? Builds one tank, reports every turretG/gunG mesh material.
     Deleted after round. -->
<script type="module">
import { createTank } from '/src/vehicles/tankFactory.js';
const id = new URLSearchParams(location.search).get('id') || 'm1a1';
const engineCtx = { anisotropy: 4 };
const v = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
const out = [];
const scan = (g, tag) => {
  g.traverse((ob) => {
    if (!ob.isMesh && !ob.isInstancedMesh) return;
    const m = ob.material;
    if (!m || !m.color) return;
    out.push({
      tag, type: ob.type,
      color: m.color.getHexString(),
      key: m.customProgramCacheKey ? String(m.customProgramCacheKey.call ? m.customProgramCacheKey() : m.customProgramCacheKey) : 'none',
      rough: m.roughness,
    });
  });
};
const turretG = v.root.getObjectByName('rig_turret');
const hullG = v.root.getObjectByName('rig_hull');
scan(turretG, 'turret');
scan(hullG, 'hull');
window.__SWAP_OUT = out;
window.__SWAP_READY = true;
</script>
