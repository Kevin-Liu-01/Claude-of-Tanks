<!doctype html>
<!-- TEMP (isu122s r8): report the MATERIAL identity/color of meshes whose
     world bbox intersects a query box. ?id=isu122s&x0=..&tanks compare
     mesh.material against the build's own mats entries. Deleted after round. -->
<meta charset="utf-8">
<title>tmp-isu122s-r8mat</title>
<script type="module">
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.js';

const q = new URLSearchParams(location.search);
const id = q.get('id') || 'isu122s';
const B = {
  x0: +(q.get('x0') ?? -10), x1: +(q.get('x1') ?? 10),
  y0: +(q.get('y0') ?? -10), y1: +(q.get('y1') ?? 10),
  z0: +(q.get('z0') ?? -10), z1: +(q.get('z1') ?? 10),
};
const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer: null };
const tank = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
tank.root.updateMatrixWorld(true);
const mats = tank.mats || {};
const matName = (m) => {
  for (const [k, v] of Object.entries(mats)) if (v === m) return k;
  return '(unregistered)';
};
const out = [];
const qb = new THREE.Box3(new THREE.Vector3(B.x0, B.y0, B.z0), new THREE.Vector3(B.x1, B.y1, B.z1));
tank.root.traverse((o) => {
  if (!(o.isMesh || o.isInstancedMesh) || !o.geometry) return;
  const bb = new THREE.Box3().setFromObject(o);
  if (!bb.intersectsBox(qb)) return;
  const m = o.material;
  out.push({
    path: (() => { const p = []; for (let x = o; x; x = x.parent) p.unshift(x.name || x.type); return p.join('/'); })(),
    mat: matName(m),
    color: m && m.color ? m.color.getHexString() : null,
    vc: m ? !!m.vertexColors : null,
    hasColorAttr: !!o.geometry.attributes.color,
    min: bb.min.toArray().map((v) => +v.toFixed(2)),
    max: bb.max.toArray().map((v) => +v.toFixed(2)),
  });
});
out.push({ path: 'MATS.glass', color: mats.glass?.color?.getHexString?.(), vc: mats.glass?.vertexColors });
out.push({ path: 'MATS.canvasCloth', color: mats.canvasCloth?.color?.getHexString?.(), vc: mats.canvasCloth?.vertexColors });
window.__WHATSAT = out;
window.__HASH_READY = true;
</script>
