<html><head><meta charset="UTF-8" /></head>
<body>
<template>
<style>

</div>
<script>
const tl = gsap.timeline({ paused: true });
tl.fromTo('#fl0', {opacity:0.9}, {opacity:0, duration:0.3, ease:'power2.in'}, 2.5);
tl.fromTo('#fl1', {opacity:0.9}, {opacity:0, duration:0.267, ease:'power2.in'}, 10);
