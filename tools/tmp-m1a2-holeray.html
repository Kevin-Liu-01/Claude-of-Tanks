<!doctype html>
<meta charset="utf-8">
<title>tmp m1a2 holeray</title>
<style>:root{color-scheme:dark;background:#0b0f12;color:#e7edf0;font:13px monospace}</style>
<div id="out">booting…</div>
<script type="module">
// TEMP (m1a2 r3): critic-camera hole instrument. Renders the PROCEDURAL
// build with the EXACT tmp-tank-critic.html camera/light/background rig for
// one view, then:
//  - census: internal-background pixel census (TOL-10 discriminator, flood
//    fill from borders, connected components) — same math as
//    tools/tmp-m1a2-holecensus.py, so numbers are pair-comparable.
//  - rays: for the largest components (or an explicit ?px=..&py=.. list),
//    casts the camera ray and reports raycast hits + mesh-AABB corridor
//    (the tmp-holefind.html recipe) so the open corridor is NAMED.
// ?id=m1a2&view=rear|front|left|...|top|hero-frontleft|hero-rearright|
//   hero-toptilt|close-front|close-roof
// Deleted after the round.
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.js';

const SIZE = 640;
const params = new URLSearchParams(location.search);
const id = params.get('id') || 'm1a2';
const viewName = params.get('view') || 'rear';
const explicitPx = params.get('px'), explicitPy = params.get('py');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
renderer.setSize(SIZE, SIZE, false);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x151b20, 1);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer };
const procedural = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
scene.add(procedural.root);

const hemi = new THREE.HemisphereLight(0xcfd8e0, 0x2a2f26, 1.05);
const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(30, 42, 24);
scene.add(hemi, sun);

procedural.root.updateMatrixWorld(true);
procedural.root.traverse((o) => {
  if (!o.isLOD) return;
  o.autoUpdate = false;
  o.levels.forEach((level, i) => { if (level.object) level.object.visible = i === 0; });
});

const VIEWS = {
  front: new THREE.Vector3(0, 0.08, 1),
  frontleft: new THREE.Vector3(-1, 0.08, 1),
  left: new THREE.Vector3(-1, 0.05, 0),
  rearleft: new THREE.Vector3(-1, 0.08, -1),
  rear: new THREE.Vector3(0, 0.08, -1),
  rearright: new THREE.Vector3(1, 0.08, -1),
  right: new THREE.Vector3(1, 0.05, 0),
  frontright: new THREE.Vector3(1, 0.08, 1),
  top: new THREE.Vector3(0, 1, 0.02),
};

function visibleBox(root) {
  const box = new THREE.Box3();
  root.updateMatrixWorld(true);
  root.traverse((o) => {
    if (!(o.isMesh || o.isInstancedMesh || o.isSkinnedMesh) || !o.geometry) return;
    let vis = true;
    for (let p = o; p; p = p.parent) if (!p.visible) { vis = false; break; }
    if (!vis || /shadow/i.test(o.name || '')) return;
    if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
    const b = o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld);
    box.union(b);
  });
  return box;
}

function orthoFor(box, direction, frac = 0.55, centerOff = null) {
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  if (centerOff) {
    center.x += centerOff.x * size.x; center.y += centerOff.y * size.y; center.z += centerOff.z * size.z;
  }
  const dir = direction.clone().normalize();
  const nominalUp = Math.abs(dir.y) > 0.9 ? new THREE.Vector3(0, 0, -1) : new THREE.Vector3(0, 1, 0);
  const right = new THREE.Vector3().crossVectors(nominalUp, dir).normalize();
  const up = new THREE.Vector3().crossVectors(dir, right).normalize();
  let ext = 0.5;
  for (const cx of [box.min.x, box.max.x]) for (const cy of [box.min.y, box.max.y]) for (const cz of [box.min.z, box.max.z]) {
    const d = new THREE.Vector3(cx, cy, cz).sub(center);
    ext = Math.max(ext, Math.abs(d.dot(right)), Math.abs(d.dot(up)));
  }
  const half = ext * (frac / 0.5) * 1.06;
  const camera = new THREE.OrthographicCamera(-half, half, half, -half, 0.1, 200);
  camera.position.copy(center).addScaledVector(dir, 60);
  camera.up.copy(up);
  camera.lookAt(center);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
  return camera;
}

function heroFor(box, direction) {
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const dist = Math.max(size.x, size.y, size.z) * 1.55;
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 300);
  camera.position.copy(center).addScaledVector(direction.clone().normalize(), dist);
  camera.position.y += size.y * 0.28;
  camera.lookAt(center);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
  return camera;
}

const procBox = visibleBox(procedural.root);
let camera;
if (VIEWS[viewName]) camera = orthoFor(procBox, VIEWS[viewName]);
else if (viewName === 'hero-frontleft') camera = heroFor(procBox, new THREE.Vector3(-1, 0.35, 1));
else if (viewName === 'hero-rearright') camera = heroFor(procBox, new THREE.Vector3(1, 0.35, -1));
else if (viewName === 'hero-toptilt') camera = heroFor(procBox, new THREE.Vector3(0.55, 1.35, -0.75));
else if (viewName === 'close-front') camera = orthoFor(procBox, new THREE.Vector3(-1, 0.22, 1), 0.26, { x: 0, y: 0.12, z: 0.28 });
else if (viewName === 'close-roof') camera = orthoFor(procBox, new THREE.Vector3(1, 0.55, 0.35), 0.24, { x: 0, y: 0.3, z: 0.05 });
else throw new Error('unknown view ' + viewName);

renderer.setRenderTarget(null);
renderer.clear(true, true, true);
renderer.render(scene, camera);

const cnv = document.createElement('canvas');
cnv.width = cnv.height = SIZE;
const ctx = cnv.getContext('2d', { willReadFrequently: true });
ctx.drawImage(renderer.domElement, 0, 0, SIZE, SIZE);
const img = ctx.getImageData(0, 0, SIZE, SIZE);

// ---- census (TOL-10 critic-class discriminator) ----
const TOL = 10;
const W = SIZE, H = SIZE;
const isbg = new Uint8Array(W * H);
for (let i = 0, p = 0; i < W * H; i++, p += 4) {
  if (Math.abs(img.data[p] - 0x15) <= TOL && Math.abs(img.data[p + 1] - 0x1b) <= TOL && Math.abs(img.data[p + 2] - 0x20) <= TOL) isbg[i] = 1;
}
const ext_ = new Uint8Array(W * H);
const stack = [];
const push = (i) => { if (isbg[i] && !ext_[i]) { ext_[i] = 1; stack.push(i); } };
for (let x = 0; x < W; x++) { push(x); push((H - 1) * W + x); }
for (let y = 0; y < H; y++) { push(y * W); push(y * W + W - 1); }
while (stack.length) {
  const i = stack.pop();
  const y = (i / W) | 0, x = i % W;
  if (y > 0) push(i - W);
  if (y < H - 1) push(i + W);
  if (x > 0) push(i - 1);
  if (x < W - 1) push(i + 1);
}
const seen = new Uint8Array(W * H);
const comps = [];
let total = 0;
for (let i0 = 0; i0 < W * H; i0++) {
  if (!isbg[i0] || ext_[i0] || seen[i0]) continue;
  let n = 0, minx = 1e9, miny = 1e9, maxx = -1, maxy = -1;
  const rows = new Map(); // y -> [minx, maxx, count] member stats per row
  stack.push(i0); seen[i0] = 1;
  while (stack.length) {
    const i = stack.pop();
    const y = (i / W) | 0, x = i % W;
    n++;
    if (x < minx) minx = x; if (x > maxx) maxx = x;
    if (y < miny) miny = y; if (y > maxy) maxy = y;
    const r = rows.get(y) || [1e9, -1, 0];
    if (x < r[0]) r[0] = x; if (x > r[1]) r[1] = x;
    r[2]++;
    rows.set(y, r);
    for (const j of [y > 0 ? i - W : -1, y < H - 1 ? i + W : -1, x > 0 ? i - 1 : -1, x < W - 1 ? i + 1 : -1]) {
      if (j >= 0 && isbg[j] && !ext_[j] && !seen[j]) { seen[j] = 1; stack.push(j); }
    }
  }
  // pick a guaranteed-member probe pixel: middle bg pixel of the densest row
  let bestY = miny, bestC = -1;
  for (const [y, r] of rows) if (r[2] > bestC) { bestC = r[2]; bestY = y; }
  const r = rows.get(bestY);
  let px = -1;
  {
    let want = r[2] >> 1, c = 0;
    for (let x = r[0]; x <= r[1]; x++) {
      const i = bestY * W + x;
      if (isbg[i] && !ext_[i]) { if (c === want) { px = x; break; } c++; }
    }
  }
  total += n;
  comps.push({ n, minx, miny, maxx, maxy, probe: [px, bestY] });
}
comps.sort((a, b) => b.n - a.n);

// ---- rays through hole centers (or the explicit pixel) ----
function castPx(px, py) {
  const ndc = new THREE.Vector2(((px + 0.5) / SIZE) * 2 - 1, -(((py + 0.5) / SIZE) * 2 - 1));
  const ray = new THREE.Raycaster();
  ray.setFromCamera(ndc, camera);
  // raycaster ignores .visible — filter to actually-rendered meshes
  const hits = ray.intersectObject(procedural.root, true).filter((h) => {
    for (let p = h.object; p; p = p.parent) if (!p.visible) return false;
    return h.object.material?.colorWrite !== false;
  }).slice(0, 6)
    .map((h) => ({ d: +h.distance.toFixed(2), mat: h.object.material?.color ? '#' + h.object.material.color.getHexString() : '',
      at: [h.point.x, h.point.y, h.point.z].map((v) => +v.toFixed(3)) }));
  const segs = [];
  procedural.root.traverse((o) => {
    if (!(o.isMesh || o.isInstancedMesh) || !o.geometry) return;
    let vis = true;
    for (let p = o; p; p = p.parent) if (!p.visible) { vis = false; break; }
    if (!vis) return;
    if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
    const b = o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld);
    const t = ray.ray.intersectBox(b, new THREE.Vector3());
    if (!t) return;
    segs.push({ enter: +t.distanceTo(ray.ray.origin).toFixed(2),
      box: [b.min, b.max].map((v) => [v.x, v.y, v.z].map((n) => +n.toFixed(2))) });
  });
  segs.sort((a, b) => a.enter - b.enter);
  return { px, py, hits, corridor: segs.slice(0, 10) };
}
const rays = [];
if (explicitPx != null && explicitPy != null) {
  rays.push(castPx(+explicitPx, +explicitPy));
} else {
  for (const c of comps.slice(0, 8)) {
    if (c.n < 30 || c.probe[0] < 0) continue;
    rays.push(castPx(c.probe[0], c.probe[1]));
  }
}

window.__HOLERAY = {
  id, view: viewName,
  camera: { pos: camera.position.toArray().map((v) => +v.toFixed(3)), isOrtho: !!camera.isOrthographicCamera },
  census: { total, comps: comps.slice(0, 14).filter((c) => c.n >= 12) },
  rays,
};
window.__HOLERAY_READY = true;
document.getElementById('out').textContent = JSON.stringify(window.__HOLERAY.census);
</script>
