<!doctype html>
<meta charset="utf-8">
<title>tmp isu152 r6 raycast</title>
<style>:root{color-scheme:dark;background:#0b0f12;color:#e7edf0;font:13px monospace}</style>
<div id="out">booting…</div>
<script type="module">
// TEMP (isu152 r6): raycast the PROC frontleft pane pixels to identify the
// checker owners. Camera math cloned from tmp-isu152-critic.html verbatim.
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.js';

const SIZE = 640;
const id = 'isu152';
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(SIZE, SIZE, false);
const scene = new THREE.Scene();
const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer };
// two-tank parity with the critic page (reference + GLB swap first)
const reference = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high' });
const procedural = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
scene.add(reference.root, procedural.root);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const swapped = (visual) => {
  let yes = false;
  visual.root.traverse((o) => { if (o.userData?.__glbSwapped) yes = true; });
  return yes;
};
for (let i = 0; i < 600 && !swapped(reference); i++) await sleep(50);
reference.root.visible = false;
procedural.root.updateMatrixWorld(true);
for (const root of [reference.root, procedural.root]) {
  root.traverse((o) => {
    if (!o.isLOD) return;
    o.autoUpdate = false;
    o.levels.forEach((level, i) => { if (level.object) level.object.visible = i === 0; });
  });
}
function visibleBox(root) {
  const box = new THREE.Box3();
  root.updateMatrixWorld(true);
  root.traverse((o) => {
    if (!(o.isMesh || o.isSkinnedMesh) || o.isInstancedMesh || !o.geometry) return;
    let vis = true;
    for (let p = o; p; p = p.parent) if (!p.visible) { vis = false; break; }
    if (!vis || /shadow/i.test(o.name || '')) return;
    if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
    const b = o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld);
    box.union(b);
  });
  return box;
}
function orthoFor(box, direction, frac = 0.55, centerOff = null) {
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  if (centerOff) {
    center.x += centerOff.x * size.x; center.y += centerOff.y * size.y; center.z += centerOff.z * size.z;
  }
  const dir = direction.clone().normalize();
  const nominalUp = Math.abs(dir.y) > 0.9 ? new THREE.Vector3(0, 0, -1) : new THREE.Vector3(0, 1, 0);
  const right = new THREE.Vector3().crossVectors(nominalUp, dir).normalize();
  const up = new THREE.Vector3().crossVectors(dir, right).normalize();
  let ext = 0.5;
  for (const cx of [box.min.x, box.max.x]) for (const cy of [box.min.y, box.max.y]) for (const cz of [box.min.z, box.max.z]) {
    const d = new THREE.Vector3(cx, cy, cz).sub(center);
    ext = Math.max(ext, Math.abs(d.dot(right)), Math.abs(d.dot(up)));
  }
  const half = ext * (frac / 0.5) * 1.06;
  const camera = new THREE.OrthographicCamera(-half, half, half, -half, 0.1, 200);
  camera.position.copy(center).addScaledVector(dir, 60);
  camera.up.copy(up);
  camera.lookAt(center);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
  return camera;
}
const box = visibleBox(procedural.root);
const params = new URLSearchParams(location.search);
const view = params.get('view') || 'frontleft';
const DIRS = {
  frontleft: new THREE.Vector3(-1, 0.08, 1),
  frontright: new THREE.Vector3(1, 0.08, 1),
};
const camera = orthoFor(box, DIRS[view]);
const pixels = (params.get('px') || '368,385;370,380;366,390;372,392;400,378;405,382;410,388;350,395;340,393;433,390')
  .split(';').map((s) => s.split(',').map(Number));
// render this page's own view with the board light rig and report the pixel
// colors at the sample points (camera-parity check vs the critic pane).
// FULL critic-sequence parity: ref pane rendered first, visibility toggles.
const hemi = new THREE.HemisphereLight(0xcfd8e0, 0x2a2f26, 1.05);
const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(30, 42, 24);
scene.add(hemi, sun);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x151b20, 1);
reference.root.visible = true;
procedural.root.visible = false;
renderer.clear(true, true, true);
renderer.render(scene, camera);
procedural.root.visible = true;
reference.root.visible = false;
renderer.clear(true, true, true);
renderer.render(scene, camera);
const glPix = new Uint8Array(4);
const gl = renderer.getContext();
const ray = new THREE.Raycaster();
const rows = [];
for (const [px, py] of pixels) {
  const ndc = new THREE.Vector2((px + 0.5) / SIZE * 2 - 1, 1 - (py + 0.5) / SIZE * 2);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObject(procedural.root, true).slice(0, 5);
  gl.readPixels(px, SIZE - 1 - py, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, glPix);
  rows.push({
    px, py, rgb: [glPix[0], glPix[1], glPix[2]],
    hits: hits.map((h) => ({
      d: +h.distance.toFixed(3),
      p: [+h.point.x.toFixed(3), +h.point.y.toFixed(3), +h.point.z.toFixed(3)],
      inst: h.instanceId ?? null,
      mat: h.object.material?.color ? h.object.material.color.getHexString() : '?',
      map: !!h.object.material?.map,
      name: h.object.name || h.object.type,
    })),
  });
}
window.__RAYS = rows;
window.__SHOT = renderer.domElement.toDataURL('image/png');
window.__HASH_READY = true;
document.getElementById('out').textContent = 'rays ready';
</script>
