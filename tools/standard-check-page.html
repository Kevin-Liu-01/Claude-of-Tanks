<!-- tank-standard-check v2 page (BUILD-STANDARD §B2/§B3 machine census).
     Two modes, driven by tools/tank-standard-check.mjs:

     ?id=<specId>   DECORATION CENSUS + CONTIGUITY SCAN on the PROCEDURAL
                    build (proceduralOnly, camoSeed 4242 — the tmp-hashgeo
                    bootstrap, so GLB swaps and the cosmetic decorations.ts
                    layer never pollute the measurement):
                    - census: counts KIT.fittings marker roots
                      (userData.fittingRoot / userData.fitting) — mg = pintleMG
                      or openYokeRws instances with actual rendered stock; dressing
                      = every other fitting instance. Hand-authored decoration
                      carries no markers and censuses ZERO by design.
                    - contiguity: top-down orthographic render of body skin
                      and ordinary fittings on a magenta key, downsampled to ~6 cm
                      cells on the HULL-ANCHORED lattice (tools/contig-grid.mjs:
                      cell edges at fixed multiples of 6 cm in the vehicle frame,
                      re-binned at every sub-cell phase, so an add-on that moves
                      the AABB cannot hide or reveal a gap); uncovered cells NOT
                      connected to the frame border are raw enclosed sky cells,
                      and a hole at another phase sharing no pixel with a primary
                      hole is a phase-only hole. Approved source openings are
                      classified separately; unexpected holes must be zero. FrontSide
                      materials mean reversed-winding slabs read as holes —
                      the winding audit is built in. Explicitly separated
                      open-lattice equipment is excluded from this scan only:
                      its exterior stand-off air is present in source models.
                    -> window.__STANDARD + __STANDARD_READY
                    Audit-only switches (tools/contig-phase-audit.mjs; the gate
                    never passes them): legacy=1 adds the pre-227 AABB-framed
                    scan as legacyHoles; neighbors=1 names the meshes walling
                    each gap; addonX=<m> / addonZ=<m> seed the 226 defect class
                    (a 1 cm add-on that moves the AABB by that much).

     ?fixture=fittings  KIT.fittings library self-test (no tank, no profile
                    edits): builds every fitting + variants standalone and
                    asserts (a) marker coverage on every mesh, (b) the stamped
                    userData.aabb matches the meshes, (c) seed determinism
                    (same opts => identical geometry hash), (d) top-down
                    FrontSide coverage > 0 (winding), (e) mats is required.
                    -> window.__FIXTURE + __FIXTURE_READY -->
<meta charset="utf-8">
<title>tank-standard-check</title>
<script type="module">
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.ts';
import { ensureInteriorFills, hasInteriorFills } from '/src/vehicles/interiorFills.ts';
import { FITTINGS } from '/src/vehicles/profiles/kit.ts';
import { isOpenLatticeMesh } from './standard-continuity-policy.mjs';
import { censusEquipment } from './source-equipment-policy.mjs';
import { anchoredContigFrame, legacyContigFrame, contigScan, LEGACY_CONTIG_FRAMING } from './contig-grid.mjs';

const params = new URLSearchParams(location.search);

const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer };

function pinLODs(root) {
  root.traverse((o) => {
    if (!o.isLOD) return;
    o.autoUpdate = false;
    o.levels.forEach((l, i) => { if (l.object) l.object.visible = i === 0; });
  });
}

const effectivelyVisible = (o, top) => {
  for (let p = o; p && p !== top.parent; p = p.parent) if (!p.visible) return false;
  return true;
};
const isColorWriting = (o) => {
  const m = Array.isArray(o.material) ? o.material[0] : o.material;
  return !m || m.colorWrite !== false;
};

// AABB over everything that actually writes color (instance-aware — shadow
// proxies are colorWrite:false and excluded from scan AND framing).
// §B3.1 MUZZLE-BORE MECHANISM corollary (banked 3fca39b): /shadow/i-NAMED
// render furniture (muzzle bore rims/discs) renders in game/critic but is
// excluded from every measurement mask AND framing recipe — the same
// isShadowHelper contract as tools/procedural-fidelity.html. Without this
// filter the furniture grew the gun AABB and re-framed the ~6 cm contig
// grid (leo2a2 fender-gap cells flipped to phantom holes, sweep 2026-08-06).
function renderedAABB(root) {
  root.updateMatrixWorld(true);
  const bb = new THREE.Box3();
  const local = new THREE.Box3();
  const m = new THREE.Matrix4();
  root.traverse((o) => {
    if (!(o.isMesh || o.isInstancedMesh) || !o.geometry) return;
    if (!effectivelyVisible(o, root) || !isColorWriting(o)) return;
    if (isOpenLatticeMesh(o)) return;
    if (/shadow/i.test(o.name || '')) return;
    if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
    if (!o.geometry.boundingBox) return;
    if (o.isInstancedMesh) {
      for (let i = 0; i < o.count; i++) {
        o.getMatrixAt(i, m);
        const el = m.elements;
        if (Math.abs(el[0]) + Math.abs(el[5]) + Math.abs(el[10]) < 1e-5) continue; // collapsed
        local.copy(o.geometry.boundingBox);
        local.applyMatrix4(m).applyMatrix4(o.matrixWorld);
        bb.union(local);
      }
    } else {
      local.copy(o.geometry.boundingBox).applyMatrix4(o.matrixWorld);
      bb.union(local);
    }
  });
  return bb;
}

const isScanExcluded = (o) => !isColorWriting(o) || /shadow/i.test(o.name || '') || isOpenLatticeMesh(o);

// Top-down coverage raster + enclosed-void (hole) scan on the hull-anchored ~6 cm lattice (tools/contig-grid.mjs).
// One render: the pixel lattice is anchored too, so every sub-cell phase is a re-binning of the same pixels.
function topDownScan(root, framing) {
  const bb = renderedAABB(root);
  if (bb.isEmpty()) return { error: 'empty AABB' };
  const hidden = [];
  root.traverse((o) => {
    if ((o.isMesh || o.isInstancedMesh) && isScanExcluded(o) && o.visible) { o.visible = false; hidden.push(o); }
  });
  const origin = new THREE.Vector3().setFromMatrixPosition(root.matrixWorld);
  const plan = { minX: bb.min.x, maxX: bb.max.x, minZ: bb.min.z, maxZ: bb.max.z };
  const frame = framing === LEGACY_CONTIG_FRAMING ? legacyContigFrame(plan)
    : anchoredContigFrame(plan, { originX: origin.x, originZ: origin.z });
  const { x0, x1, z0, z1, pw, ph } = frame;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xff00ff);
  const parent = root.parent;
  scene.add(root);
  const cam = new THREE.OrthographicCamera(
    -(x1 - x0) / 2, (x1 - x0) / 2, (z1 - z0) / 2, -(z1 - z0) / 2, 0.1, bb.max.y - bb.min.y + 20);
  cam.position.set((x0 + x1) / 2, bb.max.y + 5, (z0 + z1) / 2);
  cam.up.set(0, 0, -1);
  cam.lookAt((x0 + x1) / 2, 0, (z0 + z1) / 2);
  cam.updateMatrixWorld(true);

  const target = new THREE.WebGLRenderTarget(pw, ph, { depthBuffer: true, stencilBuffer: false });
  renderer.setSize(pw, ph, false);
  renderer.setRenderTarget(target);
  renderer.render(scene, cam);
  const buf = new Uint8Array(pw * ph * 4);
  renderer.readRenderTargetPixels(target, 0, 0, pw, ph, buf);
  renderer.setRenderTarget(null);
  target.dispose();
  scene.remove(root);
  if (parent) parent.add(root);
  for (const o of hidden) o.visible = true;

  // covered = not the magenta key (unlit black meshes still separate cleanly). readRenderTargetPixels row 0 is the
  // screen BOTTOM = world +z (camera up = world -z): the contig-grid row convention, rows counting DOWN from z1.
  const hit = new Uint8Array(pw * ph);
  for (let i = 0, k = 0; i < pw * ph; i++, k += 4) {
    hit[i] = Math.abs(buf[k] - 255) + buf[k + 1] + Math.abs(buf[k + 2] - 255) > 60 ? 1 : 0;
  }
  return contigScan(hit, frame);
}

// Audit only: the meshes walling each gap, from vertical rays just outside its plan extent.
function gapNeighbors(root, gaps) {
  root.updateMatrixWorld(true);
  const bb = renderedAABB(root);
  const ray = new THREE.Raycaster();
  const down = new THREE.Vector3(0, -1, 0);
  const named = (o) => { for (let p = o; p && p !== root; p = p.parent) if (p.name) return p.name; return '(unnamed)'; };
  return gaps.map((gap) => {
    const probes = [['-x', gap.x - gap.w / 2 - 0.04, gap.z], ['+x', gap.x + gap.w / 2 + 0.04, gap.z],
      ['-z', gap.x, gap.z - gap.d / 2 - 0.04], ['+z', gap.x, gap.z + gap.d / 2 + 0.04]];
    const walls = probes.map(([side, x, z]) => {
      ray.set(new THREE.Vector3(x, bb.max.y + 1, z), down);
      const hit = ray.intersectObject(root, true).find((h) => (h.object.isMesh || h.object.isInstancedMesh)
        && effectivelyVisible(h.object, root) && !isScanExcluded(h.object));
      return hit ? { side, mesh: named(hit.object), y: +hit.point.y.toFixed(3) } : { side, mesh: null };
    });
    return { ...gap, walls };
  });
}

// Audit only: a 1 cm colour-writing cube just beyond the AABB on one axis (the 226 class: a longer gun, a proud
// spare-link run). It closes nothing; it only moves the frame.
function addProbeAddon(root, axis, offset) {
  const bb = renderedAABB(root);
  const cube = new THREE.Mesh(new THREE.BoxGeometry(0.01, 0.01, 0.01), new THREE.MeshBasicMaterial({ color: 0x808080 }));
  cube.name = 'contigProbeAddon';
  const c = bb.getCenter(new THREE.Vector3());
  cube.position.copy(root.worldToLocal(new THREE.Vector3(
    axis === 'x' ? bb.max.x + offset - 0.005 : c.x, bb.max.y - 0.005, axis === 'z' ? bb.max.z + offset - 0.005 : c.z)));
  root.add(cube);
  root.updateMatrixWorld(true);
}

// --------------------------------------------------------------------------
// mode: per-tank standard scan
// --------------------------------------------------------------------------
async function runTank(id) {
  const quality = params.get('quality') ?? 'high';
  if (!['high', 'low'].includes(quality)) throw new Error('Expected high or low scan quality');
  await ensureInteriorFills([id]);
  const t0 = performance.now();
  const tank = createTank(id, engineCtx, { camoSeed: 4242, quality, proceduralOnly: true });
  tank.root.updateMatrixWorld(true);
  pinLODs(tank.root);
  const census = censusEquipment(tank.root);
  for (const axis of ['x', 'z']) {
    const offset = Number(params.get(`addon${axis.toUpperCase()}`));
    if (params.has(`addon${axis.toUpperCase()}`) && Number.isFinite(offset) && offset > 0) addProbeAddon(tank.root, axis, offset);
  }
  const holes = topDownScan(tank.root);
  const audit = {};
  if (params.get('legacy') === '1') audit.legacyHoles = topDownScan(tank.root, LEGACY_CONTIG_FRAMING);
  if (params.get('neighbors') === '1' && !holes.error) audit.gapWalls = gapNeighbors(tank.root, holes.gaps);
  window.__STANDARD = { id, census, holes, ...audit, interiorFillRecordLoaded: hasInteriorFills(id), ms: Math.round(performance.now() - t0), quality };
  window.__STANDARD_READY = true;
}

// --------------------------------------------------------------------------
// mode: fittings library self-test (validation without touching any profile)
// --------------------------------------------------------------------------
function fixtureMats() {
  return {
    hull: new THREE.MeshStandardMaterial({ color: 0x6b6f52, vertexColors: true }),
    barrel: new THREE.MeshStandardMaterial({ color: 0x656a4e, vertexColors: true }),
    detail: new THREE.MeshStandardMaterial({ color: 0x8a8f78 }),
    dark: new THREE.MeshStandardMaterial({ color: 0x24282c }),
    canvasCloth: new THREE.MeshStandardMaterial({ color: 0x55583e }),
    wood: new THREE.MeshStandardMaterial({ color: 0x6e5637 }),
    spareTrack: new THREE.MeshStandardMaterial({ color: 0x3a3d40 }),
    glass: new THREE.MeshStandardMaterial({ color: 0x30414f }),
    rubber: new THREE.MeshStandardMaterial({ color: 0x2e2d2a }),
  };
}

function geoHash(group) {
  group.updateMatrixWorld(true);
  const fnv = (h, b) => { h ^= b; return (h * 0x01000193) >>> 0; };
  const hashBytes = (bytes, h) => { for (let i = 0; i < bytes.length; i++) h = fnv(h, bytes[i]); return h >>> 0; };
  const digests = [];
  group.traverse((o) => {
    if (!o.isMesh || !o.geometry) return;
    let h = hashBytes(new Uint8Array(new Float32Array(o.geometry.getAttribute('position').array).buffer), 0x811c9dc5);
    h = hashBytes(new Uint8Array(new Float32Array(o.matrixWorld.elements).buffer), h);
    digests.push(h);
  });
  digests.sort((a, b) => a - b);
  let total = 0x811c9dc5;
  for (const d of digests) for (const sh of [0, 8, 16, 24]) total = fnv(total, (d >> sh) & 0xff);
  return total.toString(16);
}

function fixtureScan(group, framing) {
  const holder = new THREE.Group();
  holder.add(group);
  return topDownScan(holder, framing);
}

function runContinuityFixtures(results, failures) {
  for (const [name, missingPanel, markedLattice, expectHoles] of [
    ['external-open-lattice', false, true, false],
    ['missing-body-panel-with-lattice', true, true, true],
    ['ordinary-untagged-rails', false, false, true],
  ]) {
    const group = new THREE.Group();
    const material = new THREE.MeshBasicMaterial({ color: 0x808080 });
    const add = (width, length, x, z, lattice = false) => {
      const object = new THREE.Mesh(new THREE.BoxGeometry(width, 0.12, length), material);
      object.position.set(x, lattice ? 0.6 : 0.2, z);
      object.userData.combatHitboxRole = lattice ? 'equipment' : 'armor';
      if (lattice && markedLattice) object.userData.continuityRole = 'open-lattice';
      group.add(object);
    };
    if (missingPanel) {
      for (const x of [-0.7, 0.7]) add(0.6, 2, x, 0);
      for (const z of [-0.7, 0.7]) add(0.8, 0.6, 0, z);
    } else add(2, 2, 0, 0);
    for (const x of [-1.5, 1.5]) add(0.04, 3.04, x, 0, true);
    for (const z of [-1.5, 1.5]) add(3.04, 0.04, 0, z, true);
    const scan = fixtureScan(group);
    const label = `continuity:${name}`;
    if ((scan.holeCells > 0) !== expectHoles) failures.push(`${label}: unexpected hole count ${scan.holeCells}`);
    if (group.children.some((object) => !object.visible)) failures.push(`${label}: scan changed rendered visibility`);
    results.push({ label, meshes: group.children.length, hash: geoHash(group), ...scan });
    for (const object of group.children) object.geometry.dispose();
    material.dispose();
  }
  runPhaseFixtures(results, failures);
}

// The 226 defect class on the GPU path: a 6.5 cm slot the primary phase misses (z 0.032..0.097 against lattice
// samples at k*6 + 1/3/5 cm) must still fail as a phase-only hole, and an add-on that only moves the AABB must not
// change any of it.
function runPhaseFixtures(results, failures) {
  const material = new THREE.MeshBasicMaterial({ color: 0x808080 });
  const slotted = (addonZ) => {
    const group = new THREE.Group();
    const box = (xa, xb, za, zb) => {
      const object = new THREE.Mesh(new THREE.BoxGeometry(xb - xa, 0.12, zb - za), material);
      object.position.set((xa + xb) / 2, 0.2, (za + zb) / 2);
      object.userData.combatHitboxRole = 'armor';
      group.add(object);
    };
    box(-1, 1, 0.097, 1); box(-1, 1, -1, 0.032); box(-1, -0.6, 0.032, 0.097); box(0.6, 1, 0.032, 0.097);
    if (addonZ !== null) box(-0.005, 0.005, 1 + addonZ - 0.01, 1 + addonZ);
    return group;
  };
  // The frame may grow by whole lattice cells as the add-on reaches past a lattice line; what it finds may not change.
  const signature = (scan) => JSON.stringify([scan.holeCells, scan.phaseOnlyCells, scan.phases, scan.gaps]);
  const onLattice = (v) => Math.abs(v / 0.06 - Math.round(v / 0.06)) < 1e-6;
  let reference = null;
  for (const addonZ of [null, 0.004, 0.017, 0.031, 0.046]) {
    const group = slotted(addonZ);
    const scan = fixtureScan(group);
    const label = `contig-phase:slot${addonZ === null ? '' : `+addon${addonZ}`}`;
    if (scan.framing !== 'hull-anchored' || ![scan.bounds.x0, scan.bounds.x1, scan.bounds.z0, scan.bounds.z1].every(onLattice))
      failures.push(`${label}: scan is not on the hull-anchored lattice`);
    if (scan.holeCells !== 0) failures.push(`${label}: the primary phase should miss this slot (${scan.holeCells})`);
    if (!(scan.phaseOnlyCells > 0) || scan.phaseOnlyGaps.length !== 1
        || Math.abs(scan.phaseOnlyGaps[0].z - 0.065) > 0.04 || scan.phaseOnlyGaps[0].gap < 0.05 || scan.phaseOnlyGaps[0].gap > 0.09)
      failures.push(`${label}: the hidden 6.5 cm slot was not reported as one phase-only gap`);
    const sig = signature(scan);
    if (reference === null) reference = sig;
    else if (sig !== reference) failures.push(`${label}: an AABB-only add-on changed the hole scan`);
    results.push({ label, meshes: group.children.length, hash: geoHash(group), coveredCells: scan.coveredCells,
      holeCells: scan.holeCells, phaseOnlyCells: scan.phaseOnlyCells, legacyHoleCells: fixtureScan(group, LEGACY_CONTIG_FRAMING).holeCells });
    for (const object of group.children) object.geometry.dispose();
  }
  material.dispose();
}

async function runFixture() {
  const cases = [
    ['pintleMG', { cls: 'm2', tone: 'two-tone', ring: true, shield: true }],
    ['pintleMG', { cls: 'dshk', tone: 'pale' }],
    ['pintleMG', { cls: 'nsvt', tone: 'dark' }],
    ['pintleMG', { cls: 'mag', elev: 0.12, ammo: false }],
    ['openYokeRws', {
      variant: 'kf51b-panther', scale: 1.12, towerRise: 0.14,
      ammoSide: 1, sensorSide: -1,
    }],
    ['stowageRack', {}],
    ['stowageRack', { w: 1.6, fill: 1, rails: 3, seed: 7 }],
    ['stowageRack', { fill: 0 }],
    ['towCable', { pts: [[-0.5, 0.10, 0], [0, 0.02, 0.15], [0.5, 0.10, 0]] }],
    ['jerryCans', { count: 3 }],
    ['spareTrackLinks', { links: 5, rotation: [0.3, 0, 0] }],
    ['lightCluster', {}],
    ['lightCluster', { pods: 1, lens: 'dark' }],
    ['smokeBank', { count: 4 }],
    ['smokeBank', { count: 6, splay: -1.12 }],
    ['antennaWhip', {}],
    ['unditchingLog', {}],
    ['unditchingLog', { axis: 'z', straps: 3, seed: 5 }],
  ];
  const results = [];
  const failures = [];
  for (let ci = 0; ci < cases.length; ci++) {
    const [type, opts] = cases[ci];
    const label = `${type}#${ci}`;
    try {
      const mk = () => FITTINGS[type]({ ...opts, mats: fixtureMats(), seed: opts.seed ?? 1 });
      const g = mk();
      let meshes = 0, marked = 0;
      g.traverse((o) => { if (o.isMesh) { meshes++; if (o.userData.fitting === type) marked++; } });
      if (!meshes) failures.push(`${label}: no meshes`);
      if (marked !== meshes) failures.push(`${label}: ${meshes - marked} unmarked meshes`);
      if (!g.userData.fittingRoot || g.userData.fitting !== type) failures.push(`${label}: missing root marker`);
      // stamped AABB matches the as-built meshes
      const bb = new THREE.Box3().setFromObject(g);
      const st = g.userData.aabb;
      const near = (a, b) => Math.abs(a - b) < 1e-4;
      if (!st || !near(st.min[0], bb.min.x) || !near(st.min[1], bb.min.y) || !near(st.min[2], bb.min.z)
        || !near(st.max[0], bb.max.x) || !near(st.max[1], bb.max.y) || !near(st.max[2], bb.max.z)) {
        failures.push(`${label}: stamped aabb drifts from meshes`);
      }
      // determinism: identical opts => identical geometry hash
      const h1 = geoHash(g), h2 = geoHash(mk());
      if (h1 !== h2) failures.push(`${label}: nondeterministic (hash ${h1} vs ${h2})`);
      // winding: top-down FrontSide coverage must exist
      const scan = fixtureScan(mk());
      if (!scan.coveredCells) failures.push(`${label}: zero top-down coverage (winding?)`);
      results.push({
        label, meshes, hash: h1, coveredCells: scan.coveredCells, holeCells: scan.holeCells,
        aabb: st ? [st.min.map((v) => +v.toFixed(3)), st.max.map((v) => +v.toFixed(3))] : null,
      });
    } catch (e) {
      failures.push(`${label}: threw ${e.message}`);
    }
  }
  try { FITTINGS.pintleMG({}); failures.push('pintleMG without mats did not throw'); }
  catch (e) { /* required contract */ }
  runContinuityFixtures(results, failures);
  window.__FIXTURE = { ok: failures.length === 0, failures, results };
  window.__FIXTURE_READY = true;
}

try {
  if (params.get('fixture') === 'fittings') await runFixture();
  else if (params.get('id')) await runTank(params.get('id'));
  else throw new Error('pass ?id=<specId> or ?fixture=fittings');
} catch (e) {
  window.__STANDARD = { error: String(e && e.message || e) };
  window.__FIXTURE = { ok: false, failures: [String(e && e.message || e)], results: [] };
  window.__STANDARD_READY = true;
  window.__FIXTURE_READY = true;
}
</script>
