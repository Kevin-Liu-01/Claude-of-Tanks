<!doctype html>
<!-- TEMP (winding fix-round 2026-08-07): shaded compass renders for visual
     truth-checks of decal re-seats. ?id=<tank>&views=rear,right,... -->
<meta charset="utf-8">
<title>tmp-winding-shaded</title>
<script type="module">
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.js';

const params = new URLSearchParams(location.search);
const id = params.get('id') || 't80u';
const S = 900;
const wanted = (params.get('views') || 'rear').split(',').map((s) => s.trim()).filter(Boolean);
try {
  const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer: null };
  const tank = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
  const root = tank.root;
  root.traverse((o) => {
    if (!o.isLOD) return;
    o.autoUpdate = false;
    o.levels.forEach((level, i) => { if (level.object) level.object.visible = i === 0; });
  });
  root.updateMatrixWorld(true);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
  renderer.setSize(S, S, false);
  renderer.setPixelRatio(1);
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x30363d);
  scene.add(new THREE.HemisphereLight(0xcfd8e0, 0x2a2f26, 1.05));
  const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
  sun.position.set(30, 42, 24);
  scene.add(sun, root);
  const box = new THREE.Box3().setFromObject(root);
  const center = box.getCenter(new THREE.Vector3());
  const VIEWS = {
    front: [0, 0.18, 1], frontleft: [-1, 0.18, 1], left: [-1, 0.12, 0], rearleft: [-1, 0.18, -1],
    rear: [0, 0.18, -1], rearright: [1, 0.18, -1], right: [1, 0.12, 0], frontright: [1, 0.18, 1],
    top: [0, 1, 0.02], rearlow: [0, 0.06, -1],
  };
  // decal paint check: per view, diff pixels with the unit-plane decal meshes
  // hidden vs shown (proves the re-seated decals still paint in-game).
  const decalMeshes = [];
  root.traverse((o) => {
    if (o.isMesh && o.geometry && o.geometry.type === 'PlaneGeometry' && !o.name) decalMeshes.push(o);
  });
  window.__DECAL_DIFF = {};
  const shots = {};
  for (const name of wanted) {
    const d = new THREE.Vector3(...(VIEWS[name] || VIEWS.rear)).normalize();
    let ext = 0.5;
    const up0 = Math.abs(d.y) > 0.9 ? new THREE.Vector3(0, 0, -1) : new THREE.Vector3(0, 1, 0);
    const right = new THREE.Vector3().crossVectors(up0, d).normalize();
    const up = new THREE.Vector3().crossVectors(d, right).normalize();
    for (const cx of [box.min.x, box.max.x]) for (const cy of [box.min.y, box.max.y]) for (const cz of [box.min.z, box.max.z]) {
      const v = new THREE.Vector3(cx, cy, cz).sub(center);
      ext = Math.max(ext, Math.abs(v.dot(right)), Math.abs(v.dot(up)));
    }
    const h = ext * 1.08;
    const cam = new THREE.OrthographicCamera(-h, h, h, -h, 0.1, 200);
    cam.position.copy(center).addScaledVector(d, 60);
    cam.up.copy(up);
    cam.lookAt(center);
    cam.updateProjectionMatrix();
    renderer.render(scene, cam);
    shots[name] = renderer.domElement.toDataURL('image/png').split(',')[1];
    // with-vs-without decal diff (same camera)
    const gl = renderer.getContext();
    const grab = () => { const b = new Uint8Array(S * S * 4); gl.readPixels(0, 0, S, S, gl.RGBA, gl.UNSIGNED_BYTE, b); return b; };
    const a = grab();
    decalMeshes.forEach((m) => { m.visible = false; });
    renderer.render(scene, cam);
    const b = grab();
    decalMeshes.forEach((m) => { m.visible = true; });
    let diff = 0;
    let x0 = S, y0 = S, x1 = -1, y1 = -1;
    for (let i = 0; i < S * S; i++) {
      if (Math.abs(a[i * 4] - b[i * 4]) > 6 || Math.abs(a[i * 4 + 1] - b[i * 4 + 1]) > 6 || Math.abs(a[i * 4 + 2] - b[i * 4 + 2]) > 6) {
        diff++;
        const x = i % S, y = (i / S) | 0;
        if (x < x0) x0 = x; if (x > x1) x1 = x;
        if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
    }
    window.__DECAL_DIFF[name] = { diffPx: diff, bbox: diff ? [x0, y0, x1, y1] : null, decalMeshes: decalMeshes.length };
  }
  window.__SHOTS_B64 = shots;
} catch (e) {
  window.__ERR = String(e && e.stack || e);
  window.__SHOTS_B64 = {};
}
window.__SHADED_READY = true;
</script>
