<!doctype html>
<!-- TEMP (russia §B5 t72b3m graduate-change round): per-PIECE add() census.
     Drives buildT72B3M directly with an instrumented P whose add() records
     bucket + post-xform AABB (parent-group frame) + the russia.js call-site
     line, so the §B5 adjudication can name every authored piece near the
     turret and the §B4 fix can attribute clip voxels to source lines.
     DIAGNOSIS ONLY — never a verdict rig. -->
<meta charset="utf-8">
<title>tmp-b5-t72b3m-pieces</title>
<script type="module">
import * as THREE from 'three';
// evaluate the factory graph FIRST — importing russia.js directly starts the
// module graph at profiles/ and trips a TDZ cycle in uk.js (evenStations);
// the factory's own import order is the one the app ships with.
import '/src/vehicles/tankFactory.js';
import { RUSSIA_PROFILES } from '/src/vehicles/profiles/russia.js';
import { getSpec } from '/src/vehicles/specs.js';
import { createTankMaterials } from '/src/vehicles/materials.js';

const params = new URLSearchParams(location.search);
const id = params.get('id') || 't72b3m';

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const spec = getSpec(id);
const armor = spec.armor;
const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer: null };
const mats = createTankMaterials(spec, engineCtx, 4242, 'high');
const rng = mulberry32(4242 ^ 0x9e37);

const root = new THREE.Group();
root.rotation.order = 'YXZ';
const hullG = new THREE.Group(); hullG.name = 'rig_hull';
const turretG = new THREE.Group(); turretG.name = 'rig_turret';
turretG.position.set(armor.turretPivot[0], armor.turretPivot[1], armor.turretPivot[2]);
const gunG = new THREE.Group(); gunG.name = 'rig_gun';
gunG.position.set(armor.gunPivot[0], armor.gunPivot[1], armor.gunPivot[2]);
const recoilG = new THREE.Group(); recoilG.name = 'rig_recoil';
root.add(hullG, turretG); turretG.add(gunG); gunG.add(recoilG);

const records = [];
const _m = new THREE.Matrix4();
function record(bucket, geo, x, y, z, rx, ry, rz, s) {
  const sc = Array.isArray(s) ? s : [s, s, s];
  _m.compose(
    new THREE.Vector3(x, y, z),
    new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)),
    new THREE.Vector3(sc[0], sc[1], sc[2]),
  );
  geo.applyMatrix4(_m);
  geo.computeBoundingBox();
  const bb = geo.boundingBox;
  // call-site line inside russia.js (skip the two probe frames)
  let line = null;
  const stack = (new Error().stack || '').split('\n');
  for (const fr of stack) {
    const m2 = fr.match(/russia\.js[^:]*:(\d+):/);
    if (m2) { line = +m2[1]; break; }
  }
  records.push({
    i: records.length, bucket, line,
    min: bb.min.toArray().map((v) => +v.toFixed(4)),
    max: bb.max.toArray().map((v) => +v.toFixed(4)),
  });
  geo.dispose();
}

const P = {
  spec, mats, rng, q: true, hullG, turretG, gunG, recoilG,
  disposables: [], gear: null, muzzleZ: armor.gunBarrel.lengthM, topY: 0.8,
  add(bucket, geo, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, s = 1) {
    record(bucket, geo, x, y, z, rx, ry, rz, s);
  },
  clear(...names) {
    for (const name of names.flat()) {
      for (const r of records) if (r.bucket === name) r.cleared = true;
    }
  },
  addGunExtra(geo, x, y, z) { record('gunMount', geo, x, y, z, 0, 0, 0, 1); },
  addGunExtraDark(geo, x, y, z) { record('gunMountDark', geo, x, y, z, 0, 0, 0, 1); },
  decal() {},
  eraCluster(plateName, fill, turretLocal = false) {
    records.push({ i: records.length, bucket: `eraCluster:${plateName}`, turretLocal, era: true });
  },
};

RUSSIA_PROFILES[id].build(P);
window.__PIECES = {
  id,
  turretPivot: armor.turretPivot, gunPivot: armor.gunPivot,
  count: records.length, records,
};
window.__PIECES_READY = true;
</script>
