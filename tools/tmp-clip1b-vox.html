<!doctype html>
<!-- merkava1b r13 order-0 diagnosis probe: same voxel logic as
     track-clip-audit.html (exact mode), but dumps EVERY overlap voxel per
     offending mesh plus material fingerprints so the merged-bucket hits can
     be attributed to their source geometry. Diagnosis-only (§D). -->
<meta charset="utf-8">
<title>tmp-clip1b-vox</title>
<script type="module">
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.js';

const params = new URLSearchParams(location.search);
const id = params.get('id') || 'merkava1b';
const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer: null };
const tank = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
tank.root.updateMatrixWorld(true);

const V = 0.02;
const key = (x, y, z) => `${Math.round(x / V)},${Math.round(y / V)},${Math.round(z / V)}`;

const bands = [];
const meshes = [];
tank.root.traverse((o) => {
  if (!o.visible) return;
  if (o.isMesh && !o.isInstancedMesh && o.geometry) {
    const pos = o.geometry.getAttribute('position');
    if (pos && pos.usage === THREE.DynamicDrawUsage) bands.push(o);
    else if (!o.material || o.material.colorWrite !== false) meshes.push(o);
  }
});

const out = { id, bands: bands.length, zones: [] };
const bbox = new THREE.Box3();
const lanes = bands.map((b) => { bbox.setFromObject(b); return bbox.clone(); });
const zMax = Math.max(...lanes.map((l) => l.max.z));
const zMin = Math.min(...lanes.map((l) => l.min.z));
const yTop = Math.max(...lanes.map((l) => l.max.y));
const yBot = Math.min(...lanes.map((l) => l.min.y));
const laneInnerX = Math.min(...lanes.map((l) => Math.min(Math.abs(l.min.x), Math.abs(l.max.x))));
out.band = { zMax: +zMax.toFixed(3), zMin: +zMin.toFixed(3), yTop: +yTop.toFixed(3), yBot: +yBot.toFixed(3), laneInnerX: +laneInnerX.toFixed(3) };

const zones = [
  { name: 'front', z0: zMax - 0.50, z1: zMax + 0.06 },
  { name: 'rear', z0: zMin - 0.06, z1: zMin + 0.50 },
];
const y0 = yBot + 0.02, y1 = yTop + 0.06;

const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3(), p = new THREE.Vector3();
function sampleMesh(o, z0, z1, set, triOf) {
  const g = o.geometry, pos = g.getAttribute('position'), idx = g.index;
  const n = idx ? idx.count : pos.count;
  for (let i = 0; i < n; i += 3) {
    const i0 = idx ? idx.getX(i) : i, i1 = idx ? idx.getX(i + 1) : i + 1, i2 = idx ? idx.getX(i + 2) : i + 2;
    a.fromBufferAttribute(pos, i0).applyMatrix4(o.matrixWorld);
    b.fromBufferAttribute(pos, i1).applyMatrix4(o.matrixWorld);
    c.fromBufferAttribute(pos, i2).applyMatrix4(o.matrixWorld);
    const zc = (a.z + b.z + c.z) / 3;
    const zr = Math.max(a.z, b.z, c.z) - Math.min(a.z, b.z, c.z);
    if (zc + zr < z0 || zc - zr > z1) continue;
    const area = b.clone().sub(a).cross(c.clone().sub(a)).length() / 2;
    const steps = Math.max(1, Math.min(24, Math.ceil(Math.sqrt(area) / 0.012)));
    for (let u = 0; u <= steps; u++) {
      for (let v = 0; v + u <= steps; v++) {
        const w = steps - u - v;
        p.set(0, 0, 0).addScaledVector(a, u / steps).addScaledVector(b, v / steps).addScaledVector(c, w / steps);
        if (p.z < z0 || p.z > z1 || p.y < y0 || p.y > y1) continue;
        const k = key(p.x, p.y, p.z);
        set.add(k);
        if (triOf && !triOf.has(k)) {
          triOf.set(k, [
            [+a.x.toFixed(3), +a.y.toFixed(3), +a.z.toFixed(3)],
            [+b.x.toFixed(3), +b.y.toFixed(3), +b.z.toFixed(3)],
            [+c.x.toFixed(3), +c.y.toFixed(3), +c.z.toFixed(3)]]);
        }
      }
    }
  }
}

for (const zone of zones) {
  const bandSet = new Set();
  for (const bm of bands) sampleMesh(bm, zone.z0, zone.z1, bandSet);
  const hits = [];
  const zoneBox = new THREE.Box3(
    new THREE.Vector3(-1e3, y0, zone.z0), new THREE.Vector3(1e3, y1, zone.z1));
  for (const m of meshes) {
    bbox.setFromObject(m);
    if (!bbox.intersectsBox(zoneBox)) continue;
    const reach = Math.min(Math.abs(bbox.min.x), bbox.min.x <= 0 && bbox.max.x >= 0 ? 0 : Math.abs(bbox.max.x));
    if (reach > Math.max(0.05, laneInnerX - 0.15)) continue;
    const set = new Set();
    const triOf = new Map();
    sampleMesh(m, zone.z0, zone.z1, set, triOf);
    const vox = [];
    const tris = [];
    for (const k of set) {
      if (!bandSet.has(k)) continue;
      vox.push(k.split(',').map(Number));
      tris.push(triOf.get(k));
    }
    if (vox.length) {
      const mat = m.material;
      hits.push({
        name: m.name || m.parent?.name || '(unnamed)',
        parentChain: (() => { let s = [], o = m; while (o) { s.push(o.name || o.type); o = o.parent; } return s.join('<'); })(),
        matColor: mat && mat.color ? '#' + mat.color.getHexString() : null,
        matType: mat ? mat.type : null,
        vertexColors: mat ? !!mat.vertexColors : null,
        vox: vox.length,
        voxels: vox.map(([x, y, z]) => [+(x * V).toFixed(2), +(y * V).toFixed(2), +(z * V).toFixed(2)]),
        tris,
      });
    }
  }
  out.zones.push({ name: zone.name, overlapVox: hits.reduce((s, h) => s + h.vox, 0), hits: hits.sort((x, y) => y.vox - x.vox) });
}
window.__CLIP_RESULT = out;
window.__CLIP_READY = true;
</script>
