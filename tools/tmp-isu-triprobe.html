<!doctype html>
<!-- TEMP (casemate ISU containment round): list triangles intersecting a query
     box, grouped by mesh material hex. ?id=&x0..z1&mat=515549 (optional).
     DIAGNOSIS ONLY. -->
<meta charset="utf-8">
<title>tmp-isu-triprobe</title>
<script type="module">
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.js';

const q = new URLSearchParams(location.search);
const id = q.get('id') || 'isu122s';
const B = {
  x0: +(q.get('x0') ?? -10), x1: +(q.get('x1') ?? 10),
  y0: +(q.get('y0') ?? -10), y1: +(q.get('y1') ?? 10),
  z0: +(q.get('z0') ?? -10), z1: +(q.get('z1') ?? 10),
};
const matFilter = q.get('mat') || null;
const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer: null };
const tank = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
tank.root.updateMatrixWorld(true);
const out = [];
const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
tank.root.traverse((o) => {
  if (!o.isMesh || o.isInstancedMesh || !o.geometry) return;
  if (!o.visible) return;
  const hex = o.material && o.material.color ? o.material.color.getHexString() : '?';
  if (matFilter && hex !== matFilter) return;
  const pos = o.geometry.getAttribute('position'), idx = o.geometry.index;
  if (pos && pos.usage === THREE.DynamicDrawUsage) return; // skip bands
  const n = idx ? idx.count : pos.count;
  for (let i = 0; i < n && out.length < 60; i += 3) {
    const i0 = idx ? idx.getX(i) : i, i1 = idx ? idx.getX(i + 1) : i + 1, i2 = idx ? idx.getX(i + 2) : i + 2;
    a.fromBufferAttribute(pos, i0).applyMatrix4(o.matrixWorld);
    b.fromBufferAttribute(pos, i1).applyMatrix4(o.matrixWorld);
    c.fromBufferAttribute(pos, i2).applyMatrix4(o.matrixWorld);
    const lo = [Math.min(a.x, b.x, c.x), Math.min(a.y, b.y, c.y), Math.min(a.z, b.z, c.z)];
    const hi = [Math.max(a.x, b.x, c.x), Math.max(a.y, b.y, c.y), Math.max(a.z, b.z, c.z)];
    if (lo[0] > B.x1 || hi[0] < B.x0 || lo[1] > B.y1 || hi[1] < B.y0 || lo[2] > B.z1 || hi[2] < B.z0) continue;
    out.push({
      mat: hex, tri: i,
      v: [a.toArray(), b.toArray(), c.toArray()].map((v3) => v3.map((n2) => +n2.toFixed(3))),
    });
  }
});
window.__CLIP_RESULT = out; window.__CLIP_READY = true;
</script>
