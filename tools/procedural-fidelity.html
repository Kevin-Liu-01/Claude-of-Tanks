// BUILD-STANDARD: nine fixed proof cameras. Quarter views catch compound
// slopes and bustle shapes that pure orthographic axes hide; both sides are
// scored because real vehicles are asymmetric (exhausts, sights, stowage).
// Metrology-only axes: PURE orthographic views. The display ANGLES below
// carry deliberate small tilts (deck hint) which distort measurements —
// never use them for curves, stations, or dims.
const TRUE_AXES = {
  side: new THREE.Vector3(1, 0, 0),
  plan: new THREE.Vector3(0, 1, 0),
  front: new THREE.Vector3(0, 0, 1),
};
const ANGLES = {
  front: new THREE.Vector3(0, 0.08, 1),
  frontLeft: new THREE.Vector3(-1, 0.08, 1),
  left: new THREE.Vector3(-1, 0.05, 0),
  rearLeft: new THREE.Vector3(-1, 0.28, -1),
  rear: new THREE.Vector3(0, 0.08, -1),
  rearRight: new THREE.Vector3(1, 0.28, -1),
  right: new THREE.Vector3(1, 0.05, 0),
  frontRight: new THREE.Vector3(1, 0.08, 1),

function cameraFor(direction) {
  const dir = direction.clone().normalize();
  const nominalUp = Math.abs(dir.y) > 0.9 ? new THREE.Vector3(0, 0, -1) : new THREE.Vector3(0, 1, 0);
  const right = new THREE.Vector3().crossVectors(nominalUp, dir).normalize();
  const up = new THREE.Vector3().crossVectors(dir, right).normalize();
  let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
  for (const p of corners) {
    const rel = p.clone().sub(center);
    const x = rel.dot(right), y = rel.dot(up);
    minX=Math.min(minX,x); maxX=Math.max(maxX,x); minY=Math.min(minY,y); maxY=Math.max(maxY,y);
  }
  const half = Math.max((maxX-minX)/2, (maxY-minY)/2, 0.5) * 1.08;
  const camera = new THREE.OrthographicCamera(-half, half, half, -half, 0.1, 200);
  camera.position.copy(center).addScaledVector(dir, 60);
  camera.up.copy(up);
  camera.lookAt(center);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
  return camera;
}
function setPart(root, part) {
  const hull = root.getObjectByName('rig_hull');
  const turret = root.getObjectByName('rig_turret');
  const gun = root.getObjectByName('rig_gun');
  root.traverse((o) => {
    if (!isRenderNode(o)) return;
    const base = baseVisible.get(o) === true;
    const allowed = part === 'whole'
      || (part === 'hull' && isBelow(o, hull) && !isBelow(o, turret))
      || (part === 'turret' && isBelow(o, turret))
      || (part === 'gun' && isBelow(o, gun))

      // its barrel into the hull's gun buckets
      || (part === 'hullBody' && isBelow(o, hull) && !isBelow(o, turret) && !onGunRig(o) && !/^(gun|hullGun)/.test(o.name || ''));

// `scene.overrideMaterial` does not suppress InstancedMesh.instanceColor:
// Three.js still multiplies the white mask material by each instance's tint.
// Dark track-shoe palettes can therefore write depth as near-black and punch
// holes through the otherwise continuous belt, while an uninstanced source
// reference stays solid. Silhouette gates measure occupied geometry only, so
// temporarily detach instance colors for every mask render and restore the
// live vehicle immediately afterward. This does not touch matrices, materials,
// draw counts, shaded boards, or gameplay rendering.
function renderGeometryOnly(camera) {
  const coloredInstances = [];
  for (const root of [reference.root, procedural.root]) {
    root.traverse((object) => {
      if (!object.isInstancedMesh || !object.instanceColor) return;
      coloredInstances.push([object, object.instanceColor]);
      object.instanceColor = null;
    });
  }
  try {
    renderer.render(scene, camera);
  } finally {
    for (const [object, instanceColor] of coloredInstances) {
      object.instanceColor = instanceColor;
    }
  }
}

function readGeometryMask(renderTarget, renderSize, camera) {
  const previousTarget = renderer.getRenderTarget();
  const previousOverride = scene.overrideMaterial;
  const rgba = new Uint8Array(renderSize * renderSize * 4);
  try {
    renderer.setRenderTarget(renderTarget);
    renderer.clear(true, true, true);
    scene.overrideMaterial = geometryMaskMaterial;
    renderGeometryOnly(camera);
    renderer.readRenderTargetPixels(renderTarget, 0, 0, renderSize, renderSize, rgba);
  } finally {
    scene.overrideMaterial = previousOverride;
    renderer.setRenderTarget(previousTarget);
  }
  const mask = new Uint8Array(renderSize * renderSize);
  for (let i = 0; i < mask.length; i++) mask[i] = rgba[i * 4] > 40 ? 1 : 0;
  return mask;
}

function renderMask(visual, other, camera, part='whole') {
  visual.root.visible = true;

function bounds(mask) {
  let minX=SIZE, minY=SIZE, maxX=-1, maxY=-1, area=0, sx=0, sy=0;
  for (let y=0; y<SIZE; y++) for (let x=0; x<SIZE; x++) {

    minX=Math.min(minX,x); maxX=Math.max(maxX,x); minY=Math.min(minY,y); maxY=Math.max(maxY,y);
  }
  return { minX,minY,maxX,maxY,area,cx:area?sx/area:0,cy:area?sy/area:0,
    width:area?maxX-minX+1:0,height:area?maxY-minY+1:0 };
}

function alignMask(referenceMask, candidateMask) {
  const ra=bounds(referenceMask), cb=bounds(candidateMask);
  if (!ra.area || !cb.area) return candidateMask;
  // Asset origins are authoring metadata, not vehicle geometry.  Register the
  // two silhouettes by their image centroid before scoring so an off-centre
  // Blender origin cannot cost a physically identical shape 20 points.
  const dx=Math.round(ra.cx-cb.cx), dy=Math.round(ra.cy-cb.cy);
  if (!dx && !dy) return candidateMask;
  const shifted=new Uint8Array(candidateMask.length);
  for (let y=0;y<SIZE;y++) for(let x=0;x<SIZE;x++) {
    const sx=x-dx,sy=y-dy;
    if (sx>=0&&sx<SIZE&&sy>=0&&sy<SIZE) shifted[y*SIZE+x]=candidateMask[sy*SIZE+sx];
  }
  return shifted;
}

function compare(a, candidate) {
  const b=alignMask(a,candidate);
  let intersection=0, union=0;
  for (let i=0; i<a.length; i++) { intersection += a[i] && b[i] ? 1 : 0; union += a[i] || b[i] ? 1 : 0; }
  const ba=bounds(a), bb=bounds(b);
  if (!union) return { score:100, iou:1, areaSimilarity:1, bboxSimilarity:1, centroidSimilarity:1 };
  const iou = intersection/union;
  const areaSimilarity = Math.min(ba.area,bb.area)/Math.max(ba.area,bb.area,1);
  const dw=Math.abs(ba.width-bb.width)/Math.max(ba.width,bb.width,1);
  const dh=Math.abs(ba.height-bb.height)/Math.max(ba.height,bb.height,1);
  const bboxSimilarity=Math.max(0,1-(dw+dh)/2);
  const dc=Math.hypot(ba.cx-bb.cx,ba.cy-bb.cy)/Math.max(Math.hypot(ba.width,ba.height),1);
  const centroidSimilarity=Math.max(0,1-dc*2);
  const score=(iou*.70+areaSimilarity*.15+bboxSimilarity*.10+centroidSimilarity*.05)*100;
  return {
    score, iou, areaSimilarity, bboxSimilarity, centroidSimilarity,
    referenceArea:ba.area, proceduralArea:bb.area,
    referenceBounds:{ width:ba.width, height:ba.height, cx:ba.cx, cy:ba.cy },
    proceduralBounds:{ width:bb.width, height:bb.height, cx:bb.cx, cy:bb.cy },
  };
}

// Compact contour diagnostics for thin side silhouettes. A one-pixel roof or
// belly mismatch can dominate direct-turret IoU while remaining difficult to
// read in the thumbnail overlay. Positive deltas mean the aligned procedural
// contour sits lower in image space than the reference contour.
function contourProfile(referenceMask, candidateMask, bins=12) {
  const candidate=alignMask(referenceMask,candidateMask);
  const ra=bounds(referenceMask), cb=bounds(candidate);
  const minX=Math.min(ra.minX,cb.minX), maxX=Math.max(ra.maxX,cb.maxX);
  const out=[];
  for (let b=0; b<bins; b++) {
    const x0=Math.floor(minX+(maxX-minX+1)*b/bins);
    const x1=Math.max(x0,Math.floor(minX+(maxX-minX+1)*(b+1)/bins)-1);
    let topDelta=0,bottomDelta=0,columns=0;
    for (let x=x0; x<=x1; x++) {
      const longestRun=(mask)=>{
        let bestTop=SIZE,bestBottom=-1,bestLength=0,start=-1;
        for (let y=0; y<=SIZE; y++) {
          const on=y<SIZE && mask[y*SIZE+x];
          if (on && start<0) start=y;
          if (!on && start>=0) {
            const length=y-start;
            if (length>bestLength) { bestLength=length; bestTop=start; bestBottom=y-1; }
            start=-1;
          }
        }
        return [bestTop,bestBottom];
      };
      const [rt,rb]=longestRun(referenceMask),[pt,pb]=longestRun(candidate);
      if (rb>=0 && pb>=0) { topDelta+=pt-rt; bottomDelta+=pb-rb; columns++; }
    }
    out.push({
      topDelta:columns?Number((topDelta/columns).toFixed(2)):null,
      bottomDelta:columns?Number((bottomDelta/columns).toFixed(2)):null,
      columns,
    });
  }
  return out;
}

// Downsampled direct-component silhouette bands for authored rebuilds.  This
// is deliberately a 2-D render diagnostic (not source geometry): each sample
// records only the longest visible top/bottom run after the same translation
// alignment used by compare().  It makes thin turret/bustle mismatches
// actionable without embedding or reconstructing oracle mesh data.
function silhouetteBand(referenceMask, candidateMask, samples=48) {
  const candidate=alignMask(referenceMask,candidateMask);
  const rb=bounds(referenceMask), cb=bounds(candidate);
  const minX=Math.min(rb.minX,cb.minX), maxX=Math.max(rb.maxX,cb.maxX);
  const longestRun=(mask,x)=>{
    let bestTop=null,bestBottom=null,bestLength=0,start=-1;
    for (let y=0; y<=SIZE; y++) {
      const on=y<SIZE && mask[y*SIZE+x];
      if (on && start<0) start=y;
      if (!on && start>=0) {
        const length=y-start;
        if (length>bestLength) { bestLength=length; bestTop=start; bestBottom=y-1; }
        start=-1;
      }
    }
    return bestTop===null?null:[bestTop,bestBottom];
  };
  const rows=[];
  for (let i=0;i<samples;i++) {
    const x=Math.round(minX+(maxX-minX)*i/Math.max(1,samples-1));
    rows.push([x,longestRun(referenceMask,x),longestRun(candidate,x)]);
  }
  return rows;
}

function differenceProfile(referenceMask, candidateMask, axis='y', bins=12) {
  const candidate=alignMask(referenceMask,candidateMask);
  const rb=bounds(referenceMask), cb=bounds(candidate);
  const lo=axis==='y'?Math.min(rb.minY,cb.minY):Math.min(rb.minX,cb.minX);
  const hi=axis==='y'?Math.max(rb.maxY,cb.maxY):Math.max(rb.maxX,cb.maxX);
  const out=[];
  for(let b=0;b<bins;b++){
    const a0=Math.floor(lo+(hi-lo+1)*b/bins);
    const a1=Math.max(a0,Math.floor(lo+(hi-lo+1)*(b+1)/bins)-1);
    let referenceOnly=0,proceduralOnly=0,overlap=0;
    for(let y=0;y<SIZE;y++)for(let x=0;x<SIZE;x++){
      const a=axis==='y'?y:x;
      if(a<a0||a>a1)continue;
      const i=y*SIZE+x,r=referenceMask[i],p=candidate[i];
      if(r&&p)overlap++; else if(r)referenceOnly++; else if(p)proceduralOnly++;
    }
    out.push({start:a0,end:a1,referenceOnly,proceduralOnly,overlap});
  }
  return out;
}

function differenceGrid(referenceMask, candidateMask, cols=12, rows=8) {
  const candidate=alignMask(referenceMask,candidateMask);
  const rb=bounds(referenceMask), cb=bounds(candidate);
  const minX=Math.min(rb.minX,cb.minX), maxX=Math.max(rb.maxX,cb.maxX);
  const minY=Math.min(rb.minY,cb.minY), maxY=Math.max(rb.maxY,cb.maxY);
  const out=[];
  for(let gy=0;gy<rows;gy++){
    const y0=Math.floor(minY+(maxY-minY+1)*gy/rows);
    const y1=Math.max(y0,Math.floor(minY+(maxY-minY+1)*(gy+1)/rows)-1);
    const row=[];
    for(let gx=0;gx<cols;gx++){
      const x0=Math.floor(minX+(maxX-minX+1)*gx/cols);
      const x1=Math.max(x0,Math.floor(minX+(maxX-minX+1)*(gx+1)/cols)-1);
      let referenceOnly=0,proceduralOnly=0,overlap=0;
      for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
        const i=y*SIZE+x,r=referenceMask[i],p=candidate[i];
        if(r&&p)overlap++; else if(r)referenceOnly++; else if(p)proceduralOnly++;
      }
      row.push({referenceOnly,proceduralOnly,overlap});
    }
    out.push(row);
  }
  return out;
}

const subtract = (whole, base) => {
  const out = new Uint8Array(whole.length);
  for (let i=0; i<out.length; i++) out[i] = whole[i] && !base[i] ? 1 : 0;
  return out;
};

function lowerBand(a, b) {
  const ba=bounds(a), bb=bounds(b);
  const minY=Math.min(ba.minY,bb.minY), maxY=Math.max(ba.maxY,bb.maxY);
  const cut=minY+(maxY-minY)*0.39;
  const oa=new Uint8Array(a.length), ob=new Uint8Array(b.length);
  for (let y=0; y<SIZE; y++) for (let x=0; x<SIZE; x++) if (y<=cut) {
    const i=y*SIZE+x; oa[i]=a[i]; ob[i]=b[i];

function cannonOverhang(whole, hullBounds) {
  const out=new Uint8Array(whole.length);

    // screen-left. The opposite overhang is bustle, rack or rear service

    // mask silently made rear-package width alter the gun score.
    if (whole[i] && x<hullBounds.minX-pad) out[i]=1;
  }
  return out;
}

function overlayCanvas(name, refMask, procMask, metric) {

// ---- BUILD-STANDARD board mode (&board=1, driver --board): shaded beauty
// pair, articulation strip, procedural turntable. Rendered strictly AFTER
// scoring so pose/visibility mutations can never contaminate the masks.
if (params.get('board')) {
  // Shaded evidence always shows the complete armed playable. Restore the
  // measurement scope afterwards so board mode cannot change geometry scores.
  const photoNodes=[];
  for(const group of [photoGroup,...ownerKitGroups].filter(Boolean)){group.visible=true;group.traverse(o=>{if(isRenderNode(o)){photoNodes.push(o);baseVisible.set(o,true);o.visible=true;}});}

  // This equal-clay diagnostic is deliberately applied only after masks and
  // scores are finalized. Albedo, texture detail and instanced tread tints
  // cannot disguise mismatched physical planes in this optional board.
  const neutralBoard = params.has('neutralBoard');
  scene.overrideMaterial = neutralBoard ? new THREE.MeshStandardMaterial({
    color: 0xb8b8ac, roughness: .85, metalness: 0, side: THREE.DoubleSide,
  }) : null;
  renderer.setClearColor(0x151b20, 1);
  const hemi = new THREE.HemisphereLight(0xcfd8e0, 0x2a2f26, 1.05);
  const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
  sun.position.set(30, 42, 24);
  scene.add(hemi, sun);
  const boardDiv = document.createElement('div');
  boardDiv.id = 'board';
  document.body.append(boardDiv);

  const shadedInto = (ctx2d, visual, other, camera, dx, dy, px) => {
    visual.root.visible = true;
    other.root.visible = false;
    setPart(visual.root, 'whole');
    renderer.setSize(px, px, false);
    renderer.setRenderTarget(null);
    if (neutralBoard) renderGeometryOnly(camera);
    else renderer.render(scene, camera);
    ctx2d.drawImage(renderer.domElement, dx, dy, px, px);
  };
  // Locked mild-perspective beauty camera. PER-MODEL framing: the two roots
  // sit at different world centers with different bbox depths, so one shared
  // camera rendered the procedural up to ~1.5x the reference's apparent size
  // — the shaded pairs were judged scale-mismatched (wave-2 finding). Each
  // cell now frames its own subject with identical fov/direction/fill.
  const heroCameraFor = (root) => {
    // The final score pass may leave only a component visible. Restore the
    // full subject before measuring, otherwise the resulting beauty camera
    // frames that component and clips the bow/cannon from the evidence board.
    root.visible = true;
    setPart(root, 'whole');
    root.updateMatrixWorld(true);
    return fitBoardCamera(root, object => isRenderNode(object) && baseVisible.get(object));
  };
  const addBoard = (title, canvas) => {
    canvas.style.width = `${canvas.width}px`;
    const figure = document.createElement('figure');
    const caption = document.createElement('figcaption');
    caption.innerHTML = `<span>${title}</span>`;
    figure.append(canvas, caption);
    boardDiv.append(figure);
  };
  const refCam = heroCameraFor(reference.root);
  const procCam = heroCameraFor(procedural.root);

  { // shaded hero pair, 1600 px combined
    const px = 800;
    const cv = document.createElement('canvas'); cv.width = px * 2; cv.height = px;
    const ctx = cv.getContext('2d');
    shadedInto(ctx, reference, procedural, refCam, 0, 0, px);
    shadedInto(ctx, procedural, reference, procCam, px, 0, px);
    addBoard(`${neutralBoard ? 'equal neutral clay' : 'shaded'} — reference | procedural`, cv);
  }

  { // articulation: turret -90/0/+90/180 at level gun, then gun -dep/+elev.
    // Reference row above procedural row so detached/floating children in
    // either rig are directly comparable cell by cell.
    const dep = spec.gunDepressionDeg ?? 8;
    const elev = spec.gunElevationDeg ?? 15;
    const poses = [
      { yawDeg: -90, pitchDeg: 0 }, { yawDeg: 0, pitchDeg: 0 },
      { yawDeg: 90, pitchDeg: 0 }, { yawDeg: 180, pitchDeg: 0 },
      { yawDeg: 0, pitchDeg: -dep }, { yawDeg: 0, pitchDeg: elev },
    ];
    const px = 380;
    const cv = document.createElement('canvas'); cv.width = px * poses.length; cv.height = px * 2;
    const ctx = cv.getContext('2d');
    const applyPose = (visual, pose) => {
      const turret = visual.root.getObjectByName('rig_turret');
      const gun = visual.root.getObjectByName('rig_gun');
      if (turret) turret.rotation.y = pose.yawDeg * Math.PI / 180;
      if (gun) gun.rotation.x = -pose.pitchDeg * Math.PI / 180;

      applyPose(reference, pose);

  { // 24-frame procedural turntable at 15° — continuity / floating-part sweep

    const ctx = cv.getContext('2d');
    const baseYaw = procedural.root.rotation.y;
    for (let i = 0; i < 24; i++) {
      procedural.root.rotation.y = baseYaw + i * (Math.PI / 12);
      procedural.root.updateMatrixWorld(true);
      shadedInto(ctx, procedural, reference, heroCameraFor(procedural.root), (i % cols) * px, Math.floor(i / cols) * px, px);
    }

  for(const group of [photoGroup,...ownerKitGroups].filter(Boolean))group.visible=false;

// ---- &profiles=1: measure the REFERENCE model into authoring data --------
// Silhouette polylines + station cross-sections extracted from ortho mask
// renders (never vertex data): the from-scratch rebuild program authors
// procedural geometry against these measured curves. All values in the
// width-normalized world meters the game/lab share.
if (params.get('profiles')) {
  const PSIZE = 1024;
  const ptarget = new THREE.WebGLRenderTarget(PSIZE, PSIZE, { depthBuffer:true, stencilBuffer:false });
  const readMask = (camera, part) => {
    reference.root.visible = true;
    procedural.root.visible = false;
    setPart(reference.root, part);
    return readGeometryMask(ptarget, PSIZE, camera);
  };
  // Column trace: for each pixel column, the top/bottom silhouette edge in
  // world units. Returns ~N stations of [along, top, bottom].
  const trace = (mask, cam, N = 96) => {
    const half = cam.right; // symmetric ortho
    const toWorldX = (px) => ((px + 0.5) / PSIZE * 2 - 1) * half;
    const toWorldY = (py) => ((py + 0.5) / PSIZE * 2 - 1) * half;
    const out = [];
    const step = PSIZE / N;
    for (let c = 0; c < N; c++) {
      const x0 = Math.floor(c * step), x1 = Math.min(PSIZE, Math.floor((c + 1) * step));
      let top = -1, bot = -1;
      for (let x = x0; x < x1; x++) {
        for (let y = PSIZE - 1; y >= 0; y--) if (mask[y * PSIZE + x]) { if (y > top) top = y; break; }
        for (let y = 0; y < PSIZE; y++) if (mask[y * PSIZE + x]) { if (bot < 0 || y < bot) bot = y; break; }
      }
      if (top >= 0) out.push([Number(toWorldX((x0 + x1) / 2).toFixed(3)),
        Number(toWorldY(top).toFixed(3)), Number(toWorldY(bot).toFixed(3))]);
    }
    return out;
  };
  const refBox = visibleBox(reference.root);
  const rc = refBox.getCenter(new THREE.Vector3());
  const mkCam = (dir) => {
    const c = cameraFor(dir);
    return c;
  };
  // Side (camera on +x): columns = world -z (flip to +z later), rows = world y.
  const sideCam = mkCam(TRUE_AXES.side);
  const topCam = mkCam(TRUE_AXES.plan);
  const frontCam = mkCam(TRUE_AXES.front);
  const profiles = {
    id, generated: 'mask-trace-1024',
    frame: { center: rc.toArray().map((v) => Number(v.toFixed(3))),
      box: { min: refBox.min.toArray().map((v)=>Number(v.toFixed(3))), max: refBox.max.toArray().map((v)=>Number(v.toFixed(3))) } },
    // whole-vehicle: side profile (z, deckY, bellyY), plan (z, +x half-width),
    // front (x, topY, bottomY)
    side_whole: trace(readMask(sideCam, 'whole'), sideCam),
    side_hull: trace(readMask(sideCam, 'hull'), sideCam),
    plan_whole: trace(readMask(topCam, 'whole'), topCam),
    plan_hull: trace(readMask(topCam, 'hull'), topCam),
    front_whole: trace(readMask(frontCam, 'whole'), frontCam),
    front_hull: trace(readMask(frontCam, 'hull'), frontCam),
  };
  // Station cross-sections: slice the front camera's near/far around 12 z
  // stations; each slice's mask bounds give hull width/height at that station.
  const size = refBox.getSize(new THREE.Vector3());
  const stations = [];
  const S = 14;
  for (let i = 0; i < S; i++) {
    const z0 = refBox.min.z + (i / S) * size.z;
    const z1 = refBox.min.z + ((i + 1) / S) * size.z;
    const cam = mkCam(TRUE_AXES.front);
    // camera sits at center + dir*60 looking -dir; distance to plane z=zs:
    const camZ = cam.position.z;
    cam.near = Math.max(0.1, camZ - z1);
    cam.far = camZ - z0;
    cam.updateProjectionMatrix();
    const m = readMask(cam, 'whole');
    // bounds in world units
    let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9, area = 0;
    const half = cam.right;
    for (let y = 0; y < PSIZE; y++) for (let x = 0; x < PSIZE; x++) {
      if (!m[y * PSIZE + x]) continue;
      area++;
      const wx = ((x + 0.5) / PSIZE * 2 - 1) * half;
      const wy = ((y + 0.5) / PSIZE * 2 - 1) * half;
      if (wx < minX) minX = wx; if (wx > maxX) maxX = wx;
      if (wy < minY) minY = wy; if (wy > maxY) maxY = wy;
    }
    stations.push(area ? {
      z: Number(((z0 + z1) / 2).toFixed(3)),
      w: Number((maxX - minX).toFixed(3)), x0: Number(minX.toFixed(3)), x1: Number(maxX.toFixed(3)),
      y0: Number(minY.toFixed(3)), y1: Number(maxY.toFixed(3)),
    } : { z: Number(((z0 + z1) / 2).toFixed(3)), empty: true });
  }
  profiles.stations = stations;
  setPart(reference.root, 'whole');
  renderer.setSize(SIZE, SIZE, false);
  ptarget.dispose();
  window.__PROFILES = profiles;
}

// ---- &geo=1: THE GEOMETRY GATE --------------------------------------------
// Authoritative curve-to-curve comparison. Extracts the SAME measured curves
// from BOTH models with the same pipeline (no self-reporting), then scores:
//   curves   — mean+max deviation between ref/proc silhouette polylines,
//              normalized by vehicle size (side/plan/front, whole + hull)
//   turret   — the subtracted (whole−hull) curves, scored separately so the
//              historically weakest assembly can never hide in an average
//   stations — per-station width/top/bottom errors across 14 hull slices
//   dims     — the PROCEDURAL build vs PUBLISHED spec dims (anchors to the
//              real vehicle: a defective oracle cannot drag the build wrong)
//   floaters — connected-component check across articulation poses (a
//              detached mesh island fails the gate outright)
// GATE: every component >= 90. min() is the headline. No averaging.
if (params.get('geo')) {
  const GSIZE = 1024;
  const gtarget = new THREE.WebGLRenderTarget(GSIZE, GSIZE, { depthBuffer:true, stencilBuffer:false });
  const gMask = (visual, other, camera, part) => {
    visual.root.visible = true; other.root.visible = false;
    setPart(visual.root, part);
    return readGeometryMask(gtarget, GSIZE, camera);
  };
  const gTrace = (mask, cam, N = 96) => columnTrace(mask, GSIZE, cam.right, N);
  const clamp01 = (v) => Math.max(0, Math.min(100, v));
  // Curve deviation: mean+max |ref−proc| over columns where BOTH exist, plus
  // a coverage penalty where exactly one silhouette exists (missing/excess
  // volume is worse than displaced volume).
  const curveScore = (refC, procC, normDim, fixedReg) => {
    // Registration: translation-only, BOTH axes. The two models sit at
    // different world spots in the shared camera, so align each curve pair by
    // its valid-span midpoint (along) and mean band center (vertical), then
    // resample the procedural curve onto the reference stations. Shape error
    // survives untouched; placement error disappears. fixedReg pins BOTH
    // offsets to the whole-vehicle frame so hull/turret PLACEMENT counts —
    // without it a turret 40 cm out of position would self-register away.
    const span = (c) => {
      let a = null, b = null;
      for (const p of c) if (p) { if (a === null) a = p[0]; b = p[0]; }
      return a === null ? null : [a, b];
    };
    // registration uses BODY columns only: a barrel fused into a print's
    // hull mesh is band-thin and must not steer the frame midpoint
    const bodySpan = (c) => {
      const cols = c.filter(Boolean);
      if (!cols.length) return null;
      const rough = Math.max(...cols.map((p) => p[1])) - Math.min(...cols.map((p) => p[2]));
      let a = null, b = null;
      for (const p of c) if (p && p[1] - p[2] > rough * 0.12) { if (a === null) a = p[0]; b = p[0]; }
      return a === null ? null : [a, b];
    };
    const rs = span(refC), ps = span(procC);
    const rsB = bodySpan(refC) || rs, psB = bodySpan(procC) || ps;
    if (!rs || !ps) return { score: 0, meanPct: 100, maxPct: 100, coverPct: 100 };
    const dAlong = fixedReg ? fixedReg.dAlong : (rsB[0] + rsB[1]) / 2 - (psB[0] + psB[1]) / 2;
    const valid = procC.filter(Boolean);
    const interp = (along) => {
      const a = along - dAlong;                 // sample in proc's own frame
      if (a < ps[0] - 0.02 || a > ps[1] + 0.02) return null;
      let lo = null, hi = null;
      for (const p of valid) {
        if (p[0] <= a && (!lo || p[0] > lo[0])) lo = p;
        if (p[0] >= a && (!hi || p[0] < hi[0])) hi = p;
      }
      // TRIM-BOUNDARY CLAMP (centurion push-2 find, 2026-08-05): the span
      // check above deliberately admits a ±0.02 band past the end columns,
      // but with no column beyond the edge the lo/hi lookup nulled every
      // sample in that band — sub-2cm edge overhangs (dAlong half-pitch
      // pairings at the turret trim window) read as fake cover (~2.9 pts
      // on the centurion turret_side rows). Clamp to the edge column
      // inside the already-declared tolerance; beyond it stays null.
      if (!hi && lo && a - lo[0] <= 0.02) return [a, lo[1], lo[2]];
      if (!lo && hi && hi[0] - a <= 0.02) return [a, hi[1], hi[2]];
      if (!lo || !hi) return null;
      if (hi[0] === lo[0]) return lo;
      const t = (a - lo[0]) / (hi[0] - lo[0]);
      return [a, lo[1] + (hi[1] - lo[1]) * t, lo[2] + (hi[2] - lo[2]) * t];
    };
    let dy = 0;
    if (fixedReg) { dy = fixedReg.dy; } else {
      let dySum = 0, dyN = 0;
      for (const r of refC) if (r) { const p = interp(r[0]); if (p) { dySum += ((r[1] + r[2]) - (p[1] + p[2])) / 2; dyN++; } }
      dy = dyN ? dySum / dyN : 0;
    }
    const errs = [], cols = [];
    let onlyOne = 0, either = 0;
    let pitch = 0;
    { let prev = null;
      for (const p of refC) { if (p) { if (prev !== null) { pitch = Math.abs(p[0] - prev); break; } prev = p[0]; } } }
    const margin = Math.max(0.05, pitch * 0.75);
    for (const p of procC) {          // proc-only columns: geometry the ref
      if (!p) continue;               // doesn't have (e.g. excess overhang)
      either++;
      const a = p[0] + dAlong;
      if (a < rs[0] - margin || a > rs[1] + margin) onlyOne++;
    }
    for (const r of refC) {
      if (!r) continue;
      either++;
      const p = interp(r[0]);
      if (!p) { onlyOne++; continue; }
      const e = (Math.abs(r[1] - (p[1] + dy)) + Math.abs(r[2] - (p[2] + dy))) / 2;
      errs.push(e);
      cols.push({ at: +r[0].toFixed(2), refTop: +r[1].toFixed(2), refBot: +r[2].toFixed(2),
        procTop: +(p[1] + dy).toFixed(2), procBot: +(p[2] + dy).toFixed(2), errM: +e.toFixed(3) });
    }
    if (!errs.length) return { score: 0, meanPct: 100, p95Pct: 100, coverPct: 100 };
    cols.sort((a, b) => b.errM - a.errM);
    const worst = cols.slice(0, 12);
    errs.sort((a, b) => a - b);
    const meanPct = (errs.reduce((a, b) => a + b, 0) / errs.length) / normDim * 100;
    // p95 instead of raw max: one aliased column or fitting edge must not own
    // the score; systematic shape error still shows in the tail.
    const p95Pct = errs[Math.min(errs.length - 1, Math.floor(errs.length * 0.95))] / normDim * 100;
    const coverPct = either ? onlyOne / either * 100 : 0;
    return { score: Math.max(0, Math.min(100, 100 - 12 * meanPct - 0.6 * p95Pct - 1.5 * coverPct)),
      meanPct: +meanPct.toFixed(2), p95Pct: +p95Pct.toFixed(2), coverPct: +coverPct.toFixed(2),
      reg: { dAlong, dy }, worst };
  };
  const sub = (whole, hull) => whole.map((w, i) => {
    const h = hull[i];
    if (!w) return null;
    if (!h) return w;                       // hull absent → whole IS upper here
    return w[1] - h[1] > 0.04 ? [w[0], w[1], h[1]] : null; // upper band only
  });

  const refBoxG = visibleBox(reference.root);
  const height = refBoxG.max.y - refBoxG.min.y;
  const length = refBoxG.max.z - refBoxG.min.z;
  const camsG = { side: cameraFor(TRUE_AXES.side), plan: cameraFor(TRUE_AXES.plan), front: cameraFor(TRUE_AXES.front) };
  const curves = {};
  for (const [view, cam] of Object.entries(camsG)) {
    for (const part of ['whole', 'hull']) {
      curves[`${view}_${part}_ref`] = gTrace(gMask(reference, procedural, cam, part), cam);
      curves[`${view}_${part}_proc`] = gTrace(gMask(procedural, reference, cam, part), cam);
    }
  }
  // plan-view band errors live on the LENGTH axis (z); side/front on height
  const norm = { side: height, plan: length, front: height };
  const geometryComponentMasksAvailable = componentMasksAvailable
    && source?.glb?.geometryComponentMasks !== false;
  const curveRows = {};
  const viewReg = {};
  for (const view of ['side', 'plan', 'front']) {
    // hull anchors the frame: it contains no barrel, so gun-length deltas
    // cannot shift registration (dims stays satisfiable vs short-gun oracles)
    curveRows[`${view}_hull`] = curveScore(curves[`${view}_hull_ref`], curves[`${view}_hull_proc`], norm[view], sourceWorldRegistration?.fixedReg);
    viewReg[view] = curveRows[`${view}_hull`].reg; // may be undefined if hull empty
    // A fused oracle cannot provide a truthful hull anchor: its nominal hull
    // curve may contain turret/glacis equipment while the authored hull does
    // not. In that declared case register the valid whole silhouettes to one
    // another. Component-capable references keep the stricter hull-pinned
    // registration so turret placement still counts.
    curveRows[`${view}_whole`] = curveScore(
      curves[`${view}_whole_ref`], curves[`${view}_whole_proc`], norm[view],
      sourceWorldRegistration?.fixedReg || (geometryComponentMasksAvailable ? viewReg[view] : undefined));
  }
  for (const view of ['side', 'plan']) {
    curves[`${view}_turret_ref`] = gTrace(gMask(reference, procedural, camsG[view], 'turret'), camsG[view]);
    curves[`${view}_turret_proc`] = gTrace(gMask(procedural, reference, camsG[view], 'turret'), camsG[view]);
  }
  const spanAll = (c) => {
    let a = null, b = null;
    for (const p of c) if (p) { if (a === null) a = p[0]; b = p[0]; }
    return a === null ? null : [Math.min(a, b), Math.max(a, b)];
  };
  const trimToHull = (c, hullC, m = 0.6) => {
    const sp = spanAll(hullC);
    if (!sp) return c;
    return c.map((p) => (p && (p[0] < sp[0] - m || p[0] > sp[1] + m)) ? null : p);
  };
  // v11 (ORIENTATION GUARD, owner bug 2026-08-01): translation-only
  // registration is blind to a fore-aft MIRRORED build — t62_1975 shipped
  // with its glacis at the stern and still bulk-overlapped to ~70. Score
  // the hull curve again with the proc curve mirrored about its own span
  // midpoint; if the mirror fits distinctly better, the build faces
  // backwards — hard-zero the row and flag it as a work order.
  {
    const mirror = (c) => {
      const sp = spanAll(c);
      if (!sp) return c;
      const mid = (sp[0] + sp[1]) / 2;
      const out = c.filter(Boolean).map((p) => [2 * mid - p[0], p[1], p[2]]);
      out.sort((a, b) => a[0] - b[0]);
      return out;
    };
    for (const view of ['side', 'plan']) {
      const row = curveRows[`${view}_hull`];
      if (!row || row.score <= 0) continue;
      const mirrored = curveScore(
        curves[`${view}_hull_ref`], mirror(curves[`${view}_hull_proc`]), norm[view], sourceWorldRegistration?.fixedReg);
      if (mirrored.score > row.score + 8) {
        row.orientationFlip = true;
        row.mirrorScore = +mirrored.score.toFixed(1);
        row.score = 0;
      }
    }
  }
  for (const view of ['side', 'plan']) {
    curves[`${view}_turret_ref`] = trimToHull(curves[`${view}_turret_ref`], curves[`${view}_hull_ref`]);
    curves[`${view}_turret_proc`] = trimToHull(curves[`${view}_turret_proc`], curves[`${view}_hull_proc`]);
  }
  const turretEmpty = (c) => !c.some(Boolean);
  // fixedMount is the committed casemate registration — spec-driven, so an
  // emptied rig_turret can't fake it; the whole/hull curves carry the body.
  const noTurretBoth = source?.glb?.fixedMount
    || (turretEmpty(curves.side_turret_ref) && turretEmpty(curves.side_turret_proc));
  const turretRows = !turretComponentMasksAvailable
    ? { side: { score: null, note: 'unavailable (fused/misclassified turret tree)' }, plan: { score: null, note: 'unavailable (fused/misclassified turret tree)' } }
    : noTurretBoth
    ? { side: { score: 100, note: 'no turret (casemate)' }, plan: { score: 100, note: 'no turret (casemate)' } }
    : {
      side: curveScore(curves.side_turret_ref, curves.side_turret_proc, height, viewReg.side),
      plan: curveScore(curves.plan_turret_ref, curves.plan_turret_proc, length, viewReg.plan),
    };
  // Stations: 14 front-view slices, width/top errors between the two models.
  const stationErr = [];
  {
    const procBoxS = visibleBox(procedural.root);
    // hull z-range from the side HULL mask (no barrel in it): stations stay
    // on the body for both models regardless of gun overhang
    const hullZRange = (visual, other) => {
      const cam = camsG.side;
      const rightVec = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 0);
      const t = gTrace(gMask(visual, other, cam, 'hull'), cam);
      let z0 = 1e9, z1 = -1e9;
      for (const c of t) {
        if (!c) continue;

      }
      return z1 > z0 ? [z0, z1] : null;
    };
    const refZR = hullZRange(reference, procedural);
    // Canonical metre frames use the same physical source slice planes; a
    // longer candidate hull must not stretch the sampling stations to fit.
    const procZR = sourceWorldRegistration ? refZR : hullZRange(procedural, reference);
    // Rendering an uncapped near/far slice erases exactly Z-parallel flanks.
    // Certified source-world models instead intersect actual surface triangles
    // with identical physical planes, retaining parallel faces and real voids.
    const exactStationRows = visual => {
      const zr = refZR || [refBoxG.min.z, refBoxG.max.z];
      const planes = Array.from({length:14}, (_,i) => [
        zr[0]+i/14*(zr[1]-zr[0]), zr[0]+(i+1)/14*(zr[1]-zr[0])]);
      visual.root.visible = true;
      setPart(visual.root, 'whole');
      return measureSlabBounds(visual.root, planes, o => baseVisible.get(o) === true);
    };
    const refExact = sourceWorldRegistration ? exactStationRows(reference) : null;
    const procExact = sourceWorldRegistration ? exactStationRows(procedural) : null;
    for (let i = 0; i < 14; i++) {
      const meas = (visual, other, box, zr, exact) => {
        if (exact) return exact[i].empty ? null : {w:exact[i].width, top:exact[i].top};
        const sz = (zr ? zr[1] - zr[0] : box.max.z - box.min.z);
        const zb = zr ? zr[0] : box.min.z;
        const z0 = zb + (i / 14) * sz, z1 = zb + ((i + 1) / 14) * sz;
        const cam = cameraFor(TRUE_AXES.front);
        cam.near = Math.max(0.1, cam.position.z - z1); cam.far = cam.position.z - z0;
        cam.updateProjectionMatrix();
        const m = gMask(visual, other, cam, 'whole');
        let minX = 1e9, maxX = -1e9, maxY = -1e9, any = false;
        const half = cam.right;
        for (let y = 0; y < GSIZE; y++) for (let x = 0; x < GSIZE; x++) {
          if (!m[y * GSIZE + x]) continue;
          any = true;
          const wx = ((x + 0.5) / GSIZE * 2 - 1) * half, wy = ((y + 0.5) / GSIZE * 2 - 1) * half;
          if (wx < minX) minX = wx; if (wx > maxX) maxX = wx; if (wy > maxY) maxY = wy;
        }
        return any ? { w: maxX - minX, top: maxY } : null;
      };
      const r = meas(reference, procedural, refBoxG, refZR, refExact), p = meas(procedural, reference, procBoxS, procZR, procExact);
      const procGround = sourceWorldRegistration ? refBoxG.min.y : procBoxS.min.y;
      if (r && p) stationErr.push({ i,
        refW: +r.w.toFixed(3), procW: +p.w.toFixed(3),
        refTop: +(r.top - refBoxG.min.y).toFixed(3), procTop: +(p.top - procGround).toFixed(3),
        wPct: (Math.abs(r.w - p.w) / Math.max(r.w, 0.2)) * 100,
        topPct: (Math.abs((r.top - refBoxG.min.y) - (p.top - procGround)) / height) * 100 });
      else if (r || p) stationErr.push({ i, wPct: 100, topPct: 100, onlyOne: true });
    }
  }
  const trimmed = (arr) => {
    const v = arr.slice().sort((a, b) => a - b);
    const keep = v.slice(0, Math.max(1, v.length - 2)); // drop the 2 worst:
    return keep.reduce((a, b) => a + b, 0) / keep.length; // one bustle station
  };                                                       // must not own it
  const mW = trimmed(stationErr.map((e) => e.wPct));
  const mT = trimmed(stationErr.map((e) => e.topPct));
  const stationScore = clamp01(100 - 10 * mW - 10 * mT);
  // Published-dimension anchor: PROCEDURAL vs spec.dims (real vehicle).
  // Every dims row measures the BODY (withBodyOnly: no whips, antennas or
  // roof weapons on either model; Main's rulings 2026-10-30). A published
  // height is met anywhere from the body top to the roof-fittings top
  // (sources measure to the cupola or the roof gun; whips stay out), an
  // oracle is body against body, and hull length is the hull's own side
  // span, gun left out, wherever both sides have one (a fused oracle has
  // none: the whole-body extent on both sides there).
  const sideTraces = (visual, other, mode = 'body', cam = camsG.side) => withBodyOnly(() => ({
    whole: gTrace(gMask(visual, other, cam, 'whole'), cam), hull: gTrace(gMask(visual, other, cam, 'hullBody'), cam),
  }), mode);
  const procSide = sideTraces(procedural, reference);
  const procPairedSide = sideTraces(procedural, reference, 'paired');
  const refSide = sideTraces(reference, procedural, 'paired');
  const procExt = bodyExtent(procSide.whole, procSide.hull);
  const procPairedExt = bodyExtent(procPairedSide.whole, geometryComponentMasksAvailable ? procPairedSide.hull : null);
  const refExt = bodyExtent(refSide.whole, geometryComponentMasksAvailable ? refSide.hull : null);
  const procRoofTop = bodyExtent(sideTraces(procedural, reference, 'roof').whole)?.hMax;
  // columns are CENTERS: a span between first/last centers is one pitch
  // short of the physical extent (refs self-measured ~3% narrow on width)
  const colPitch = (curve) => {
    let prev = null;
    for (const p of curve) { if (p) { if (prev !== null) return Math.abs(p[0] - prev); } if (p) prev = p[0]; }
    return 0;
  };
  const fullSpan = (curve) => {
    let a = null, b = null;
    for (const p of curve) if (p) { if (a === null) a = p[0]; b = p[0]; }
    return a === null ? 0 : Math.abs(b - a);
  };
  const colSpan = (curve, minBand) => {
    let a = null, b = null;
    for (const p of curve) if (p && p[1] - p[2] > minBand) { if (a === null) a = p[0]; b = p[0]; }
    return a === null ? 0 : Math.abs(b - a);
  };
  const dimRows = [];
  const specDimensions = spec.dims || {};
  const dimCheck = (name, actual, published, extra) => {
    if (!published || !Number.isFinite(actual) || actual <= 0) return;
    const pct = Math.abs(actual - published) / published * 100;
    dimRows.push({ name, actual, published, pct, ...extra });
  };
  const pixelSpanZ = (part, visual = procedural, other = reference, cam = camsG.side) => {
    const m = gMask(visual, other, cam, part);
    const px = 2 * cam.right / GSIZE;
    let minX = null, maxX = null;
    for (let x = 0; x < GSIZE; x++) {
      let lit = false;
      for (let y = 0; y < GSIZE; y++) if (m[y * GSIZE + x]) { lit = true; break; }
      if (!lit) continue;
      if (minX === null) minX = x;
      maxX = x;
    }
    return minX === null ? 0 : (maxX - minX + 1) * px;
  };
  // plan columns run across the WIDTH axis; substantial band = the hull body
  // pixel-resolution width: trace columns quantize to ~11cm when a long
  // gun pins the plan frame; lit-pixel extent resolves to ~2-3cm. The
  // 0.35m band rule applies per pixel column so whip antennas don't count.
  const measurePixelWidth = (visual, other, cam = camsG.plan) => {
    const m = gMask(visual, other, cam, 'whole');
    const half = cam.right;
    const px = 2 * half / GSIZE;
    let minX = null, maxX = null;
    for (let x = 0; x < GSIZE; x++) {
      let top = -1, bot = -1;
      for (let y = 0; y < GSIZE; y++) if (m[y * GSIZE + x]) { if (bot < 0) bot = y; top = y; }
      if (top < 0 || (top - bot + 1) * px < 0.35) continue;
      if (minX === null) minX = x;
      maxX = x;
    }
    return minX === null ? 0 : (maxX - minX + 1) * px;
  };
  // Legacy sources retain published dimensions; historical preservation
  // retains its frozen-original policy. Explicitly certified source-study
  // IDs below use an independent fixed ruler and full physical envelopes.
  let referenceDimensions = withBodyOnly(() => ({
    heightM:refExt?.h, hullLengthM:refExt?.len,
    overallLengthM:pixelSpanZ('whole', reference, procedural),
    widthM:measurePixelWidth(reference, procedural),
  }), 'paired');
  let dimensionFrame = null;
  if (usesSourceDimensionFrame(id,sourceWorldRegistration)) {
    // A candidate-dependent union frame moves96-column percentile bins.
    // Freeze this separate ruler to the hash-verified source alone, and
    // compare like measurements, not filtered width versus full-body width.
    // The additional full3D envelopes catch any out-of-frame excess.
    const side=sourceDimensionCamera(referenceBox,TRUE_AXES.side);
    const plan=sourceDimensionCamera(referenceBox,TRUE_AXES.plan);
    const measure=(visual,other)=>withBodyOnly(()=>{
      const body=bodyExtent(gTrace(gMask(visual,other,side,'whole'),side),
        geometryComponentMasksAvailable?gTrace(gMask(visual,other,side,'hullBody'),side):null);
      return {heightM:body?.h,hullLengthM:body?.len,
        overallLengthM:pixelSpanZ('whole',visual,other,side),
        widthM:measurePixelWidth(visual,other,plan)};
    },'paired');
    referenceDimensions=measure(reference,procedural);
    const actual=measure(procedural,reference);
    // the ruler stays framed by the whole source; the physical envelopes are the bodies'
    dimRows.push(...sourceDimensionRows(referenceDimensions,actual,
      withBodyOnly(()=>visibleBox(reference.root),'paired'),withBodyOnly(()=>visibleBox(procedural.root),'paired'),
      SOURCE_WORLD_BUILD_OFFSETS[id]));
    dimensionFrame={mode:'source-only-fixed-v1',sourceBounds:{min:referenceBox.min.toArray(),max:referenceBox.max.toArray()},
      side:{projection:side.projectionMatrix.toArray(),world:side.matrixWorld.toArray()},
      plan:{projection:plan.projectionMatrix.toArray(),world:plan.matrixWorld.toArray()},actual};
  } else {
    const pub = preservationDimensionTargets(source, id, preservation ? referenceDimensions : {}, specDimensions);
    const publishedHeight = pub.silhouetteHeightM ?? pub.heightM;
    const ext = preservation ? procPairedExt : procExt;
    if (preservation && ext) dimCheck('heightM', ext.h, publishedHeight);
    else if (ext && publishedHeight && Number.isFinite(procRoofTop)) dimRows.push({ name:'heightM', actual:ext.h,
      roofFittingsTop:Math.max(ext.h, procRoofTop), published:publishedHeight, method:'interval: body top to roof-fittings top',
      pct:heightIntervalPct(ext.h, procRoofTop, publishedHeight) });
    const donorId = FLEET_RENEWAL_DONORS[id] ?? spec.variantOf;
    const ownOracle = source?.glb?.path && source.glb.path !== (LOCAL_REFERENCE_OVERRIDES[donorId] || MODEL_SOURCE[donorId])?.glb?.path;
    const { published: hullTarget, ...hullBasis } = hullLengthTarget(pub, preservation ? null : TANK_SPECS[donorId]?.dims,
      ownOracle ? referenceDimensions.hullLengthM : null);
    if (ext) dimCheck('hullLengthM', ext.len, hullTarget, hullBasis);
    dimCheck('overallLengthM', withBodyOnly(() => pixelSpanZ('whole')), pub.silhouetteOverallLengthM ?? pub.overallLengthM);
    dimCheck('widthM', withBodyOnly(() => measurePixelWidth(procedural, reference)), pub.silhouetteWidthM ?? pub.widthM);
  }
  const dimScore = clamp01(100 - dimRows.reduce((s, d) => s + Math.max(0, d.pct - 1) * 8, 0));
  // Floater detection: connected components of the whole mask across poses.
  const islands = (raw) => {
    // two-pass dilation bridges aliasing gaps on thin antennas/chains
    let mask = raw;
    for (let pass = 0; pass < 2; pass++) {
      const next = new Uint8Array(mask.length);
      for (let y = 0; y < GSIZE; y++) for (let x = 0; x < GSIZE; x++) {
        const i = y * GSIZE + x;
        if (mask[i] || (x > 0 && mask[i - 1]) || (x < GSIZE - 1 && mask[i + 1]) ||
            (y > 0 && mask[i - GSIZE]) || (y < GSIZE - 1 && mask[i + GSIZE])) next[i] = 1;
      }
      mask = next;
    }
    const seen = new Uint8Array(mask.length);
    const regions = [];
    const stack = [];
    for (let i = 0; i < mask.length; i++) {
      if (!mask[i] || seen[i]) continue;
      let area = 0, minX = GSIZE, minY = GSIZE, maxX = -1, maxY = -1;
      stack.push(i); seen[i] = 1;
      while (stack.length) {
        const j = stack.pop(); area++;
        const x = j % GSIZE, y = (j / GSIZE) | 0;
        minX = Math.min(minX, x); minY = Math.min(minY, y);
        maxX = Math.max(maxX, x); maxY = Math.max(maxY, y);
        for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
          const nx = x + dx, ny = y + dy;
          if (nx < 0 || ny < 0 || nx >= GSIZE || ny >= GSIZE) continue;
          const k = ny * GSIZE + nx;
          if (mask[k] && !seen[k]) { seen[k] = 1; stack.push(k); }
        }
      }
      if (area > 400) regions.push({ area, minX, minY, maxX, maxY }); // chains/straps read as small islands
    }
    return regions;
  };
  let floaterFails = 0;
  const floaterRows = [];
  {
    const turretN = procedural.root.getObjectByName('rig_turret');
    const gunN = procedural.root.getObjectByName('rig_gun');
    const dep = spec.gunDepressionDeg ?? 8, elev = spec.gunElevationDeg ?? 15;
    const poses = [[0, 0], [90, 0], [180, 0], [0, -dep], [0, elev]];
    const camF = cameraFor(ANGLES.frontRight);
    for (const [yaw, pitch] of poses) {
      if (turretN) turretN.rotation.y = yaw * Math.PI / 180;
      if (gunN) gunN.rotation.x = -pitch * Math.PI / 180;
      procedural.root.updateMatrixWorld(true);
      const rawFloaterMask = gMask(procedural, reference, camF, 'whole');
      const regions = islands(rawFloaterMask);
      floaterRows.push({ yaw, pitch, islandCount: regions.length, regions });
      if (regions.length > 1) floaterFails++;
    }
    if (turretN) turretN.rotation.y = 0;
    if (gunN) gunN.rotation.x = 0;
    procedural.root.updateMatrixWorld(true);
  }
  const floaterScore = floaterFails ? 0 : 100;
  // For a declared fused reference, the 1-D curve extrema are dominated by
  // whichever mixed-owner fitting happens to occupy a sampled column (the
  // Type 99 oracle's antenna/cheek mesh is the concrete case). The valid
  // geometry evidence is then the already-computed registered whole mask in
  // every standard view. Use its worst view as the whole-shape component;
  // component-capable references retain the stricter metric curve minimum.
  const wholeShapeScore = geometryComponentMasksAvailable
    ? Math.min(...['side_whole', 'plan_whole', 'front_whole'].map((k) => curveRows[k].score))
    : Math.min(...Object.values(angleRows).map((row) => row.score));
  const components = {
    ...(geometryComponentMasksAvailable ? {
      hullCurves: Math.min(...['side_hull', 'plan_hull', 'front_hull'].map((k) => curveRows[k].score)),
      stations: stationScore,
    } : {}),
    ...(turretComponentMasksAvailable ? {
      turretCurves: Math.min(turretRows.side.score, turretRows.plan.score),
    } : {}),
    wholeCurves: wholeShapeScore,
    dims: dimScore,
    floaters: floaterScore,
  };
  const geometryGate=evaluateGeometryGate({qualityBar:source?.qualityBar,components});
  const geoMin = geometryGate.geoMin;
  window.__GEO_CURVES = curves;                                              // italy §5.248: raw trace export for builder-lane column decode (score-neutral)
  window.__GEO_REPORT = {
    id, geoMin: +geoMin.toFixed(1), requiredMinimum: requiredFidelity,
    registration:sourceWorldRegistration || {mode:'legacy-hull-translation'},
    comparisonPurpose:photoSupplement ? 'source-body-and-photo-arrangement' : ownerKit ? 'source-without-owner-kit' : preservation ? 'preservation' : 'source-fidelity',
  ...(comparisonScope ? {comparisonScope} : {}),
    dimensionTarget:dimensionFrame ? 'hash-pinned source: fixed ruler plus full physical envelope'
      : preservation ? 'hash-pinned historical first-party baseline' : 'published specification',
    ...(dimensionFrame ? {dimensionFrame} : {}),
    ...(preservation ? { preservationBaseline:preservation } : {}),
    qualityBar: source?.qualityBar || 'fleet', gatePassed: geometryGate.gatePassed,
    rawGeoMin:geoMin,rawComponents:components,
    components: Object.fromEntries(Object.entries(components).map(([k, v]) => [k, +(+v).toFixed(1)])),
    wholeShapeMetric: geometryComponentMasksAvailable ? 'metric-curves' : 'registered-standard-view-masks (fused reference)',
    stationMethod: sourceWorldRegistration ? 'exact-triangle-slab-intersections' : 'legacy-uncapped-raster-slices',
    curveRows: Object.fromEntries(Object.entries(curveRows).map(([k, v]) => [k, v])),
    turretRows, stationErr, dimRows, referenceDimensions,
    referenceBodyExtent: refExt && { h: +refExt.h.toFixed(3), len: +refExt.len.toFixed(3) },
    proceduralBodyExtent: procExt && { h: +procExt.h.toFixed(3), len: +procExt.len.toFixed(3),
      ...(Number.isFinite(procRoofTop) ? { roofFittingsTop: +Math.max(procExt.h, procRoofTop).toFixed(3) } : {}) },
    ...(roofFittingsExcluded ? { roofFittingsExcluded } : {}),
    ...(roofFittingsExcluded && (dimensionFrame || preservation) ? { oracleComparison:{ antennasDropped:paired.named.antenna,
      roofWeaponsDropped:paired.named.weapon, rule:'a kind of roof fitting leaves both models only where the oracle names it' } } : {}),
    floaterFails, floaterRows,
  };
  setPart(reference.root, 'whole');
  setPart(procedural.root, 'whole');
  renderer.setSize(SIZE, SIZE, false);
  gtarget.dispose();
}

// Diagnosis hook for headless probes (ancestry/classification questions).
window.__FIDELITY_DEBUG = {
  reference, procedural, setPart, baseVisible, renderMask, cameraFor, ANGLES,
  TRUE_AXES, bounds, alignMask, rawMasks, rawDirectTurretMasks,
};
window.__FIDELITY_READY=true;
renderer.setRenderTarget(null);
}
</script>
