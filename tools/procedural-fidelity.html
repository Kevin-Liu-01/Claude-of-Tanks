function forEachBoxCorner(box, fn) {
  for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) {
    for (const z of [box.min.z, box.max.z]) fn(new THREE.Vector3(x, y, z));

function visibleBox(root) {
  const result = new THREE.Box3();

  const instance = new THREE.Matrix4();
  const world = new THREE.Matrix4();
  root.updateMatrixWorld(true);
  root.traverse((o) => {
    if (!isRenderNode(o) || !baseVisible.get(o)) return;
    if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
    if (!o.geometry.boundingBox) return;
    local.copy(o.geometry.boundingBox);
    if (o.isInstancedMesh) {
      for (let i=0; i<o.count; i++) {
        o.getMatrixAt(i, instance);
        world.multiplyMatrices(o.matrixWorld, instance);
        forEachBoxCorner(local, (p) => result.expandByPoint(p.applyMatrix4(world)));
      }
    } else {
      forEachBoxCorner(local, (p) => result.expandByPoint(p.applyMatrix4(o.matrixWorld)));
    }
  });

}

function cameraFor(direction) {
  const dir = direction.clone().normalize();
  const nominalUp = Math.abs(dir.y) > 0.9 ? new THREE.Vector3(0, 0, -1) : new THREE.Vector3(0, 1, 0);
  const right = new THREE.Vector3().crossVectors(nominalUp, dir).normalize();

  }
  const half = Math.max((maxX-minX)/2, (maxY-minY)/2, 0.5) * 1.08;
  const camera = new THREE.OrthographicCamera(-half, half, half, -half, 0.1, 200);
  camera.position.copy(center).addScaledVector(dir, 60);
  camera.up.copy(up);
  camera.lookAt(center);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
  return camera;
}

function setPart(root, part) {

      || (part === 'turret' && isBelow(o, turret));

}

function renderMask(visual, other, camera, part='whole') {

}

function bounds(mask) {
  let minX=SIZE, minY=SIZE, maxX=-1, maxY=-1, area=0, sx=0, sy=0;
  for (let y=0; y<SIZE; y++) for (let x=0; x<SIZE; x++) {
    if (!mask[y*SIZE+x]) continue;
    area++; sx+=x; sy+=y;
    minX=Math.min(minX,x); maxX=Math.max(maxX,x); minY=Math.min(minY,y); maxY=Math.max(maxY,y);
  }
  return { minX,minY,maxX,maxY,area,cx:area?sx/area:0,cy:area?sy/area:0,
    width:area?maxX-minX+1:0,height:area?maxY-minY+1:0 };
}

function alignMask(referenceMask, candidateMask) {
  const ra=bounds(referenceMask), cb=bounds(candidateMask);
  if (!ra.area || !cb.area) return candidateMask;
  // Asset origins are authoring metadata, not vehicle geometry.  Register the
  // two silhouettes by their image centroid before scoring so an off-centre
  // Blender origin cannot cost a physically identical shape 20 points.
  const dx=Math.round(ra.cx-cb.cx), dy=Math.round(ra.cy-cb.cy);
  if (!dx && !dy) return candidateMask;
  const shifted=new Uint8Array(candidateMask.length);
  for (let y=0;y<SIZE;y++) for(let x=0;x<SIZE;x++) {
    const sx=x-dx,sy=y-dy;
    if (sx>=0&&sx<SIZE&&sy>=0&&sy<SIZE) shifted[y*SIZE+x]=candidateMask[sy*SIZE+sx];
  }
  return shifted;
}

function compare(a, candidate) {
  const b=alignMask(a,candidate);
  let intersection=0, union=0;
  for (let i=0; i<a.length; i++) { intersection += a[i] && b[i] ? 1 : 0; union += a[i] || b[i] ? 1 : 0; }
  const ba=bounds(a), bb=bounds(b);
  if (!union) return { score:100, iou:1, areaSimilarity:1, bboxSimilarity:1, centroidSimilarity:1 };
  const iou = intersection/union;
  const areaSimilarity = Math.min(ba.area,bb.area)/Math.max(ba.area,bb.area,1);
  const dw=Math.abs(ba.width-bb.width)/Math.max(ba.width,bb.width,1);
  const dh=Math.abs(ba.height-bb.height)/Math.max(ba.height,bb.height,1);
  const bboxSimilarity=Math.max(0,1-(dw+dh)/2);
  const dc=Math.hypot(ba.cx-bb.cx,ba.cy-bb.cy)/Math.max(Math.hypot(ba.width,ba.height),1);
  const centroidSimilarity=Math.max(0,1-dc*2);
  const score=(iou*.70+areaSimilarity*.15+bboxSimilarity*.10+centroidSimilarity*.05)*100;
  return { score, iou, areaSimilarity, bboxSimilarity, centroidSimilarity, referenceArea:ba.area, proceduralArea:bb.area };

function lowerBand(a, b) {

    cam.updateMatrixWorld(true);
    return cam;
  };
  const addBoard = (title, canvas) => {
    canvas.style.width = `${canvas.width}px`;
    const figure = document.createElement('figure');
    const caption = document.createElement('figcaption');
    caption.innerHTML = `<span>${title}</span>`;
    figure.append(canvas, caption);
    boardDiv.append(figure);
  };
  const refCam = heroCameraFor(reference.root);
  const procCam = heroCameraFor(procedural.root);

  { // shaded hero pair, 1600 px combined
    const px = 800;
    const cv = document.createElement('canvas'); cv.width = px * 2; cv.height = px;
    const ctx = cv.getContext('2d');
    shadedInto(ctx, reference, procedural, refCam, 0, 0, px);
    shadedInto(ctx, procedural, reference, procCam, px, 0, px);
    addBoard('shaded — reference | procedural', cv);
  }

  { // articulation: turret -90/0/+90/180 at level gun, then gun -dep/+elev.
    // Reference row above procedural row so detached/floating children in
    // either rig are directly comparable cell by cell.
    const dep = spec.gunDepressionDeg ?? 8;
    const elev = spec.gunElevationDeg ?? 15;
    const poses = [
      { yawDeg: -90, pitchDeg: 0 }, { yawDeg: 0, pitchDeg: 0 },
      { yawDeg: 90, pitchDeg: 0 }, { yawDeg: 180, pitchDeg: 0 },
      { yawDeg: 0, pitchDeg: -dep }, { yawDeg: 0, pitchDeg: elev },
    ];
    const px = 380;
    const cv = document.createElement('canvas'); cv.width = px * poses.length; cv.height = px * 2;
    const ctx = cv.getContext('2d');
    const applyPose = (visual, pose) => {
      const turret = visual.root.getObjectByName('rig_turret');
      const gun = visual.root.getObjectByName('rig_gun');
      if (turret) turret.rotation.y = pose.yawDeg * Math.PI / 180;
      if (gun) gun.rotation.x = -pose.pitchDeg * Math.PI / 180;
      visual.root.updateMatrixWorld(true);
    };
    poses.forEach((pose, i) => {
      applyPose(reference, pose);
      shadedInto(ctx, reference, procedural, refCam, i * px, 0, px);
      applyPose(procedural, pose);
      shadedInto(ctx, procedural, reference, procCam, i * px, px, px);
    });
    for (const visual of [reference, procedural]) applyPose(visual, { yawDeg: 0, pitchDeg: 0 });
    addBoard(`articulation — turret −90/0/+90/180 · gun −${dep}°/+${elev}° (reference top, procedural bottom)`, cv);
  }

  { // 24-frame procedural turntable at 15° — continuity / floating-part sweep
    const px = 300, cols = 8;
    const cv = document.createElement('canvas'); cv.width = px * cols; cv.height = px * 3;
    const ctx = cv.getContext('2d');
    const baseYaw = procedural.root.rotation.y;
    for (let i = 0; i < 24; i++) {
      procedural.root.rotation.y = baseYaw + i * (Math.PI / 12);
      procedural.root.updateMatrixWorld(true);
      shadedInto(ctx, procedural, reference, procCam, (i % cols) * px, Math.floor(i / cols) * px, px);
    }
    procedural.root.rotation.y = baseYaw;
    procedural.root.updateMatrixWorld(true);
    addBoard('procedural turntable — 24 × 15°', cv);
  }
}

// ---- &profiles=1: measure the REFERENCE model into authoring data --------
// Silhouette polylines + station cross-sections extracted from ortho mask
// renders (never vertex data): the from-scratch rebuild program authors
// procedural geometry against these measured curves. All values in the
// width-normalized world meters the game/lab share.
if (params.get('profiles')) {
  const PSIZE = 1024;
  const ptarget = new THREE.WebGLRenderTarget(PSIZE, PSIZE, { depthBuffer:true, stencilBuffer:false });
  const readMask = (camera, part) => {
    reference.root.visible = true;
    procedural.root.visible = false;
    setPart(reference.root, part);
    renderer.setRenderTarget(ptarget);
    renderer.setSize(PSIZE, PSIZE, false);
    renderer.clear(true, true, true);
    renderer.render(scene, camera);
    const rgba = new Uint8Array(PSIZE * PSIZE * 4);
    renderer.readRenderTargetPixels(ptarget, 0, 0, PSIZE, PSIZE, rgba);
    const m = new Uint8Array(PSIZE * PSIZE);
    for (let i = 0; i < m.length; i++) m[i] = rgba[i * 4] > 40 ? 1 : 0;
    return m;
  };
  // Column trace: for each pixel column, the top/bottom silhouette edge in
  // world units. Returns ~N stations of [along, top, bottom].
  const trace = (mask, cam, N = 96) => {
    const half = cam.right; // symmetric ortho
    const toWorldX = (px) => ((px + 0.5) / PSIZE * 2 - 1) * half;
    const toWorldY = (py) => ((py + 0.5) / PSIZE * 2 - 1) * half;
    const out = [];
    const step = PSIZE / N;
    for (let c = 0; c < N; c++) {
      const x0 = Math.floor(c * step), x1 = Math.min(PSIZE, Math.floor((c + 1) * step));
      let top = -1, bot = -1;
      for (let x = x0; x < x1; x++) {
        for (let y = PSIZE - 1; y >= 0; y--) if (mask[y * PSIZE + x]) { if (y > top) top = y; break; }
        for (let y = 0; y < PSIZE; y++) if (mask[y * PSIZE + x]) { if (bot < 0 || y < bot) bot = y; break; }
      }
      if (top >= 0) out.push([Number(toWorldX((x0 + x1) / 2).toFixed(3)),
        Number(toWorldY(top).toFixed(3)), Number(toWorldY(bot).toFixed(3))]);
    }
    return out;
  };
  const refBox = visibleBox(reference.root);
  const rc = refBox.getCenter(new THREE.Vector3());
  const mkCam = (dir) => {
    const c = cameraFor(dir);
    return c;
  };
  // Side (camera on +x): columns = world -z (flip to +z later), rows = world y.
  const sideCam = mkCam(TRUE_AXES.side);
  const topCam = mkCam(TRUE_AXES.plan);
  const frontCam = mkCam(TRUE_AXES.front);
  const profiles = {
    id, generated: 'mask-trace-1024',
    frame: { center: rc.toArray().map((v) => Number(v.toFixed(3))),
      box: { min: refBox.min.toArray().map((v)=>Number(v.toFixed(3))), max: refBox.max.toArray().map((v)=>Number(v.toFixed(3))) } },
    // whole-vehicle: side profile (z, deckY, bellyY), plan (z, +x half-width),
    // front (x, topY, bottomY)
    side_whole: trace(readMask(sideCam, 'whole'), sideCam),
    side_hull: trace(readMask(sideCam, 'hull'), sideCam),
    plan_whole: trace(readMask(topCam, 'whole'), topCam),
    plan_hull: trace(readMask(topCam, 'hull'), topCam),
    front_whole: trace(readMask(frontCam, 'whole'), frontCam),
    front_hull: trace(readMask(frontCam, 'hull'), frontCam),
  };
  // Station cross-sections: slice the front camera's near/far around 12 z
  // stations; each slice's mask bounds give hull width/height at that station.
  const size = refBox.getSize(new THREE.Vector3());
  const stations = [];
  const S = 14;
  for (let i = 0; i < S; i++) {
    const z0 = refBox.min.z + (i / S) * size.z;
    const z1 = refBox.min.z + ((i + 1) / S) * size.z;
    const cam = mkCam(TRUE_AXES.front);
    // camera sits at center + dir*60 looking -dir; distance to plane z=zs:
    const camZ = cam.position.z;
    cam.near = Math.max(0.1, camZ - z1);
    cam.far = camZ - z0;
    cam.updateProjectionMatrix();
    const m = readMask(cam, 'whole');
    // bounds in world units
    let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9, area = 0;
    const half = cam.right;
    for (let y = 0; y < PSIZE; y++) for (let x = 0; x < PSIZE; x++) {
      if (!m[y * PSIZE + x]) continue;
      area++;
      const wx = ((x + 0.5) / PSIZE * 2 - 1) * half;
      const wy = ((y + 0.5) / PSIZE * 2 - 1) * half;
      if (wx < minX) minX = wx; if (wx > maxX) maxX = wx;
      if (wy < minY) minY = wy; if (wy > maxY) maxY = wy;
    }
    stations.push(area ? {
      z: Number(((z0 + z1) / 2).toFixed(3)),
      w: Number((maxX - minX).toFixed(3)), x0: Number(minX.toFixed(3)), x1: Number(maxX.toFixed(3)),
      y0: Number(minY.toFixed(3)), y1: Number(maxY.toFixed(3)),
    } : { z: Number(((z0 + z1) / 2).toFixed(3)), empty: true });
  }
  profiles.stations = stations;
  setPart(reference.root, 'whole');
  renderer.setSize(SIZE, SIZE, false);
  ptarget.dispose();
  window.__PROFILES = profiles;
}

// ---- &geo=1: THE GEOMETRY GATE --------------------------------------------
// Authoritative curve-to-curve comparison. Extracts the SAME measured curves
// from BOTH models with the same pipeline (no self-reporting), then scores:
//   curves   — mean+max deviation between ref/proc silhouette polylines,
//              normalized by vehicle size (side/plan/front, whole + hull)
//   turret   — the subtracted (whole−hull) curves, scored separately so the
//              historically weakest assembly can never hide in an average
//   stations — per-station width/top/bottom errors across 14 hull slices
//   dims     — the PROCEDURAL build vs PUBLISHED spec dims (anchors to the
//              real vehicle: a defective oracle cannot drag the build wrong)
//   floaters — connected-component check across articulation poses (a
//              detached mesh island fails the gate outright)
// GATE: every component >= 90. min() is the headline. No averaging.
if (params.get('geo')) {
  const GSIZE = 1024;
  const gtarget = new THREE.WebGLRenderTarget(GSIZE, GSIZE, { depthBuffer:true, stencilBuffer:false });
  const gMask = (visual, other, camera, part) => {
    visual.root.visible = true; other.root.visible = false;
    setPart(visual.root, part);
    renderer.setRenderTarget(gtarget);
    renderer.setSize(GSIZE, GSIZE, false);
    renderer.clear(true, true, true);
    renderer.render(scene, camera);
    const rgba = new Uint8Array(GSIZE * GSIZE * 4);
    renderer.readRenderTargetPixels(gtarget, 0, 0, GSIZE, GSIZE, rgba);
    const m = new Uint8Array(GSIZE * GSIZE);
    for (let i = 0; i < m.length; i++) m[i] = rgba[i * 4] > 40 ? 1 : 0;
    return m;
  };
  const gTrace = (mask, cam, N = 96) => {
    const half = cam.right;
    const out = [];
    const step = GSIZE / N;
    for (let c = 0; c < N; c++) {
      const x0 = Math.floor(c * step), x1 = Math.min(GSIZE, Math.floor((c + 1) * step));
      let top = -1, bot = -1;
      for (let x = x0; x < x1; x++) {
        for (let y = GSIZE - 1; y >= 0; y--) if (mask[y * GSIZE + x]) { if (y > top) top = y; break; }
        for (let y = 0; y < GSIZE; y++) if (mask[y * GSIZE + x]) { if (bot < 0 || y < bot) bot = y; break; }
      }
      out.push(top >= 0 ? [((x0 + x1) / 2 + 0.5) / GSIZE * 2 * half - half,
        ((top + 0.5) / GSIZE * 2 - 1) * half, ((bot + 0.5) / GSIZE * 2 - 1) * half] : null);
    }
    return out;
  };
  const clamp01 = (v) => Math.max(0, Math.min(100, v));
  // Curve deviation: mean+max |ref−proc| over columns where BOTH exist, plus
  // a coverage penalty where exactly one silhouette exists (missing/excess
  // volume is worse than displaced volume).
  const curveScore = (refC, procC, normDim, fixedReg) => {
    // Registration: translation-only, BOTH axes. The two models sit at
    // different world spots in the shared camera, so align each curve pair by
    // its valid-span midpoint (along) and mean band center (vertical), then
    // resample the procedural curve onto the reference stations. Shape error
    // survives untouched; placement error disappears. fixedReg pins BOTH
    // offsets to the whole-vehicle frame so hull/turret PLACEMENT counts —
    // without it a turret 40 cm out of position would self-register away.
    const span = (c) => {
      let a = null, b = null;
      for (const p of c) if (p) { if (a === null) a = p[0]; b = p[0]; }
      return a === null ? null : [a, b];
    };
    // registration uses BODY columns only: a barrel fused into a print's
    // hull mesh is band-thin and must not steer the frame midpoint
    const bodySpan = (c) => {
      const cols = c.filter(Boolean);
      if (!cols.length) return null;
      const rough = Math.max(...cols.map((p) => p[1])) - Math.min(...cols.map((p) => p[2]));
      let a = null, b = null;
      for (const p of c) if (p && p[1] - p[2] > rough * 0.12) { if (a === null) a = p[0]; b = p[0]; }
      return a === null ? null : [a, b];
    };
    const rs = span(refC), ps = span(procC);
    const rsB = bodySpan(refC) || rs, psB = bodySpan(procC) || ps;
    if (!rs || !ps) return { score: 0, meanPct: 100, maxPct: 100, coverPct: 100 };
    const dAlong = fixedReg ? fixedReg.dAlong : (rsB[0] + rsB[1]) / 2 - (psB[0] + psB[1]) / 2;
    const valid = procC.filter(Boolean);
    const interp = (along) => {
      const a = along - dAlong;                 // sample in proc's own frame
      if (a < ps[0] - 0.02 || a > ps[1] + 0.02) return null;
      let lo = null, hi = null;
      for (const p of valid) {
        if (p[0] <= a && (!lo || p[0] > lo[0])) lo = p;
        if (p[0] >= a && (!hi || p[0] < hi[0])) hi = p;
      }
      // TRIM-BOUNDARY CLAMP (centurion push-2 find, 2026-08-05): the span
      // check above deliberately admits a ±0.02 band past the end columns,
      // but with no column beyond the edge the lo/hi lookup nulled every
      // sample in that band — sub-2cm edge overhangs (dAlong half-pitch
      // pairings at the turret trim window) read as fake cover (~2.9 pts
      // on the centurion turret_side rows). Clamp to the edge column
      // inside the already-declared tolerance; beyond it stays null.
      if (!hi && lo && a - lo[0] <= 0.02) return [a, lo[1], lo[2]];
      if (!lo && hi && hi[0] - a <= 0.02) return [a, hi[1], hi[2]];
      if (!lo || !hi) return null;
      if (hi[0] === lo[0]) return lo;
      const t = (a - lo[0]) / (hi[0] - lo[0]);
      return [a, lo[1] + (hi[1] - lo[1]) * t, lo[2] + (hi[2] - lo[2]) * t];
    };
    let dy = 0;
    if (fixedReg) { dy = fixedReg.dy; } else {
      let dySum = 0, dyN = 0;
      for (const r of refC) if (r) { const p = interp(r[0]); if (p) { dySum += ((r[1] + r[2]) - (p[1] + p[2])) / 2; dyN++; } }
      dy = dyN ? dySum / dyN : 0;
    }
    const errs = [], cols = [];
    let onlyOne = 0, either = 0;
    let pitch = 0;
    { let prev = null;
      for (const p of refC) { if (p) { if (prev !== null) { pitch = Math.abs(p[0] - prev); break; } prev = p[0]; } } }
    const margin = Math.max(0.05, pitch * 0.75);
    for (const p of procC) {          // proc-only columns: geometry the ref
      if (!p) continue;               // doesn't have (e.g. excess overhang)
      either++;
      const a = p[0] + dAlong;
      if (a < rs[0] - margin || a > rs[1] + margin) onlyOne++;
    }
    for (const r of refC) {
      if (!r) continue;
      either++;
      const p = interp(r[0]);
      if (!p) { onlyOne++; continue; }
      const e = (Math.abs(r[1] - (p[1] + dy)) + Math.abs(r[2] - (p[2] + dy))) / 2;
      errs.push(e);
      cols.push({ at: +r[0].toFixed(2), refTop: +r[1].toFixed(2), refBot: +r[2].toFixed(2),
        procTop: +(p[1] + dy).toFixed(2), procBot: +(p[2] + dy).toFixed(2), errM: +e.toFixed(3) });
    }
    if (!errs.length) return { score: 0, meanPct: 100, p95Pct: 100, coverPct: 100 };
    cols.sort((a, b) => b.errM - a.errM);
    const worst = cols.slice(0, 12);
    errs.sort((a, b) => a - b);
    const meanPct = (errs.reduce((a, b) => a + b, 0) / errs.length) / normDim * 100;
    // p95 instead of raw max: one aliased column or fitting edge must not own
    // the score; systematic shape error still shows in the tail.
    const p95Pct = errs[Math.min(errs.length - 1, Math.floor(errs.length * 0.95))] / normDim * 100;
    const coverPct = either ? onlyOne / either * 100 : 0;
    return { score: Math.max(0, Math.min(100, 100 - 12 * meanPct - 0.6 * p95Pct - 1.5 * coverPct)),
      meanPct: +meanPct.toFixed(2), p95Pct: +p95Pct.toFixed(2), coverPct: +coverPct.toFixed(2),
      reg: { dAlong: +dAlong.toFixed(3), dy: +dy.toFixed(3) }, worst };
  };
  const sub = (whole, hull) => whole.map((w, i) => {
    const h = hull[i];
    if (!w) return null;
    if (!h) return w;                       // hull absent → whole IS upper here
    return w[1] - h[1] > 0.04 ? [w[0], w[1], h[1]] : null; // upper band only
  });

  const refBoxG = visibleBox(reference.root);
  const height = refBoxG.max.y - refBoxG.min.y;
  const length = refBoxG.max.z - refBoxG.min.z;
  const camsG = { side: cameraFor(TRUE_AXES.side), plan: cameraFor(TRUE_AXES.plan), front: cameraFor(TRUE_AXES.front) };
  const curves = {};
  for (const [view, cam] of Object.entries(camsG)) {
    for (const part of ['whole', 'hull']) {
      curves[`${view}_${part}_ref`] = gTrace(gMask(reference, procedural, cam, part), cam);
      curves[`${view}_${part}_proc`] = gTrace(gMask(procedural, reference, cam, part), cam);
    }
  }
  // plan-view band errors live on the LENGTH axis (z); side/front on height
  const norm = { side: height, plan: length, front: height };
  const curveRows = {};
  const viewReg = {};
  for (const view of ['side', 'plan', 'front']) {
    // hull anchors the frame: it contains no barrel, so gun-length deltas
    // cannot shift registration (dims stays satisfiable vs short-gun oracles)
    curveRows[`${view}_hull`] = curveScore(curves[`${view}_hull_ref`], curves[`${view}_hull_proc`], norm[view]);
    viewReg[view] = curveRows[`${view}_hull`].reg; // may be undefined if hull empty
    curveRows[`${view}_whole`] = curveScore(
      curves[`${view}_whole_ref`], curves[`${view}_whole_proc`], norm[view], viewReg[view]);
  }
  for (const view of ['side', 'plan']) {
    curves[`${view}_turret_ref`] = gTrace(gMask(reference, procedural, camsG[view], 'turret'), camsG[view]);
    curves[`${view}_turret_proc`] = gTrace(gMask(procedural, reference, camsG[view], 'turret'), camsG[view]);
  }
  const spanAll = (c) => {
    let a = null, b = null;
    for (const p of c) if (p) { if (a === null) a = p[0]; b = p[0]; }
    return a === null ? null : [Math.min(a, b), Math.max(a, b)];
  };
  const trimToHull = (c, hullC, m = 0.6) => {
    const sp = spanAll(hullC);
    if (!sp) return c;
    return c.map((p) => (p && (p[0] < sp[0] - m || p[0] > sp[1] + m)) ? null : p);
  };
  // v11 (ORIENTATION GUARD, owner bug 2026-08-01): translation-only
  // registration is blind to a fore-aft MIRRORED build — t62mv1 shipped
  // with its glacis at the stern and still bulk-overlapped to ~70. Score
  // the hull curve again with the proc curve mirrored about its own span
  // midpoint; if the mirror fits distinctly better, the build faces
  // backwards — hard-zero the row and flag it as a work order.
  {
    const mirror = (c) => {
      const sp = spanAll(c);
      if (!sp) return c;
      const mid = (sp[0] + sp[1]) / 2;
      const out = c.filter(Boolean).map((p) => [2 * mid - p[0], p[1], p[2]]);
      out.sort((a, b) => a[0] - b[0]);
      return out;
    };
    for (const view of ['side', 'plan']) {
      const row = curveRows[`${view}_hull`];
      if (!row || row.score <= 0) continue;
      const mirrored = curveScore(
        curves[`${view}_hull_ref`], mirror(curves[`${view}_hull_proc`]), norm[view]);
      if (mirrored.score > row.score + 8) {
        row.orientationFlip = true;
        row.mirrorScore = +mirrored.score.toFixed(1);
        row.score = 0;
      }
    }
  }
  for (const view of ['side', 'plan']) {
    curves[`${view}_turret_ref`] = trimToHull(curves[`${view}_turret_ref`], curves[`${view}_hull_ref`]);
    curves[`${view}_turret_proc`] = trimToHull(curves[`${view}_turret_proc`], curves[`${view}_hull_proc`]);
  }
  const turretEmpty = (c) => !c.some(Boolean);
  // fixedMount is the committed casemate registration — spec-driven, so an
  // emptied rig_turret can't fake it; the whole/hull curves carry the body.
  const noTurretBoth = source?.glb?.fixedMount
    || (turretEmpty(curves.side_turret_ref) && turretEmpty(curves.side_turret_proc));
  const turretRows = noTurretBoth
    ? { side: { score: 100, note: 'no turret (casemate)' }, plan: { score: 100, note: 'no turret (casemate)' } }
    : {
      side: curveScore(curves.side_turret_ref, curves.side_turret_proc, height, viewReg.side),
      plan: curveScore(curves.plan_turret_ref, curves.plan_turret_proc, length, viewReg.plan),
    };
  // Stations: 14 front-view slices, width/top errors between the two models.
  const stationErr = [];
  {
    const procBoxS = visibleBox(procedural.root);
    // hull z-range from the side HULL mask (no barrel in it): stations stay
    // on the body for both models regardless of gun overhang
    const hullZRange = (visual, other) => {
      const cam = camsG.side;
      const rightVec = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 0);
      const t = gTrace(gMask(visual, other, cam, 'hull'), cam);
      let z0 = 1e9, z1 = -1e9;
      for (const c of t) {
        if (!c) continue;
        const z = cam.position.z + rightVec.z * c[0];
        if (z < z0) z0 = z; if (z > z1) z1 = z;
      }
      return z1 > z0 ? [z0, z1] : null;
    };
    const refZR = hullZRange(reference, procedural);
    const procZR = hullZRange(procedural, reference);
    for (let i = 0; i < 14; i++) {
      const meas = (visual, other, box, zr) => {
        const sz = (zr ? zr[1] - zr[0] : box.max.z - box.min.z);
        const zb = zr ? zr[0] : box.min.z;
        const z0 = zb + (i / 14) * sz, z1 = zb + ((i + 1) / 14) * sz;
        const cam = cameraFor(TRUE_AXES.front);
        cam.near = Math.max(0.1, cam.position.z - z1); cam.far = cam.position.z - z0;
        cam.updateProjectionMatrix();
        const m = gMask(visual, other, cam, 'whole');
        let minX = 1e9, maxX = -1e9, maxY = -1e9, any = false;
        const half = cam.right;
        for (let y = 0; y < GSIZE; y++) for (let x = 0; x < GSIZE; x++) {
          if (!m[y * GSIZE + x]) continue;
          any = true;
          const wx = ((x + 0.5) / GSIZE * 2 - 1) * half, wy = ((y + 0.5) / GSIZE * 2 - 1) * half;
          if (wx < minX) minX = wx; if (wx > maxX) maxX = wx; if (wy > maxY) maxY = wy;
        }
        return any ? { w: maxX - minX, top: maxY } : null;
      };
      const r = meas(reference, procedural, refBoxG, refZR), p = meas(procedural, reference, procBoxS, procZR);
      if (r && p) stationErr.push({ i,
        wPct: +((Math.abs(r.w - p.w) / Math.max(r.w, 0.2)) * 100).toFixed(2),
        topPct: +((Math.abs((r.top - refBoxG.min.y) - (p.top - procBoxS.min.y)) / height) * 100).toFixed(2) });
      else if (r || p) stationErr.push({ i, wPct: 100, topPct: 100, onlyOne: true });
    }
  }
  const trimmed = (arr) => {
    const v = arr.slice().sort((a, b) => a - b);
    const keep = v.slice(0, Math.max(1, v.length - 2)); // drop the 2 worst:
    return keep.reduce((a, b) => a + b, 0) / keep.length; // one bustle station
  };                                                       // must not own it
  const mW = trimmed(stationErr.map((e) => e.wPct));
  const mT = trimmed(stationErr.map((e) => e.topPct));
  const stationScore = clamp01(100 - 10 * mW - 10 * mT);
  // Published-dimension anchor: PROCEDURAL vs spec.dims (real vehicle).
  // Antenna-robust: measured from silhouette curves counting only columns
  // whose band thickness exceeds 12% of height (whip antennas/masts are
  // authoring metadata, not the vehicle's published envelope).
  const bodyExtent = (curve) => {
    const cols = curve.filter(Boolean);
    if (!cols.length) return null;
    const rough = Math.max(...cols.map((c) => c[1])) - Math.min(...cols.map((c) => c[2]));
    const body = cols.filter((c) => c[1] - c[2] > rough * 0.12);
    if (!body.length) return null;
    // p95 of column tops: a 2-column antenna mast must not define the roof
    const tops = body.map((c) => c[1]).sort((a, b) => a - b);
    const top = tops[Math.min(tops.length - 1, Math.floor(tops.length * 0.95))];
    const bot = Math.min(...body.map((c) => c[2]));
    return { h: top - bot, len: Math.abs(body[body.length - 1][0] - body[0][0]) };
  };
  const procExt = bodyExtent(curves.side_whole_proc);
  // columns are CENTERS: a span between first/last centers is one pitch
  // short of the physical extent (refs self-measured ~3% narrow on width)
  const colPitch = (curve) => {
    let prev = null;
    for (const p of curve) { if (p) { if (prev !== null) return Math.abs(p[0] - prev); } if (p) prev = p[0]; }
    return 0;
  };
  const fullSpan = (curve) => {
    let a = null, b = null;
    for (const p of curve) if (p) { if (a === null) a = p[0]; b = p[0]; }
    return a === null ? 0 : Math.abs(b - a);
  };
  const colSpan = (curve, minBand) => {
    let a = null, b = null;
    for (const p of curve) if (p && p[1] - p[2] > minBand) { if (a === null) a = p[0]; b = p[0]; }
    return a === null ? 0 : Math.abs(b - a);
  };
  const dimRows = [];
  const pub = spec.dims || {};
  const dimCheck = (name, actual, published) => {
    if (!published || !Number.isFinite(actual) || actual <= 0) return;
    const pct = Math.abs(actual - published) / published * 100;
    dimRows.push({ name, actual: +actual.toFixed(2), published, pct: +pct.toFixed(2) });
  };
  if (procExt) dimCheck('heightM', procExt.h, pub.heightM);
  if (procExt) dimCheck('hullLengthM', procExt.len, pub.hullLengthM);
  const pixelSpanZ = (part) => {
    const cam = camsG.side;
    const m = gMask(procedural, reference, cam, part);
    const px = 2 * cam.right / GSIZE;
    let minX = null, maxX = null;
    for (let x = 0; x < GSIZE; x++) {
      let lit = false;
      for (let y = 0; y < GSIZE; y++) if (m[y * GSIZE + x]) { lit = true; break; }
      if (!lit) continue;
      if (minX === null) minX = x;
      maxX = x;
    }
    return minX === null ? 0 : (maxX - minX + 1) * px;
  };
  dimCheck('overallLengthM', pixelSpanZ('whole'), pub.overallLengthM);
  // plan columns run across the WIDTH axis; substantial band = the hull body
  // pixel-resolution width: trace columns quantize to ~11cm when a long
  // gun pins the plan frame; lit-pixel extent resolves to ~2-3cm. The
  // 0.35m band rule applies per pixel column so whip antennas don't count.
  const pixelWidth = (() => {
    const cam = camsG.plan;
    const m = gMask(procedural, reference, cam, 'whole');
    const half = cam.right;
    const px = 2 * half / GSIZE;
    let minX = null, maxX = null;
    for (let x = 0; x < GSIZE; x++) {
      let top = -1, bot = -1;
      for (let y = 0; y < GSIZE; y++) if (m[y * GSIZE + x]) { if (bot < 0) bot = y; top = y; }
      if (top < 0 || (top - bot + 1) * px < 0.35) continue;
      if (minX === null) minX = x;
      maxX = x;
    }
    return minX === null ? 0 : (maxX - minX + 1) * px;
  })();
  dimCheck('widthM', pixelWidth, pub.widthM);
  const dimScore = clamp01(100 - dimRows.reduce((s, d) => s + Math.max(0, d.pct - 1) * 8, 0));
  // Floater detection: connected components of the whole mask across poses.
  const islands = (raw) => {
    // two-pass dilation bridges aliasing gaps on thin antennas/chains
    let mask = raw;
    for (let pass = 0; pass < 2; pass++) {
      const next = new Uint8Array(mask.length);
      for (let y = 0; y < GSIZE; y++) for (let x = 0; x < GSIZE; x++) {
        const i = y * GSIZE + x;
        if (mask[i] || (x > 0 && mask[i - 1]) || (x < GSIZE - 1 && mask[i + 1]) ||
            (y > 0 && mask[i - GSIZE]) || (y < GSIZE - 1 && mask[i + GSIZE])) next[i] = 1;
      }
      mask = next;
    }
    const seen = new Uint8Array(mask.length);
    let count = 0;
    const stack = [];
    for (let i = 0; i < mask.length; i++) {
      if (!mask[i] || seen[i]) continue;
      let area = 0; stack.push(i); seen[i] = 1;
      while (stack.length) {
        const j = stack.pop(); area++;
        const x = j % GSIZE, y = (j / GSIZE) | 0;
        for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
          const nx = x + dx, ny = y + dy;
          if (nx < 0 || ny < 0 || nx >= GSIZE || ny >= GSIZE) continue;
          const k = ny * GSIZE + nx;
          if (mask[k] && !seen[k]) { seen[k] = 1; stack.push(k); }
        }
      }
      if (area > 400) count++;              // chains/straps read as small islands
    }
    return count;
  };
  let floaterFails = 0;
  {
    const turretN = procedural.root.getObjectByName('rig_turret');
    const gunN = procedural.root.getObjectByName('rig_gun');
    const dep = spec.gunDepressionDeg ?? 8, elev = spec.gunElevationDeg ?? 15;
    const poses = [[0, 0], [90, 0], [180, 0], [0, -dep], [0, elev]];
    const camF = cameraFor(ANGLES.frontRight);
    for (const [yaw, pitch] of poses) {
      if (turretN) turretN.rotation.y = yaw * Math.PI / 180;
      if (gunN) gunN.rotation.x = -pitch * Math.PI / 180;
      procedural.root.updateMatrixWorld(true);
      if (islands(gMask(procedural, reference, camF, 'whole')) > 1) floaterFails++;
    }
    if (turretN) turretN.rotation.y = 0;
    if (gunN) gunN.rotation.x = 0;
    procedural.root.updateMatrixWorld(true);
  }
  const floaterScore = floaterFails ? 0 : 100;
  const components = {
    hullCurves: Math.min(...['side_hull', 'plan_hull', 'front_hull'].map((k) => curveRows[k].score)),
    wholeCurves: Math.min(...['side_whole', 'plan_whole', 'front_whole'].map((k) => curveRows[k].score)),
    turretCurves: Math.min(turretRows.side.score, turretRows.plan.score),
    stations: +stationScore.toFixed(1),
    dims: +dimScore.toFixed(1),
    floaters: floaterScore,
  };
  const geoMin = Math.min(...Object.values(components).map((v) => +v));
  window.__GEO_REPORT = {
    id, geoMin: +geoMin.toFixed(1), gatePassed: geoMin >= 90,
    components: Object.fromEntries(Object.entries(components).map(([k, v]) => [k, +(+v).toFixed(1)])),
    curveRows: Object.fromEntries(Object.entries(curveRows).map(([k, v]) => [k, v])),
    turretRows, stationErr, dimRows, floaterFails,
  };
  setPart(reference.root, 'whole');
  setPart(procedural.root, 'whole');
  renderer.setSize(SIZE, SIZE, false);
  gtarget.dispose();
}

// Diagnosis hook for headless probes (ancestry/classification questions).
window.__FIDELITY_DEBUG = { reference, procedural, setPart, baseVisible, renderMask, cameraFor, ANGLES, bounds };
window.__FIDELITY_READY=true;
renderer.setRenderTarget(null);
</script>
