<!doctype html>
<!-- TEMP (winding fix-round 2026-08-07, sweep items 2-5): ATTRIBUTE mode-1b
     render-deficit pixels to authored pieces. Same build + camera recipe as
     tools/winding-audit.html; per deficit view:
       1. deficit pixel set  = gate(DoubleSide) mask minus game(FrontSide) mask
       2. flat-ID DoubleSide pass (gate visibility) -> front-most node per
          deficit pixel (the culled-face carrier)
       3. per carrier node: connected-piece census (open+closed); pieces are
          scored by projected-AABB overlap with the deficit px bbox and by
          camera-facing area split (a one-sided plane read has ~0 area toward
          the camera). Top pieces dump local+world AABBs and sample triangles
          (local coords match authored builder coordinates for unbaked meshes).
     ?id=<tank>&size=768&views=a,b,c (default: every view with deficit >= 8px)
     Read-only probe: never writes shots/ or ledger rows. -->
<meta charset="utf-8">
<title>tmp-winding-attrib</title>
<script type="module">
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.js';
import { TANK_SPECS } from '/src/vehicles/specs.js';

const params = new URLSearchParams(location.search);
const id = params.get('id') || 't80u';
const S = Math.max(256, Math.min(1024, Number(params.get('size')) || 768));
const out = { id, size: S, views: {} };

try {
  if (!TANK_SPECS[id]) throw new Error('no spec');
  THREE.ColorManagement.enabled = false;
  const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer: null };
  const tank = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
  const root = tank.root;
  root.traverse((o) => {
    if (!o.isLOD) return;
    o.autoUpdate = false;
    o.levels.forEach((level, i) => { if (level.object) level.object.visible = i === 0; });
  });
  root.updateMatrixWorld(true);

  const isRenderNode = (o) => (o.isMesh || o.isInstancedMesh) && o.geometry;
  const firstMat = (o) => (Array.isArray(o.material) ? o.material[0] : o.material);
  const cwFalse = (o) => { const m = firstMat(o); return !!m && m.colorWrite === false; };
  const isShadowNamed = (o) => /shadow/i.test(o.name || '');
  const rigOf = (o) => {
    for (let p = o; p; p = p.parent) if (/^rig_/.test(p.name || '')) return p.name;
    return 'root';
  };
  const effVisible = (o) => { for (let p = o; p; p = p.parent) if (!p.visible) return false; return true; };
  const nodes = [];
  root.traverse((o) => {
    if (!isRenderNode(o) || !effVisible(o)) return;
    const chain = [];
    for (let p = o; p; p = p.parent) chain.unshift(p.name || p.type);
    nodes.push({
      o,
      idx: nodes.length + 1,
      cw: cwFalse(o),
      shadow: isShadowNamed(o),
      rig: rigOf(o),
      chain: chain.join('/'),
      name: `${o.name || (o.userData?.trackBucket ? `bucket_${o.userData.trackBucket}` : (o.isInstancedMesh ? 'IM' : 'mesh'))}#${nodes.length + 1}`,
      vis0: o.visible,
    });
  });

  // ---- render plumbing (audit recipe) ----
  const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false, preserveDrawingBuffer: false });
  renderer.setSize(S, S, false);
  renderer.setPixelRatio(1);
  renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
  renderer.setClearColor(0x000000, 1);
  document.body.appendChild(renderer.domElement);
  const target = new THREE.WebGLRenderTarget(S, S, { depthBuffer: true, stencilBuffer: false });
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xcfd8e0, 0x2a2f26, 1.05));
  const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
  sun.position.set(30, 42, 24);
  scene.add(sun);
  scene.add(root);

  const setPass = (kind) => {
    for (const n of nodes) {
      n.o.visible = kind === 'game' ? (n.vis0 && !n.cw) : (n.vis0 && !n.cw && !n.shadow);
    }
  };
  const buf = new Uint8Array(S * S * 4);
  const shoot = (cam) => {
    renderer.setRenderTarget(target);
    renderer.clear();
    renderer.render(scene, cam);
    renderer.readRenderTargetPixels(target, 0, 0, S, S, buf);
    renderer.setRenderTarget(null);
    return buf.slice();
  };
  const visibleBox = () => {
    const box = new THREE.Box3();
    root.updateMatrixWorld(true);
    for (const n of nodes) {
      if (!n.vis0 || n.cw || n.shadow) continue;
      const o = n.o;
      if (o.isInstancedMesh) {
        if (!o.count) continue;
        o.computeBoundingBox();
        if (o.boundingBox && !o.boundingBox.isEmpty()) box.union(o.boundingBox.clone().applyMatrix4(o.matrixWorld));
        continue;
      }
      if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
      box.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld));
    }
    return box;
  };
  function orthoFor(box, direction) {
    const center = box.getCenter(new THREE.Vector3());
    const dir = direction.clone().normalize();
    const nominalUp = Math.abs(dir.y) > 0.9 ? new THREE.Vector3(0, 0, -1) : new THREE.Vector3(0, 1, 0);
    const right = new THREE.Vector3().crossVectors(nominalUp, dir).normalize();
    const up = new THREE.Vector3().crossVectors(dir, right).normalize();
    let ext = 0.5;
    for (const cx of [box.min.x, box.max.x]) for (const cy of [box.min.y, box.max.y]) for (const cz of [box.min.z, box.max.z]) {
      const d = new THREE.Vector3(cx, cy, cz).sub(center);
      ext = Math.max(ext, Math.abs(d.dot(right)), Math.abs(d.dot(up)));
    }
    const h = ext * 1.06 * 1.1;
    const camera = new THREE.OrthographicCamera(-h, h, h, -h, 0.1, 200);
    camera.position.copy(center).addScaledVector(dir, 60);
    camera.up.copy(up);
    camera.lookAt(center);
    camera.updateProjectionMatrix();
    camera.updateMatrixWorld(true);
    camera.userData.map = { center, half: h, right, up, dir };
    return camera;
  }
  // world -> px (bottom-origin, matches readRenderTargetPixels)
  const worldToPx = (cam, v) => {
    const { center, half, right, up } = cam.userData.map;
    const d = v.clone().sub(center);
    const un = d.dot(right) / half;
    const vn = d.dot(up) / half;
    return [((un + 1) / 2) * S - 0.5, ((vn + 1) / 2) * S - 0.5];
  };

  const VIEWS = {
    front: [0, 0.08, 1], frontleft: [-1, 0.08, 1], left: [-1, 0.05, 0], rearleft: [-1, 0.08, -1],
    rear: [0, 0.08, -1], rearright: [1, 0.08, -1], right: [1, 0.05, 0], frontright: [1, 0.08, 1],
    top: [0, 1, 0.02],
  };
  const viewFilter = (params.get('views') || '').split(',').map((s) => s.trim()).filter(Boolean);
  const frontMask = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.FrontSide });
  const doubleMask = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
  const box0 = visibleBox();
  const lit = (b, i) => b[i * 4] > 90;

  // ---- per-node piece census (open + closed), reused across views ----
  const pieceCache = new Map(); // node idx -> pieces[]
  const censusNode = (n) => {
    if (pieceCache.has(n.idx)) return pieceCache.get(n.idx);
    const g = n.o.geometry;
    const pos = g.getAttribute('position');
    const pieces = [];
    if (!pos || pos.count < 3) { pieceCache.set(n.idx, pieces); return pieces; }
    const idx = g.index;
    const triN = (idx ? idx.count : pos.count) / 3 | 0;
    const vN = pos.count;
    const parent = new Int32Array(vN);
    for (let i = 0; i < vN; i++) parent[i] = i;
    const find = (i) => { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
    const uni = (a, b) => { const ra = find(a), rb = find(b); if (ra !== rb) parent[ra] = rb; };
    const byPos = new Map();
    const q = 1e4;
    for (let i = 0; i < vN; i++) {
      const k = `${Math.round(pos.getX(i) * q)},${Math.round(pos.getY(i) * q)},${Math.round(pos.getZ(i) * q)}`;
      const seen = byPos.get(k);
      if (seen === undefined) byPos.set(k, i); else uni(i, seen);
    }
    const tv = (t, j) => (idx ? idx.getX(t * 3 + j) : t * 3 + j);
    for (let t = 0; t < triN; t++) { uni(tv(t, 0), tv(t, 1)); uni(tv(t, 1), tv(t, 2)); }
    const pk = (i) => {
      const k = `${Math.round(pos.getX(i) * q)},${Math.round(pos.getY(i) * q)},${Math.round(pos.getZ(i) * q)}`;
      return byPos.get(k);
    };
    const pieceOf = new Map();
    const getPiece = (r) => {
      let p = pieceOf.get(r);
      if (!p) {
        p = {
          tris: 0, area: 0, cx: 0, cy: 0, cz: 0,
          edges: new Map(),
          min: [Infinity, Infinity, Infinity], max: [-Infinity, -Infinity, -Infinity],
          faces: [], nSum: [0, 0, 0],
        };
        pieceOf.set(r, p);
      }
      return p;
    };
    const A = new THREE.Vector3(), B = new THREE.Vector3(), C = new THREE.Vector3();
    const AB = new THREE.Vector3(), AC = new THREE.Vector3(), N = new THREE.Vector3();
    for (let t = 0; t < triN; t++) {
      const i0 = tv(t, 0), i1 = tv(t, 1), i2 = tv(t, 2);
      const p = getPiece(find(i0));
      A.fromBufferAttribute(pos, i0); B.fromBufferAttribute(pos, i1); C.fromBufferAttribute(pos, i2);
      AB.subVectors(B, A); AC.subVectors(C, A); N.crossVectors(AB, AC);
      const area = N.length() / 2;
      p.tris++;
      p.area += area;
      const fx = (A.x + B.x + C.x) / 3, fy = (A.y + B.y + C.y) / 3, fz = (A.z + B.z + C.z) / 3;
      p.cx += fx * area; p.cy += fy * area; p.cz += fz * area;
      p.nSum[0] += N.x / 2; p.nSum[1] += N.y / 2; p.nSum[2] += N.z / 2;
      for (const v of [A, B, C]) {
        if (v.x < p.min[0]) p.min[0] = v.x; if (v.x > p.max[0]) p.max[0] = v.x;
        if (v.y < p.min[1]) p.min[1] = v.y; if (v.y > p.max[1]) p.max[1] = v.y;
        if (v.z < p.min[2]) p.min[2] = v.z; if (v.z > p.max[2]) p.max[2] = v.z;
      }
      if (p.faces.length < 4000) p.faces.push([A.x, A.y, A.z, B.x, B.y, B.z, C.x, C.y, C.z, N.x, N.y, N.z, area, fx, fy, fz]);
      const c0 = pk(i0), c1 = pk(i1), c2 = pk(i2);
      for (const [ea, eb] of [[c0, c1], [c1, c2], [c2, c0]]) {
        if (ea === eb) continue;
        const lo = Math.min(ea, eb), hi = Math.max(ea, eb);
        const key = lo * 4194304 + hi;
        let e = p.edges.get(key);
        if (!e) { e = [0, 0]; p.edges.set(key, e); }
        e[ea === lo ? 0 : 1]++;
      }
    }
    let pi = 0;
    for (const p of pieceOf.values()) {
      pi++;
      if (p.area < 1e-9) continue;
      let boundary = 0;
      let unbalanced = 0;
      for (const e of p.edges.values()) {
        const tot = e[0] + e[1];
        if (tot === 1) boundary++;
        else if (e[0] !== e[1]) unbalanced++;
      }
      const cx = p.cx / p.area, cy = p.cy / p.area, cz = p.cz / p.area;
      let outA = 0;
      let vol = 0;
      for (const f of p.faces) {
        const dx = f[13] - cx, dy = f[14] - cy, dz = f[15] - cz;
        if (f[9] * dx + f[10] * dy + f[11] * dz > 0) outA += f[12];
        const ax = f[0] - cx, ay = f[1] - cy, az = f[2] - cz;
        const bx = f[3] - cx, by = f[4] - cy, bz = f[5] - cz;
        const gx = f[6] - cx, gy = f[7] - cy, gz = f[8] - cz;
        vol += (ax * (by * gz - bz * gy) + ay * (bz * gx - bx * gz) + az * (bx * gy - by * gx)) / 6;
      }
      pieces.push({
        pi, tris: p.tris, area: p.area, boundary, unbalanced, vol,
        outFrac: p.area ? outA / p.area : 0,
        min: p.min, max: p.max, faces: p.faces, nSum: p.nSum,
      });
    }
    pieceCache.set(n.idx, pieces);
    return pieces;
  };

  // ---- id materials (DoubleSide: gate truth) ----
  const idMats = new Map();
  const idMat = (i) => {
    let m = idMats.get(i);
    if (!m) {
      m = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide });
      m.color.setRGB((i & 255) / 255, ((i >> 8) & 255) / 255, 170 / 255);
      idMats.set(i, m);
    }
    return m;
  };
  const idAt = (b, i) => (Math.abs(b[i * 4 + 2] - 170) <= 1 ? b[i * 4] + (b[i * 4 + 1] << 8) : 0);

  for (const [name, d] of Object.entries(VIEWS)) {
    if (viewFilter.length && !viewFilter.includes(name)) continue;
    const cam = orthoFor(box0, new THREE.Vector3(...d));
    scene.overrideMaterial = frontMask;
    setPass('game');
    const fb = shoot(cam);
    scene.overrideMaterial = doubleMask;
    setPass('gate');
    const db = shoot(cam);
    scene.overrideMaterial = null;
    const defPix = [];
    let x0 = S, y0 = S, x1 = -1, y1 = -1;
    for (let y = 0; y < S; y++) {
      for (let x = 0; x < S; x++) {
        const i = y * S + x;
        if (lit(db, i) && !lit(fb, i)) {
          defPix.push(i);
          if (x < x0) x0 = x; if (x > x1) x1 = x;
          if (y < y0) y0 = y; if (y > y1) y1 = y;
        }
      }
    }
    if (!viewFilter.length && defPix.length < 8) continue;
    const row = { deficitPx: defPix.length, pxBbox: defPix.length ? [x0, y0, x1, y1] : null, carriers: [] };

    if (defPix.length) {
      // flat-ID DoubleSide pass, gate visibility
      const savedMats = nodes.map((n) => n.o.material);
      for (const n of nodes) n.o.material = idMat(n.idx);
      setPass('gate');
      const ib = shoot(cam);
      nodes.forEach((n, i) => { n.o.material = savedMats[i]; });
      const tally = new Map();
      for (const i of defPix) {
        const nid = idAt(ib, i);
        tally.set(nid, (tally.get(nid) || 0) + 1);
      }
      const carriers = [...tally.entries()].sort((a, b) => b[1] - a[1]);
      for (const [nid, px] of carriers) {
        if (nid === 0) { row.carriers.push({ node: 'BACKGROUND/unattributed', px }); continue; }
        const n = nodes[nid - 1];
        const camDir = cam.userData.map.dir; // scene -> camera
        const pieces = censusNode(n);
        // score pieces: projected AABB overlap with deficit bbox (world AABB
        // through matrixWorld; instanced = union of instances)
        const scored = [];
        for (const p of pieces) {
          const lb = new THREE.Box3(new THREE.Vector3(...p.min), new THREE.Vector3(...p.max));
          const boxes = [];
          if (n.o.isInstancedMesh) {
            const M4 = new THREE.Matrix4();
            const wm = new THREE.Matrix4();
            for (let k = 0; k < n.o.count; k++) {
              n.o.getMatrixAt(k, M4);
              if (Math.abs(M4.determinant()) < 1e-12) continue;
              wm.multiplyMatrices(n.o.matrixWorld, M4);
              boxes.push(lb.clone().applyMatrix4(wm));
            }
          } else {
            boxes.push(lb.clone().applyMatrix4(n.o.matrixWorld));
          }
          let best = null;
          for (const wb of boxes) {
            let px0 = Infinity, py0 = Infinity, px1 = -Infinity, py1 = -Infinity;
            for (const cx of [wb.min.x, wb.max.x]) for (const cy of [wb.min.y, wb.max.y]) for (const cz of [wb.min.z, wb.max.z]) {
              const [px, py] = worldToPx(cam, new THREE.Vector3(cx, cy, cz));
              px0 = Math.min(px0, px); px1 = Math.max(px1, px);
              py0 = Math.min(py0, py); py1 = Math.max(py1, py);
            }
            const ox = Math.min(px1, x1 + 1) - Math.max(px0, x0 - 1);
            const oy = Math.min(py1, y1 + 1) - Math.max(py0, y0 - 1);
            const ov = (ox > 0 && oy > 0) ? ox * oy : 0;
            if (!best || ov > best.ov) best = { ov, wb };
          }
          if (!best || best.ov <= 0) continue;
          // camera-facing area split (world normals)
          const nm = new THREE.Matrix3().getNormalMatrix(n.o.matrixWorld);
          const wn = new THREE.Vector3();
          let toward = 0, away = 0;
          for (const f of p.faces) {
            wn.set(f[9], f[10], f[11]).applyMatrix3(nm);
            if (wn.dot(camDir) > 0) toward += f[12]; else away += f[12];
          }
          scored.push({
            piece: p.pi, tris: p.tris, areaM2: +p.area.toFixed(4),
            boundary: p.boundary, unbalanced: p.unbalanced, vol: +p.vol.toFixed(5),
            outFrac: +p.outFrac.toFixed(3),
            overlapPx2: +best.ov.toFixed(0),
            areaTowardCam: +toward.toFixed(4), areaAwayCam: +away.toFixed(4),
            normalSum: p.nSum.map((v) => +v.toFixed(3)),
            localAabb: [p.min.map((v) => +v.toFixed(3)), p.max.map((v) => +v.toFixed(3))],
            worldAabb: [
              [best.wb.min.x, best.wb.min.y, best.wb.min.z].map((v) => +v.toFixed(3)),
              [best.wb.max.x, best.wb.max.y, best.wb.max.z].map((v) => +v.toFixed(3)),
            ],
            sampleTrisLocal: p.faces.slice(0, 6).map((f) => [
              [f[0], f[1], f[2]].map((v) => +v.toFixed(3)),
              [f[3], f[4], f[5]].map((v) => +v.toFixed(3)),
              [f[6], f[7], f[8]].map((v) => +v.toFixed(3)),
            ]),
          });
        }
        scored.sort((a, b) => (b.overlapPx2 - a.overlapPx2));
        row.carriers.push({
          node: n.name, rig: n.rig, chain: n.chain,
          instanced: !!n.o.isInstancedMesh,
          userData: JSON.parse(JSON.stringify(n.o.userData || {})),
          matName: (firstMat(n.o) && firstMat(n.o).name) || '',
          px,
          pieces: scored.slice(0, 8),
          pieceCount: pieces.length,
        });
      }
    }
    out.views[name] = row;
    for (const n of nodes) n.o.visible = n.vis0;
  }
  window.__PROBE_RESULT = out;
} catch (e) {
  out.error = String(e && e.stack || e);
  window.__PROBE_RESULT = out;
}
window.__PROBE_READY = true;
</script>
