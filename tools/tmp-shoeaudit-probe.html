<!doctype html>
<!-- scratch probe for the shoe-envelope audit extension: identify which
     meshes have surface inside a world box, and where the shoe instances
     near the box sit. ?id=<id>&box=x0,y0,z0,x1,y1,z1 -->
<meta charset="utf-8">
<title>tmp-shoeaudit-probe</title>
<script type="module">
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.js';

const params = new URLSearchParams(location.search);
const id = params.get('id') || 'm1a1ha';
const bv = (params.get('box') || '-1.7,0.3,3.0,1.7,0.5,3.3').split(',').map(Number);
const box = new THREE.Box3(new THREE.Vector3(bv[0], bv[1], bv[2]), new THREE.Vector3(bv[3], bv[4], bv[5]));

const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer: null };
const tank = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
tank.root.updateMatrixWorld(true);

const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3(), p = new THREE.Vector3();
const hits = [];
const shoeInfo = [];
tank.root.traverse((o) => {
  if (!o.visible) return;
  if (o.isInstancedMesh && o.parent && o.parent.isLOD && o.count >= 8) {
    // shoe IM: report instances near the box
    const m4 = new THREE.Matrix4(), w4 = new THREE.Matrix4(), v = new THREE.Vector3();
    const near = [];
    for (let k = 0; k < o.count; k++) {
      o.getMatrixAt(k, m4);
      if (Math.abs(m4.determinant()) < 1e-12) continue;
      w4.multiplyMatrices(o.matrixWorld, m4);
      v.setFromMatrixPosition(w4);
      if (box.clone().expandByScalar(0.35).containsPoint(v)) {
        near.push([+v.x.toFixed(3), +v.y.toFixed(3), +v.z.toFixed(3)]);
      }
    }
    const g = o.geometry;
    if (!g.boundingBox) g.computeBoundingBox();
    shoeInfo.push({
      count: o.count, nearBox: near.length,
      localBox: [g.boundingBox.min.toArray().map((x) => +x.toFixed(3)), g.boundingBox.max.toArray().map((x) => +x.toFixed(3))],
      sample: near.slice(0, 12),
    });
    return;
  }
  if (!o.isMesh || o.isInstancedMesh || !o.geometry) return;
  if (o.material && o.material.colorWrite === false) return;
  const g = o.geometry, pos = g.getAttribute('position'), idx = g.index;
  if (!pos) return;
  const n = idx ? idx.count : pos.count;
  let inBox = 0;
  const sub = new THREE.Box3();
  for (let i = 0; i < n; i += 3) {
    const i0 = idx ? idx.getX(i) : i, i1 = idx ? idx.getX(i + 1) : i + 1, i2 = idx ? idx.getX(i + 2) : i + 2;
    a.fromBufferAttribute(pos, i0).applyMatrix4(o.matrixWorld);
    b.fromBufferAttribute(pos, i1).applyMatrix4(o.matrixWorld);
    c.fromBufferAttribute(pos, i2).applyMatrix4(o.matrixWorld);
    for (let t = 0; t <= 4; t++) {
      for (let u = 0; t + u <= 4; u++) {
        p.set(0, 0, 0).addScaledVector(a, t / 4).addScaledVector(b, u / 4).addScaledVector(c, (4 - t - u) / 4);
        if (box.containsPoint(p)) { inBox++; sub.expandByPoint(p); }
      }
    }
  }
  if (inBox > 0) {
    const chain = [];
    let par = o;
    while (par && chain.length < 6) { chain.push(par.name || par.type); par = par.parent; }
    hits.push({
      inBox,
      name: o.name || '(unnamed)',
      chain: chain.join(' < '),
      mat: o.material?.name || '(mat-unnamed)',
      matColor: o.material?.color ? '#' + o.material.color.getHexString() : null,
      tris: Math.floor(n / 3),
      ud: JSON.stringify(o.userData || {}).slice(0, 80),
      hitBox: [sub.min.toArray().map((x) => +x.toFixed(3)), sub.max.toArray().map((x) => +x.toFixed(3))],
      meshBox: (() => { const bb = new THREE.Box3().setFromObject(o); return [bb.min.toArray().map((x) => +x.toFixed(2)), bb.max.toArray().map((x) => +x.toFixed(2))]; })(),
    });
  }
});
hits.sort((x, y) => y.inBox - x.inBox);
window.__PROBE_RESULT = { id, box: bv, hits: hits.slice(0, 10), shoeInfo };
window.__PROBE_READY = true;
</script>
