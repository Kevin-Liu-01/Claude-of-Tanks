<!doctype html>
<meta charset="utf-8">
<title>tmp russia prism-sweep closeups</title>
<style>:root{color-scheme:dark;background:#0b0f12;color:#e7edf0;font:13px monospace}</style>
<div id="out">booting…</div>
<script type="module">
// TEMP (russia §B3.1 prism sweep): ref|proc closeup pairs focused on the GUN
// RUN + turret face + hull furniture. Same load harness as tmp-tank-critic.html
// (page-local MODEL_SOURCE injection, board light rig). Deleted after round.
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.js';
import { MODEL_SOURCE } from '/src/vehicles/specs.js';

const SIZE = 640;
const params = new URLSearchParams(location.search);
const id = params.get('id') || 't90a';
const procOnly = params.get('proconly') === '1';
const CRITIC_REFERENCE_OVERRIDES = {
  t62mv1: { source:'glb', glb:{ path:'/models/tanks/community/recovered/t62_bergman.glb', paintUntextured:true, turretNode:'^Turret$', gunNode:'^Gun$', autoPivot:false } },
  t64bv1: { source:'glb', glb:{ path:'/models/tanks/community/recovered/t64bv1.glb', paintUntextured:true, turretNode:'^Turret$', autoPivot:true, yawOffset:-1.5707963267948966 } },
  t72b_1987: { source:'glb', glb:{ path:'/models/tanks/community/recovered/t72b_1987.glb', paintUntextured:true, turretNode:'^Turret$', gunNode:'^Gun$', autoPivot:true, yawOffset:-1.5707963267948966 } },
  t72bu: { source:'glb', glb:{ path:'/models/tanks/community/recovered/t72bu.glb', paintUntextured:true, turretNode:'^Turret$', gunNode:'^Gun$', autoPivot:true, yawOffset:-1.5707963267948966 } },
  t80: { source:'glb', glb:{ path:'/models/tanks/community/recovered/t80.glb', turretNode:'^Turret$', autoPivot:true, paintUntextured:true } },
  t80b: { source:'glb', glb:{ path:'/models/tanks/community/recovered/t80b.glb', turretNode:'^Turret$', autoPivot:true, paintUntextured:true } },
  t80bv: { source:'glb', glb:{ path:'/models/tanks/community/recovered/t80bv.glb', turretNode:'^Turret$', autoPivot:true, paintUntextured:true } },
  t90a: { source:'glb', glb:{ path:'/models/tanks/community/variants/t90a_xarchenko_variant.glb', turretNode:'TurretPivot', gunNode:'GunPivot', autoPivot:true, paintUntextured:true } },
  t90a_vladimir: { source:'glb', glb:{ path:'/models/tanks/community/recovered/t90a_vladimir.glb', paintUntextured:true, turretNode:'^desirefx[._]?me_001$', autoPivot:true } },
  t90m: { source:'glb', glb:{ path:'/models/tanks/t90m_minehffd.glb', turretNode:'^Turret$', gunNode:'^Main_barrel$', autoPivot:true, scaleToOverall:true, yawOffset:1.5707963267948966, heroTex:true } },
  t90sm: { source:'glb', glb:{ path:'/models/tanks/community/recovered/t90sm.glb', paintUntextured:true, turretNode:'^misc_a$', gunNode:'^misc_b$', autoPivot:true, yawOffset:3.141592653589793 } },
  t72b3m: { source:'glb', glb:{ path:'/models/tanks/community/recovered/t72b3m.glb', turretNode:'^misc_a$', gunNode:'^misc_b$', autoPivot:true, paintUntextured:true, yawOffset:Math.PI } },
  pt91m: { source:'glb', glb:{ path:'/models/tanks/community/recovered/pt91m.glb', turretNode:'^misc_a$', gunNode:'^misc_b$', autoPivot:true, paintUntextured:true, yawOffset:Math.PI } },
  t84: { source:'glb', glb:{ path:'/models/tanks/community/recovered/t84.glb', turretNode:'^Turret$', autoPivot:true, paintUntextured:true } },
};
if (!procOnly && MODEL_SOURCE[id]?.source !== 'glb' && CRITIC_REFERENCE_OVERRIDES[id]) {
  MODEL_SOURCE[id] = CRITIC_REFERENCE_OVERRIDES[id];
}
const source = MODEL_SOURCE[id];
const haveRef = !procOnly && source?.source === 'glb';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
renderer.setSize(SIZE, SIZE, false);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x151b20, 1);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer };

const reference = haveRef ? createTank(id, engineCtx, { camoSeed: 4242, quality: 'high' }) : null;
const procedural = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
if (reference) scene.add(reference.root);
scene.add(procedural.root);

const hemi = new THREE.HemisphereLight(0xcfd8e0, 0x2a2f26, 1.05);
const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(30, 42, 24);
scene.add(hemi, sun);

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const swapped = (visual) => {
  let yes = false;
  visual.root.traverse((o) => { if (o.userData?.__glbSwapped) yes = true; });
  return yes;
};
if (reference) {
  for (let i = 0; i < 600 && !swapped(reference); i++) await sleep(50);
  if (!swapped(reference)) throw new Error(`${id} reference GLB did not load`);
}
await sleep(400);
if (reference) reference.root.updateMatrixWorld(true);
procedural.root.updateMatrixWorld(true);
for (const root of [reference?.root, procedural.root]) {
  if (!root) continue;
  root.traverse((o) => {
    if (!o.isLOD) return;
    o.autoUpdate = false;
    o.levels.forEach((level, i) => { if (level.object) level.object.visible = i === 0; });
  });
}

function visibleBox(root) {
  const box = new THREE.Box3();
  root.updateMatrixWorld(true);
  root.traverse((o) => {
    if (!(o.isMesh || o.isInstancedMesh || o.isSkinnedMesh) || !o.geometry) return;
    let vis = true;
    for (let p = o; p; p = p.parent) if (!p.visible) { vis = false; break; }
    if (!vis || /shadow/i.test(o.name || '')) return;
    if (o.isInstancedMesh) {
      if (o.count === 0) return;
      o.computeBoundingBox();
      if (o.boundingBox && !o.boundingBox.isEmpty()) box.union(o.boundingBox.clone().applyMatrix4(o.matrixWorld));
      return;
    }
    if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
    box.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld));
  });
  return box;
}

function orthoFor(box, direction, frac = 0.55, centerOff = null) {
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  if (centerOff) { center.x += centerOff.x * size.x; center.y += centerOff.y * size.y; center.z += centerOff.z * size.z; }
  const dir = direction.clone().normalize();
  const nominalUp = Math.abs(dir.y) > 0.9 ? new THREE.Vector3(0, 0, -1) : new THREE.Vector3(0, 1, 0);
  const right = new THREE.Vector3().crossVectors(nominalUp, dir).normalize();
  const up = new THREE.Vector3().crossVectors(dir, right).normalize();
  let ext = 0.5;
  for (const cx of [box.min.x, box.max.x]) for (const cy of [box.min.y, box.max.y]) for (const cz of [box.min.z, box.max.z]) {
    const d = new THREE.Vector3(cx, cy, cz).sub(center);
    ext = Math.max(ext, Math.abs(d.dot(right)), Math.abs(d.dot(up)));
  }
  const half = ext * (frac / 0.5) * 1.06;
  const camera = new THREE.OrthographicCamera(-half, half, half, -half, 0.1, 200);
  camera.position.copy(center).addScaledVector(dir, 60);
  camera.up.copy(up);
  camera.lookAt(center);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
  return camera;
}

function heroFor(box, direction, distF = 1.55, centerOff = null, fov = 35) {
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  if (centerOff) { center.x += centerOff.x * size.x; center.y += centerOff.y * size.y; center.z += centerOff.z * size.z; }
  const dist = Math.max(size.x, size.y, size.z) * distF;
  const camera = new THREE.PerspectiveCamera(fov, 1, 0.1, 300);
  camera.position.copy(center).addScaledVector(direction.clone().normalize(), dist);
  camera.position.y += size.y * 0.28 * distF / 1.55;
  camera.lookAt(center);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
  return camera;
}

const copy2d = document.createElement('canvas');
copy2d.width = copy2d.height = SIZE;
const copyCtx = copy2d.getContext('2d', { willReadFrequently: true });
function renderModel(visual, other, camera) {
  visual.root.visible = true;
  if (other) other.root.visible = false;
  renderer.setRenderTarget(null);
  renderer.setClearColor(0x151b20, 1);
  renderer.clear(true, true, true);
  renderer.render(scene, camera);
  copyCtx.drawImage(renderer.domElement, 0, 0, SIZE, SIZE);
  return copyCtx.getImageData(0, 0, SIZE, SIZE);
}

const pairCanvas = document.createElement('canvas');
pairCanvas.width = SIZE * 2; pairCanvas.height = SIZE;
const pairCtx = pairCanvas.getContext('2d', { willReadFrequently: true });
function pairURL(refImg, procImg) {
  copyCtx.putImageData(refImg, 0, 0); pairCtx.drawImage(copy2d, 0, 0);
  copyCtx.putImageData(procImg, 0, 0); pairCtx.drawImage(copy2d, SIZE, 0);
  pairCtx.fillStyle = '#e7edf0'; pairCtx.font = '18px monospace';
  pairCtx.fillText('REFERENCE', 12, 24);
  pairCtx.fillText('PROCEDURAL', SIZE + 12, 24);
  return pairCanvas.toDataURL('image/png');
}
function soloURL(procImg) {
  copyCtx.putImageData(procImg, 0, 0);
  return copy2d.toDataURL('image/png');
}

if (reference) reference.root.visible = true;
procedural.root.visible = true;
const refBox = reference ? visibleBox(reference.root) : null;
const procBox = visibleBox(procedural.root);

// Crops: gun run occupies the forward third, high band. All offsets are in
// box-size fractions (per-model, ref and proc framed independently).
const SHOTS = [
  // name, dir, frac(zoom), centerOff, hero?
  ['gunrun-left',  new THREE.Vector3(-1, 0.10, 0.25), 0.22, { x: 0, y: 0.26, z: 0.28 }],
  ['gunrun-frontleft', new THREE.Vector3(-1, 0.30, 1), 0.26, { x: 0, y: 0.24, z: 0.25 }],
  ['gunrun-frontright', new THREE.Vector3(1, 0.30, 1), 0.26, { x: 0, y: 0.24, z: 0.25 }],
  ['mantlet-left34', new THREE.Vector3(-1, 0.22, 0.85), 0.13, { x: 0, y: 0.30, z: 0.22 }],
  ['mantlet-right34', new THREE.Vector3(1, 0.22, 0.85), 0.13, { x: 0, y: 0.30, z: 0.22 }],
  ['turretface-front', new THREE.Vector3(0, 0.16, 1), 0.30, { x: 0, y: 0.28, z: 0 }],
  ['turret-toptilt', new THREE.Vector3(0.5, 1.2, 0.9), 0.34, { x: 0, y: 0.30, z: 0 }],
  ['hull-rearleft', new THREE.Vector3(-1, 0.35, -1), 0.40, { x: 0, y: 0.10, z: -0.12 }],
  ['hero-full', new THREE.Vector3(-1, 0.35, 1), 0.55, null, true],
];

const pairs = {};
for (const [name, dir, frac, off, hero] of SHOTS) {
  const camsFor = (box) => hero ? heroFor(box, dir) : orthoFor(box, dir, frac, off);
  const p = renderModel(procedural, reference, camsFor(procBox));
  if (reference) {
    const r = renderModel(reference, procedural, camsFor(refBox));
    pairs[name] = pairURL(r, p);
  } else {
    pairs[name] = soloURL(p);
  }
}

// world-space focus crops: ?focus=x,y,z,half (proc frame; ref pane shifted
// by the box-center delta — registration-rough, reads only)
function focusCam(center, half, direction) {
  const dir = direction.clone().normalize();
  const nominalUp = Math.abs(dir.y) > 0.9 ? new THREE.Vector3(0, 0, -1) : new THREE.Vector3(0, 1, 0);
  const right = new THREE.Vector3().crossVectors(nominalUp, dir).normalize();
  const up = new THREE.Vector3().crossVectors(dir, right).normalize();
  const camera = new THREE.OrthographicCamera(-half, half, half, -half, 0.1, 200);
  camera.position.copy(center).addScaledVector(dir, 60);
  camera.up.copy(up);
  camera.lookAt(center);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
  return camera;
}
if (params.get('focus')) {
  const [fx, fy, fz, fh] = params.get('focus').split(',').map(Number);
  const pc = new THREE.Vector3(fx, fy, fz);
  const rc = reference ? pc.clone().sub(procBox.getCenter(new THREE.Vector3())).add(refBox.getCenter(new THREE.Vector3())) : pc;
  for (const [name, dir] of [
    ['focus-left34', new THREE.Vector3(-1, 0.25, 0.7)],
    ['focus-right34', new THREE.Vector3(1, 0.25, 0.7)],
    ['focus-front', new THREE.Vector3(0, 0.12, 1)],
    ['focus-top', new THREE.Vector3(0.25, 1, 0.35)],
  ]) {
    const p = renderModel(procedural, reference, focusCam(pc, fh, dir));
    if (reference) {
      const r = renderModel(reference, procedural, focusCam(rc, fh, dir));
      pairs[name] = pairURL(r, p);
    } else {
      pairs[name] = soloURL(p);
    }
  }
}

window.__SWEEP_PAIRS = pairs;
window.__SWEEP_READY = true;
document.getElementById('out').textContent = `pairs ready: ${Object.keys(pairs).length}`;
</script>
