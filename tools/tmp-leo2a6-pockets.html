<!doctype html>
<meta charset="utf-8">
<title>tmp leo2a6 pockets</title>
<style>:root{color-scheme:dark;background:#0b0f12;color:#e7edf0;font:13px monospace}</style>
<div id="out">booting…</div>
<script type="module">
// TEMP (leo2a6 contiguity round): desert-scheme garage-angle renders of the
// PROC build + a DARK-POCKET census (near-black clusters inside the
// silhouette — the owner's "empty areas" read) + camera-ray identification
// of the masses bounding each pocket. Deleted after the round.
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.js';
import { setCamoOverride } from '/src/vehicles/materials.js';

const SIZE = 960;
const params = new URLSearchParams(location.search);
const id = params.get('id') || 'leo2a6';
const scheme = params.get('scheme') || 'desert';
const DARK_L = Number(params.get('dark') || 34);   // ITU-601 luma pocket ceiling
const BG = [0x15, 0x1b, 0x20];

setCamoOverride(id, scheme);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
renderer.setSize(SIZE, SIZE, false);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x151b20, 1);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer };
const tank = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
scene.add(tank.root);
tank.root.updateMatrixWorld(true);
tank.root.traverse((o) => {
  if (!o.isLOD) return;
  o.autoUpdate = false;
  o.levels.forEach((level, i) => { if (level.object) level.object.visible = i === 0; });
});
// critic board light rig (identical to tmp-tank-critic.html)
const hemi = new THREE.HemisphereLight(0xcfd8e0, 0x2a2f26, 1.05);
const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(30, 42, 24);
scene.add(hemi, sun);

const box = new THREE.Box3();
tank.root.traverse((o) => {
  if (!(o.isMesh || o.isInstancedMesh) || !o.geometry) return;
  let vis = true;
  for (let p = o; p; p = p.parent) if (!p.visible) { vis = false; break; }
  if (!vis || /shadow/i.test(o.name || '')) return;
  if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
  box.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld));
});
const center = box.getCenter(new THREE.Vector3());
const size = box.getSize(new THREE.Vector3());

function heroCam(direction, lift = 0.28, distMul = 1.55) {
  const dist = Math.max(size.x, size.y, size.z) * distMul;
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 300);
  camera.position.copy(center).addScaledVector(direction.clone().normalize(), dist);
  camera.position.y += size.y * lift;
  camera.lookAt(center);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
  return camera;
}

// critic-convention ortho side views (for identifying pair-census slivers)
function orthoCam(direction) {
  const dir = direction.clone().normalize();
  const nominalUp = Math.abs(dir.y) > 0.9 ? new THREE.Vector3(0, 0, -1) : new THREE.Vector3(0, 1, 0);
  const right = new THREE.Vector3().crossVectors(nominalUp, dir).normalize();
  const up = new THREE.Vector3().crossVectors(dir, right).normalize();
  let ext = 0.5;
  for (const cx of [box.min.x, box.max.x]) for (const cy of [box.min.y, box.max.y]) for (const cz of [box.min.z, box.max.z]) {
    const d = new THREE.Vector3(cx, cy, cz).sub(center);
    ext = Math.max(ext, Math.abs(d.dot(right)), Math.abs(d.dot(up)));
  }
  const half = ext * (0.55 / 0.5) * 1.06;
  const camera = new THREE.OrthographicCamera(-half, half, half, -half, 0.1, 200);
  camera.position.copy(center).addScaledVector(dir, 60);
  camera.up.copy(up);
  camera.lookAt(center);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
  return camera;
}

const VIEWS = {
  'ortho-left':         orthoCam(new THREE.Vector3(-1, 0.05, 0)),
  'ortho-right':        orthoCam(new THREE.Vector3(1, 0.05, 0)),
  'garage-left':        heroCam(new THREE.Vector3(-1, 0.10, -0.42), 0.22),
  'garage-right':       heroCam(new THREE.Vector3(1, 0.10, -0.42), 0.22),
  'garage-frontleft':   heroCam(new THREE.Vector3(-1, 0.10, 0.55), 0.22),
  'garage-frontright':  heroCam(new THREE.Vector3(1, 0.10, 0.55), 0.22),
  'hero-rearleft':      heroCam(new THREE.Vector3(-1, 0.35, -1)),
  'hero-rearright':     heroCam(new THREE.Vector3(1, 0.35, -1)),
  'side-left':          heroCam(new THREE.Vector3(-1, 0.08, 0), 0.18),
  'side-right':         heroCam(new THREE.Vector3(1, 0.08, 0), 0.18),
};

const copy2d = document.createElement('canvas');
copy2d.width = copy2d.height = SIZE;
const ctx2d = copy2d.getContext('2d', { willReadFrequently: true });

function census(img) {
  const W = SIZE, H = SIZE, d = img.data;
  const isbg = new Uint8Array(W * H);
  const dark = new Uint8Array(W * H);
  for (let i = 0, p = 0; i < W * H; i++, p += 4) {
    const r = d[p], g = d[p + 1], b = d[p + 2];
    if (Math.abs(r - BG[0]) <= 6 && Math.abs(g - BG[1]) <= 6 && Math.abs(b - BG[2]) <= 6) { isbg[i] = 1; continue; }
    const L = 0.299 * r + 0.587 * g + 0.114 * b;
    if (L < DARK_L) dark[i] = 1;
  }
  // flood external bg (4-conn)
  const ext = new Uint8Array(W * H);
  const dq = new Int32Array(W * H);
  let qh = 0, qt = 0;
  const push = (i) => { if (isbg[i] && !ext[i]) { ext[i] = 1; dq[qt++] = i; } };
  for (let x = 0; x < W; x++) { push(x); push((H - 1) * W + x); }
  for (let y = 0; y < H; y++) { push(y * W); push(y * W + W - 1); }
  while (qh < qt) {
    const i = dq[qh++];
    const y = (i / W) | 0, x = i - y * W;
    if (y > 0) push(i - W);
    if (y < H - 1) push(i + W);
    if (x > 0) push(i - 1);
    if (x < W - 1) push(i + 1);
  }
  // components over (internal-bg OR dark) — the pocket class
  const seen = new Uint8Array(W * H);
  const comps = [];
  let holePx = 0, darkPx = 0;
  for (let i0 = 0; i0 < W * H; i0++) {
    const pocket0 = (isbg[i0] && !ext[i0]) || dark[i0];
    if (!pocket0 || seen[i0]) continue;
    let n = 0, nHole = 0, minx = 1e9, miny = 1e9, maxx = -1, maxy = -1, sx = 0, sy = 0;
    qh = qt = 0;
    dq[qt++] = i0; seen[i0] = 1;
    while (qh < qt) {
      const i = dq[qh++];
      const y = (i / W) | 0, x = i - y * W;
      n++; sx += x; sy += y;
      if (isbg[i] && !ext[i]) nHole++;
      if (x < minx) minx = x; if (x > maxx) maxx = x;
      if (y < miny) miny = y; if (y > maxy) maxy = y;
      for (const j of [y > 0 ? i - W : -1, y < H - 1 ? i + W : -1, x > 0 ? i - 1 : -1, x < W - 1 ? i + 1 : -1]) {
        if (j >= 0 && !seen[j] && ((isbg[j] && !ext[j]) || dark[j])) { seen[j] = 1; dq[qt++] = j; }
      }
    }
    holePx += nHole; darkPx += n - nHole;
    comps.push({ n, nHole, minx, miny, maxx, maxy, cx: Math.round(sx / n), cy: Math.round(sy / n) });
  }
  comps.sort((a, b) => b.n - a.n);
  return { holePx, darkPx, comps: comps.slice(0, 14).filter((c) => c.n >= 40) };
}

function identify(cam, px, py) {
  const ndc = new THREE.Vector2((px / SIZE) * 2 - 1, -((py / SIZE) * 2 - 1));
  const ray = new THREE.Raycaster();
  ray.setFromCamera(ndc, cam);
  return ray.intersectObject(tank.root, true).slice(0, 4).map((h) => ({
    d: +h.distance.toFixed(2),
    at: [h.point.x, h.point.y, h.point.z].map((v) => +v.toFixed(3)),
    mat: h.object.material?.color ? '#' + h.object.material.color.getHexString() : '?',
  }));
}

// optional targeted probes: ?probe=view:px:py,view:px:py — casts rays through
// exact pixels and reports the full hit chain (identification aid).
const probes = (params.get('probe') || '').split(',').filter(Boolean).map((s) => {
  const [v, px, py] = s.split(':');
  return { v, px: Number(px), py: Number(py) };
});

const report = {};
const pngs = {};
for (const [name, cam] of Object.entries(VIEWS)) {
  renderer.setClearColor(0x151b20, 1);
  renderer.clear(true, true, true);
  renderer.render(scene, cam);
  ctx2d.drawImage(renderer.domElement, 0, 0, SIZE, SIZE);
  const img = ctx2d.getImageData(0, 0, SIZE, SIZE);
  const c = census(img);
  for (const comp of c.comps) comp.hits = identify(cam, comp.cx, comp.cy);
  c.probes = probes.filter((p) => p.v === name).map((p) => {
    const i = (p.py * SIZE + p.px) * 4;
    return { px: p.px, py: p.py, rgb: [img.data[i], img.data[i + 1], img.data[i + 2]], hits: identify(cam, p.px, p.py) };
  });
  report[name] = c;
  pngs[name] = copy2d.toDataURL('image/png');
}
window.__POCKETS = report;
window.__POCKET_PNGS = pngs;
window.__POCKETS_READY = true;
document.getElementById('out').textContent = 'pockets ready';
</script>
