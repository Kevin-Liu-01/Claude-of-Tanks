<!doctype html>
<!-- TEMP (merkava r12): raycast critic-view pixels to world hits. Rebuilds the
     critic's exact ortho for a named view and raycasts given pixel coords on
     the PROC half; reports mesh path + world point + parent chain. -->
<meta charset="utf-8">
<title>tmp-merk-pixprobe</title>
<script type="module">
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.js';

const q = new URLSearchParams(location.search);
const id = q.get('id') || 'merkava3d';
const viewName = q.get('view') || 'rearleft';
const pix = (q.get('px') || '70,349').split(';').map((s) => s.split(',').map(Number));
const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer: null };
const tank = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
tank.root.updateMatrixWorld(true);

const VIEWS = {
  front: new THREE.Vector3(0, 0.08, 1),
  frontleft: new THREE.Vector3(-1, 0.08, 1),
  left: new THREE.Vector3(-1, 0.05, 0),
  rearleft: new THREE.Vector3(-1, 0.08, -1),
  rear: new THREE.Vector3(0, 0.08, -1),
  rearright: new THREE.Vector3(1, 0.08, -1),
  right: new THREE.Vector3(1, 0.05, 0),
  frontright: new THREE.Vector3(1, 0.08, 1),
  top: new THREE.Vector3(0, 1, 0.02),
};
function visibleBox(root) {
  const box = new THREE.Box3();
  root.updateMatrixWorld(true);
  root.traverse((o) => {
    if (!(o.isMesh || o.isInstancedMesh || o.isSkinnedMesh) || !o.geometry) return;
    let vis = true;
    for (let p = o; p; p = p.parent) if (!p.visible) { vis = false; break; }
    if (!vis || /shadow/i.test(o.name || '')) return;
    if (o.isInstancedMesh) {
      if (o.count === 0) return;
      o.computeBoundingBox();
      if (o.boundingBox && !o.boundingBox.isEmpty()) box.union(o.boundingBox.clone().applyMatrix4(o.matrixWorld));
      return;
    }
    if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
    box.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld));
  });
  return box;
}
function orthoFor(box, direction, frac = 0.55, centerOff = null) {
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  if (centerOff) { center.x += centerOff.x * size.x; center.y += centerOff.y * size.y; center.z += centerOff.z * size.z; }
  const dir = direction.clone().normalize();
  const nominalUp = Math.abs(dir.y) > 0.9 ? new THREE.Vector3(0, 0, -1) : new THREE.Vector3(0, 1, 0);
  const right = new THREE.Vector3().crossVectors(nominalUp, dir).normalize();
  const up = new THREE.Vector3().crossVectors(dir, right).normalize();
  let ext = 0.5;
  for (const cx of [box.min.x, box.max.x]) for (const cy of [box.min.y, box.max.y]) for (const cz of [box.min.z, box.max.z]) {
    const d = new THREE.Vector3(cx, cy, cz).sub(center);
    ext = Math.max(ext, Math.abs(d.dot(right)), Math.abs(d.dot(up)));
  }
  const half = ext * (frac / 0.5) * 1.06;
  const camera = new THREE.OrthographicCamera(-half, half, half, -half, 0.1, 200);
  camera.position.copy(center).addScaledVector(dir, 60);
  camera.up.copy(up);
  camera.lookAt(center);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
  return camera;
}
function heroFor(box, direction) {
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const dist = Math.max(size.x, size.y, size.z) * 1.55;
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 300);
  camera.position.copy(center).addScaledVector(direction.clone().normalize(), dist);
  camera.position.y += size.y * 0.28;
  camera.lookAt(center);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
  return camera;
}
const box = visibleBox(tank.root);
let cam;
if (viewName === 'close-roof') cam = orthoFor(box, new THREE.Vector3(1, 0.55, 0.35), 0.24, { x: 0, y: 0.3, z: 0.05 });
else if (viewName === 'close-front') cam = orthoFor(box, new THREE.Vector3(-1, 0.22, 1), 0.26, { x: 0, y: 0.12, z: 0.28 });
else if (viewName === 'hero-frontleft') cam = heroFor(box, new THREE.Vector3(-1, 0.35, 1));
else if (viewName === 'hero-rearright') cam = heroFor(box, new THREE.Vector3(1, 0.35, -1));
else if (viewName === 'hero-toptilt') cam = heroFor(box, new THREE.Vector3(0.55, 1.35, -0.75));
else cam = orthoFor(box, VIEWS[viewName]);
const ray = new THREE.Raycaster();
const out = [];
const SIZE = 640;
for (const [px, py] of pix) {
  const ndc = new THREE.Vector2((px / SIZE) * 2 - 1, -((py / SIZE) * 2 - 1));
  ray.setFromCamera(ndc, cam);
  const hits = ray.intersectObject(tank.root, true).filter((h) => {
    let vis = true;
    for (let p = h.object; p; p = p.parent) if (!p.visible) { vis = false; break; }
    const mat = h.object.material;
    return vis && (!mat || mat.colorWrite !== false);
  });
  const h = hits[0];
  if (!h) { out.push({ px, py, hit: null }); continue; }
  const path = [];
  for (let p = h.object; p; p = p.parent) path.unshift(p.name || p.type);
  out.push({ px, py, mesh: path.join('/'), inst: h.instanceId ?? null,
    point: h.point.toArray().map((v) => +v.toFixed(3)),
    color: h.object.material && h.object.material.color ? h.object.material.color.getHexString() : '?',
    verts: h.object.geometry.getAttribute('position').count });
}
window.__PROBE = out;
window.__HASH_READY = true;
</script>
