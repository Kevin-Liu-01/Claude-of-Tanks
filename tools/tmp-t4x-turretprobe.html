<!doctype html>
<!-- TEMP (t44/type59 build round 2026-08-08): AABB census of every mesh
     below rig_turret (world space, at rest) — adjudicates the "apron boxes
     absent from the turret-row masks" read. DELETE at landing. -->
<meta charset="utf-8">
<title>tmp-t4x-turretprobe</title>
<script type="module">
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.js';

const params = new URLSearchParams(location.search);
const id = params.get('id') || 't44';
const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer: null };
const tank = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
tank.root.updateMatrixWorld(true);
const turret = tank.root.getObjectByName('rig_turret');
const rows = [];
const box = new THREE.Box3();
const isBelow = (node, anc) => { for (let p = node; p; p = p.parent) if (p === anc) return true; return false; };
tank.root.traverse((o) => {
  if (!(o.isMesh || o.isInstancedMesh) || !o.geometry) return;
  if (!isBelow(o, turret)) return;
  box.setFromObject(o);
  rows.push({
    name: o.name || o.parent?.name || '?', mat: o.material?.name || '',
    verts: o.geometry.getAttribute('position')?.count ?? 0,
    lo: box.min.toArray().map((v) => +v.toFixed(3)),
    hi: box.max.toArray().map((v) => +v.toFixed(3)),
    visible: (() => { for (let p = o; p; p = p.parent) if (!p.visible) return false; return true; })(),
  });
});
const tp = new THREE.Vector3();
turret.getWorldPosition(tp);
window.__PROBE = { id, turretPos: tp.toArray().map((v) => +v.toFixed(3)), meshes: rows };
window.__PROBE_READY = true;
</script>
