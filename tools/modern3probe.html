<!DOCTYPE html>
<!-- tools/modern3probe.html — closeup render probe for the modern3.js builder
     pack (chieftain_mk10 / k2 / type10 / m2a2_bradley / bmp2 / ariete).
     Query: ?id=<specId>&az=<deg>&pitch=<deg>&dist=<m|0=auto>
     Sets window.__PROBE_READY after the settled frame; window.__TRIS carries
     the visible triangle count (<=120k budget gate). -->
<html><body style="margin:0">
<script type="module">
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.js';
import { getSpec } from '/src/vehicles/specs.js';

const q = new URLSearchParams(location.search);
const id = q.get('id') || 'chieftain_mk10';
const az = parseFloat(q.get('az') ?? '-38');
const pitch = parseFloat(q.get('pitch') ?? '10');
const distQ = parseFloat(q.get('dist') ?? '0');
const W = 1280, H = 720;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87a6c4);
scene.add(new THREE.HemisphereLight(0xcfe4ff, 0x4a5a3a, 1.0));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.6);
// key the sun just off the camera azimuth, at a lower elevation, so the
// judged quarter (hull side + running gear) is lit like the game closeups
const sunA = ((az + 18) * Math.PI) / 180;
sun.position.set(Math.sin(sunA) * 24, 15, Math.cos(sunA) * 24);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, far: 90 });
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(400, 400),
  new THREE.MeshStandardMaterial({ color: 0x55663f, roughness: 1 }),
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

try {
  const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 8, renderer };
  const visual = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high' });
  scene.add(visual.root);

  const spec = getSpec(id);
  const dist = distQ || Math.max(6.2, spec.dims.overallLengthM * 0.82);
  const cy = spec.dims.heightM * 0.52;
  const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 500);
  const a = (az * Math.PI) / 180, p = (pitch * Math.PI) / 180;
  camera.position.set(
    Math.sin(a) * Math.cos(p) * dist,
    cy + Math.sin(p) * dist,
    Math.cos(a) * Math.cos(p) * dist,
  );
  camera.lookAt(0, cy, 0);

  let tris = 0;
  visual.root.updateMatrixWorld(true);
  visual.root.traverse((o) => {
    if (!(o.isMesh || o.isInstancedMesh) || !o.visible) return;
    const g = o.geometry;
    const n = g.index ? g.index.count / 3 : g.attributes.position.count / 3;
    tris += n * (o.isInstancedMesh ? o.count : 1);
  });
  window.__TRIS = Math.round(tris);

  let f = 0;
  (function loop() {
    renderer.render(scene, camera);
    if (++f < 6) requestAnimationFrame(loop);
    else window.__PROBE_READY = true;
  })();
} catch (e) {
  console.error('[modern3probe]', e);
  window.__PROBE_ERROR = String(e && e.message || e);
  window.__PROBE_READY = true;
}
</script>
</body></html>
