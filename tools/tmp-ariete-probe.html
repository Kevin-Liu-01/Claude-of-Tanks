<!doctype html>
<meta charset="utf-8">
<title>tmp ariete mesh probe</title>
<script type="module">
// TEMP (ariete turret-fix round): builds the procedural ariete exactly like
// the critic page (camoSeed 4242, quality high, proceduralOnly) and dumps
// every mesh's rig parent, material, tris and WORLD AABB onto
// window.__PROBE. Read-only diagnosis harness; deleted after the round.
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.js';

const params = new URLSearchParams(location.search);
const id = params.get('id') || 'ariete';
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(64, 64, false);
const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer };
const tank = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
const scene = new THREE.Scene();
scene.add(tank.root);
tank.root.updateMatrixWorld(true);
// force LOD level0 like the critic page
tank.root.traverse((o) => {
  if (!o.isLOD) return;
  o.autoUpdate = false;
  o.levels.forEach((level, i) => { if (level.object) level.object.visible = i === 0; });
});
tank.root.updateMatrixWorld(true);

const rows = [];
tank.root.traverse((o) => {
  if (!(o.isMesh || o.isInstancedMesh) || !o.geometry) return;
  let vis = true;
  for (let p = o; p; p = p.parent) if (!p.visible) { vis = false; break; }
  let rig = '?';
  for (let p = o; p; p = p.parent) if (/^rig_/.test(p.name || '')) { rig = p.name; break; }
  let bb;
  if (o.isInstancedMesh) {
    if (o.count === 0) return;
    o.computeBoundingBox();
    bb = o.boundingBox ? o.boundingBox.clone().applyMatrix4(o.matrixWorld) : null;
  } else {
    if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
    bb = o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld);
  }
  if (!bb) return;
  const posAttr = o.geometry.attributes.position;
  rows.push({
    name: o.name || '(anon)', rig, visible: vis,
    instanced: !!o.isInstancedMesh, count: o.count || 1,
    mat: (o.material && o.material.name) || o.material?.type || '?',
    colorWrite: o.material ? o.material.colorWrite !== false : true,
    tris: posAttr ? Math.round(posAttr.count / 3) : 0,
    fitting: o.userData?.fitting || null,
    min: [bb.min.x, bb.min.y, bb.min.z].map((v) => +v.toFixed(3)),
    max: [bb.max.x, bb.max.y, bb.max.z].map((v) => +v.toFixed(3)),
  });
});
// ---- false-color identification renders: each mesh gets a unique flat
// color; ortho front/left/top/plan renders report which mesh paints where.
const SIZE = 640;
renderer.setSize(SIZE, SIZE, false);
renderer.setClearColor(0x000000, 1);
const meshes = [];
tank.root.traverse((o) => {
  if (!(o.isMesh || o.isInstancedMesh) || !o.geometry) return;
  let vis = true;
  for (let p = o; p; p = p.parent) if (!p.visible) { vis = false; break; }
  if (!vis) return;
  if (o.material && o.material.colorWrite === false) return;
  meshes.push(o);
});
meshes.forEach((m, i) => {
  const r = ((i * 37) % 250) + 5, g = ((i * 91) % 250) + 5, b = ((i * 151) % 250) + 5;
  m.userData.__probeColor = [r, g, b];
  m.material = new THREE.MeshBasicMaterial({ color: new THREE.Color(r / 255, g / 255, b / 255) });
});
const views = {
  front: [new THREE.Vector3(0, 1.25, 60), new THREE.Vector3(0, 1, 0)],
  left: [new THREE.Vector3(-60, 1.25, 0), new THREE.Vector3(0, 1, 0)],
  top: [new THREE.Vector3(0, 60, 0.01), new THREE.Vector3(0, 0, -1)],
};
const shots = {};
const counts = {};
const canvas2d = document.createElement('canvas');
canvas2d.width = canvas2d.height = SIZE;
const ctx2d = canvas2d.getContext('2d', { willReadFrequently: true });
for (const [name, [pos, up]] of Object.entries(views)) {
  const half = 6.0;
  const cam = new THREE.OrthographicCamera(-half, half, half, -half, 0.1, 200);
  cam.position.copy(pos); cam.up.copy(up); cam.lookAt(0, name === 'top' ? 0 : 1.25, 0);
  cam.updateProjectionMatrix(); cam.updateMatrixWorld(true);
  renderer.render(scene, cam);
  ctx2d.drawImage(renderer.domElement, 0, 0);
  shots[name] = canvas2d.toDataURL('image/png');
  const img = ctx2d.getImageData(0, 0, SIZE, SIZE).data;
  const c = {};
  for (let i = 0; i < img.length; i += 4) {
    if (img[i] < 3 && img[i + 1] < 3 && img[i + 2] < 3) continue;
    const key = `${img[i]},${img[i + 1]},${img[i + 2]}`;
    c[key] = (c[key] || 0) + 1;
  }
  counts[name] = c;
}
const legend = meshes.map((m, i) => {
  let rig = '?';
  for (let p = m; p; p = p.parent) if (/^rig_/.test(p.name || '')) { rig = p.name; break; }
  let bb;
  if (m.isInstancedMesh) { m.computeBoundingBox(); bb = m.boundingBox.clone().applyMatrix4(m.matrixWorld); }
  else { if (!m.geometry.boundingBox) m.geometry.computeBoundingBox(); bb = m.geometry.boundingBox.clone().applyMatrix4(m.matrixWorld); }
  return {
    i, key: m.userData.__probeColor.join(','), rig,
    name: m.name || '(anon)',
    tris: m.geometry.attributes.position ? Math.round(m.geometry.attributes.position.count / 3) : 0,
    min: [bb.min.x, bb.min.y, bb.min.z].map((v) => +v.toFixed(2)),
    max: [bb.max.x, bb.max.y, bb.max.z].map((v) => +v.toFixed(2)),
  };
});
window.__PROBE = { id, rows, legend, counts, shots };
window.__PROBE_READY = true;
</script>
