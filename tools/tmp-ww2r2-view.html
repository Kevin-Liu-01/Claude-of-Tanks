<!doctype html>
<meta charset="utf-8">
<title>ww2 r2 eyeball</title>
<body style="margin:0">
<script type="module">
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.js';
const id = new URLSearchParams(location.search).get('id') || 'sherman_jumbo';
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(1280, 800); renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x20262e);
scene.add(new THREE.HemisphereLight(0xcfd8e6, 0x2a2620, 1.1));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.2); sun.position.set(6, 9, 4); scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0x3a3f35 }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 4, renderer };
const t = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
scene.add(t.root);
t.root.updateMatrixWorld(true);
const bb = new THREE.Box3().setFromObject(t.root);
const c = bb.getCenter(new THREE.Vector3()); const r = bb.getSize(new THREE.Vector3()).length() / 2;
const views = [
  [c.x + r * 1.15, c.y + r * 0.55, c.z + r * 1.15],
  [c.x - r * 1.15, c.y + r * 0.55, c.z - r * 1.15],
  [c.x, c.y + r * 0.28, c.z + r * 1.7],
  [c.x + r * 0.02, c.y + r * 1.8, c.z + r * 0.02],
];
const cam = new THREE.PerspectiveCamera(38, 0.5 * 1280 / 800 * 2 / 2, 0.1, 200);
// 2x2 grid of views
renderer.setScissorTest(true);
let done = 0;
for (let i = 0; i < 4; i++) {
  const vx = (i % 2) * 640, vy = (1 - Math.floor(i / 2)) * 400;
  renderer.setViewport(vx, vy, 640, 400); renderer.setScissor(vx, vy, 640, 400);
  const cam2 = new THREE.PerspectiveCamera(36, 640 / 400, 0.1, 300);
  cam2.position.set(...views[i]); cam2.lookAt(c.x, c.y * 0.9, c.z);
  renderer.render(scene, cam2);
}
window.__SHOT_READY = true;
</script>
