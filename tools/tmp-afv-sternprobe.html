<!doctype html>
<!-- TEMP (AFV lane, diagnosis-only §D): list meshes of ?id= whose world AABB
     crosses a z threshold (?zlt=), incl. materials — hunting the type99a
     §B2 flood clusters at (±0.88, z −3.94). -->
<meta charset="utf-8">
<script type="module">
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.js';

const q = new URLSearchParams(location.search);
const id = q.get('id') || 'type99a';
const zlt = parseFloat(q.get('zlt') ?? '-3.78');
const renderer = new THREE.WebGLRenderer();
const tank = createTank(id, { renderer, scene: new THREE.Scene() }, { camoSeed: 4242, quality: 'high' });
const root = tank.root || tank;
root.updateMatrixWorld(true);
const rows = [];
root.traverse((o) => {
  if (!o.isMesh && !o.isInstancedMesh) return;
  const bb = new THREE.Box3().setFromObject(o);
  if (bb.isEmpty()) return;
  if (bb.min.z < zlt) {
    rows.push({
      name: o.name || '(unnamed)', parent: o.parent?.name || '',
      z: [+bb.min.z.toFixed(3), +bb.max.z.toFixed(3)],
      x: [+bb.min.x.toFixed(2), +bb.max.x.toFixed(2)],
      y: [+bb.min.y.toFixed(2), +bb.max.y.toFixed(2)],
      visible: o.visible, mat: o.material?.type,
      transparent: !!o.material?.transparent, opacity: o.material?.opacity,
      colorWrite: o.material?.colorWrite !== false,
      instanced: !!o.isInstancedMesh, count: o.count,
    });
  }
});
const all = [];
root.traverse((o) => {
  if (!o.isMesh && !o.isInstancedMesh) return;
  const bb = new THREE.Box3().setFromObject(o);
  if (bb.isEmpty()) return;
  const chain = [];
  for (let p = o.parent; p; p = p.parent) chain.push(p.name || p.type);
  all.push({
    name: o.name || '(unnamed)', chain: chain.join('<'),
    min: bb.min.toArray().map((v) => +v.toFixed(2)),
    max: bb.max.toArray().map((v) => +v.toFixed(2)),
    visible: o.visible, mat: o.material?.name || o.material?.type,
  });
});
window.__ALLMESHES = all;
window.__PROBE = { id, zlt, rows };
window.__PROBE_READY = true;
</script>
