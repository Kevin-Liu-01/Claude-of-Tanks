<!doctype html>
<html>
<head><meta charset="utf-8"><title>tmp e3 mask probe</title></head>
<body>
<script type="module">
// TEMP r12 E3 diagnosis — proc-only silhouette mask at the evaluator's
// hero camera (heroFor copied verbatim from tools/visual-evaluator-page.html).
// DIAGNOSIS ONLY, never a verdict rig.
import * as THREE from 'three';
import { createTank } from '/src/vehicles/tankFactory.js';

const params = new URLSearchParams(location.search);
const id = params.get('id') || 'leo2_revolution';
const dirSpec = (params.get('dir') || '1,0.35,-1').split(',').map(Number);
const MASK_S = 1024;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
renderer.setSize(MASK_S, MASK_S, false);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const engineCtx = { setupShadowMaterial: (m) => m, anisotropy: 1, renderer };
const procedural = createTank(id, engineCtx, { camoSeed: 4242, quality: 'high', proceduralOnly: true });
scene.add(procedural.root);
procedural.root.updateMatrixWorld(true);
for (const root of [procedural.root]) {
  root.traverse((o) => {
    if (!o.isLOD) return;
    o.autoUpdate = false;
    o.levels.forEach((level, i) => { if (level.object) level.object.visible = i === 0; });
  });
}

function visibleBox(root) {
  const box = new THREE.Box3();
  root.updateMatrixWorld(true);
  root.traverse((o) => {
    if (!(o.isMesh || o.isInstancedMesh || o.isSkinnedMesh) || !o.geometry) return;
    let vis = true;
    for (let p = o; p; p = p.parent) if (!p.visible) { vis = false; break; }
    if (!vis || /shadow/i.test(o.name || '')) return;
    if (o.isInstancedMesh) {
      if (o.count === 0) return;
      o.computeBoundingBox();
      if (o.boundingBox && !o.boundingBox.isEmpty()) box.union(o.boundingBox.clone().applyMatrix4(o.matrixWorld));
      return;
    }
    if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
    box.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld));
  });
  return box;
}

function heroFor(box, direction) {
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const dist = Math.max(size.x, size.y, size.z) * 1.55;
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 300);
  camera.position.copy(center).addScaledVector(direction.clone().normalize(), dist);
  camera.position.y += size.y * 0.28;
  camera.lookAt(center);
  camera.updateProjectionMatrix();
  const half = Math.tan(camera.fov * Math.PI / 360) * camera.position.distanceTo(center);
  camera.userData.eval = { center: center.clone(), half };
  return camera;
}

const maskMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
function swapToMask(root) {
  root.traverse((o) => {
    if (!(o.isMesh || o.isInstancedMesh || o.isSkinnedMesh)) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    const proxy = /shadow/i.test(o.name || '') ||
      mats.some((m) => m && (m.colorWrite === false || (m.transparent && (m.opacity ?? 1) < 0.05)));
    if (proxy) o.visible = false;
    else o.material = Array.isArray(o.material) ? o.material.map(() => maskMat) : maskMat;
  });
}

await new Promise((r) => setTimeout(r, 800));
const box = visibleBox(procedural.root);
const cam = heroFor(box, new THREE.Vector3(dirSpec[0], dirSpec[1], dirSpec[2]));
swapToMask(procedural.root);
renderer.render(scene, cam);
window.__CAM = {
  pos: cam.position.toArray(),
  center: cam.userData.eval.center.toArray(),
  half: cam.userData.eval.half,
  boxMin: box.min.toArray(), boxMax: box.max.toArray(),
};
window.__SHOT = renderer.domElement.toDataURL('image/png');
window.__READY = true;
</script>
</body>
</html>
