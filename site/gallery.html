  <script>
    // GALLERY CHUNK RECOVERY: this page shares the game's site-wide Vercel
    // deployment pin. If an old pin or cached document names removed hashes,
    // recover onto one coherent deployment without asking users to clear data.
    (() => {
      const KEY = 'cot.galleryRecovery.v1';
      const MAX_AUTO_RELOADS = 2;
      let navigating = false;
      let scheduled = false;

      function retryCountFromUrl() {
        try {
          const receipt = new URL(location.href).searchParams.get('_galleryretry');
          if (!receipt) return 0;
          const count = Number.parseInt(receipt.split('-', 1)[0], 10);
          return Number.isFinite(count) ? Math.max(1, Math.min(MAX_AUTO_RELOADS, count)) : 1;
        } catch (_) { return 0; }
      }

      function retryCount() {
        let stored = 0;
        try {
          const value = JSON.parse(sessionStorage.getItem(KEY) || 'null');
          if (value && Date.now() - value.at < 15 * 60 * 1000) stored = Number(value.count) || 0;
        } catch (_) { /* storage may be blocked */ }
        return Math.max(stored, retryCountFromUrl());
      }

      function remember(count, reason) {
        try { sessionStorage.setItem(KEY, JSON.stringify({ count, reason, at: Date.now() })); }
        catch (_) { /* storage may be blocked */ }
      }

      function showRetry() {
        if (document.getElementById('gallery-runtime-retry')) return;
        const button = document.createElement('button');
        button.id = 'gallery-runtime-retry';
        button.type = 'button';
        button.textContent = 'A gallery file did not load — reload';
        button.style.cssText = 'position:fixed;z-index:10000;left:50%;bottom:24px;transform:translateX(-50%);padding:12px 18px;border:1px solid #f0a030;background:#0b1117;color:#ffe4b0;font:700 12px var(--font-ui);cursor:pointer';
        button.onclick = () => navigate('manual');
        document.body.appendChild(button);
      }

      function navigate(reason) {
        if (navigating) return;
        navigating = true;
        const nextCount = Math.min(MAX_AUTO_RELOADS, retryCount() + 1);
        remember(nextCount, reason);
        const receipt = `${nextCount}-${Date.now().toString(36)}`;
        const finish = () => {
          const url = new URL(location.href);
          url.searchParams.set('_galleryretry', receipt);
          url.searchParams.delete('_dplreset');
          location.replace(url.href);
        };
        // Older deployments did not run middleware on /gallery. The root
        // route has always owned the reset handshake, so fetch it first and
        // let its redirect clear the stale cookie before replacing Gallery.
        if (typeof fetch === 'function') {
          const reset = new URL('/', location.href);
          reset.searchParams.set('_dplreset', '1');
          fetch(reset.href, {
            cache: 'no-store',
            credentials: 'same-origin',
            redirect: 'follow',
          }).then(finish, finish);
        } else {
          const url = new URL(location.href);
          url.searchParams.set('_galleryretry', receipt);
          url.searchParams.set('_dplreset', '1');
          location.replace(url.href);
        }
      }

      function recover(reason) {
        if (navigating || scheduled) return;
        if (retryCount() >= MAX_AUTO_RELOADS) {
          showRetry();
          return;
        }
        scheduled = true;
        setTimeout(() => navigate(reason), 150);
      }

      addEventListener('vite:preloadError', () => recover('preload'));
      addEventListener('error', (event) => {
        const node = event.target;
        const moduleScript = node && node.tagName === 'SCRIPT' && node.type === 'module';
        if (moduleScript || /module script|dynamically imported module|module preload/i.test(String(event.message || ''))) {
          recover('module');
        }
      }, true);
      addEventListener('unhandledrejection', (event) => {
        const message = String(event.reason && (event.reason.message || event.reason) || '');
        if (/module script|dynamically imported module|module preload|failed to fetch/i.test(message)) {
          recover('module-promise');
        }
      });
    })();
  </script>

        <div class="cot-c-seg layout-switch" role="radiogroup" data-i18n-aria-label="gallery.layout.aria">
          <button type="button" role="radio" class="cot-c-seg__opt" data-value="list" aria-checked="true" data-ui-sound="select" data-i18n-aria-label="gallery.layout.list" data-i18n-title="gallery.layout.list"><svg class="cot-i" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false" data-icon="menu" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><use href="#i-menu"/></svg></button>
          <button type="button" role="radio" class="cot-c-seg__opt" data-value="grid" aria-checked="false" tabindex="-1" data-ui-sound="select" data-i18n-aria-label="gallery.layout.grid" data-i18n-title="gallery.layout.grid"><svg class="cot-i" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false" data-icon="pixels" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><use href="#i-pixels"/></svg></button>
        </div>
      </div>
      <div class="fam" id="vehicleList" role="listbox" data-i18n-aria-label="gallery.archive.listAria"></div>
    </aside>

    <section class="stage" id="viewport" aria-label="Interactive tank viewer" data-i18n-aria-label="gallery.viewer.aria">
      <div class="layers" role="group" data-i18n-aria-label="gallery.view.modeDockAria">
        <button type="button" data-mode="appearance" data-key="1" aria-pressed="true"><svg class="cot-i" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" data-icon="vehicle" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><use href="#i-vehicle"/></svg><span data-i18n="gallery.view.mode.appearance">Exterior</span><kbd class="cot-c-kbd" aria-hidden="true">1</kbd></button>
        <button type="button" data-mode="armor" data-key="2" aria-pressed="false"><svg class="cot-i" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" data-icon="layerArmor" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><use href="#i-layerArmor"/></svg><span data-i18n="gallery.view.mode.armor">Armor</span><kbd class="cot-c-kbd" aria-hidden="true">2</kbd></button>
        <button type="button" data-mode="modules" data-key="3" aria-pressed="false"><svg class="cot-i" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" data-icon="layerXray" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><use href="#i-layerXray"/></svg><span data-i18n="gallery.view.mode.modules">Modules</span><kbd class="cot-c-kbd" aria-hidden="true">3</kbd></button>
        <button type="button" data-mode="crew" data-key="4" aria-pressed="false"><svg class="cot-i" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" data-icon="team" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><use href="#i-team"/></svg><span data-i18n="gallery.view.mode.crew">Crew</span><kbd class="cot-c-kbd" aria-hidden="true">4</kbd></button>
        <button type="button" data-mode="markup" data-key="5" aria-pressed="false"><svg class="cot-i" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" data-icon="layerMarkup" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><use href="#i-layerMarkup"/></svg><span data-i18n="gallery.view.mode.markup">Markup</span><kbd class="cot-c-kbd" aria-hidden="true">5</kbd></button>
      </div>

      <div class="views" role="group" data-i18n-aria-label="gallery.viewer.viewControlsAria">
        <button type="button" data-view="hero" class="active" data-i18n="gallery.view.view.hero">Hero</button>
        <button type="button" data-view="front" data-i18n="gallery.view.view.front">Front</button>
        <button type="button" data-view="left" data-i18n="gallery.view.view.left">Left</button>
        <button type="button" data-view="right" data-i18n="gallery.view.view.right">Right</button>
        <button type="button" data-view="rear" data-i18n="gallery.view.view.rear">Rear</button>
        <button type="button" data-view="top" data-i18n="gallery.view.view.top">Top</button>
        <button type="button" data-view="elevated-left" data-i18n="gallery.view.view.elevatedLeft">Elev. L</button>
        <button type="button" data-view="elevated-right" data-i18n="gallery.view.view.elevatedRight">Elev. R</button>
      </div>

      <div class="tools" role="group" data-i18n-aria-label="gallery.tool.aria">
        <button type="button" id="autoRotate" aria-pressed="false"><svg class="cot-i" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" data-icon="rematch" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><use href="#i-rematch"/></svg><span data-i18n="gallery.view.auto">Turntable</span></button>
        <button type="button" id="photo"><svg class="cot-i" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" data-icon="toolPhoto" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><use href="#i-toolPhoto"/></svg><span data-i18n="gallery.tool.photo">Photo</span></button>
      </div>

      <div class="loading-state" id="loadingState" role="status">
        <span class="loading-state__sil cot-c-sil" id="loadingSil" aria-hidden="true"></span>
        <i class="loading-state__bar" aria-hidden="true"></i>
        <span class="sr-only" data-i18n="gallery.view.loading">Assembling vehicle</span>
      </div>

      <div class="readout" id="inspectionReadout" hidden>
        <div><span id="inspectionId">H01</span><small id="inspectionOwner"></small></div>
        <strong id="inspectionTitle"></strong>
        <p id="inspectionDetails"></p>
      </div>

      <div class="viewer-bottom-console">
        <div class="legend" id="overlayLegend" role="group" data-i18n-aria-label="gallery.legend.aria"></div>
      </div>

      <figure class="inset" id="stageInset">
        <canvas id="stageScale" width="134" height="96"></canvas>
      </figure>
    </section>

    <aside class="dossier" data-i18n-aria-label="gallery.dossier.aria">
      <div class="dossier-scroll">
        <header class="take" id="dossierTake">
          <div class="take-media" id="takeMedia" role="group"><img class="take-still" id="takeStill" alt="" width="512" height="512" decoding="async"></div>
          <div class="take-actions" id="takeActions"></div>
          <div class="nm"><img class="cot-c-flag" id="dossierFlag" alt="" width="34" height="26"><h1 id="dossierName"></h1></div>
        </header>
        <div class="dz-tabs" id="dossierTabs"></div>

        <section class="dz" id="dossier-overview" role="tabpanel">
          <div class="facts" id="dossierFacts"></div>
          <div class="dz-rules" id="dossierTags"></div>
          <div class="ratings" id="ratingGrid"></div>
          <ul class="features" id="dossierFeatures"></ul>
          <div class="vsc" id="versus">
            <label class="vsc__pick"><span class="sr-only" data-i18n="gallery.versus.rival">Rival</span><select id="rivalSelect"></select></label>
            <div class="s" id="versusOwn"></div>
            <div class="mid" id="versusMid"></div>
            <div class="s r" id="versusRival"></div>
            <canvas class="vsc__scale" id="versusScale" width="360" height="72"></canvas>
          </div>
        </section>

        <section class="dz" id="dossier-stats" role="tabpanel" hidden>
          <div class="cot-c-seg peer-switch" role="radiogroup" data-i18n-aria-label="gallery.peer.aria">
            <button type="button" role="radio" class="cot-c-seg__opt" data-value="fleet" aria-checked="true" data-ui-sound="select" data-i18n="gallery.peer.fleet">Fleet</button>
            <button type="button" role="radio" class="cot-c-seg__opt" data-value="class" aria-checked="false" tabindex="-1" data-ui-sound="select" data-i18n="gallery.peer.class">Class</button>
          </div>
          <div class="stat-groups" id="statGroups"></div>
        </section>

        <section class="dz" id="dossier-ammo" role="tabpanel" hidden>
          <div class="ammunition-list" id="ammunitionList"></div>
        </section>

        <section class="dz" id="dossier-anatomy" role="tabpanel" hidden>
          <div class="cot-c-seg diagram-switch" id="diagramSwitch" role="radiogroup" data-i18n-aria-label="gallery.diagram.aria"></div>
          <figure class="diagram"><img id="diagramImage" alt="" width="512" height="256" decoding="async"></figure>
          <div class="pose" id="pose">
            <label class="sl" for="hullYaw"><span data-i18n="gallery.dossier.hullYaw">Hull yaw</span><output id="hullYawValue" class="num">0°</output><input id="hullYaw" type="range" min="-180" max="180" value="0"></label>
            <label class="sl" for="turretYaw"><span data-i18n="gallery.dossier.turretYaw">Turret yaw</span><output id="turretYawValue" class="num">0°</output><input id="turretYaw" type="range" min="-180" max="180" value="0"></label>
            <label class="sl" for="gunPitch"><span data-i18n="gallery.dossier.gunPitch">Gun elevation</span><output id="gunPitchValue" class="num">0°</output><input id="gunPitch" type="range" min="-10" max="20" step="0.5" value="0"></label>
          </div>
        </section>

        <section class="dz" id="dossier-damage" role="tabpanel" hidden></section>

        <section class="dz" id="dossier-markup" role="tabpanel" hidden>
          <section class="surface-workbench" id="markupWorkbench" hidden>
            <div class="markup-operation-grid" role="group" aria-label="Surface markup operation" data-i18n-aria-label="aria.surfacemarkupoperation">
              <button type="button" data-markup-operation="inspect" data-i18n="gallery.markup.inspect">Inspect</button>
              <button type="button" class="active" data-markup-operation="remove" aria-pressed="true" data-i18n="gallery.markup.remove">Remove</button>
              <button type="button" data-markup-operation="reshape" data-i18n="gallery.markup.reshape">Reshape</button>
              <button type="button" data-markup-operation="add" data-i18n="gallery.markup.add">Add here</button>
            </div>

            <div class="markup-control-grid">
              <label for="markupScope"><span data-i18n="gallery.markup.scope">Selection scope</span><select id="markupScope"><option value="patch" data-i18n="gallery.markup.scope.patch">Coplanar patch</option><option value="face" data-i18n="gallery.markup.scope.face">Single triangle</option></select></label>
              <label for="markupPatchAngle"><span data-i18n="gallery.markup.patchAngle">Patch angle</span><input id="markupPatchAngle" type="number" value="14" min="1" max="45" step="1"></label>
            </div>

            <label class="markup-field" for="markupNote"><span data-i18n="gallery.markup.note">Geometry instruction</span><textarea id="markupNote"></textarea></label>

            <div class="markup-request" id="markupReshapeFields" hidden>
              <span data-i18n="gallery.markup.suggestedOffset">Suggested offset / metres</span>
              <div class="markup-vector"><input id="markupOffsetX" type="number" step="0.01" value="0" aria-label="X offset" data-i18n-aria-label="aria.xoffset"><input id="markupOffsetY" type="number" step="0.01" value="0" aria-label="Y offset" data-i18n-aria-label="aria.yoffset"><input id="markupOffsetZ" type="number" step="0.01" value="0" aria-label="Z offset" data-i18n-aria-label="aria.zoffset"></div>
            </div>

            <div class="markup-request" id="markupAddFields" hidden>
              <label for="markupPrimitive"><span data-i18n="gallery.markup.primitive">Primitive</span><select id="markupPrimitive"><option data-i18n="gallery.markup.primitive.custom">custom</option><option data-i18n="gallery.markup.primitive.box">box</option><option data-i18n="gallery.markup.primitive.wedge">wedge</option><option data-i18n="gallery.markup.primitive.cylinder">cylinder</option><option data-i18n="gallery.markup.primitive.rail">rail</option><option data-i18n="gallery.markup.primitive.armor">armor</option></select></label>
              <span data-i18n="gallery.markup.size">Size W × H × D / metres</span>
              <div class="markup-vector"><input id="markupSizeW" type="number" step="0.01" value="0.20" aria-label="Width" data-i18n-aria-label="aria.width"><input id="markupSizeH" type="number" step="0.01" value="0.20" aria-label="Height" data-i18n-aria-label="aria.height"><input id="markupSizeD" type="number" step="0.01" value="0.20" aria-label="Depth" data-i18n-aria-label="aria.depth"></div>
            </div>

            <div class="markup-selection-head"><span data-i18n="gallery.markup.selections">Selections</span><output id="markupSelectionCount" class="num">0</output></div>
            <div class="markup-selection-list" id="markupSelectionList"></div>
            <div class="markup-action-row"><button type="button" id="markupUndo" data-i18n="gallery.markup.undo">Undo</button><button type="button" id="markupClear" data-i18n="gallery.markup.clear">Clear</button><button type="button" id="markupFocus" data-i18n="gallery.markup.focus">Focus</button></div>

            <label class="markup-field" for="markupJson"><span data-i18n="gallery.markup.json">Review packet JSON</span><textarea id="markupJson" class="markup-json" readonly spellcheck="false"></textarea></label>
            <div class="markup-action-row"><button type="button" id="markupCopy" data-i18n="gallery.markup.copyJson">Copy JSON</button><button type="button" id="markupDownload" data-i18n="gallery.markup.download">Download</button><button type="button" id="markupSavePng" data-i18n="gallery.markup.savePng">Save PNG</button></div>
          </section>
        </section>
      </div>

      <div class="acts">
        <button type="button" id="testDrive" class="cot-c-btn cot-c-btn--primary cot-c-btn--36" data-ui-sound="confirm"><svg class="cot-i" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" data-icon="modeProving" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><use href="#i-modeProving"/></svg><span class="cot-c-btn__label" data-i18n="gallery.dossier.testDrive">Test Drive</span></button>
        <button type="button" id="favourite" class="cot-c-btn cot-c-btn--36 cot-c-btn--icon" aria-pressed="false" data-ui-sound="toggle" data-i18n-aria-label="gallery.dossier.favourite" data-i18n-title="gallery.dossier.favourite"><svg class="cot-i" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" data-icon="star" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><use href="#i-star"/></svg></button>
        <button type="button" id="copyLink" class="cot-c-btn cot-c-btn--36 cot-c-btn--icon" data-ui-sound="press" data-i18n-aria-label="gallery.dossier.linkTitle" data-i18n-title="gallery.dossier.linkTitle"><svg class="cot-i" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" data-icon="statChain" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><use href="#i-statChain"/></svg></button>
        <button type="button" id="copySpec" class="cot-c-btn cot-c-btn--36 cot-c-btn--icon" data-ui-sound="press" data-i18n-aria-label="gallery.dossier.copyDataTitle" data-i18n-title="gallery.dossier.copyDataTitle"><svg class="cot-i" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" data-icon="copy" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><use href="#i-copy"/></svg></button>
      </div>
    </aside>
  </main>

  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="/src/analytics.ts"></script>
  <script type="module" src="/src/presentation/publicNav.ts"></script>
  <script type="module" src="/src/gallery/gallery.ts"></script>
</body>
</html>
