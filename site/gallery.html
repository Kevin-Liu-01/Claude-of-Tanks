  <script>
    // GALLERY CHUNK RECOVERY: this page shares the game's site-wide Vercel
    // deployment pin. If an old pin or cached document names removed hashes,
    // recover onto one coherent deployment without asking users to clear data.
    (() => {
      const KEY = 'cot.galleryRecovery.v1';
      const MAX_AUTO_RELOADS = 2;
      let navigating = false;
      let scheduled = false;

      function retryCountFromUrl() {
        try {
          const receipt = new URL(location.href).searchParams.get('_galleryretry');
          if (!receipt) return 0;
          const count = Number.parseInt(receipt.split('-', 1)[0], 10);
          return Number.isFinite(count) ? Math.max(1, Math.min(MAX_AUTO_RELOADS, count)) : 1;
        } catch (_) { return 0; }
      }

      function retryCount() {
        let stored = 0;
        try {
          const value = JSON.parse(sessionStorage.getItem(KEY) || 'null');
          if (value && Date.now() - value.at < 15 * 60 * 1000) stored = Number(value.count) || 0;
        } catch (_) { /* storage may be blocked */ }
        return Math.max(stored, retryCountFromUrl());
      }

      function remember(count, reason) {
        try { sessionStorage.setItem(KEY, JSON.stringify({ count, reason, at: Date.now() })); }
        catch (_) { /* storage may be blocked */ }
      }

      function showRetry() {
        if (document.getElementById('gallery-runtime-retry')) return;
        const button = document.createElement('button');
        button.id = 'gallery-runtime-retry';
        button.type = 'button';
        button.textContent = 'A gallery file did not load — reload';
        button.style.cssText = 'position:fixed;z-index:10000;left:50%;bottom:24px;transform:translateX(-50%);padding:12px 18px;border:1px solid #f0a030;background:#0b1117;color:#ffe4b0;font:700 12px var(--font-ui);cursor:pointer';
        button.onclick = () => navigate('manual');
        document.body.appendChild(button);
      }

      function navigate(reason) {
        if (navigating) return;
        navigating = true;
        const nextCount = Math.min(MAX_AUTO_RELOADS, retryCount() + 1);
        remember(nextCount, reason);
        const receipt = `${nextCount}-${Date.now().toString(36)}`;
        const finish = () => {
          const url = new URL(location.href);
          url.searchParams.set('_galleryretry', receipt);
          url.searchParams.delete('_dplreset');
          location.replace(url.href);
        };
        // Older deployments did not run middleware on /gallery. The root
        // route has always owned the reset handshake, so fetch it first and
        // let its redirect clear the stale cookie before replacing Gallery.
        if (typeof fetch === 'function') {
          const reset = new URL('/', location.href);
          reset.searchParams.set('_dplreset', '1');
          fetch(reset.href, {
            cache: 'no-store',
            credentials: 'same-origin',
            redirect: 'follow',
          }).then(finish, finish);
        } else {
          const url = new URL(location.href);
          url.searchParams.set('_galleryretry', receipt);
          url.searchParams.set('_dplreset', '1');
          location.replace(url.href);
        }
      }

      function recover(reason) {
        if (navigating || scheduled) return;
        if (retryCount() >= MAX_AUTO_RELOADS) {
          showRetry();
          return;
        }
        scheduled = true;
        setTimeout(() => navigate(reason), 150);
      }

      addEventListener('vite:preloadError', () => recover('preload'));
      addEventListener('error', (event) => {
        const node = event.target;
        const moduleScript = node && node.tagName === 'SCRIPT' && node.type === 'module';
        if (moduleScript || /module script|dynamically imported module|module preload/i.test(String(event.message || ''))) {
          recover('module');
        }
      }, true);
      addEventListener('unhandledrejection', (event) => {
        const message = String(event.reason && (event.reason.message || event.reason) || '');
        if (/module script|dynamically imported module|module preload|failed to fetch/i.test(message)) {
          recover('module-promise');
        }
      });
    })();
  </script>

              <label for="markupPrimitive"><span data-i18n="gallery.markup.primitive">Primitive</span><select id="markupPrimitive"><option data-i18n="gallery.markup.primitive.custom">custom</option><option data-i18n="gallery.markup.primitive.box">box</option><option data-i18n="gallery.markup.primitive.wedge">wedge</option><option data-i18n="gallery.markup.primitive.cylinder">cylinder</option><option data-i18n="gallery.markup.primitive.rail">rail</option><option data-i18n="gallery.markup.primitive.armor">armor</option></select></label>
              <span data-i18n="gallery.markup.size">Size W × H × D / metres</span>
              <div class="markup-vector"><input id="markupSizeW" type="number" step="0.01" value="0.20" aria-label="Width" data-i18n-aria-label="aria.width"><input id="markupSizeH" type="number" step="0.01" value="0.20" aria-label="Height" data-i18n-aria-label="aria.height"><input id="markupSizeD" type="number" step="0.01" value="0.20" aria-label="Depth" data-i18n-aria-label="aria.depth"></div>
            </div>

            <div class="markup-selection-head"><span data-i18n="gallery.markup.selections">Selections</span><output id="markupSelectionCount" class="num">0</output></div>
            <div class="markup-selection-list" id="markupSelectionList"></div>
            <div class="markup-action-row"><button type="button" id="markupUndo" data-i18n="gallery.markup.undo">Undo</button><button type="button" id="markupClear" data-i18n="gallery.markup.clear">Clear</button><button type="button" id="markupFocus" data-i18n="gallery.markup.focus">Focus</button></div>

            <label class="markup-field" for="markupJson"><span data-i18n="gallery.markup.json">Review packet JSON</span><textarea id="markupJson" class="markup-json" readonly spellcheck="false"></textarea></label>
            <div class="markup-action-row"><button type="button" id="markupCopy" data-i18n="gallery.markup.copyJson">Copy JSON</button><button type="button" id="markupDownload" data-i18n="gallery.markup.download">Download</button><button type="button" id="markupSavePng" data-i18n="gallery.markup.savePng">Save PNG</button></div>
          </section>
        </section>
      </div>

      <div class="dossier-actions">
        <button type="button" id="testDrive" class="cot-c-btn cot-c-btn--primary cot-c-btn--36" data-ui-sound="confirm"><svg class="cot-i" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" data-icon="modeProving" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><use href="#i-modeProving"/></svg><span class="cot-c-btn__label" data-i18n="gallery.dossier.testDrive">Test Drive</span></button>
        <button type="button" id="favourite" class="cot-c-btn cot-c-btn--secondary cot-c-btn--36 cot-c-btn--icon" aria-pressed="false" data-i18n-aria-label="gallery.dossier.favourite" data-i18n-title="gallery.dossier.favourite"><svg class="cot-i" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" data-icon="star" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><use href="#i-star"/></svg></button>
        <button type="button" id="copyLink" class="cot-c-btn cot-c-btn--secondary cot-c-btn--36 cot-c-btn--icon" data-i18n-aria-label="gallery.dossier.linkTitle" data-i18n-title="gallery.dossier.linkTitle"><svg class="cot-i" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" data-icon="statChain" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><use href="#i-statChain"/></svg></button>
        <button type="button" id="copySpec" class="cot-c-btn cot-c-btn--secondary cot-c-btn--36 cot-c-btn--icon" data-i18n-aria-label="gallery.dossier.copyDataTitle" data-i18n-title="gallery.dossier.copyDataTitle"><svg class="cot-i" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" data-icon="copy" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><use href="#i-copy"/></svg></button>
      </div>
    </aside>
  </main>

  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="/src/analytics.ts"></script>
  <script type="module" src="/src/presentation/publicNav.ts"></script>
  <script type="module" src="/src/gallery/gallery.ts"></script>
</body>
</html>
