name: Check

# The fast tier (practice audit 2026-11-26, mechanism 10): `npm run check` is Oxlint, the 1,500-line size ratchet,
# the /tmp-literal scan and the one TypeScript 7 compile. No receipt suite runs here (tools/selftest-tiers.selftest.mjs):
# the default tier runs in the release gate, and the manual suites only when the owner triggers them.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# least privilege: the job reads the repository and nothing else
permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # nothing here drives a browser; skip the unpinned Chrome download in puppeteer's postinstall
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint, size ratchet, /tmp literals, typecheck
        run: npm run check
