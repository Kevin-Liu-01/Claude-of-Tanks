name: Localization

on:
  pull_request:
  push:
    branches: [main]

# least privilege: the job reads the repository and nothing else
permissions:
  contents: read

jobs:
  gt-catalog-gate:
    runs-on: ubuntu-latest
    env:
      # the i18n gate needs no browser; skip the unpinned Chrome download in puppeteer's postinstall
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate General Translation catalogs and locale routes
        run: npm run i18n:check
