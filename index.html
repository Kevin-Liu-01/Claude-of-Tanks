  <!-- MOBILE-UX r1: pinch must never zoom the PAGE (pinch-out is the scope
       gesture in battle — touchControls.js). maximum-scale/user-scalable stop
       spec-compliant mobile browsers; iOS Safari ignores user-scalable, so
       touchControls.js also cancels its non-standard gesture* pinch events.
       viewport-fit=cover exposes env(safe-area-inset-*) on notched phones —
       the touch HUD keeps its controls off the notch/home bar with them. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

       VideoGame JSON-LD block so search/answer engines get typed facts
       instead of scraping the splash. Brand set lives in public/brand/,

  <!-- BOOT SCREEN: the wordmark weights are on the critical paint path, so they
       are preloaded ahead of the module graph (the splash markup below is inline
       for exactly the same reason — first paint must not wait on /src/main.js). -->
  <link rel="preload" href="/fonts/abc-monument-grotesk/ABCMonumentGrotesk-Medium.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/abc-monument-grotesk/ABCMonumentGrotesk-Bold.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    :root {
      /* One raster-quality contract for every DOM HUD mounted by the game.
         Most panels are composited translucent layers, where browser defaults
         can fall back to visibly coarse grayscale glyph edges. */
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      font-kerning: normal;
      font-synthesis: none;
      /* Monument Grotesk ships static cuts (no opsz axis) — kept as a no-op
         so any future variable face picks up optical sizing automatically. */
      font-optical-sizing: auto;
    }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #05080b;
      /* MOBILE-UX r1: no double-tap zoom anywhere (taps stay instant); menus
         keep one-finger scrolling — their own overflow containers pan as
         normal under touch-action: manipulation. */
      touch-action: manipulation; }
    body, button, input, select, textarea {
      -webkit-font-smoothing: inherit;
      text-rendering: optimizeLegibility;
      font-kerning: inherit;
      font-synthesis: none;
      font-optical-sizing: auto;
      /* type mandate: UI weight floor is 500 — nothing renders at book/regular */
      font-weight: 500;
    }
    #app { width: 100%; height: 100%; }
    canvas, img { image-rendering: auto; }
    canvas { display: block; }
    /* MOBILE-UX r1: the 3D surface is a gameplay surface on every screen
       (battle swipe-aim, garage orbit drag) — never a browser pan/pinch
       target. Menus/garage DOM keeps its own scrolling; this is canvas-only. */
    #app canvas { touch-action: none; }
    svg { shape-rendering: geometricPrecision; text-rendering: geometricPrecision; }

    /* ---------------------------------------------------------------------
       ENTRY / LOADING SCREEN (src/ui/bootScreen.js drives the live parts).
       Everything needed for the FIRST PAINT is inline here: the game used to
       show a black screen for ~7.5 s while the vehicle textures and the 1 km
       world baked. Now the branded splash paints from the HTML itself, before
       a single module is fetched, and the bar below is driven by real load
       stages (see bootScreen.js / main.js BOOT STAGES).
       --------------------------------------------------------------------- */
    /* ABC Monument Grotesk (Dinamo Typefaces — owner-provided cut, fonts r4
       owner-directed swap replacing Inter; see docs/ATTRIBUTION.md). Three
       static faces with weight RANGES so the existing hierarchy maps: 100-400
       Regular, 500-600 Medium, 700-900 Bold (usage weight floor: 500). Keep
       these three blocks in sync with src/ui/fonts.js FONT_CSS. */
    @font-face { font-family: 'ABC Monument Grotesk';
      src: url('/fonts/abc-monument-grotesk/ABCMonumentGrotesk-Regular.woff2') format('woff2');
      font-weight: 100 400; font-style: normal; font-display: swap; }
    @font-face { font-family: 'ABC Monument Grotesk';
      src: url('/fonts/abc-monument-grotesk/ABCMonumentGrotesk-Medium.woff2') format('woff2');
      font-weight: 500 600; font-style: normal; font-display: swap; }
    @font-face { font-family: 'ABC Monument Grotesk';
      src: url('/fonts/abc-monument-grotesk/ABCMonumentGrotesk-Bold.woff2') format('woff2');
      font-weight: 700 900; font-style: normal; font-display: swap; }

    #cot-boot {
      position: fixed; inset: 0; z-index: 200; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: 'ABC Monument Grotesk', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #e6edf3; -webkit-user-select: none; user-select: none; cursor: default;
      background:
        radial-gradient(118% 82% at 50% 22%, #16202b 0%, #0b1117 42%, #05080b 78%),
        #05080b;
      opacity: 1; transition: opacity .5s ease;
    }
    #cot-boot.cot-boot-out { opacity: 0; pointer-events: none; }
    /* MARKETING BACKDROP (in-engine action stills, lazy-loaded by
       bootScreen.js AFTER first paint — never on the boot critical path).
       Two stacked layers crossfade for the gate-idle slideshow; the scrim
       gradient keeps the splash chrome/wordmark contrast on any frame. */
    #cot-boot-hero { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
    #cot-boot-hero .hly {
      position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s ease;
      background-size: cover; background-position: center 38%;
    }
    #cot-boot-hero .hly.on { opacity: 1; }
    #cot-boot-hero::after {
      content: ''; position: absolute; inset: 0;
      background:
        linear-gradient(180deg, rgba(5,8,11,.78) 0%, rgba(5,8,11,.46) 26%, rgba(5,8,11,.40) 55%, rgba(5,8,11,.84) 100%),
        radial-gradient(120% 95% at 50% 34%, rgba(5,8,11,.10) 0%, rgba(5,8,11,.58) 88%);
    }
    /* horizon glow + a faint armour-plate grid so the field is never flat black */
    #cot-boot::before {
      content: ''; position: absolute; left: -10%; right: -10%; bottom: -8%; height: 62%; z-index: 1;
      background: radial-gradient(60% 100% at 50% 100%, rgba(240,160,48,.20) 0%, rgba(240,160,48,.05) 45%, rgba(240,160,48,0) 72%);
      pointer-events: none;
    }
    #cot-boot::after {
      content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background-image:
        linear-gradient(rgba(146,164,180,.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(146,164,180,.055) 1px, transparent 1px);
      background-size: 74px 74px, 74px 74px;
      mask-image: radial-gradient(88% 68% at 50% 44%, #000 12%, transparent 74%);
      -webkit-mask-image: radial-gradient(88% 68% at 50% 44%, #000 12%, transparent 74%);
    }
    .cot-boot-inner { position: relative; z-index: 2; width: min(760px, 86vw); text-align: center; }

    /* --- emblem + wordmark ------------------------------------------------ */
    /* garage_ui: staggered entrance — the splash used to pop in fully formed.
       Pure CSS with `backwards` fill, so it runs from the very first paint
       (no JS on the path) and every element still lands exactly where the
       static layout put it. */
    .cot-boot-mark { display: block; width: 120px; height: 120px; margin: 0 auto 20px;
      animation: cot-boot-pop .62s cubic-bezier(.18,.7,.3,1) backwards; }
    .cot-boot-word { line-height: .92; }
    .cot-boot-word .l1 {
      display: block; font-weight: 800; letter-spacing: .10em; text-indent: .10em;
      font-size: clamp(34px, 6.4vw, 62px); color: #f2f7fb;
      text-shadow: 0 2px 26px rgba(0,0,0,.75);
      animation: cot-boot-rise .5s ease-out .10s backwards;
    }
    .cot-boot-word .l2 {
      display: flex; align-items: center; justify-content: center; gap: 14px;
      margin-top: 12px; font-family: 'ABC Monument Grotesk', 'Arial Narrow', Arial, sans-serif;
      font-weight: 700; letter-spacing: .30em; text-indent: .30em;
      font-size: clamp(14px, 2.05vw, 21px); color: #f0a030;
      animation: cot-boot-rise .5s ease-out .18s backwards;
    }
    .cot-boot-word .l2 i { display: block; height: 1px; width: clamp(28px, 8vw, 92px);
      background: linear-gradient(90deg, rgba(240,160,48,0), #f0a030); }
    .cot-boot-word .l2 i + span + i { background: linear-gradient(270deg, rgba(240,160,48,0), #f0a030); }
    .cot-boot-tag {
      margin-top: 20px; font-family: 'ABC Monument Grotesk', 'Arial Narrow', Arial, sans-serif;
      font-weight: 600; font-size: 10.5px; letter-spacing: .26em; text-indent: .26em;
      color: #6e7d8a; text-transform: uppercase;
      animation: cot-boot-rise .5s ease-out .26s backwards;
    }
    @keyframes cot-boot-pop { from { opacity: 0; transform: scale(.85) translateY(8px); } }
    @keyframes cot-boot-rise { from { opacity: 0; transform: translateY(12px); } }
    @keyframes cot-boot-fade { from { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .cot-boot-mark, .cot-boot-word .l1, .cot-boot-word .l2, .cot-boot-tag,
      .cot-boot-load, .cot-boot-tip, .cot-boot-foot { animation: none; }
    }

    /* --- progress ---------------------------------------------------------- */
    .cot-boot-load { margin-top: 46px; animation: cot-boot-rise .55s ease-out .36s backwards; }
    .cot-boot-meta {
      display: flex; align-items: flex-end; justify-content: space-between; gap: 18px;
      margin-bottom: 9px;
      font-family: 'ABC Monument Grotesk', 'Arial Narrow', Arial, sans-serif;
      font-variant-numeric: tabular-nums;
    }
    .cot-boot-stage {
      font-size: 11px; font-weight: 700; letter-spacing: .26em; text-transform: uppercase;
      color: #9fb0bf; text-align: left; min-height: 14px;
    }
    .cot-boot-pct { font-size: 21px; font-weight: 700; letter-spacing: .06em; color: #ffd27a; }
    .cot-boot-bar {
      position: relative; height: 6px; background: rgba(255,255,255,.07);
      box-shadow: inset 0 0 0 1px rgba(146,164,180,.22);
    }
    .cot-boot-fill {
      position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
      background: linear-gradient(90deg, #b96f10 0%, #f0a030 62%, #ffcf7d 100%);
      box-shadow: 0 0 16px rgba(240,160,48,.55);
    }
    /* travelling sheen — proves the loop is alive even inside a long stage */
    .cot-boot-fill::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.34) 50%, rgba(255,255,255,0) 100%);
      background-size: 42% 100%; background-repeat: no-repeat;
      animation: cot-sheen 1.35s linear infinite;
    }
    @keyframes cot-sheen { from { background-position: -45% 0; } to { background-position: 145% 0; } }
    .cot-boot-ticks {
      display: flex; gap: 4px; margin-top: 10px;
    }
    .cot-boot-ticks span {
      flex: 1 1 0; height: 2px; background: rgba(146,164,180,.18);
      transition: background .2s ease, box-shadow .2s ease;
    }
    .cot-boot-ticks span.on { background: #f0a030; box-shadow: 0 0 8px rgba(240,160,48,.6); }

    /* --- tips + gate ------------------------------------------------------- */
    .cot-boot-tip {
      margin-top: 34px; min-height: 44px; padding: 0 6%;
      font-size: 13px; font-weight: 500; line-height: 1.55; color: #aebbc7;
      opacity: 1; transition: opacity .35s ease;
      animation: cot-boot-rise .55s ease-out .46s backwards;
    }
    .cot-boot-tip.fade { opacity: 0; }
    .cot-boot-tip b {
      display: block; margin-bottom: 5px;
      font-family: 'ABC Monument Grotesk', 'Arial Narrow', Arial, sans-serif;
      font-size: 9.5px; font-weight: 700; letter-spacing: .3em; color: #f0a030;
      text-transform: uppercase;
    }
    .cot-boot-gate {
      margin-top: 26px; height: 22px;
      font-family: 'ABC Monument Grotesk', 'Arial Narrow', Arial, sans-serif;
      font-size: 12.5px; font-weight: 700; letter-spacing: .28em; text-indent: .28em;
      color: #ffe4b0; text-transform: uppercase; opacity: 0;
      transition: opacity .4s ease;
    }
    .cot-boot-gate.on { opacity: 1; animation: cot-gate 1.5s ease-in-out infinite; }
    @keyframes cot-gate { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
    .cot-boot-foot {
      position: absolute; left: 0; right: 0; bottom: 20px; z-index: 2;
      font-family: 'ABC Monument Grotesk', 'Arial Narrow', Arial, sans-serif;
      font-size: 9px; font-weight: 600; letter-spacing: .26em; color: #4b5865;
      text-transform: uppercase; text-align: center;
      animation: cot-boot-fade .6s ease-out .55s backwards;
    }
    @media (max-width: 760px) { .cot-boot-mark { width: 92px; height: 92px; } .cot-boot-load { margin-top: 32px; } }
  </style>
</head>
