[package]
name = "cot-sim-wasm"
description = "Raw C-ABI WebAssembly bindings of cot-sim: the pinned ECMAScript math, the terrain contact lattice, the obstacle grid and the shell step"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
cot-sim = { path = "../cot-sim" }
