<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 210" role="img" aria-label="Claude of Tanks">
  <!-- v4.1 (owner-directed): speed lines removed — the tank is the primary feature; tank scaled +6% and re-centered in the bowl; ground bar trimmed to the bowl curve; metal variant promoted to favicon. v4.3: ground bar removed entirely; cannon back at -10 degrees but translated down 4 units on the turret face. -->
  <!-- Claude of Tanks v4 full lockup: colored crest badge (master:
       public/brand/logo-mark.svg — keep in sync; v3 archived in
       public/brand/v3-shield/) + Inter wordmark, white, for dark contexts. Wordmark fonts: subset of Inter wght 800/700 opsz 32
       embedded as woff2 data URIs so the file is self-contained; Inter is
       OFL — see docs/ATTRIBUTION.md. Mascot: Anthropic (via thesvg.org). -->
  <style>
    @font-face { font-family: 'CotInter800'; src: url(data:font/woff2;base64,) format('woff2'); font-weight: 800; }
    @font-face { font-family: 'CotInter700'; src: url(data:font/woff2;base64,) format('woff2'); font-weight: 700; }
    .wm1 { font: 800 58px 'CotInter800', 'Inter', 'Segoe UI', sans-serif; letter-spacing: 2.3px; fill: #f2f7fb; }
    .wm2 { font: 700 27px 'CotInter700', 'Inter', 'Segoe UI', sans-serif; letter-spacing: 11.3px; fill: #f2f7fb; }
  </style>
  <g transform="translate(5 5) scale(0.78125)">
  <defs>
    <clipPath id="cotHatchClipF"><rect x="70" y="26" width="68" height="44"/></clipPath>
  </defs>

  <!-- ===== crest: ink band, amber pinstripe groove, dark steel field ===== -->
  <path d="M34 26 H222 L236 40 V112 C236 174 196 214 128 238 C60 214 20 174 20 112 V40 Z"
        fill="#151f29" stroke="#0b0f12" stroke-width="16" stroke-linejoin="miter"/>
  <path d="M34 26 H222 L236 40 V112 C236 174 196 214 128 238 C60 214 20 174 20 112 V40 Z"
        fill="none" stroke="#f5b64b" stroke-width="3"/>

  <g transform="translate(-0.8 24) scale(1.06)">

    <!-- whip antenna: one clean 45-degree diagonal off the rear deck -->
    <path d="M52 96 32 76" stroke="#55697e" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <!-- flag: vertical pole from the bustle rack + amber pennant streaming back -->
    <path d="M68 84V34" stroke="#55697e" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M68 34 46 39.5 68 45Z" fill="#f5b64b"/>

    <!-- running gear: near-black track band, steel wheel two-tone
         (six identical road wheels on an exact 24.4 pitch) -->
    <path d="M52 107h122a15 15 0 0 1 0 30H52a15 15 0 0 1 0-30Z" fill="#0c1218"/>
    <g fill="#33424f">
      <circle cx="52" cy="122" r="10"/><circle cx="76.4" cy="122" r="10"/><circle cx="100.8" cy="122" r="10"/>
      <circle cx="125.2" cy="122" r="10"/><circle cx="149.6" cy="122" r="10"/><circle cx="174" cy="122" r="10"/>
    </g>
    <g fill="#0c1218">
      <circle cx="52" cy="122" r="3.2"/><circle cx="76.4" cy="122" r="3.2"/><circle cx="100.8" cy="122" r="3.2"/>
      <circle cx="125.2" cy="122" r="3.2"/><circle cx="149.6" cy="122" r="3.2"/><circle cx="174" cy="122" r="3.2"/>
    </g>

    <!-- hull: low profile, long wedge glacis (steel mass, lighter edge seams) -->
    <path d="M34 116 40 94h108l52 18-3 6Z" fill="#2a3947"/>
    <path d="M148 94l52 18-1.9 3.8-51.6-17.6Z" fill="#4d637a"/>
    <rect x="40" y="94" width="108" height="2.4" fill="#4d637a"/>

    <!-- side skirt: lighter steel panel; seams sit exactly midway between
         wheel centers so panels and wheels share one rhythm -->
    <path d="M46 106h136v8l-9 12H46Z" fill="#3d5062" stroke="#0c1218" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="41" y="106" width="5" height="20" fill="#1c2833"/>
    <g stroke="#1a232d" stroke-width="1.8">
      <path d="M64.2 107.5V124M88.6 107.5V124M113 107.5V124M137.4 107.5V124M161.8 107.5V124"/>
    </g>

    <!-- turret: long low wedge + bustle rack + facet flash -->
    <rect x="60" y="79" width="16" height="14" rx="1.5" fill="#1c2833"/>
    <path d="M61 83.7h14M61 88.3h14" stroke="#0c1218" stroke-width="1.8"/>
    <path d="M72 96 82 74l58 3.5L154 96Z" fill="#3a4c5f"/>
    <path d="M82 74 140 77.5 138.8 80.8 81 77.2Z" fill="#4d637a"/>
    <path d="M124 80l7 .5 6 15.5h-7Z" fill="#f5b64b"/>

    <!-- the commander: Claude Code mascot, faithful source path (brand orange;
         legs clipped by the hatch), centered on x=106 with the hatch ring -->
    <rect x="91" y="57" width="30" height="12" fill="#0c1218"/>
    <g clip-path="url(#cotHatchClipF)">
      <path clip-rule="evenodd" fill-rule="evenodd" fill="#D97757" stroke="#0b0f12"
        stroke-width="1.5" paint-order="stroke" transform="translate(82.6 42.75) scale(1.95)"
        d="M20.998 10.949H24v3.102h-3v3.028h-1.487V20H18v-2.921h-1.487V20H15v-2.921H9V20H7.488v-2.921H6V20H4.487v-2.921H3V14.05H0V10.95h3V5h17.998v5.949zM6 10.949h1.488V8.102H6v2.847zm10.51 0H18V8.102h-1.49v2.847z"/>
    </g>
    <!-- hatch coaming (arms rest on the ring) -->
    <rect x="81" y="68" width="50" height="6.5" rx="1.5" fill="#3a4c5f" stroke="#0c1218" stroke-width="2.5"/>

    <!-- tanker helmet: light steel dome + rim + goggles, all symmetric on x=106 -->
    <path d="M87.5 52.5a18.5 12 0 0 1 37 0Z" fill="#7d90a3" stroke="#0c1218" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="85.5" y="52.3" width="41" height="4.2" rx="2" fill="#0e151d"/>
    <rect x="93.75" y="45.2" width="24.5" height="5.2" rx="1.5" fill="#0e151d"/>
    <circle cx="101.75" cy="47.8" r="3.8" fill="#0e151d" stroke="#9fb2c4" stroke-width="1.8"/>
    <circle cx="110.25" cy="47.8" r="3.8" fill="#0e151d" stroke="#9fb2c4" stroke-width="1.8"/>

    <!-- main gun, elevated 10 degrees: steel barrel, light keylines + muzzle
         step — trimmed so the muzzle stays inside the shield's inner border -->
    <g transform="translate(0 4) rotate(-10 140 82)">
      <rect x="136" y="76" width="18" height="12" rx="1.5" fill="#24313f"/>
      <rect x="154" y="78.3" width="48" height="7.4" fill="#2b3947"/>
      <rect x="154" y="78.3" width="48" height="1.9" fill="#4d637a"/>
      <rect x="154" y="84.5" width="48" height="1.2" fill="#1a232d"/>
      <rect x="166" y="76.4" width="16" height="11.2" rx="4.4" fill="#24313f" stroke="#7d90a3" stroke-width="1.8"/>
      <rect x="199.5" y="76.2" width="11" height="11.6" rx="1.5" fill="#7d90a3" stroke="#0b0f12" stroke-width="2.5"/>
    </g>
  </g>
  </g>
  <text class="wm1" x="227" y="102">CLAUDE</text>
  <text class="wm2" x="229" y="138">OF TANKS</text>
</svg>
