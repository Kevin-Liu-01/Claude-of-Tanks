<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 210" role="img" aria-label="Claude of Tanks">
  <!-- Claude of Tanks v4 full lockup, METAL treatment (owner ask, brand r2):
       the embossed metal crest (master: public/brand/logo-mark-metal.svg —
       keep in sync) + the lockup wordmark from logo-full.svg re-cut in
       brushed steel (vertical banded gradient, hairline gunmetal edge so it
       holds on paper stages). Replaces the retired simple mark in the brand
       set. Wordmark fonts: same self-contained Inter 800/700 woff2 subsets
       as logo-full.svg (OFL — docs/ATTRIBUTION.md). Mascot: Anthropic (via
       thesvg.org). -->
  <style>
    @font-face { font-family: 'CotInter800'; src: url(data:font/woff2;base64,) format('woff2'); font-weight: 800; }
    @font-face { font-family: 'CotInter700'; src: url(data:font/woff2;base64,) format('woff2'); font-weight: 700; }
    .wm1 { font: 800 58px 'CotInter800', 'Inter', 'Segoe UI', sans-serif; letter-spacing: 2.3px; fill: url(#cotWordSteelM); stroke: #232b33; stroke-width: .6; paint-order: stroke; }
    .wm2 { font: 700 27px 'CotInter700', 'Inter', 'Segoe UI', sans-serif; letter-spacing: 11.3px; fill: url(#cotWordSteelM); stroke: #232b33; stroke-width: .6; paint-order: stroke; }
  </style>
  <defs>
    <linearGradient id="cotWordSteelM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f6f9"/>
      <stop offset=".45" stop-color="#c3ced7"/>
      <stop offset=".55" stop-color="#93a1ad"/>
      <stop offset="1" stop-color="#6a7682"/>
    </linearGradient>
  </defs>
  <g transform="translate(5 5) scale(0.78125)">
  <!-- v4.1 (owner-directed): speed lines removed — the tank is the primary feature; tank scaled +6% and re-centered in the bowl; ground bar trimmed to the bowl curve; metal variant promoted to favicon. v4.3: ground bar removed entirely; cannon back at -10 degrees but translated down 4 units on the turret face. -->
  <!-- Claude of Tanks v4 crest mark — METAL treatment (embossed badge for
       premium/medal surfaces). Same shield geometry + tank composition as
       logo-mark-bw.svg / logo-mark.svg (keep in sync). v4 (owner-directed
       cleanup; v3 archived in public/brand/v3-shield/): tank rescaled to fit
       FULLY inside the shield's inner border (muzzle no longer breaks the
       wall), two stroke weights only (2.5 primary / 1.8 detail; 1.2 specular
       hairlines), skirt seams locked to the wheel pitch, vertical flag pole +
       one diagonal whip antenna, blobby dashes replaced by three rounded
       speed strokes. This variant alone is ALLOWED gradients: brushed-steel
       field (vertical banded gradient), gunmetal border band lit at 135deg
       (light top-left rim, dark bottom-right rim), polished inner groove,
       diagonal glass sheen, tank in dark gunmetal relief with silver specular
       seams. Mascot stays brand orange #D97757 so the commander reads
       (steel-mascot variant tried and rejected: vanished into the field at
       64px). Mascot: Anthropic (via thesvg.org) — see docs/ATTRIBUTION.md. -->
  <defs>
    <clipPath id="cotHatchClipM"><rect x="70" y="29" width="68" height="44"/></clipPath>
    <clipPath id="cotShieldClipM">
      <path d="M34 26 H222 L236 40 V112 C236 174 196 214 128 238 C60 214 20 174 20 112 V40 Z"/>
    </clipPath>
    <clipPath id="cotLightHalfM"><path d="M-20 -20 H276 L-20 276 Z"/></clipPath>
    <clipPath id="cotDarkHalfM"><path d="M276 -20 V276 H-20 Z"/></clipPath>
    <linearGradient id="cotFieldSteelM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbe2e9"/>
      <stop offset=".16" stop-color="#c3ced7"/>
      <stop offset=".2" stop-color="#cfdae2"/>
      <stop offset=".44" stop-color="#a0adb8"/>
      <stop offset=".5" stop-color="#93a1ad"/>
      <stop offset=".56" stop-color="#9fadb8"/>
      <stop offset=".8" stop-color="#75828e"/>
      <stop offset="1" stop-color="#5c6873"/>
    </linearGradient>
    <linearGradient id="cotBandSteelM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f6f9"/>
      <stop offset=".38" stop-color="#aab5c0"/>
      <stop offset=".7" stop-color="#5e6a75"/>
      <stop offset="1" stop-color="#39434c"/>
    </linearGradient>
    <linearGradient id="cotGrooveM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#c6d1da"/>
      <stop offset="1" stop-color="#78848f"/>
    </linearGradient>
    <linearGradient id="cotHullM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39434e"/>
      <stop offset="1" stop-color="#20272f"/>
    </linearGradient>
  </defs>

  <!-- ===== badge plate: die-cut edge, beveled band, brushed field ===== -->
  <!-- soft drop shadow -->
  <path d="M34 26 H222 L236 40 V112 C236 174 196 214 128 238 C60 214 20 174 20 112 V40 Z"
        transform="translate(0 3)" fill="none" stroke="#05080b" stroke-width="17"
        stroke-linejoin="miter" opacity=".35"/>
  <!-- brushed field -->
  <path d="M34 26 H222 L236 40 V112 C236 174 196 214 128 238 C60 214 20 174 20 112 V40 Z"
        fill="url(#cotFieldSteelM)"/>
  <!-- bevel rims: light top-left / dark bottom-right, peeking 1px past the band -->
  <g fill="none" stroke-linejoin="miter">
    <path d="M34 26 H222 L236 40 V112 C236 174 196 214 128 238 C60 214 20 174 20 112 V40 Z"
          stroke="#f7fafc" stroke-width="18.5" clip-path="url(#cotLightHalfM)"/>
    <path d="M34 26 H222 L236 40 V112 C236 174 196 214 128 238 C60 214 20 174 20 112 V40 Z"
          stroke="#232b33" stroke-width="18.5" clip-path="url(#cotDarkHalfM)"/>
  </g>
  <!-- gunmetal band, lit at 135 degrees -->
  <path d="M34 26 H222 L236 40 V112 C236 174 196 214 128 238 C60 214 20 174 20 112 V40 Z"
        fill="none" stroke="url(#cotBandSteelM)" stroke-width="15" stroke-linejoin="miter"/>
  <!-- polished inner groove at band center -->
  <path d="M34 26 H222 L236 40 V112 C236 174 196 214 128 238 C60 214 20 174 20 112 V40 Z"
        fill="none" stroke="url(#cotGrooveM)" stroke-width="2.5"/>

  <g transform="translate(-0.8 24) scale(1.06)">

    <!-- whip antenna: one clean 45-degree diagonal off the rear deck -->
    <path d="M52 96 32 76" stroke="#2b333c" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <!-- flag: vertical pole from the bustle rack + pennant streaming back
         (dark gunmetal, silver edge) -->
    <path d="M68 84V34" stroke="#2b333c" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M68 34 46 39.5 68 45Z" fill="#2b333c" stroke="#cfd9e2" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- running gear: gunmetal track band, silver wheel cutouts
         (six identical road wheels on an exact 24.4 pitch) -->
    <path d="M52 107h122a15 15 0 0 1 0 30H52a15 15 0 0 1 0-30Z" fill="#1d242c"/>
    <g fill="#aeb9c4">
      <circle cx="52" cy="122" r="10"/><circle cx="76.4" cy="122" r="10"/><circle cx="100.8" cy="122" r="10"/>
      <circle cx="125.2" cy="122" r="10"/><circle cx="149.6" cy="122" r="10"/><circle cx="174" cy="122" r="10"/>
    </g>
    <g fill="#1d242c">
      <circle cx="52" cy="122" r="3.2"/><circle cx="76.4" cy="122" r="3.2"/><circle cx="100.8" cy="122" r="3.2"/>
      <circle cx="125.2" cy="122" r="3.2"/><circle cx="149.6" cy="122" r="3.2"/><circle cx="174" cy="122" r="3.2"/>
    </g>

    <!-- hull: gunmetal relief mass, silver specular seams -->
    <path d="M34 116 40 94h108l52 18-3 6Z" fill="url(#cotHullM)"/>
    <path d="M148 94l52 18-1.9 3.8-51.6-17.6Z" fill="#cfd9e2"/>
    <rect x="40" y="94" width="108" height="2.4" fill="#cfd9e2"/>

    <!-- side skirt: lighter gunmetal panel; seams sit exactly midway between
         wheel centers so panels and wheels share one rhythm -->
    <path d="M46 106h136v8l-9 12H46Z" fill="#525e69" stroke="#1d242c" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="41" y="106" width="5" height="20" fill="#1d242c"/>
    <g stroke="#1d242c" stroke-width="1.8">
      <path d="M64.2 107.5V124M88.6 107.5V124M113 107.5V124M137.4 107.5V124M161.8 107.5V124"/>
    </g>
    <path d="M47.5 107.3h133" stroke="#dde5ec" stroke-width="1.2" fill="none"/>

    <!-- turret: gunmetal wedge + bustle rack + specular facet -->
    <rect x="60" y="79" width="16" height="14" rx="1.5" fill="#2b333c"/>
    <path d="M61 83.7h14M61 88.3h14" stroke="#161c22" stroke-width="1.8"/>
    <path d="M72 96 82 74l58 3.5L154 96Z" fill="url(#cotHullM)"/>
    <path d="M82 74 140 77.5 138.8 80.8 81 77.2Z" fill="#cfd9e2"/>
    <path d="M124 80l7 .5 6 15.5h-7Z" fill="#8d99a4"/>

    <!-- the commander: Claude Code mascot, faithful source path (brand orange
         keeps the commander readable against the steel), centered on x=106 -->
    <rect x="91" y="60" width="30" height="12" fill="#161c22"/>
    <g clip-path="url(#cotHatchClipM)">
      <path clip-rule="evenodd" fill-rule="evenodd" fill="#D97757" stroke="#161c22"
        stroke-width="1.5" paint-order="stroke" transform="translate(82.6 45.75) scale(1.95)"
        d="M20.998 10.949H24v3.102h-3v3.028h-1.487V20H18v-2.921h-1.487V20H15v-2.921H9V20H7.488v-2.921H6V20H4.487v-2.921H3V14.05H0V10.95h3V5h17.998v5.949zM6 10.949h1.488V8.102H6v2.847zm10.51 0H18V8.102h-1.49v2.847z"/>
    </g>
    <!-- hatch coaming -->
    <rect x="81" y="71" width="50" height="6.5" rx="1.5" fill="#525e69" stroke="#161c22" stroke-width="2.5"/>
    <path d="M83 71.8h46" stroke="#dde5ec" stroke-width="1.2" fill="none"/>

    <!-- tanker helmet: silver dome + gunmetal rim + goggles, symmetric on x=106 -->
    <path d="M87.5 55.5a18.5 12 0 0 1 37 0Z" fill="#aeb9c4" stroke="#161c22" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="85.5" y="55.3" width="41" height="4.2" rx="2" fill="#2b333c"/>
    <rect x="93.75" y="48.2" width="24.5" height="5.2" rx="1.5" fill="#161c22"/>
    <circle cx="101.75" cy="50.8" r="3.8" fill="#161c22" stroke="#cfd9e2" stroke-width="1.8"/>
    <circle cx="110.25" cy="50.8" r="3.8" fill="#161c22" stroke="#cfd9e2" stroke-width="1.8"/>

    <!-- main gun, elevated 10 degrees: gunmetal barrel, specular keylines,
         bright muzzle step — trimmed so it stays inside the shield's inner
         border -->
    <g transform="translate(0 4) rotate(-10 140 82)">
      <rect x="136" y="76" width="18" height="12" rx="1.5" fill="#2b333c"/>
      <rect x="154" y="78.3" width="48" height="7.4" fill="#333c46"/>
      <rect x="154" y="78.3" width="48" height="1.9" fill="#dde5ec"/>
      <rect x="154" y="84.5" width="48" height="1.2" fill="#12181e"/>
      <rect x="166" y="76.4" width="16" height="11.2" rx="4.4" fill="#2b333c" stroke="#cfd9e2" stroke-width="1.8"/>
      <rect x="199.5" y="76.2" width="11" height="11.6" rx="1.5" fill="#e9eff4" stroke="#1d242c" stroke-width="2.5"/>
    </g>
  </g>

  <!-- diagonal glass sheen across the plate (over tank, under nothing) -->
  <g clip-path="url(#cotShieldClipM)">
    <path d="M-10 60 L120 -30 L170 -30 L-10 128 Z" fill="#ffffff" opacity=".14"/>
    <path d="M30 250 L230 60 L252 92 L80 262 Z" fill="#ffffff" opacity=".05"/>
  </g>
</g>
  <text class="wm1" x="227" y="102">CLAUDE</text>
  <text class="wm2" x="229" y="138">OF TANKS</text>
</svg>
