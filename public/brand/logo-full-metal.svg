<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 210" role="img" aria-label="Claude of Tanks">
  <!-- Claude of Tanks v5 full lockup, METAL treatment:
       the embossed metal crest (master: public/brand/logo-mark-metal.svg —
       keep in sync) + the lockup wordmark from logo-full.svg re-cut in
       brushed steel (vertical banded gradient, hairline gunmetal edge so it
       holds on paper stages). Replaces the retired simple mark in the brand
       set. Wordmark fonts: same self-contained Inter 800/700 woff2 subsets
       as logo-full.svg (OFL — docs/ATTRIBUTION.md). Mascot: Anthropic (via
       thesvg.org). -->
  <style>
    @font-face { font-family: 'CotInter800'; src: url(data:font/woff2;base64,) format('woff2'); font-weight: 800; }
    @font-face { font-family: 'CotInter700'; src: url(data:font/woff2;base64,) format('woff2'); font-weight: 700; }
    .wm1 { font: 800 58px 'CotInter800', 'Inter', 'Segoe UI', sans-serif; letter-spacing: 2.3px; fill: url(#cotWordSteelM); stroke: #232b33; stroke-width: .6; paint-order: stroke; }
    .wm2 { font: 700 27px 'CotInter700', 'Inter', 'Segoe UI', sans-serif; letter-spacing: 11.3px; fill: url(#cotWordSteelM); stroke: #232b33; stroke-width: .6; paint-order: stroke; }
  </style>
  <defs>
    <linearGradient id="cotWordSteelM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f6f9"/>
      <stop offset=".45" stop-color="#c3ced7"/>
      <stop offset=".55" stop-color="#93a1ad"/>
      <stop offset="1" stop-color="#6a7682"/>
    </linearGradient>
  </defs>
  <g transform="translate(5 5) scale(0.78125)">
  <!-- v5 (owner-directed): cleaned modern-MBT silhouette, closed bow, refined
       running gear and gun, and a right-shifted vehicle with a protected clear zone. -->
  <!-- Claude of Tanks v5 crest mark — METAL treatment (embossed badge for
       premium/medal surfaces). Same shield geometry + tank composition as
       logo-mark-bw.svg / logo-mark.svg (keep in sync). v5 (owner-directed
       cleanup; v3 archived in public/brand/v3-shield/): tank rescaled and
       moved right for even optical margins, with a closed bow, coherent track
       loop, quieter wheel details, and a coherent stepped cannon. This variant alone
       is ALLOWED gradients: brushed-steel
       field (vertical banded gradient), gunmetal border band lit at 135deg
       (light top-left rim, dark bottom-right rim), polished inner groove,
       diagonal glass sheen, tank in dark gunmetal relief with silver specular
       seams. Mascot stays brand orange #D97757 so the commander reads
       (steel-mascot variant tried and rejected: vanished into the field at
       64px). Mascot: Anthropic (via thesvg.org) — see docs/ATTRIBUTION.md. -->
  <defs>
    <clipPath id="cotHatchClipM"><rect x="70" y="29" width="68" height="44"/></clipPath>
    <clipPath id="cotShieldClipM">
      <path d="M34 26 H222 L236 40 V112 C236 174 196 214 128 238 C60 214 20 174 20 112 V40 Z"/>
    </clipPath>
    <clipPath id="cotLightHalfM"><path d="M-20 -20 H276 L-20 276 Z"/></clipPath>
    <clipPath id="cotDarkHalfM"><path d="M276 -20 V276 H-20 Z"/></clipPath>
    <linearGradient id="cotFieldSteelM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbe2e9"/>
      <stop offset=".16" stop-color="#c3ced7"/>
      <stop offset=".2" stop-color="#cfdae2"/>
      <stop offset=".44" stop-color="#a0adb8"/>
      <stop offset=".5" stop-color="#93a1ad"/>
      <stop offset=".56" stop-color="#9fadb8"/>
      <stop offset=".8" stop-color="#75828e"/>
      <stop offset="1" stop-color="#5c6873"/>
    </linearGradient>
    <linearGradient id="cotBandSteelM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f6f9"/>
      <stop offset=".38" stop-color="#aab5c0"/>
      <stop offset=".7" stop-color="#5e6a75"/>
      <stop offset="1" stop-color="#39434c"/>
    </linearGradient>
    <linearGradient id="cotGrooveM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#c6d1da"/>
      <stop offset="1" stop-color="#78848f"/>
    </linearGradient>
    <linearGradient id="cotHullM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39434e"/>
      <stop offset="1" stop-color="#20272f"/>
    </linearGradient>
  </defs>

  <!-- ===== badge plate: die-cut edge, beveled band, brushed field ===== -->
  <!-- soft drop shadow -->
  <path d="M34 26 H222 L236 40 V112 C236 174 196 214 128 238 C60 214 20 174 20 112 V40 Z"
        transform="translate(0 3)" fill="none" stroke="#05080b" stroke-width="17"
        stroke-linejoin="miter" opacity=".35"/>
  <!-- brushed field -->
  <path d="M34 26 H222 L236 40 V112 C236 174 196 214 128 238 C60 214 20 174 20 112 V40 Z"
        fill="url(#cotFieldSteelM)"/>
  <!-- bevel rims: light top-left / dark bottom-right, peeking 1px past the band -->
  <g fill="none" stroke-linejoin="miter">
    <path d="M34 26 H222 L236 40 V112 C236 174 196 214 128 238 C60 214 20 174 20 112 V40 Z"
          stroke="#f7fafc" stroke-width="18.5" clip-path="url(#cotLightHalfM)"/>
    <path d="M34 26 H222 L236 40 V112 C236 174 196 214 128 238 C60 214 20 174 20 112 V40 Z"
          stroke="#232b33" stroke-width="18.5" clip-path="url(#cotDarkHalfM)"/>
  </g>
  <!-- gunmetal band, lit at 135 degrees -->
  <path d="M34 26 H222 L236 40 V112 C236 174 196 214 128 238 C60 214 20 174 20 112 V40 Z"
        fill="none" stroke="url(#cotBandSteelM)" stroke-width="15" stroke-linejoin="miter"/>
  <!-- polished inner groove at band center -->
  <path d="M34 26 H222 L236 40 V112 C236 174 196 214 128 238 C60 214 20 174 20 112 V40 Z"
        fill="none" stroke="url(#cotGrooveM)" stroke-width="2.5"/>

  <g transform="translate(3.5 24) scale(1.04)">

    <!-- running gear: one closed, tapered track loop with six wheels -->
    <path d="M48 107H174Q184 107 188 116L186 127Q184 137 174 138H50Q40 138 37 128L36 119Q37 109 48 107Z" fill="#1d242c"/>
    <g fill="#aeb9c4">
      <circle cx="52" cy="122" r="10"/><circle cx="76.4" cy="122" r="10"/><circle cx="100.8" cy="122" r="10"/>
      <circle cx="125.2" cy="122" r="10"/><circle cx="149.6" cy="122" r="10"/><circle cx="174" cy="122" r="10"/>
    </g>
    <g fill="#1d242c">
      <circle cx="52" cy="122" r="3.2"/><circle cx="76.4" cy="122" r="3.2"/><circle cx="100.8" cy="122" r="3.2"/>
      <circle cx="125.2" cy="122" r="3.2"/><circle cx="149.6" cy="122" r="3.2"/><circle cx="174" cy="122" r="3.2"/>
    </g>
    <!-- quiet gear detail: dished rims and balanced end-wheel rings -->
    <g fill="none" stroke="#1d242c" stroke-width="1.8">
      <circle cx="52" cy="122" r="6.4"/><circle cx="76.4" cy="122" r="6.4"/><circle cx="100.8" cy="122" r="6.4"/>
      <circle cx="125.2" cy="122" r="6.4"/><circle cx="149.6" cy="122" r="6.4"/><circle cx="174" cy="122" r="6.4"/>
    </g>
    <circle cx="52" cy="122" r="8.4" fill="none" stroke="#1d242c" stroke-width="1.6"/>
    <circle cx="174" cy="122" r="8.4" fill="none" stroke="#1d242c" stroke-width="1.6"/>

    <!-- hull: deck, exposed side plate, and upper glacis read as separate planes. -->
    <path d="M36 115 41 94H146L197 110 192 115Z" fill="url(#cotHullM)"/>
    <path d="M38.5 103H145L191 112.5 188.5 115H36Z" fill="#27323b"/>
    <path d="M146 94 197 110 191 113 145 98Z" fill="#525e69"/>
    <path d="M41 95H145L193 110" fill="none" stroke="#cfd9e2" stroke-width="2.4" stroke-linecap="round"/>
    <!-- restrained hull kit: rear exhaust, recessed side-access plates, bow light -->
    <rect x="45" y="97.5" width="11" height="6.5" rx="1" fill="#2b333c"/>
    <path d="M47 99.7h7M47 101.9h7" stroke="#161c22" stroke-width="1.3"/>
    <path d="M61 104.5H121L129 111.5H61Z" fill="#48545f" stroke="#1d242c" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M78 105v6M96 105v6M114 105v6" stroke="#1d242c" stroke-width="1.25"/>
    <circle cx="64.5" cy="108" r="1.05" fill="#aeb9c4"/><circle cx="125" cy="109.2" r="1.05" fill="#aeb9c4"/>
    <rect x="184.5" y="106.5" width="5" height="3.5" rx="0.9" fill="#cfd9e2"/>

    <!-- side skirt: layered over the lower hull seam, entirely below the glacis. -->
    <path d="M42 114.5H181L178 118 173 126H46L42 122Z" fill="#525e69" stroke="#1d242c" stroke-width="2.5" stroke-linejoin="round"/>
    <g stroke="#1d242c" stroke-width="1.8">
      <path d="M64.2 116V124M88.6 116V124M113 116V124M137.4 116V124M161.8 116V124"/>
    </g>
    <path d="M47 116h130" stroke="#dde5ec" stroke-width="1.2" fill="none"/>

    <!-- turret: chamfered roof, raised bustle, armored cheek, and ring. -->
    <path d="M58 92V78L61 76H79L84 72.5 128 74.5 141 78 154 94 150 97H75L70 92Z" fill="url(#cotHullM)"/>
    <path d="M61 80h18M61 84.5h18M61 89h15" stroke="#161c22" stroke-width="1.7"/>
    <path d="M84 72.5 128 74.5 141 78 138.5 81 82 76.2Z" fill="#cfd9e2"/>
    <path d="M112 79.2 140 81 151 94H130Z" fill="#394550"/>
    <!-- turret kit: ring shadow, CITV periscope, recessed side-access panel -->
    <path d="M75 94.2H150L148 97H75Z" fill="#161c22"/>
    <rect x="128" y="69.5" width="7.5" height="7.4" rx="1" fill="#2b333c"/>
    <rect x="129.4" y="71.2" width="4.7" height="1.8" fill="#cfd9e2"/>
    <path d="M84 86.5H119L124 92H84Z" fill="#2b333c" stroke="#161c22" stroke-width="1.1" stroke-linejoin="round"/>
    <path d="M93 87v4.5M102 87v4.5M111 87v4.5" stroke="#161c22" stroke-width="1.2"/>
    <path d="M124.5 80.2 131 80.7 136 95H129.5Z" fill="#8d99a4"/>

    <!-- deck fittings: antenna and a double-stroked mast seated in a roof base. -->
    <rect x="50" y="89.5" width="6" height="5" rx="1" fill="#2b333c"/>
    <path d="M53 89.5 Q48 76 43 60" stroke="#2b333c" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <circle cx="43" cy="60" r="1.1" fill="#cfd9e2"/>
    <path d="M69 74.5V31.5" stroke="#161c22" stroke-width="3.4" stroke-linecap="round" fill="none"/>
    <path d="M69 74.5V31.5" stroke="#cfd9e2" stroke-width="1.45" stroke-linecap="round" fill="none"/>
    <path d="M68.5 34C61 34.5 54.5 36.5 48.5 38.5 55 39.5 61.5 41.5 68.5 44Z" fill="#2b333c" stroke="#cfd9e2" stroke-width="1.1" stroke-linejoin="round"/>
    <circle cx="69" cy="31.5" r="1.7" fill="#cfd9e2" stroke="#161c22" stroke-width=".8"/>
    <path d="M64 77 65.2 72.5H72.8L74 77Z" fill="#2b333c" stroke="#161c22" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M66.5 73.8h5" stroke="#cfd9e2" stroke-width="1.1" stroke-linecap="round"/>

    <!-- the commander: Claude Code mascot, faithful source path (brand orange
         keeps the commander readable against the steel), centered on x=106 -->
    <rect x="91" y="60" width="30" height="12" fill="#161c22"/>
    <g clip-path="url(#cotHatchClipM)">
      <path clip-rule="evenodd" fill-rule="evenodd" fill="#D97757" stroke="#161c22"
        stroke-width="1.5" paint-order="stroke" transform="translate(82.6 45.75) scale(1.95)"
        d="M20.998 10.949H24v3.102h-3v3.028h-1.487V20H18v-2.921h-1.487V20H15v-2.921H9V20H7.488v-2.921H6V20H4.487v-2.921H3V14.05H0V10.95h3V5h17.998v5.949zM6 10.949h1.488V8.102H6v2.847zm10.51 0H18V8.102h-1.49v2.847z"/>
    </g>
    <!-- hatch coaming: turret-colored rim with paired reflected and shadow seams. -->
    <path d="M80.5 76.5 83.5 70.5H128.5L131.5 76.5Z" fill="#525e69" stroke="url(#cotHullM)" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M85.5 72H126.5" stroke="#c7d1da" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M84.8 74H127.2" stroke="#303941" stroke-width="1.1" stroke-linecap="round"/>

    <!-- tanker helmet: articulated dome, padded crown, ear cups, and stowed panoramic goggles. -->
    <path d="M89.5 49.8Q84.3 50.1 84.3 55.3V57.2Q84.3 59.4 88 60L91.5 56Z" fill="#46515c" stroke="#161c22" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M122.5 49.8Q127.7 50.1 127.7 55.3V57.2Q127.7 59.4 124 60L120.5 56Z" fill="#46515c" stroke="#161c22" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M87.8 55.6C88.2 47.2 92.6 41.4 99.4 39.5Q106 37.7 112.6 39.5C119.4 41.4 123.8 47.2 124.2 55.6Z" fill="#aeb9c4" stroke="#161c22" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M98.2 41.2Q106 38.5 113.8 41.2L111.8 47.5H100.2Z" fill="#c7d1da"/>
    <path d="M106 39.3V45.4M97.6 42.1Q95.7 45 95.5 48.3M114.4 42.1Q116.3 45 116.5 48.3" fill="none" stroke="#7c8995" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M87.8 50.5Q89.5 47.8 92.5 47.5M119.5 47.5Q122.5 47.8 124.2 50.5" fill="none" stroke="#161c22" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M88.3 50.1Q89.8 48.2 92.6 48M119.4 48Q122.2 48.2 123.7 50.1" fill="none" stroke="#7c8995" stroke-width="1" stroke-linecap="round"/>
    <!-- Unified lens rests on the crown; the raised center cutout is its nose indent. -->
    <path d="M93 46.3Q106 44 119 46.3Q120.4 46.6 120.1 48L119.2 52.1Q119 53.4 117.5 53.6H110L106 50.9L102 53.6H94.5Q93 53.4 92.8 52.1L91.9 48Q91.6 46.6 93 46.3Z" fill="#657f92" stroke="#161c22" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M94.5 47.4Q102.2 45.9 109.4 46.4" fill="none" stroke="#edf2f6" stroke-width="1.05" stroke-linecap="round"/>
    <circle cx="92.8" cy="49.6" r=".8" fill="#9eabb7"/><circle cx="119.2" cy="49.6" r=".8" fill="#9eabb7"/>
    <path d="M85.2 55.2H126.8L125.4 59.4H86.6Z" fill="#46515c" stroke="#161c22" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M89 56.4H123" stroke="#c7d1da" stroke-width="1.05" stroke-linecap="round"/>

    <!-- main gun: mantlet, tapered sleeve, collar, evacuator, barrel, muzzle. -->
    <g transform="translate(0 4) rotate(-10 140 82)">
      <path d="M135 75.5H151L156 79V85L151 88.5H135Z" fill="#2b333c"/>
      <path d="M150 78.5 178 79.2V85.8L150 86.5Z" fill="#394650"/>
      <path d="M153 79.8 176 80.3" stroke="#dde5ec" stroke-width="1.45" stroke-linecap="round"/>
      <path d="M160 77.7H164L164.5 86.5H159.7Z" fill="#12181e"/>
      <path d="M176.5 77.2H190Q193.5 77.2 193.5 80.3V84Q193.5 87 190 87H176.5Z" fill="#2b333c"/>
      <path d="M180 79.1H190" stroke="#dde5ec" stroke-width="1.45" stroke-linecap="round"/>
      <path d="M192 79.3H206.5V84.9H192Z" fill="#394650"/>
      <path d="M194 80.3H205" stroke="#dde5ec" stroke-width="1.15" stroke-linecap="round"/>
      <path d="M205 78.1H211.5L212.5 85.9H205Z" fill="#525e69" stroke="#1d242c" stroke-width="1.8" stroke-linejoin="round"/>
      <rect x="207.1" y="79.7" width="3.1" height="4.6" rx=".7" fill="#161c22"/>
    </g>
  </g>

  <!-- diagonal glass sheen across the plate (over tank, under nothing) -->
  <g clip-path="url(#cotShieldClipM)">
    <path d="M-10 60 L120 -30 L170 -30 L-10 128 Z" fill="#ffffff" opacity=".14"/>
    <path d="M30 250 L230 60 L252 92 L80 262 Z" fill="#ffffff" opacity=".05"/>
  </g>
</g>
  <text class="wm1" x="227" y="102">CLAUDE</text>
  <text class="wm2" x="229" y="138">OF TANKS</text>
</svg>
