<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 34 184 106" role="img" aria-label="Claude of Tanks"><!-- The Claude of Tanks mark (tools/brand-marks.mjs from src/ui/brandMark.ts). Copyright (c) 2026 Kevin B. Liu. The commander is the Claude Code mascot (Anthropic), verbatim: docs/ATTRIBUTION.md. --><style>
:root{--mk-loop:1.2s;overflow:visible}
:root :is(.mk-hull,.mk-turret,.mk-crew,.mk-antenna,.mk-puff){transform-box:view-box}
:root .mk-wheel{transform-box:fill-box;transform-origin:50% 50%;animation:mk-turn var(--mk-loop) linear infinite}
:root .mk-links--top{animation:mk-links-top var(--mk-loop) linear infinite}
:root .mk-links--low{animation:mk-links-low var(--mk-loop) linear infinite}
:root .mk-hull{animation:mk-bob calc(var(--mk-loop) / 2) ease-in-out infinite}
:root .mk-turret{transform-origin:105px 93px;animation:mk-rock calc(var(--mk-loop) / 2) ease-in-out calc(var(--mk-loop) * -0.38) infinite}
:root .mk-crew{animation:mk-bounce calc(var(--mk-loop) / 2) ease-in-out calc(var(--mk-loop) * -0.3) infinite}
:root .mk-antenna{transform-origin:64px 76px;animation:mk-sway calc(var(--mk-loop) / 2) ease-in-out calc(var(--mk-loop) * -0.26) infinite}
:root .mk-puff{transform-origin:37px 101px;opacity:0;animation:mk-puff var(--mk-loop) ease-out infinite}
@keyframes mk-turn{to{transform:rotate(240deg)}}
@keyframes mk-links-top{from{stroke-dashoffset:5.655}to{stroke-dashoffset:0}}
@keyframes mk-links-low{from{stroke-dashoffset:0}to{stroke-dashoffset:5.655}}
@keyframes mk-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-0.9px)}}
@keyframes mk-rock{0%,100%{transform:rotate(-0.55deg)}50%{transform:rotate(0.55deg)}}
@keyframes mk-bounce{0%,100%{transform:translateY(0)}45%{transform:translateY(-1.1px)}}
@keyframes mk-sway{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-5deg)}}
@keyframes mk-puff{0%{opacity:.5;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(-11px,-5px) scale(3.2)}}
@media (prefers-reduced-motion:reduce){:root :is(.mk-wheel,.mk-links,.mk-hull,.mk-turret,.mk-crew,.mk-antenna,.mk-puff){animation:none}
  :root .mk-puff{display:none}}
