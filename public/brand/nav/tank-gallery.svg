<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" role="img" aria-label="Tank Gallery — three vehicle silhouettes compared">
  <defs>
    <filter id="gallery-blue" color-interpolation-filters="sRGB">
      <feFlood flood-color="#45c7ff" result="color"/>
      <feComposite in="color" in2="SourceAlpha" operator="in"/>
    </filter>
    <filter id="gallery-red" color-interpolation-filters="sRGB">
      <feFlood flood-color="#ff4d62" result="color"/>
      <feComposite in="color" in2="SourceAlpha" operator="in"/>
    </filter>
    <filter id="gallery-white" color-interpolation-filters="sRGB">
      <feFlood flood-color="#edf3f7" result="color"/>
      <feComposite in="color" in2="SourceAlpha" operator="in"/>
    </filter>
  </defs>
  <image data-vehicle="strv103a" href="data:image/png;base64," x="2" y="0" width="88" height="44" filter="url(#gallery-blue)" opacity=".96"/>
  <image data-vehicle="t90m" href="data:image/png;base64," x="6" y="10" width="88" height="44" filter="url(#gallery-red)" opacity=".96"/>
  <image data-vehicle="m1a2" href="data:image/png;base64," x="3" y="20" width="88" height="44" filter="url(#gallery-white)"/>
</svg>
